<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Floorplan of one compute die: twenty tiles in five columns and four rows, each tile a core sitting under its own cache-home agent and last-level cache slice. Orange mesh rails run in every gap between tiles, horizontally and vertically, and a ring stop sits at each of the thirty crossings — that stop, not the tile, is where a tile joins the mesh. Four IO tiles sit along the top edge, one UPI and two PCIe and one DMI, each labelled with its width and its line rate, with an arrow leaving the die. A memory controller flanks each side with three DDR5 channels behind it. One request is traced in orange over the mesh: badge one, core eleven misses its private cache and injects at the nearest ring stop; badge two, the address hashes to the last-level cache slice on core eight's tile, two columns away; badge three, that slice misses and the request leaves eastward to the right-hand memory controller" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
