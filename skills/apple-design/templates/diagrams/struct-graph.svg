<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Pointer graph of the Linux memory-management structures, drawn so every arrow leaves the field that actually holds the pointer rather than the edge of the box. task_struct lists pid, comm, mm, active_mm and files; an orange dot marks each pointer field and the arrow starts there. The mm dot goes to mm_struct, whose mm_mt field is a maple tree keyed by start address; three slots in that tree carry the ordered virtual ranges and each slot points down at one vm_area_struct. The first VMA is drawn in full, with start, end, flags, page offset, the file it maps, its operations table, and anon_vma which stays NULL until the first copy-on-write store, while its two siblings show only start, end and flags. Two further arrows leave the first VMA: vm_file to a struct file, vm_ops to a vm_operations_struct holding filemap_fault. Field names follow include linux mm_types.h at kernel 6.6; row order is reading order, not struct offset order" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="sgArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#0071e3"/>
    </marker>
  </defs>

  <rect width="1120" height="560" fill="#ffffff"/>

  <text x="32" y="34" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#86868b">STRUCT GRAPH &#183; WHICH FIELD HOLDS WHICH POINTER</text>
  <g font-size="12.5" fill="#86868b">
    <circle cx="600" cy="30" r="4" fill="#0071e3"/><text x="612" y="34">pointer field &#183; every arrow starts here, not at the edge of the box</text>
  </g>

  <rect x="640" y="76" width="448" height="136" rx="10" fill="#f5f5f7" stroke="#d2d2d7" stroke-dasharray="5 4"/>
  <text x="656" y="100" font-size="13.5" font-weight="600" fill="#1d1d1f" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">mm-&gt;mm_mt</text>
  <text x="656" y="118" font-size="12.5" fill="#86868b">maple tree, keyed by vm_start &#183; replaced the VMA list and rbtree in 6.1</text>
  <g>
    <rect x="648" y="132" width="136" height="44" rx="6" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="716" y="150" text-anchor="middle" font-size="12.5" fill="#1d1d1f">slot 0</text>
    <text x="716" y="167" text-anchor="middle" font-size="12.5" font-family="'SF Mono', SFMono-Regular, Menlo, monospace" fill="#86868b">0x5566_1000+</text>
    <rect x="796" y="132" width="136" height="44" rx="6" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="864" y="150" text-anchor="middle" font-size="12.5" fill="#1d1d1f">slot 1</text>
    <text x="864" y="167" text-anchor="middle" font-size="12.5" font-family="'SF Mono', SFMono-Regular, Menlo, monospace" fill="#86868b">0x5566_9000+</text>
    <rect x="944" y="132" width="136" height="44" rx="6" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="1012" y="150" text-anchor="middle" font-size="12.5" fill="#1d1d1f">slot 2</text>
    <text x="1012" y="167" text-anchor="middle" font-size="12.5" font-family="'SF Mono', SFMono-Regular, Menlo, monospace" fill="#86868b">0x7ffd_0000+</text>
  </g>

