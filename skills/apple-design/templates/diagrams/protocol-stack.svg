<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" role="img" aria-label="PCIe protocol layering drawn as two mirrored stacks, requester on the left and completer on the right, each with a transaction layer, a data link layer and a physical layer. Between the upper two layers the horizontal lines are grey and dashed, labelled TLP end to end and DLLP hop by hop: these are protocol agreements, not wires. The only solid horizontal line runs along the bottom, the PCIe lane itself, with two AC coupling capacitors. A blue path numbered one to six shows where the bytes actually travel, down every layer on the requester, once across the lane, then up every layer on the completer" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="apsSh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1d1d1f" flood-opacity="0.08"/>
    </filter>
    <filter id="apsPill" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.10"/>
    </filter>
    <marker id="apsArrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#0071e3"/>
    </marker>
    <marker id="apsArrN" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#aeaeb2"/>
    </marker>
  </defs>

  <rect width="1240" height="560" fill="#ffffff"/>
  <text x="60" y="40" font-size="12.5" font-weight="500" fill="#86868b">Protocol layering &#183; peer view</text>
  <g font-size="12.5" font-weight="500" fill="#86868b">
    <line x1="620" y1="36" x2="648" y2="36" stroke="#aeaeb2" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="658" y="40">peer agreement &#183; no wire</text>
    <line x1="852" y1="36" x2="880" y2="36" stroke="#1d1d1f" stroke-width="2.4"/>
    <text x="890" y="40">the only real wire</text>
    <line x1="1030" y1="36" x2="1058" y2="36" stroke="#0071e3" stroke-width="1.8"/>
    <text x="1068" y="40">this transfer</text>
  </g>

  <rect x="60" y="76" width="440" height="116" rx="18" fill="#f5f5f7"/>
  <rect x="740" y="76" width="440" height="116" rx="18" fill="#f5f5f7"/>
  <rect x="60" y="224" width="440" height="116" rx="18" fill="#f5f5f7"/>
  <rect x="740" y="224" width="440" height="116" rx="18" fill="#f5f5f7"/>
  <rect x="60" y="372" width="440" height="116" rx="18" fill="#f5f5f7"/>
  <rect x="740" y="372" width="440" height="116" rx="18" fill="#f5f5f7"/>

  <text x="84" y="64" font-size="12.5" font-weight="500" fill="#86868b">Transaction layer</text>
  <text x="764" y="64" font-size="12.5" font-weight="500" fill="#86868b">Transaction layer</text>
  <text x="84" y="212" font-size="12.5" font-weight="500" fill="#86868b">Data link layer</text>
  <text x="764" y="212" font-size="12.5" font-weight="500" fill="#86868b">Data link layer</text>
  <text x="84" y="360" font-size="12.5" font-weight="500" fill="#86868b">Physical layer</text>
  <text x="764" y="360" font-size="12.5" font-weight="500" fill="#86868b">Physical layer</text>

  <g filter="url(#apsSh)">
    <rect x="84" y="114" width="184" height="56" rx="14" fill="#ffffff"/>
    <rect x="288" y="114" width="184" height="56" rx="14" fill="#ffffff"/>
    <rect x="764" y="114" width="184" height="56" rx="14" fill="#ffffff"/>
    <rect x="968" y="114" width="184" height="56" rx="14" fill="#ffffff"/>
    <rect x="84" y="262" width="184" height="56" rx="14" fill="#ffffff"/>
    <rect x="288" y="262" width="184" height="56" rx="14" fill="#ffffff"/>
    <rect x="764" y="262" width="184" height="56" rx="14" fill="#ffffff"/>
    <rect x="968" y="262" width="184" height="56" rx="14" fill="#ffffff"/>
    <rect x="84" y="410" width="184" height="56" rx="14" fill="#ffffff"/>
    <rect x="288" y="410" width="184" height="56" rx="14" fill="#ffffff"/>
    <rect x="764" y="410" width="184" height="56" rx="14" fill="#ffffff"/>
    <rect x="968" y="410" width="184" height="56" rx="14" fill="#ffffff"/>
  </g>
  <text x="98" y="138" font-size="13.5" font-weight="600" fill="#1d1d1f">TLP generator</text>
  <text x="98" y="157" font-size="12.5" fill="#86868b">builds header + payload</text>
  <text x="302" y="138" font-size="13.5" font-weight="600" fill="#1d1d1f">Flow control</text>
  <text x="302" y="157" font-size="12.5" fill="#86868b">credit based</text>
  <text x="778" y="138" font-size="13.5" font-weight="600" fill="#1d1d1f">TLP parser</text>
  <text x="778" y="157" font-size="12.5" fill="#86868b">decodes header</text>
  <text x="982" y="138" font-size="13.5" font-weight="600" fill="#1d1d1f">Flow control</text>
  <text x="982" y="157" font-size="12.5" fill="#86868b">returns credits</text>
  <text x="98" y="286" font-size="13.5" font-weight="600" fill="#1d1d1f">Seq num + LCRC</text>
  <text x="98" y="305" font-size="12.5" fill="#86868b">one per packet</text>
  <text x="302" y="286" font-size="13.5" font-weight="600" fill="#1d1d1f">Replay buffer</text>
  <text x="302" y="305" font-size="12.5" fill="#86868b">holds until ACK</text>
  <text x="778" y="286" font-size="13.5" font-weight="600" fill="#1d1d1f">LCRC check</text>
  <text x="778" y="305" font-size="12.5" fill="#86868b">drops on mismatch</text>
  <text x="982" y="286" font-size="13.5" font-weight="600" fill="#1d1d1f">ACK / NAK gen</text>
  <text x="982" y="305" font-size="12.5" fill="#86868b">a DLLP, never a TLP</text>
  <text x="98" y="434" font-size="13.5" font-weight="600" fill="#1d1d1f">128b/130b + scrambler</text>
  <text x="98" y="453" font-size="12.5" fill="#86868b">block sync</text>
  <text x="302" y="434" font-size="13.5" font-weight="600" fill="#1d1d1f">TX driver</text>
  <text x="302" y="453" font-size="12.5" fill="#86868b">differential pair</text>
  <text x="778" y="434" font-size="13.5" font-weight="600" fill="#1d1d1f">Descrambler + decode</text>
  <text x="778" y="453" font-size="12.5" fill="#86868b">recovers symbols</text>
  <text x="982" y="434" font-size="13.5" font-weight="600" fill="#1d1d1f">RX equalizer</text>
  <text x="982" y="453" font-size="12.5" fill="#86868b">CDR + de-emphasis</text>

  <text x="484" y="112" text-anchor="end" font-size="12.5" fill="#86868b">requester</text>
  <text x="1164" y="112" text-anchor="end" font-size="12.5" fill="#86868b">completer</text>

  <line x1="500" y1="134" x2="740" y2="134" stroke="#aeaeb2" stroke-width="1.2" stroke-dasharray="5 4" marker-start="url(#apsArrN)" marker-end="url(#apsArrN)"/>
  <g filter="url(#apsPill)"><rect x="530" y="121" width="180" height="26" rx="13" fill="#ffffff"/></g>
  <text x="620" y="138" text-anchor="middle" font-size="12.5" font-weight="500" fill="#6e6e73">TLP &#183; end to end</text>
  <line x1="500" y1="282" x2="740" y2="282" stroke="#aeaeb2" stroke-width="1.2" stroke-dasharray="5 4" marker-start="url(#apsArrN)" marker-end="url(#apsArrN)"/>
  <g filter="url(#apsPill)"><rect x="530" y="269" width="180" height="26" rx="13" fill="#ffffff"/></g>
  <text x="620" y="286" text-anchor="middle" font-size="12.5" font-weight="500" fill="#6e6e73">DLLP &#183; hop by hop</text>
  <text x="620" y="424" text-anchor="middle" font-size="12.5" fill="#86868b">no line here either</text>
  <text x="620" y="444" text-anchor="middle" font-size="12.5" fill="#86868b">the real one runs below</text>

  <path d="M278,524 H958" fill="none" stroke="#1d1d1f" stroke-width="2.4"/>
  <line x1="424" y1="512" x2="424" y2="536" stroke="#1d1d1f" stroke-width="2.4"/>
  <line x1="442" y1="512" x2="442" y2="536" stroke="#1d1d1f" stroke-width="2.4"/>
  <line x1="796" y1="512" x2="796" y2="536" stroke="#1d1d1f" stroke-width="2.4"/>
  <line x1="814" y1="512" x2="814" y2="536" stroke="#1d1d1f" stroke-width="2.4"/>
  <g filter="url(#apsPill)"><rect x="524" y="511" width="192" height="26" rx="13" fill="#ffffff"/></g>
  <text x="620" y="528" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">PCIe lane &#215;4 &#183; 32 GT/s</text>

  <g stroke="#0071e3" stroke-width="1.8" fill="none">
    <path d="M278,192 V214" marker-end="url(#apsArrB)"/>
    <path d="M278,340 V362" marker-end="url(#apsArrB)"/>
    <path d="M278,488 V510" marker-end="url(#apsArrB)"/>
    <path d="M958,510 V488" marker-end="url(#apsArrB)"/>
    <path d="M958,362 V340" marker-end="url(#apsArrB)"/>
    <path d="M958,214 V192" marker-end="url(#apsArrB)"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#ffffff">
    <circle cx="254" cy="203" r="10" fill="#0071e3"/><text x="254" y="207" text-anchor="middle">1</text>
    <circle cx="254" cy="351" r="10" fill="#0071e3"/><text x="254" y="355" text-anchor="middle">2</text>
    <circle cx="254" cy="499" r="10" fill="#0071e3"/><text x="254" y="503" text-anchor="middle">3</text>
    <circle cx="982" cy="499" r="10" fill="#0071e3"/><text x="982" y="503" text-anchor="middle">4</text>
    <circle cx="982" cy="351" r="10" fill="#0071e3"/><text x="982" y="355" text-anchor="middle">5</text>
    <circle cx="982" cy="203" r="10" fill="#0071e3"/><text x="982" y="207" text-anchor="middle">6</text>
  </g>
</svg>
