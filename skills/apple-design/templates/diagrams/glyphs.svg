<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" role="img" aria-label="Glyph sheet for engineering diagrams in the apple grammar: a comb-toothed strip for a bounded in-order queue with a blue write pointer and an ink read pointer, a ruler-ticked bar for a serialized byte stream, a row of small vertical bars for pluggable slots with one populated in blue, a dark tab straddling a die boundary for an on-die port, a white card with a dark bezel strip and a blue link LED for a pluggable board, two short strokes across a line for an AC coupling capacitor, a small block where a signal crosses a clock-domain boundary for a synchroniser, and a hatched fill for a window onto another address space" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="aglHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#aeaeb2" stroke-width="1.6" opacity="0.5"/>
    </pattern>
    <filter id="aglSh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1d1d1f" flood-opacity="0.08"/>
    </filter>
    <filter id="aglPill" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.10"/>
    </filter>
    <marker id="aglArrI" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#1d1d1f"/>
    </marker>
  </defs>

  <rect width="1240" height="470" fill="#ffffff"/>
  <text x="60" y="40" font-size="12.5" font-weight="500" fill="#86868b">Glyph sheet &#183; copy one &#60;g&#62; at a time</text>
  <text x="60" y="88" font-size="12.5" font-weight="500" fill="#86868b">Queue</text>
  <text x="176" y="232" text-anchor="middle" font-size="12.5" fill="#86868b">finite depth, in order</text>
  <text x="356" y="88" font-size="12.5" font-weight="500" fill="#86868b">Byte stream</text>
  <text x="472" y="232" text-anchor="middle" font-size="12.5" fill="#86868b">serialized bytes, not addresses</text>
  <text x="652" y="88" font-size="12.5" font-weight="500" fill="#86868b">Slots</text>
  <text x="768" y="232" text-anchor="middle" font-size="12.5" fill="#86868b">a place something plugs into</text>
  <text x="948" y="88" font-size="12.5" font-weight="500" fill="#86868b">Port tab</text>
  <text x="1064" y="232" text-anchor="middle" font-size="12.5" fill="#86868b">an interface owned by this die</text>
  <text x="60" y="288" font-size="12.5" font-weight="500" fill="#86868b">Device card</text>
  <text x="176" y="432" text-anchor="middle" font-size="12.5" fill="#86868b">pluggable board · model text, no logo</text>
  <text x="356" y="288" font-size="12.5" font-weight="500" fill="#86868b">AC coupling</text>
  <text x="472" y="432" text-anchor="middle" font-size="12.5" fill="#86868b">a capacitor, not “isolation”</text>
  <text x="652" y="288" font-size="12.5" font-weight="500" fill="#86868b">Sync</text>
  <text x="768" y="432" text-anchor="middle" font-size="12.5" fill="#86868b">clock-domain crossing only</text>
  <text x="948" y="288" font-size="12.5" font-weight="500" fill="#86868b">Hatch</text>
  <text x="1064" y="432" text-anchor="middle" font-size="12.5" fill="#86868b">a window onto another space</text>

  <g id="g-queue">
    <rect x="96" y="128" width="160" height="44" rx="8" fill="#f5f5f7"/>
    <rect x="96" y="128" width="36" height="44" rx="8" fill="#eaf3fe"/>
    <g stroke="#d2d2d7" stroke-width="1">
      <line x1="108" y1="128" x2="108" y2="172"/>
      <line x1="120" y1="128" x2="120" y2="172"/>
      <line x1="132" y1="128" x2="132" y2="172"/>
      <line x1="144" y1="128" x2="144" y2="172"/>
      <line x1="156" y1="128" x2="156" y2="172"/>
      <line x1="168" y1="128" x2="168" y2="172"/>
      <line x1="180" y1="128" x2="180" y2="172"/>
      <line x1="192" y1="128" x2="192" y2="172"/>
      <line x1="204" y1="128" x2="204" y2="172"/>
      <line x1="216" y1="128" x2="216" y2="172"/>
      <line x1="228" y1="128" x2="228" y2="172"/>
      <line x1="240" y1="128" x2="240" y2="172"/>
    </g>
    <path d="M90,182 L102,182 L96,173 Z" fill="#1d1d1f"/>
    <text x="96" y="199" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">out</text>
    <path d="M126,182 L138,182 L132,173 Z" fill="#0071e3"/>
    <text x="132" y="199" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0071e3">in</text>
  </g>

  <g id="g-bytestream">
    <rect x="372" y="132" width="200" height="30" rx="8" fill="#f5f5f7"/>
    <g stroke="#1d1d1f" stroke-width="1.2">
      <line x1="376" y1="162" x2="376" y2="174"/>
      <line x1="384" y1="162" x2="384" y2="169"/>
      <line x1="392" y1="162" x2="392" y2="169"/>
      <line x1="400" y1="162" x2="400" y2="169"/>
      <line x1="408" y1="162" x2="408" y2="174"/>
      <line x1="416" y1="162" x2="416" y2="169"/>
      <line x1="424" y1="162" x2="424" y2="169"/>
      <line x1="432" y1="162" x2="432" y2="169"/>
      <line x1="440" y1="162" x2="440" y2="174"/>
      <line x1="448" y1="162" x2="448" y2="169"/>
      <line x1="456" y1="162" x2="456" y2="169"/>
      <line x1="464" y1="162" x2="464" y2="169"/>
      <line x1="472" y1="162" x2="472" y2="174"/>
      <line x1="480" y1="162" x2="480" y2="169"/>
      <line x1="488" y1="162" x2="488" y2="169"/>
      <line x1="496" y1="162" x2="496" y2="169"/>
      <line x1="504" y1="162" x2="504" y2="174"/>
      <line x1="512" y1="162" x2="512" y2="169"/>
      <line x1="520" y1="162" x2="520" y2="169"/>
      <line x1="528" y1="162" x2="528" y2="169"/>
      <line x1="536" y1="162" x2="536" y2="174"/>
      <line x1="544" y1="162" x2="544" y2="169"/>
      <line x1="552" y1="162" x2="552" y2="169"/>
      <line x1="560" y1="162" x2="560" y2="169"/>
      <line x1="568" y1="162" x2="568" y2="174"/>
    </g>
    <text x="472" y="152" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">TLP header + payload</text>
  </g>

  <g id="g-slots">
    <rect x="727" y="118" width="10" height="56" rx="4" fill="#f5f5f7"/>
    <rect x="745" y="118" width="10" height="56" rx="4" fill="#f5f5f7"/>
    <rect x="763" y="118" width="10" height="56" rx="4" fill="#0071e3"/>
    <rect x="781" y="118" width="10" height="56" rx="4" fill="#f5f5f7"/>
    <rect x="799" y="118" width="10" height="56" rx="4" fill="#f5f5f7"/>
    <g filter="url(#aglPill)"><rect x="698" y="184" width="140" height="26" rx="13" fill="#ffffff"/></g>
    <text x="768" y="201" text-anchor="middle" font-size="12.5" font-weight="500" fill="#6e6e73">PCIe &#215;16 slots</text>
  </g>

  <g id="g-porttab">
    <g filter="url(#aglSh)"><rect x="979" y="116" width="170" height="70" rx="14" fill="#ffffff"/></g>
    <text x="995" y="146" font-size="13.5" font-weight="600" fill="#1d1d1f">Host CPU die</text>
    <text x="995" y="165" font-size="12.5" fill="#86868b">64 core</text>
    <rect x="1139" y="133" width="20" height="44" rx="6" fill="#1d1d1f"/>
    <text x="1149" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff" transform="rotate(-90 1149 155)">IMC</text>
  </g>

  <g id="g-devcard">
    <g filter="url(#aglSh)"><rect x="101" y="306" width="150" height="90" rx="14" fill="#ffffff"/></g>
    <path d="M101,320 V320 Q101,306 115,306 H237 Q251,306 251,320 Z" fill="#1d1d1f"/>
    <circle cx="113" cy="313" r="3" fill="#0071e3"/>
    <text x="116" y="352" font-size="13.5" font-weight="600" fill="#1d1d1f">200 GbE NIC</text>
    <text x="116" y="371" font-size="12.5" fill="#86868b">2 &#215; QSFP56</text>
  </g>

  <g id="g-accoupling">
    <path d="M382,351 H562" fill="none" stroke="#1d1d1f" stroke-width="2.4"/>
    <line x1="464" y1="339" x2="464" y2="363" stroke="#1d1d1f" stroke-width="2.4"/>
    <line x1="480" y1="339" x2="480" y2="363" stroke="#1d1d1f" stroke-width="2.4"/>
    <text x="382" y="384" font-size="12.5" font-weight="600" fill="#6e6e73">D+</text>
    <text x="562" y="384" text-anchor="end" font-size="12.5" font-weight="600" fill="#6e6e73">D&#8722;</text>
  </g>

  <g id="g-sync">
    <line x1="768" y1="306" x2="768" y2="398" stroke="#aeaeb2" stroke-width="1.2" stroke-dasharray="5 4"/>
    <path d="M690,351 H842" fill="none" stroke="#1d1d1f" stroke-width="2.4" marker-end="url(#aglArrI)"/>
    <rect x="759" y="342" width="18" height="18" rx="5" fill="#f5f5f7" stroke="#aeaeb2" stroke-width="1.2"/>
    <text x="768" y="384" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6e6e73">sync</text>
    <text x="690" y="324" font-size="12.5" fill="#86868b">clk A</text>
    <text x="846" y="324" text-anchor="end" font-size="12.5" fill="#86868b">clk B</text>
  </g>

  <g id="g-hatch">
    <rect x="984" y="324" width="160" height="54" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
    <rect x="984" y="324" width="160" height="54" rx="10" fill="url(#aglHatch)"/>
    <text x="1064" y="356" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">BAR0 window</text>
  </g>
</svg>
