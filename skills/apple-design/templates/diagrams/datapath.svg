<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Read path of a four-way set-associative level-one data cache, drawn as a datapath rather than a block diagram. Badge A: the address splits into a thirty-six bit tag, a six bit set index and a six bit block offset. Badge B: the set index enters a six-to-sixty-four decoder whose wordline runs down the left edge and selects set forty-one, one entry in each of the four ways. Badge C: each way's stored tag meets the address tag at its own comparator; way one is invalid so its comparator can never assert, and way two matches. Badge D: the four match lines leave as one four-bit bundle, drive the select input of a four-to-one multiplexer that picks way two's sixty-four byte line, and the chosen word leaves to the load unit. Badge E: the same bundle enters an OR gate, whose output is the hit signal. Miss is simply that output staying low" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="dpArrI" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#1d1d1f"/>
    </marker>
    <marker id="dpArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#0071e3"/>
    </marker>
  </defs>

  <rect width="1120" height="560" fill="#ffffff"/>

  <text x="32" y="34" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#86868b">DATAPATH &#183; 4-WAY SET-ASSOCIATIVE LOOKUP</text>
  <g font-size="12.5" fill="#86868b">
    <path d="M560,24 L576,28 L576,36 L560,40 Z" fill="#eaf3fe" stroke="#0071e3"/><text x="584" y="34">comparator</text>
    <path d="M690,24 L706,28 L706,36 L690,40 Z" fill="#f5f5f7" stroke="#d2d2d7" transform="rotate(180 698 32)"/><text x="714" y="34">multiplexer</text>
    <path d="M800,24 Q814,24 828,32 Q814,40 800,40 Q807,32 800,24 Z" fill="#f5f5f7" stroke="#d2d2d7"/><text x="836" y="34">OR gate</text>
  </g>

  <!-- ===== address split ===== -->
  <g font-size="12.5" fill="#86868b">
    <text x="140" y="66">47</text><text x="556" y="66" text-anchor="end">12</text>
    <text x="564" y="66">11</text><text x="796" y="66" text-anchor="end">6</text>
    <text x="804" y="66">5</text><text x="1000" y="66" text-anchor="end">0</text>
  </g>
  <rect x="140" y="72" width="420" height="36" fill="#eaf3fe" stroke="#0071e3"/>
  <rect x="560" y="72" width="240" height="36" fill="#eaf3fe" stroke="#0071e3" stroke-width="1.5"/>
  <rect x="800" y="72" width="200" height="36" fill="#f5f5f7" stroke="#d2d2d7"/>
  <g font-size="12.5" text-anchor="middle">
    <text x="350" y="95" fill="#1d1d1f">TAG &#183; 36 bits</text>
    <text x="680" y="95" fill="#1d1d1f">SET INDEX &#183; 6</text>
    <text x="900" y="95" fill="#86868b">BLOCK OFFSET &#183; 6</text>
  </g>

  <!-- ===== decoder ===== -->
  <path d="M620,140 L740,140 L716,176 L644,176 Z" fill="#eaf3fe" stroke="#0071e3" stroke-width="1.5"/>
  <text x="680" y="163" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">6 &#8594; 64</text>
  <text x="752" y="163" font-size="12.5" fill="#86868b">decoder &#183; one wordline per set</text>

  <!-- ===== wires ===== -->
  <g fill="none" stroke="#1d1d1f" stroke-width="1.4">
    <line x1="680" y1="108" x2="680" y2="140" marker-end="url(#dpArrI)"/>
    <path d="M680,176 V188 Q680,196 672,196 H96 Q88,196 88,204 V320 Q88,328 96,328 H104" marker-end="url(#dpArrI)"/>
    <path d="M300,108 V124 Q300,132 308,132 H402 Q410,132 410,140 V378"/>
    <line x1="400" y1="212" x2="424" y2="212"/>
    <line x1="410" y1="228" x2="424" y2="228"/>
    <line x1="400" y1="262" x2="424" y2="262"/>
    <line x1="410" y1="278" x2="424" y2="278"/>
    <line x1="400" y1="312" x2="424" y2="312"/>
    <line x1="410" y1="328" x2="424" y2="328"/>
    <line x1="400" y1="362" x2="424" y2="362"/>
    <line x1="410" y1="378" x2="424" y2="378"/>
    <path d="M472,220 H488 V412"/>
    <path d="M472,270 H500 V412"/>
    <path d="M472,320 H512 V412"/>
    <path d="M472,370 H524 V412"/>
    <line x1="524" y1="412" x2="836" y2="412"/>
    <path d="M836,412 V392" marker-end="url(#dpArrI)"/>
    <path d="M836,412 H920" marker-end="url(#dpArrI)"/>
    <line x1="800" y1="290" x2="830" y2="290"/>
  </g>
  <g fill="none" stroke="#1d1d1f" stroke-width="1.4">
    <line x1="800" y1="220" x2="830" y2="220"/>
    <line x1="800" y1="270" x2="830" y2="270"/>
    <line x1="800" y1="320" x2="830" y2="320"/>
    <line x1="800" y1="370" x2="830" y2="370"/>
  </g>
  <!-- bus-width slashes -->
  <g stroke="#1d1d1f" stroke-width="1.2">
    <line x1="404" y1="264" x2="416" y2="252"/>
    <line x1="600" y1="418" x2="612" y2="406"/>
  </g>
  <g font-size="12.5" fill="#86868b">
    <text x="420" y="252">36</text>
    <text x="616" y="406">4</text>
  </g>

  <!-- ===== arrays ===== -->
  <text x="104" y="190" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#86868b">V &#183; TAG ARRAY</text>
  <text x="520" y="190" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#86868b">DATA ARRAY &#183; SET 41</text>
  <g>
    <rect x="104" y="200" width="28" height="40" rx="4" fill="#f5f5f7" stroke="#d2d2d7"/>
    <rect x="140" y="200" width="260" height="40" rx="4" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="104" y="250" width="28" height="40" rx="4" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="140" y="250" width="260" height="40" rx="4" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="104" y="300" width="28" height="40" rx="4" fill="#f5f5f7" stroke="#d2d2d7"/>
    <rect x="140" y="300" width="260" height="40" rx="4" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="104" y="350" width="28" height="40" rx="4" fill="#f5f5f7" stroke="#d2d2d7"/>
    <rect x="140" y="350" width="260" height="40" rx="4" fill="#ffffff" stroke="#d2d2d7"/>
  </g>
  <g>
    <rect x="520" y="200" width="280" height="40" rx="4" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="520" y="250" width="280" height="40" rx="4" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="520" y="300" width="280" height="40" rx="4" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="520" y="350" width="280" height="40" rx="4" fill="#ffffff" stroke="#d2d2d7"/>
  </g>
  <g>
    <path d="M424,204 L472,212 L472,228 L424,236 Z" fill="#eaf3fe" stroke="#0071e3" stroke-width="1.5"/>
    <path d="M424,254 L472,262 L472,278 L424,286 Z" fill="#eaf3fe" stroke="#0071e3" stroke-width="1.5"/>
    <path d="M424,304 L472,312 L472,328 L424,336 Z" fill="#eaf3fe" stroke="#0071e3" stroke-width="1.5"/>
    <path d="M424,354 L472,362 L472,378 L424,386 Z" fill="#eaf3fe" stroke="#0071e3" stroke-width="1.5"/>
  </g>
  <g>
    <text x="32" y="224" font-size="12.5" fill="#86868b">way 0</text>
    <text x="118" y="224" font-size="12.5" text-anchor="middle" fill="#6e6e73">1</text>
    <text x="270" y="224" font-size="12.5" text-anchor="middle" fill="#1d1d1f">0x0004_A1C</text>
    <text x="660" y="224" font-size="12.5" text-anchor="middle" fill="#86868b">64 B line &#183; way 0</text>
    <text x="448" y="225" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1f">=</text>
    <text x="32" y="274" font-size="12.5" fill="#86868b">way 1</text>
    <text x="118" y="274" font-size="12.5" text-anchor="middle" fill="#6e6e73">0</text>
    <text x="270" y="274" font-size="12.5" text-anchor="middle" fill="#1d1d1f">0x00F1_2B8</text>
    <text x="660" y="274" font-size="12.5" text-anchor="middle" fill="#86868b">64 B line &#183; way 1</text>
    <text x="448" y="275" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1f">=</text>
    <text x="32" y="324" font-size="12.5" fill="#86868b">way 2</text>
    <text x="118" y="324" font-size="12.5" text-anchor="middle" fill="#6e6e73">1</text>
    <text x="270" y="324" font-size="12.5" text-anchor="middle" fill="#1d1d1f">0x0004_A1C</text>
    <text x="660" y="324" font-size="12.5" text-anchor="middle" fill="#86868b">64 B line &#183; way 2</text>
    <text x="448" y="325" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1f">=</text>
    <text x="32" y="374" font-size="12.5" fill="#86868b">way 3</text>
    <text x="118" y="374" font-size="12.5" text-anchor="middle" fill="#6e6e73">1</text>
    <text x="270" y="374" font-size="12.5" text-anchor="middle" fill="#1d1d1f">0x0091_7D0</text>
    <text x="660" y="374" font-size="12.5" text-anchor="middle" fill="#86868b">64 B line &#183; way 3</text>
    <text x="448" y="375" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1f">=</text>
  </g>

  <!-- ===== mux + or ===== -->
  <path d="M830,196 L878,216 L878,364 L830,384 Z" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="854" y="294" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">4:1</text>
  <path d="M920,428 Q944,428 968,450 Q944,472 920,472 Q932,450 920,428 Z" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/>
  <text x="938" y="455" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d1d1f">&#8805;1</text>

  <g fill="none" stroke="#0071e3" stroke-width="2">
    <line x1="878" y1="290" x2="948" y2="290" marker-end="url(#dpArrO)"/>
    <line x1="968" y1="450" x2="1024" y2="450" marker-end="url(#dpArrO)"/>
  </g>
  <text x="956" y="278" font-size="13.5" font-weight="600" fill="#1d1d1f">word &#8594; load unit</text>
  <text x="956" y="440" font-size="13.5" font-weight="600" fill="#1d1d1f">HIT</text>
  <text x="1088" y="500" text-anchor="end" font-size="12.5" font-style="italic" fill="#86868b">a miss is this line staying low</text>

  <!-- ===== badges ===== -->
  <g font-size="12.5" font-weight="600" text-anchor="middle">
    <circle cx="600" cy="126" r="9" fill="#0071e3"/><text x="600" y="130" fill="#ffffff">A</text>
    <circle cx="88" cy="240" r="9" fill="#0071e3"/><text x="88" y="244" fill="#ffffff">B</text>
    <circle cx="448" cy="176" r="9" fill="#0071e3"/><text x="448" y="180" fill="#ffffff">C</text>
    <circle cx="854" cy="176" r="9" fill="#0071e3"/><text x="854" y="180" fill="#ffffff">D</text>
    <circle cx="938" cy="404" r="9" fill="#0071e3"/><text x="938" y="408" fill="#ffffff">E</text>
  </g>
  <text x="32" y="524" font-size="12.5" fill="#86868b">way 1 is invalid, so its comparator can never assert &#8212; the valid bit is an input to the match, not a decoration</text>
</svg>
