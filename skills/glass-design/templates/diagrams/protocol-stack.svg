<!-- glass-design diagram template · protocol-stack · paste into a glass page and delete the embedded <style> + background rect (glass.css provides the classes; the page provides the canvas). Craft rules: diagram-craft.md §7 -->
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PCIe protocol layering drawn as two mirrored stacks, requester on the left and completer on the right, each with a transaction layer, a data link layer and a physical layer. Between the upper two layers the horizontal connections are faint and dashed, labelled TLP end to end and DLLP hop by hop: these are protocol agreements, not wires. The only bright solid horizontal line runs along the bottom, the PCIe lane itself, with two AC coupling capacitors. A cyan path numbered one to six shows where the bytes actually travel, down every layer on the requester, once across the lane, then up every layer on the completer" viewBox="0 0 1240 560">
  <style>
    /* Standalone preview values = glass dark theme. When pasted into a glass
       page, DELETE this style block — glass.css provides these classes with
       theme-switching tokens (.glass-svg-* / light mode safe). */
    .glass-svg-ink   { fill: #F4F7FF; }
    .glass-svg-ink-2 { fill: rgba(231,238,255,0.74); }
    .glass-svg-ink-3 { fill: rgba(231,238,255,0.55); }
    .glass-svg-node  { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.17); }
    .glass-svg-node--cyan { fill: rgba(34,211,238,0.15); stroke: rgba(34,211,238,0.55); }
    .glass-svg-node--indigo { fill: rgba(129,140,248,0.16); stroke: rgba(129,140,248,0.55); }
    .glass-svg-line  { stroke: rgba(255,255,255,0.08); }
    .glass-svg-ink-stroke { stroke: rgba(244,247,255,0.85); fill: none; }
    .glass-svg-accent-ink { fill: #22D3EE; }
  </style>
  <rect width="100%" height="100%" fill="#0B1020"/>
  <defs>
    <marker id="pgArrL" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" class="glass-svg-ink-3"/>
    </marker>
    <marker id="pgArrC" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#22D3EE"/>
    </marker>
  </defs>

  <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-3">PROTOCOL LAYERING &#183; PEER VIEW</text>
  <g font-family="'Inter', sans-serif" font-size="12">
    <line x1="586" y1="32" x2="614" y2="32" class="glass-svg-line" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="622" y="36" class="glass-svg-ink-3">peer agreement &#183; no wire</text>
    <line x1="828" y1="32" x2="856" y2="32" class="glass-svg-ink-stroke" stroke-width="2.4" stroke-linecap="round"/>
    <text x="864" y="36" class="glass-svg-ink-3">the only real wire</text>
    <line x1="1000" y1="32" x2="1028" y2="32" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
    <text x="1036" y="36" class="glass-svg-accent-ink">this transfer</text>
  </g>

  <!-- ============ layer zones ============ -->
  <rect x="24" y="76" width="440" height="112" rx="16" class="glass-svg-node" stroke-dasharray="5 4"/>
  <rect x="776" y="76" width="440" height="112" rx="16" class="glass-svg-node" stroke-dasharray="5 4"/>
  <rect x="24" y="216" width="440" height="112" rx="16" class="glass-svg-node" stroke-dasharray="5 4"/>
  <rect x="776" y="216" width="440" height="112" rx="16" class="glass-svg-node" stroke-dasharray="5 4"/>
  <rect x="24" y="356" width="440" height="112" rx="16" class="glass-svg-node" stroke-dasharray="5 4"/>
  <rect x="776" y="356" width="440" height="112" rx="16" class="glass-svg-node" stroke-dasharray="5 4"/>

  <!-- layer names: mono + uppercase + letter-spacing. glass panels are translucent,
       so a tab straddling the border would show the border through it — the typographic
       break (mono caps vs Inter sans in the cards) does the job instead. -->
  <text x="48" y="102" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">TRANSACTION LAYER</text>
  <text x="800" y="102" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">TRANSACTION LAYER</text>
  <text x="48" y="242" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">DATA LINK LAYER</text>
  <text x="800" y="242" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">DATA LINK LAYER</text>
  <text x="48" y="382" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">PHYSICAL LAYER</text>
  <text x="800" y="382" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">PHYSICAL LAYER</text>
  <text x="440" y="102" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">requester</text>
  <text x="1192" y="102" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">completer</text>

  <!-- ============ component cards ============ -->
  <rect x="48" y="116" width="184" height="56" rx="14" class="glass-svg-node"/>
  <rect x="252" y="116" width="184" height="56" rx="14" class="glass-svg-node"/>
  <rect x="800" y="116" width="184" height="56" rx="14" class="glass-svg-node"/>
  <rect x="1004" y="116" width="184" height="56" rx="14" class="glass-svg-node"/>
  <rect x="48" y="256" width="184" height="56" rx="14" class="glass-svg-node"/>
  <rect x="252" y="256" width="184" height="56" rx="14" class="glass-svg-node"/>
  <rect x="800" y="256" width="184" height="56" rx="14" class="glass-svg-node"/>
  <rect x="1004" y="256" width="184" height="56" rx="14" class="glass-svg-node"/>
  <rect x="48" y="396" width="184" height="56" rx="14" class="glass-svg-node"/>
  <rect x="252" y="396" width="184" height="56" rx="14" class="glass-svg-node"/>
  <rect x="800" y="396" width="184" height="56" rx="14" class="glass-svg-node"/>
  <rect x="1004" y="396" width="184" height="56" rx="14" class="glass-svg-node"/>
  <text x="62" y="140" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">TLP generator</text>
  <text x="62" y="159" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">builds header + payload</text>
  <text x="266" y="140" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">Flow control</text>
  <text x="266" y="159" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">credit based</text>
  <text x="814" y="140" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">TLP parser</text>
  <text x="814" y="159" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">decodes header</text>
  <text x="1018" y="140" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">Flow control</text>
  <text x="1018" y="159" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">returns credits</text>
  <text x="62" y="280" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">Seq num + LCRC</text>
  <text x="62" y="299" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">one per packet</text>
  <text x="266" y="280" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">Replay buffer</text>
  <text x="266" y="299" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">holds until ACK</text>
  <text x="814" y="280" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">LCRC check</text>
  <text x="814" y="299" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">drops on mismatch</text>
  <text x="1018" y="280" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">ACK / NAK gen</text>
  <text x="1018" y="299" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">a DLLP, never a TLP</text>
  <text x="62" y="420" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">128b/130b + scrambler</text>
  <text x="62" y="439" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">block sync</text>
  <text x="266" y="420" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">TX driver</text>
  <text x="266" y="439" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">differential pair</text>
  <text x="814" y="420" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">Descrambler + decode</text>
  <text x="814" y="439" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">recovers symbols</text>
  <text x="1018" y="420" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">RX equalizer</text>
  <text x="1018" y="439" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">CDR + de-emphasis</text>

  <!-- ============ peer lines: drawn in two pieces so the pill sits IN the gap ============ -->
  <g class="glass-svg-line" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="516" y1="132" x2="464" y2="132" marker-end="url(#pgArrL)"/>
    <line x1="724" y1="132" x2="776" y2="132" marker-end="url(#pgArrL)"/>
  </g>
  <rect x="520" y="118" width="200" height="28" rx="14" class="glass-svg-node"/>
  <text x="620" y="136" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-2">TLP &#183; end to end</text>
  <g class="glass-svg-line" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="516" y1="272" x2="464" y2="272" marker-end="url(#pgArrL)"/>
    <line x1="724" y1="272" x2="776" y2="272" marker-end="url(#pgArrL)"/>
  </g>
  <rect x="520" y="258" width="200" height="28" rx="14" class="glass-svg-node"/>
  <text x="620" y="276" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-2">DLLP &#183; hop by hop</text>
  <text x="620" y="406" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">no line here either</text>
  <text x="620" y="426" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">the real one runs below</text>

  <!-- ============ the one real wire (bright ink, not cyan: cyan is spent on the transfer) ============ -->
  <g class="glass-svg-ink-stroke" stroke-width="2.4" stroke-linecap="round">
    <line x1="242" y1="508" x2="500" y2="508"/>
    <line x1="740" y1="508" x2="994" y2="508"/>
    <line x1="430" y1="496" x2="430" y2="520"/>
    <line x1="448" y1="496" x2="448" y2="520"/>
    <line x1="790" y1="496" x2="790" y2="520"/>
    <line x1="808" y1="496" x2="808" y2="520"/>
  </g>
  <rect x="520" y="494" width="200" height="28" rx="14" class="glass-svg-node"/>
  <text x="620" y="512" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" class="glass-svg-ink">PCIe lane &#215;4 &#183; 32 GT/s</text>

  <!-- ============ this transfer: the one cyan path ============ -->
  <g stroke="#22D3EE" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M242,188 V208" marker-end="url(#pgArrC)"/>
    <path d="M242,328 V348" marker-end="url(#pgArrC)"/>
    <path d="M242,468 V494" marker-end="url(#pgArrC)"/>
    <path d="M994,494 V468" marker-end="url(#pgArrC)"/>
    <path d="M994,348 V328" marker-end="url(#pgArrC)"/>
    <path d="M994,208 V188" marker-end="url(#pgArrC)"/>
  </g>
  <!-- badges: neutral glass chips with cyan numerals — keeps the cyan-glow budget (§2) on the path itself -->
  <g font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">
    <circle cx="216" cy="198" r="11" class="glass-svg-node"/><text x="216" y="202" text-anchor="middle" class="glass-svg-accent-ink">1</text>
    <circle cx="216" cy="338" r="11" class="glass-svg-node"/><text x="216" y="342" text-anchor="middle" class="glass-svg-accent-ink">2</text>
    <circle cx="216" cy="481" r="11" class="glass-svg-node"/><text x="216" y="485" text-anchor="middle" class="glass-svg-accent-ink">3</text>
    <circle cx="1020" cy="481" r="11" class="glass-svg-node"/><text x="1020" y="485" text-anchor="middle" class="glass-svg-accent-ink">4</text>
    <circle cx="1020" cy="338" r="11" class="glass-svg-node"/><text x="1020" y="342" text-anchor="middle" class="glass-svg-accent-ink">5</text>
    <circle cx="1020" cy="198" r="11" class="glass-svg-node"/><text x="1020" y="202" text-anchor="middle" class="glass-svg-accent-ink">6</text>
  </g>
</svg>
