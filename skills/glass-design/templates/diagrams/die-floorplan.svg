<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Floorplan of one compute die: twenty tiles in five columns and four rows, each tile a core sitting under its own cache-home agent and last-level cache slice. Orange mesh rails run in every gap between tiles, horizontally and vertically, and a ring stop sits at each of the thirty crossings — that stop, not the tile, is where a tile joins the mesh. Four IO tiles sit along the top edge, one UPI and two PCIe and one DMI, each labelled with its width and its line rate, with an arrow leaving the die. A memory controller flanks each side with three DDR5 channels behind it. One request is traced in orange over the mesh: badge one, core eleven misses its private cache and injects at the nearest ring stop; badge two, the address hashes to the last-level cache slice on core eight's tile, two columns away; badge three, that slice misses and the request leaves eastward to the right-hand memory controller" font-family="'Inter', 'Noto Sans SC', system-ui, sans-serif">
  <style>
    /* Standalone preview values = glass dark theme. When pasted into a glass
       page, DELETE this style block and the canvas rect below — glass.css
       provides these classes with theme-switching tokens. */
    .glass-svg-ink   { fill: #F4F7FF; }
    .glass-svg-ink-2 { fill: rgba(231,238,255,0.74); }
    .glass-svg-ink-3 { fill: rgba(231,238,255,0.55); }
    .glass-svg-node  { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.17); }
    .glass-svg-node--cyan   { fill: rgba(34,211,238,0.15); stroke: rgba(34,211,238,0.55); }
    .glass-svg-node--indigo { fill: rgba(129,140,248,0.16); stroke: rgba(129,140,248,0.55); }
    .glass-svg-node--warn   { fill: rgba(251,191,36,0.14); stroke: rgba(251,191,36,0.55); }
    .glass-svg-line  { stroke: rgba(255,255,255,0.10); }
    .glass-svg-ink-stroke { stroke: rgba(244,247,255,0.85); fill: none; }
    .glass-svg-accent      { fill: #22D3EE; }
    .glass-svg-accent-ink  { fill: #22D3EE; }
    .glass-svg-accent-stroke { stroke: #22D3EE; fill: none; }
    .glass-svg-ref-ink { fill: #A5B4FC; }
    .glass-svg-ok   { fill: #34D399; }
    .glass-svg-warn { fill: #FBBF24; }
  </style>
