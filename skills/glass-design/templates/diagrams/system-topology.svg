<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Board-level system topology of one SoC package with its PCIe hierarchy, drawn above the system physical address space so the two can be read together. Two DDR4 channels enter the package on each side through an integrated memory controller; four cores and a root complex on bus 00 expose three root ports. Root port 0 reaches an NVMe SSD on bus 01, root port 1 reaches a PCIe switch whose two downstream ports carry bus 03 and bus 04 to an accelerator and a GPU, and root port 2 reaches a network controller on bus 06. Every wire carries a pill naming its link width and bus number. At the bottom a single address bar runs from zero: DRAM below two gigabytes, then the thirty-two bit PCI MMIO window holding one BAR segment per device in the same left to right order as the cards above, an unassigned gap, and DRAM again above four gigabytes. A dashed leader drops from each device card onto its own BAR segment" font-family="'Inter', 'Noto Sans SC', system-ui, sans-serif">
  <style>
    /* Standalone preview values = glass dark theme. When pasted into a glass
       page, DELETE this style block and the canvas rect below — glass.css
       provides these classes with theme-switching tokens. */
    .glass-svg-ink   { fill: #F4F7FF; }
    .glass-svg-ink-2 { fill: rgba(231,238,255,0.74); }
    .glass-svg-ink-3 { fill: rgba(231,238,255,0.55); }
    .glass-svg-node  { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.17); }
    .glass-svg-node--cyan   { fill: rgba(34,211,238,0.15); stroke: rgba(34,211,238,0.55); }
    .glass-svg-node--indigo { fill: rgba(129,140,248,0.16); stroke: rgba(129,140,248,0.55); }
    .glass-svg-node--warn   { fill: rgba(251,191,36,0.14); stroke: rgba(251,191,36,0.55); }
    .glass-svg-line  { stroke: rgba(255,255,255,0.10); }
    .glass-svg-ink-stroke { stroke: rgba(244,247,255,0.85); fill: none; }
    .glass-svg-accent      { fill: #22D3EE; }
    .glass-svg-accent-ink  { fill: #22D3EE; }
    .glass-svg-accent-stroke { stroke: #22D3EE; fill: none; }
    .glass-svg-ref-ink { fill: #A5B4FC; }
    .glass-svg-ok   { fill: #34D399; }
    .glass-svg-warn { fill: #FBBF24; }
  </style>
  <defs>
    <pattern id="stHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line class="glass-svg-line" x1="0" y1="0" x2="0" y2="6"  stroke-width="1.6" opacity="0.45"/>
    </pattern>
    <filter id="stSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <marker id="stArrI" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="glass-svg-ink" d="M0,0.5 L7.5,4 L0,7.5 Z"/>
    </marker>
    <marker id="stArrG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="glass-svg-ok" d="M0,0.5 L7.5,4 L0,7.5 Z"/>
    </marker>
  </defs>

  <rect width="1120" height="560" rx="16" fill="#0B1020"/>

  <!-- header + legend -->
  <text class="glass-svg-ink-2" x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2">SYSTEM TOPOLOGY &#183; PCIe HIERARCHY OVER ITS ADDRESS SPACE</text>
  <g class="glass-svg-ink-2" font-size="12">
    <circle class="glass-svg-ok" cx="700" cy="30" r="3.5"/><text x="712" y="34">DRAM</text>
    <circle class="glass-svg-ref-ink" cx="778" cy="30" r="3.5"/><text x="790" y="34">device</text>
    <circle class="glass-svg-warn" cx="862" cy="30" r="3.5"/><text x="874" y="34">MMIO window</text>
    <line class="glass-svg-line" x1="988" y1="30" x2="1014" y2="30"  stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="1022" y="34">owns this BAR</text>
  </g>

  <!-- ============ DIMMs ============ -->
  <g>
    <rect class="glass-svg-node" x="32" y="72" width="96" height="32" rx="4"/>
    <g class="glass-svg-ok" opacity="0.55">
      <rect x="42" y="80" width="11" height="16" rx="1.5"/><rect x="57" y="80" width="11" height="16" rx="1.5"/>
      <rect x="72" y="80" width="11" height="16" rx="1.5"/><rect x="87" y="80" width="11" height="16" rx="1.5"/>
      <rect x="102" y="80" width="11" height="16" rx="1.5"/>
    </g>
    <rect class="glass-svg-node" x="32" y="118" width="96" height="32" rx="4"/>
    <g class="glass-svg-ok" opacity="0.55">
      <rect x="42" y="126" width="11" height="16" rx="1.5"/><rect x="57" y="126" width="11" height="16" rx="1.5"/>
      <rect x="72" y="126" width="11" height="16" rx="1.5"/><rect x="87" y="126" width="11" height="16" rx="1.5"/>
      <rect x="102" y="126" width="11" height="16" rx="1.5"/>
    </g>
    <text class="glass-svg-ink-2" x="80" y="168" text-anchor="middle" font-size="12">DDR4 &#183; 2 DIMM</text>
  </g>
  <g>
    <rect class="glass-svg-node" x="992" y="72" width="96" height="32" rx="4"/>
    <g class="glass-svg-ok" opacity="0.55">
      <rect x="1002" y="80" width="11" height="16" rx="1.5"/><rect x="1017" y="80" width="11" height="16" rx="1.5"/>
      <rect x="1032" y="80" width="11" height="16" rx="1.5"/><rect x="1047" y="80" width="11" height="16" rx="1.5"/>
      <rect x="1062" y="80" width="11" height="16" rx="1.5"/>
    </g>
    <rect class="glass-svg-node" x="992" y="118" width="96" height="32" rx="4"/>
    <g class="glass-svg-ok" opacity="0.55">
      <rect x="1002" y="126" width="11" height="16" rx="1.5"/><rect x="1017" y="126" width="11" height="16" rx="1.5"/>
      <rect x="1032" y="126" width="11" height="16" rx="1.5"/><rect x="1047" y="126" width="11" height="16" rx="1.5"/>
      <rect x="1062" y="126" width="11" height="16" rx="1.5"/>
    </g>
    <text class="glass-svg-ink-2" x="1040" y="168" text-anchor="middle" font-size="12">DDR4 &#183; 2 DIMM</text>
  </g>

  <!-- memory links + pills -->
  <g class="glass-svg-line" fill="none"  stroke-width="1.6">
    <line x1="128" y1="88" x2="272" y2="88" marker-end="url(#stArrG)" marker-start="url(#stArrG)"/>
    <line x1="128" y1="134" x2="272" y2="134" marker-end="url(#stArrG)" marker-start="url(#stArrG)"/>
    <line x1="856" y1="88" x2="992" y2="88" marker-end="url(#stArrG)" marker-start="url(#stArrG)"/>
    <line x1="856" y1="134" x2="992" y2="134" marker-end="url(#stArrG)" marker-start="url(#stArrG)"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect class="glass-svg-node" x="140" y="78" width="120" height="20" rx="10"/>
    <text class="glass-svg-ink-2" x="200" y="92">ch0 &#183; 3200 MT/s</text>
    <rect class="glass-svg-node" x="140" y="124" width="120" height="20" rx="10"/>
    <text class="glass-svg-ink-2" x="200" y="138">ch1 &#183; 3200 MT/s</text>
    <rect class="glass-svg-node" x="864" y="78" width="120" height="20" rx="10"/>
    <text class="glass-svg-ink-2" x="924" y="92">ch2 &#183; 3200 MT/s</text>
    <rect class="glass-svg-node" x="864" y="124" width="120" height="20" rx="10"/>
    <text class="glass-svg-ink-2" x="924" y="138">ch3 &#183; 3200 MT/s</text>
  </g>

  <!-- ============ SoC package ============ -->
  <rect class="glass-svg-node" x="272" y="56" width="584" height="152" rx="12"   filter="url(#stSh)"/>
  <circle class="glass-svg-ink" cx="292" cy="76" r="4"/>
  <text class="glass-svg-ink" x="304" y="80" font-size="12" font-weight="600" letter-spacing="1.2">SoC PACKAGE</text>
  <text class="glass-svg-ink-3" x="840" y="80" text-anchor="end" font-size="12" font-style="italic">one coherent domain</text>

  <g font-size="12" text-anchor="middle">
    <rect class="glass-svg-node" x="288" y="100" width="56" height="44" rx="8"/>
    <text class="glass-svg-ink-2" x="316" y="127">IMC</text>
    <rect class="glass-svg-node" x="784" y="100" width="56" height="44" rx="8"/>
    <text class="glass-svg-ink-2" x="812" y="127">IMC</text>
    <g class="glass-svg-node--indigo">
      <rect x="360" y="100" width="84" height="44" rx="8"/><rect x="454" y="100" width="84" height="44" rx="8"/>
      <rect x="548" y="100" width="84" height="44" rx="8"/><rect x="642" y="100" width="84" height="44" rx="8"/>
    </g>
    <g class="glass-svg-ref-ink">
      <text x="402" y="127">Core 0</text><text x="496" y="127">Core 1</text>
      <text x="590" y="127">Core 2</text><text x="684" y="127">Core 3</text>
    </g>
  </g>

  <text class="glass-svg-ink-2" x="288" y="164" font-size="12" font-weight="600" letter-spacing="1.2">ROOT COMPLEX &#183; BUS 00</text>
  <rect class="glass-svg-node" x="288" y="170" width="552" height="26" rx="8"/>
  <g font-size="12" text-anchor="middle">
    <rect class="glass-svg-node--indigo" x="340" y="174" width="110" height="18" rx="9"/>
    <text class="glass-svg-ref-ink" x="395" y="187">RP0 &#183; 00:1c.0</text>
    <rect class="glass-svg-node--indigo" x="520" y="174" width="110" height="18" rx="9"/>
    <text class="glass-svg-ref-ink" x="575" y="187">RP1 &#183; 00:1c.4</text>
    <rect class="glass-svg-node--indigo" x="700" y="174" width="110" height="18" rx="9"/>
    <text class="glass-svg-ref-ink" x="755" y="187">RP2 &#183; 00:1d.0</text>
  </g>

  <!-- ============ links down ============ -->
  <g class="glass-svg-ink-stroke" fill="none"  stroke-width="1.6">
    <path d="M395,196 V332 Q395,340 387,340 H178 Q170,340 170,348 V364" marker-end="url(#stArrI)"/>
    <path d="M575,196 V252" marker-end="url(#stArrI)"/>
    <path d="M755,196 V332 Q755,340 763,340 H942 Q950,340 950,348 V364" marker-end="url(#stArrI)"/>
    <path d="M520,312 V344 Q520,352 512,352 H438 Q430,352 430,360 V364" marker-end="url(#stArrI)"/>
    <path d="M640,312 V344 Q640,352 648,352 H682 Q690,352 690,360 V364" marker-end="url(#stArrI)"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect class="glass-svg-node" x="270" y="216" width="126" height="20" rx="10"/>
    <text class="glass-svg-ink-2" x="333" y="230">Gen4 x4 &#183; BUS 01</text>
    <rect class="glass-svg-node" x="583" y="216" width="126" height="20" rx="10"/>
    <text class="glass-svg-ink-2" x="646" y="230">Gen4 x8 &#183; BUS 02</text>
    <rect class="glass-svg-node" x="763" y="216" width="126" height="20" rx="10"/>
    <text class="glass-svg-ink-2" x="826" y="230">Gen3 x1 &#183; BUS 06</text>
    <rect class="glass-svg-node" x="392" y="322" width="112" height="20" rx="10"/>
    <text class="glass-svg-ink-2" x="448" y="336">x4 &#183; BUS 03</text>
    <rect class="glass-svg-node" x="600" y="322" width="112" height="20" rx="10"/>
    <text class="glass-svg-ink-2" x="656" y="336">x4 &#183; BUS 04</text>
  </g>

  <!-- ============ switch ============ -->
  <rect class="glass-svg-node" x="470" y="252" width="220" height="60" rx="10"   filter="url(#stSh)"/>
  <text class="glass-svg-ink" x="580" y="276" text-anchor="middle" font-size="13" font-weight="600">PCIe SWITCH</text>
  <text class="glass-svg-ink-2" x="580" y="292" text-anchor="middle" font-size="12">1 upstream &#183; 2 downstream &#183; BUS 02</text>

  <!-- ============ device cards ============ -->
  <g filter="url(#stSh)">
    <rect class="glass-svg-node" x="86" y="364" width="168" height="72" rx="10"/>
    <rect class="glass-svg-node" x="346" y="364" width="168" height="72" rx="10"/>
    <rect class="glass-svg-node" x="606" y="364" width="168" height="72" rx="10"/>
    <rect class="glass-svg-node" x="866" y="364" width="168" height="72" rx="10"/>
  </g>
  <g class="glass-svg-line" fill="none"  stroke-width="1.6">
    <rect x="104" y="382" width="20" height="16" rx="3"/><line x1="109" y1="398" x2="109" y2="404"/><line x1="119" y1="398" x2="119" y2="404"/>
    <rect x="364" y="382" width="20" height="20" rx="3"/><rect x="370" y="388" width="8" height="8" rx="1"/>
    <rect x="624" y="382" width="20" height="20" rx="3"/><line x1="629" y1="378" x2="629" y2="382"/><line x1="639" y1="378" x2="639" y2="382"/><line x1="629" y1="402" x2="629" y2="406"/><line x1="639" y1="402" x2="639" y2="406"/>
    <circle cx="894" cy="392" r="10"/><line x1="884" y1="392" x2="904" y2="392"/><path d="M894,382 Q900,392 894,402 Q888,392 894,382"/>
  </g>
  <g class="glass-svg-ink" font-size="13" font-weight="600">
    <text x="136" y="390">NVMe SSD</text><text x="396" y="390">Accelerator</text>
    <text x="656" y="390">GPU</text><text x="916" y="390">Network</text>
  </g>
  <g class="glass-svg-ink-2" font-size="12">
    <text x="104" y="418">01:00.0 &#183; BAR0 16 KiB</text>
    <text x="364" y="418">03:00.0 &#183; BAR0 256 MiB</text>
    <text x="624" y="418">04:00.0 &#183; BAR0 512 MiB</text>
    <text x="884" y="418">06:00.0 &#183; BAR0 128 KiB</text>
  </g>

  <!-- ============ leaders onto the address bar ============ -->
  <g class="glass-svg-line" fill="none"  stroke-width="1.2" stroke-dasharray="4 3">
    <path d="M170,436 Q170,458 200,458 H420 Q450,458 450,470"/>
    <path d="M430,436 Q430,456 460,456 H490 Q520,456 520,470"/>
    <path d="M690,436 V470"/>
    <path d="M950,436 Q950,456 920,456 H750 Q720,456 720,470"/>
  </g>
  <g class="glass-svg-ink-3">
    <circle cx="450" cy="470" r="2.5"/><circle cx="520" cy="470" r="2.5"/>
    <circle cx="690" cy="470" r="2.5"/><circle cx="720" cy="470" r="2.5"/>
  </g>

  <!-- ============ address bar ============ -->
  <g>
    <rect class="glass-svg-node" x="86" y="470" width="344" height="44"/>
    <rect class="glass-svg-node--warn" x="430" y="470" width="40" height="44"/>
    <rect class="glass-svg-node--warn" x="470" y="470" width="100" height="44"/>
    <rect class="glass-svg-node--warn" x="570" y="470" width="130" height="44"/>
    <rect class="glass-svg-node--warn" x="700" y="470" width="40" height="44"/>
    <rect class="glass-svg-node" x="740" y="470" width="50" height="44"/>
    <rect x="740" y="470" width="50" height="44" fill="url(#stHatch)"/>
    <rect class="glass-svg-node" x="790" y="470" width="244" height="44"/>
    <rect class="glass-svg-warn" x="430" y="470" width="360" height="4"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text class="glass-svg-ink-2" x="258" y="497">DRAM &#183; 0 &#8211; 2 GiB</text>
    <text class="glass-svg-warn" x="450" y="497">nvme</text>
    <text class="glass-svg-warn" x="520" y="497">accel</text>
    <text class="glass-svg-warn" x="635" y="497">gpu</text>
    <text class="glass-svg-warn" x="720" y="497">nic</text>
    <text class="glass-svg-ink-2" x="912" y="497">DRAM &#183; 4 GiB and up</text>
  </g>
  <g class="glass-svg-line" fill="none"  stroke-width="1.2">
    <line x1="430" y1="524" x2="790" y2="524"/>
    <line x1="430" y1="520" x2="430" y2="528"/><line x1="790" y1="520" x2="790" y2="528"/>
  </g>
  <g font-size="12">
    <text class="glass-svg-ink-2" x="86" y="542">0x0000_0000</text>
    <text class="glass-svg-warn" x="610" y="542" text-anchor="middle">PCI MMIO window &#183; 32-bit</text>
    <text class="glass-svg-ink-2" x="820" y="542">0x1_0000_0000</text>
    <text class="glass-svg-ink-3" x="1034" y="542" text-anchor="end" font-style="italic">not to scale</text>
  </g>
</svg>
