<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Pointer graph of the Linux memory-management structures, drawn so every arrow leaves the field that actually holds the pointer rather than the edge of the box. task_struct lists pid, comm, mm, active_mm and files; an orange dot marks each pointer field and the arrow starts there. The mm dot goes to mm_struct, whose mm_mt field is a maple tree keyed by start address; three slots in that tree carry the ordered virtual ranges and each slot points down at one vm_area_struct. The first VMA is drawn in full, with start, end, flags, page offset, the file it maps, its operations table, and anon_vma which stays NULL until the first copy-on-write store, while its two siblings show only start, end and flags. Two further arrows leave the first VMA: vm_file to a struct file, vm_ops to a vm_operations_struct holding filemap_fault. Field names follow include linux mm_types.h at kernel 6.6; row order is reading order, not struct offset order" font-family="'Inter', 'Noto Sans SC', system-ui, sans-serif">
  <style>
    /* Standalone preview values = glass dark theme. When pasted into a glass
       page, DELETE this style block and the canvas rect below — glass.css
       provides these classes with theme-switching tokens. */
    .glass-svg-ink   { fill: #F4F7FF; }
    .glass-svg-ink-2 { fill: rgba(231,238,255,0.74); }
    .glass-svg-ink-3 { fill: rgba(231,238,255,0.55); }
    .glass-svg-node  { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.17); }
    .glass-svg-node--cyan   { fill: rgba(34,211,238,0.15); stroke: rgba(34,211,238,0.55); }
    .glass-svg-node--indigo { fill: rgba(129,140,248,0.16); stroke: rgba(129,140,248,0.55); }
    .glass-svg-node--warn   { fill: rgba(251,191,36,0.14); stroke: rgba(251,191,36,0.55); }
    .glass-svg-line  { stroke: rgba(255,255,255,0.10); }
    .glass-svg-ink-stroke { stroke: rgba(244,247,255,0.85); fill: none; }
    .glass-svg-accent      { fill: #22D3EE; }
    .glass-svg-accent-ink  { fill: #22D3EE; }
    .glass-svg-accent-stroke { stroke: #22D3EE; fill: none; }
    .glass-svg-ref-ink { fill: #A5B4FC; }
    .glass-svg-ok   { fill: #34D399; }
    .glass-svg-warn { fill: #FBBF24; }
  </style>
  <defs>
    <marker id="sgArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="glass-svg-accent" d="M0,0.5 L7.5,4 L0,7.5 Z"/>
    </marker>
  </defs>

  <rect width="1120" height="560" rx="16" fill="#0B1020"/>

  <text class="glass-svg-ink-2" x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2">STRUCT GRAPH &#183; WHICH FIELD HOLDS WHICH POINTER</text>
  <g class="glass-svg-ink-2" font-size="12">
    <circle class="glass-svg-accent" cx="600" cy="30" r="4"/><text x="612" y="34">pointer field &#183; every arrow starts here, not at the edge of the box</text>
  </g>

