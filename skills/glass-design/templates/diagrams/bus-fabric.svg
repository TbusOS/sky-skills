<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Bus fabric of one SoC drawn the old way, as two horizontal rails with everything hanging off them. Three masters sit above the upper rail — a four-core CPU cluster, a sixteen-channel DMA engine and a GPU — and four slaves hang below it: SRAM, an AXI to APB bridge, high-speed USB and Ethernet, and the DDR4 controller. The rail is AXI4, one hundred and twenty-eight bits wide, and an arbiter block sits astride it. Each drop carries a slash with the width of that connection in bits, and the channel names it actually uses. The bridge drops to a second, narrower rail: APB at thirty-two bits, carrying UART, I2C, SPI, GPIO and a watchdog. One read is traced in orange over the top: badge one, the CPU drives its read-address channel onto the rail; badge two, the arbiter grants it the rail for that beat; badge three, the request reaches the DDR controller; badge four, read data returns along the same rail on the read channel, drawn dashed because it is the return leg" font-family="'Inter', 'Noto Sans SC', system-ui, sans-serif">
  <style>
    /* Standalone preview values = glass dark theme. When pasted into a glass
       page, DELETE this style block and the canvas rect below — glass.css
       provides these classes with theme-switching tokens. */
    .glass-svg-ink   { fill: #F4F7FF; }
    .glass-svg-ink-2 { fill: rgba(231,238,255,0.74); }
    .glass-svg-ink-3 { fill: rgba(231,238,255,0.55); }
    .glass-svg-node  { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.17); }
    .glass-svg-node--cyan   { fill: rgba(34,211,238,0.15); stroke: rgba(34,211,238,0.55); }
    .glass-svg-node--indigo { fill: rgba(129,140,248,0.16); stroke: rgba(129,140,248,0.55); }
    .glass-svg-node--warn   { fill: rgba(251,191,36,0.14); stroke: rgba(251,191,36,0.55); }
    .glass-svg-line  { stroke: rgba(255,255,255,0.10); }
    .glass-svg-ink-stroke { stroke: rgba(244,247,255,0.85); fill: none; }
    .glass-svg-accent      { fill: #22D3EE; }
    .glass-svg-accent-ink  { fill: #22D3EE; }
    .glass-svg-accent-stroke { stroke: #22D3EE; fill: none; }
    .glass-svg-ref-ink { fill: #A5B4FC; }
    .glass-svg-ok   { fill: #34D399; }
    .glass-svg-warn { fill: #FBBF24; }
  </style>
  <defs>
    <marker id="bfArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="glass-svg-accent" d="M0,0.5 L7.5,4 L0,7.5 Z"/>
    </marker>
  </defs>

  <rect width="1120" height="560" rx="16" fill="#0B1020"/>

  <text class="glass-svg-ink-2" x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2">BUS FABRIC &#183; TWO RAILS, ONE TRACED READ</text>
  <g class="glass-svg-ink-2" font-size="12">
    <rect class="glass-svg-node--indigo" x="596" y="24" width="16" height="12" rx="3"/><text x="620" y="34">master</text>
    <rect class="glass-svg-node" x="686" y="24" width="16" height="12" rx="3"/><text x="710" y="34">slave</text>
    <rect class="glass-svg-node--warn" x="768" y="24" width="16" height="12" rx="3"/><text x="792" y="34">APB peripheral</text>
    <line class="glass-svg-accent-stroke" x1="904" y1="30" x2="928" y2="30"  stroke-width="2.2"/><text x="936" y="34">this read</text>
  </g>

  <!-- masters -->
  <g>
    <rect class="glass-svg-node--indigo" x="100" y="76" width="200" height="70" rx="10"/>
    <text class="glass-svg-ref-ink" x="200" y="109" text-anchor="middle" font-size="13" font-weight="600">CPU cluster</text>
    <text class="glass-svg-ink-2" x="200" y="127" text-anchor="middle" font-size="12">4 &#215; A78 &#183; AXI master 0</text>
    <rect class="glass-svg-node--indigo" x="420" y="76" width="200" height="70" rx="10"/>
    <text class="glass-svg-ref-ink" x="520" y="109" text-anchor="middle" font-size="13" font-weight="600">DMA engine</text>
    <text class="glass-svg-ink-2" x="520" y="127" text-anchor="middle" font-size="12">16 ch &#183; AXI master 1</text>
    <rect class="glass-svg-node--indigo" x="740" y="76" width="200" height="70" rx="10"/>
    <text class="glass-svg-ref-ink" x="840" y="109" text-anchor="middle" font-size="13" font-weight="600">GPU / VPU</text>
    <text class="glass-svg-ink-2" x="840" y="127" text-anchor="middle" font-size="12">AXI master 2</text>
  </g>

  <!-- traced read, drawn under the rails and the arbiter -->
  <g class="glass-svg-accent-stroke" fill="none"  stroke-width="2.2">
    <line x1="200" y1="146" x2="200" y2="182"/>
    <line x1="200" y1="182" x2="980" y2="182"/>
    <line x1="980" y1="182" x2="980" y2="254" marker-end="url(#bfArrO)"/>
  </g>
  <g class="glass-svg-accent-stroke" fill="none"  stroke-width="2.2" stroke-dasharray="6 4">
    <line x1="968" y1="254" x2="968" y2="220"/>
    <line x1="968" y1="220" x2="212" y2="220"/>
    <line x1="212" y1="220" x2="212" y2="146" marker-end="url(#bfArrO)"/>
  </g>

  <!-- rails -->
  <rect class="glass-svg-ink" x="64" y="198" width="992" height="5" rx="2.5"/>
  <rect class="glass-svg-ink-3" x="180" y="398" width="720" height="6" rx="3"/>
  <text class="glass-svg-ink" x="1056" y="172" text-anchor="end" font-size="12" font-weight="600" letter-spacing="1.2">AXI4 &#183; 128-bit &#183; AW W B AR R</text>
  <text class="glass-svg-ink-2" x="916" y="406" font-size="12" font-weight="600" letter-spacing="1.2">APB &#183; 32-bit</text>

  <!-- drops -->
  <g class="glass-svg-ink-stroke" stroke-width="1.6">
    <line x1="200" y1="146" x2="200" y2="200"/>
    <line x1="520" y1="146" x2="520" y2="200"/>
    <line x1="840" y1="146" x2="840" y2="200"/>
    <line x1="160" y1="200" x2="160" y2="254"/>
    <line x1="440" y1="200" x2="440" y2="254"/>
    <line x1="720" y1="200" x2="720" y2="254"/>
    <line x1="980" y1="200" x2="980" y2="254"/>
  </g>
  <g class="glass-svg-line" stroke-width="1.6">
    <line x1="240" y1="400" x2="240" y2="430"/>
    <line x1="400" y1="400" x2="400" y2="430"/>
    <line x1="560" y1="400" x2="560" y2="430"/>
    <line x1="720" y1="400" x2="720" y2="430"/>
    <line x1="880" y1="400" x2="880" y2="430"/>
  </g>
  <line class="glass-svg-line" x1="440" y1="324" x2="440" y2="398"  stroke-width="1.6"/>

  <!-- bus widths -->
    <line class="glass-svg-ink-stroke" x1="194" y1="178" x2="206" y2="166"  stroke-width="1.2"/>
    <text class="glass-svg-ink-2" x="210" y="174" font-size="12">128</text>
    <line class="glass-svg-ink-stroke" x1="434" y1="366" x2="446" y2="354"  stroke-width="1.2"/>
    <text class="glass-svg-ink-2" x="450" y="362" font-size="12">32</text>
    <line class="glass-svg-ink-stroke" x1="234" y1="421" x2="246" y2="409"  stroke-width="1.2"/>
    <text class="glass-svg-ink-2" x="250" y="417" font-size="12">32</text>

  <!-- arbiter astride the rail -->
  <rect class="glass-svg-node" x="296" y="188" width="104" height="24" rx="8"/>
  <text class="glass-svg-ink" x="348" y="204" text-anchor="middle" font-size="12" font-weight="600">arbiter</text>

  <!-- slaves + apb -->
  <g>
    <rect class="glass-svg-node" x="70" y="254" width="180" height="70" rx="10"/>
    <text class="glass-svg-ink-2" x="160" y="287" text-anchor="middle" font-size="13" font-weight="600">SRAM</text>
    <text class="glass-svg-ink-2" x="160" y="305" text-anchor="middle" font-size="12">256 KiB &#183; 0x0000_0000</text>
    <rect class="glass-svg-node" x="350" y="254" width="180" height="70" rx="10"/>
    <text class="glass-svg-ink-2" x="440" y="287" text-anchor="middle" font-size="13" font-weight="600">AXI &#8594; APB bridge</text>
    <text class="glass-svg-ink-2" x="440" y="305" text-anchor="middle" font-size="12">protocol converter</text>
    <rect class="glass-svg-node" x="630" y="254" width="180" height="70" rx="10"/>
    <text class="glass-svg-ink-2" x="720" y="287" text-anchor="middle" font-size="13" font-weight="600">USB3 &#183; GbE</text>
    <text class="glass-svg-ink-2" x="720" y="305" text-anchor="middle" font-size="12">high-speed IP</text>
    <rect class="glass-svg-node" x="890" y="254" width="180" height="70" rx="10"/>
    <text class="glass-svg-ink-2" x="980" y="287" text-anchor="middle" font-size="13" font-weight="600">DDR4 controller</text>
    <text class="glass-svg-ink-2" x="980" y="305" text-anchor="middle" font-size="12">0x8000_0000 &#183; 4 GiB</text>
  </g>
  <g>
    <rect class="glass-svg-node--warn" x="175" y="430" width="130" height="56" rx="10"/>
    <text class="glass-svg-warn" x="240" y="463" text-anchor="middle" font-size="13" font-weight="600">UART0</text>
    <rect class="glass-svg-node--warn" x="335" y="430" width="130" height="56" rx="10"/>
    <text class="glass-svg-warn" x="400" y="463" text-anchor="middle" font-size="13" font-weight="600">I2C0</text>
    <rect class="glass-svg-node--warn" x="495" y="430" width="130" height="56" rx="10"/>
    <text class="glass-svg-warn" x="560" y="463" text-anchor="middle" font-size="13" font-weight="600">SPI0</text>
    <rect class="glass-svg-node--warn" x="655" y="430" width="130" height="56" rx="10"/>
    <text class="glass-svg-warn" x="720" y="463" text-anchor="middle" font-size="13" font-weight="600">GPIO</text>
    <rect class="glass-svg-node--warn" x="815" y="430" width="130" height="56" rx="10"/>
    <text class="glass-svg-warn" x="880" y="463" text-anchor="middle" font-size="13" font-weight="600">WDT</text>
  </g>

  <!-- badges -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <circle class="glass-svg-node--cyan" cx="176" cy="168" r="9"/><text class="glass-svg-accent-ink" x="176" y="172">1</text>
    <circle class="glass-svg-node--cyan" cx="348" cy="166" r="9"/><text class="glass-svg-accent-ink" x="348" y="170">2</text>
    <circle class="glass-svg-node--cyan" cx="1004" cy="232" r="9"/><text class="glass-svg-accent-ink" x="1004" y="236">3</text>
    <circle class="glass-svg-node--cyan" cx="700" cy="234" r="9"/><text class="glass-svg-accent-ink" x="700" y="238">4</text>
  </g>

  <text class="glass-svg-ink-2" x="32" y="524" font-size="12">every drop carries its own width; the rail carries the name of the channels riding it</text>
  <text class="glass-svg-ink-3" x="1088" y="524" text-anchor="end" font-size="12" font-style="italic">rails are a drawing, not a topology claim &#183; a real AXI NoC is switched</text>
</svg>
