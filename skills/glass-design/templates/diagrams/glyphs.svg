<!-- glass-design diagram template · glyphs · a SHEET, not a figure: copy one <g id="g-*"> at a time into another diagram. Paste into a glass page and delete the embedded <style> + background rect. Craft rules: diagram-craft.md §8 -->
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Glyph sheet for engineering diagrams in the glass grammar: a comb-toothed strip for a bounded in-order queue with a cyan write pointer and an ink read pointer, a ruler-ticked bar for a serialized byte stream, a row of small vertical bars for pluggable slots with one populated in cyan, a dark tab straddling a die boundary for an on-die port, a panel with a bezel strip and a cyan link LED for a pluggable board, two short strokes across a bright line for an AC coupling capacitor, a small block where a signal crosses a clock-domain boundary for a synchroniser, and a hatched fill for a window onto another address space" viewBox="0 0 1240 470">
  <style>
    /* Standalone preview values = glass dark theme. When pasted into a glass
       page, DELETE this style block — glass.css provides these classes. */
    .glass-svg-ink   { fill: #F4F7FF; }
    .glass-svg-ink-2 { fill: rgba(231,238,255,0.74); }
    .glass-svg-ink-3 { fill: rgba(231,238,255,0.55); }
    .glass-svg-node  { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.17); }
    .glass-svg-node--cyan { fill: rgba(34,211,238,0.15); stroke: rgba(34,211,238,0.55); }
    .glass-svg-node--indigo { fill: rgba(129,140,248,0.16); stroke: rgba(129,140,248,0.55); }
    .glass-svg-line  { stroke: rgba(255,255,255,0.08); }
    .glass-svg-ink-stroke { stroke: rgba(244,247,255,0.85); fill: none; }
    .glass-svg-accent { fill: #22D3EE; }
    .glass-svg-accent-ink { fill: #22D3EE; }
  </style>
  <rect width="100%" height="100%" fill="#0B1020"/>
  <defs>
    <pattern id="glgHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="1.6" height="7" class="glass-svg-ink-3"/>
    </pattern>
    <marker id="glgArrI" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" class="glass-svg-ink"/>
    </marker>
  </defs>

  <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-3">GLYPH SHEET &#183; COPY ONE &#60;g&#62; AT A TIME</text>
  <text x="24" y="88" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">QUEUE</text>
  <text x="164" y="232" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">finite depth, in order</text>
  <text x="328" y="88" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">BYTE STREAM</text>
  <text x="468" y="232" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">serialized bytes, not addresses</text>
  <text x="632" y="88" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">SLOTS</text>
  <text x="772" y="232" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">a place something plugs into</text>
  <text x="936" y="88" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">PORT TAB</text>
  <text x="1076" y="232" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">an interface owned by this die</text>
  <text x="24" y="288" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">DEVICE CARD</text>
  <text x="164" y="432" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">pluggable board &#183; model text, no logo</text>
  <text x="328" y="288" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">AC COUPLING</text>
  <text x="468" y="432" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">a capacitor, not &#8220;isolation&#8221;</text>
  <text x="632" y="288" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">SYNC</text>
  <text x="772" y="432" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">clock-domain crossing only</text>
  <text x="936" y="288" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5" class="glass-svg-ink-2">HATCH</text>
  <text x="1076" y="432" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">a window onto another space</text>

  <g id="g-queue">
    <rect x="84" y="128" width="160" height="44" rx="10" class="glass-svg-node"/>
    <rect x="84" y="128" width="36" height="44" rx="10" class="glass-svg-node--indigo"/>
    <g class="glass-svg-line" stroke-width="1">
      <line x1="96" y1="128" x2="96" y2="172"/>
      <line x1="108" y1="128" x2="108" y2="172"/>
      <line x1="120" y1="128" x2="120" y2="172"/>
      <line x1="132" y1="128" x2="132" y2="172"/>
      <line x1="144" y1="128" x2="144" y2="172"/>
      <line x1="156" y1="128" x2="156" y2="172"/>
      <line x1="168" y1="128" x2="168" y2="172"/>
      <line x1="180" y1="128" x2="180" y2="172"/>
      <line x1="192" y1="128" x2="192" y2="172"/>
      <line x1="204" y1="128" x2="204" y2="172"/>
      <line x1="216" y1="128" x2="216" y2="172"/>
      <line x1="228" y1="128" x2="228" y2="172"/>
    </g>
    <path d="M78,182 L90,182 L84,173 Z" class="glass-svg-ink"/>
    <text x="84" y="199" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" class="glass-svg-ink-2">out</text>
    <path d="M114,182 L126,182 L120,173 Z" class="glass-svg-accent"/>
    <text x="120" y="199" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" class="glass-svg-accent-ink">in</text>
  </g>

  <g id="g-bytestream">
    <rect x="368" y="128" width="200" height="30" rx="10" class="glass-svg-node"/>
    <g class="glass-svg-ink-stroke" stroke-width="1.2">
      <line x1="372" y1="158" x2="372" y2="170"/>
      <line x1="380" y1="158" x2="380" y2="165"/>
      <line x1="388" y1="158" x2="388" y2="165"/>
      <line x1="396" y1="158" x2="396" y2="165"/>
      <line x1="404" y1="158" x2="404" y2="170"/>
      <line x1="412" y1="158" x2="412" y2="165"/>
      <line x1="420" y1="158" x2="420" y2="165"/>
      <line x1="428" y1="158" x2="428" y2="165"/>
      <line x1="436" y1="158" x2="436" y2="170"/>
      <line x1="444" y1="158" x2="444" y2="165"/>
      <line x1="452" y1="158" x2="452" y2="165"/>
      <line x1="460" y1="158" x2="460" y2="165"/>
      <line x1="468" y1="158" x2="468" y2="170"/>
      <line x1="476" y1="158" x2="476" y2="165"/>
      <line x1="484" y1="158" x2="484" y2="165"/>
      <line x1="492" y1="158" x2="492" y2="165"/>
      <line x1="500" y1="158" x2="500" y2="170"/>
      <line x1="508" y1="158" x2="508" y2="165"/>
      <line x1="516" y1="158" x2="516" y2="165"/>
      <line x1="524" y1="158" x2="524" y2="165"/>
      <line x1="532" y1="158" x2="532" y2="170"/>
      <line x1="540" y1="158" x2="540" y2="165"/>
      <line x1="548" y1="158" x2="548" y2="165"/>
      <line x1="556" y1="158" x2="556" y2="165"/>
      <line x1="564" y1="158" x2="564" y2="170"/>
    </g>
    <text x="468" y="148" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" class="glass-svg-ink">TLP header + payload</text>
  </g>

  <g id="g-slots">
    <rect x="731" y="112" width="10" height="56" rx="4" class="glass-svg-node"/>
    <rect x="749" y="112" width="10" height="56" rx="4" class="glass-svg-node"/>
    <rect x="767" y="112" width="10" height="56" rx="4" class="glass-svg-node--cyan"/>
    <rect x="785" y="112" width="10" height="56" rx="4" class="glass-svg-node"/>
    <rect x="803" y="112" width="10" height="56" rx="4" class="glass-svg-node"/>
    <rect x="702" y="180" width="140" height="26" rx="13" class="glass-svg-node"/>
    <text x="772" y="197" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-2">PCIe &#215;16 slots</text>
  </g>

  <g id="g-porttab">
    <rect x="991" y="112" width="170" height="70" rx="14" class="glass-svg-node"/>
    <text x="1007" y="142" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">Host CPU die</text>
    <text x="1007" y="161" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">64 core</text>
    <rect x="1151" y="129" width="20" height="44" rx="6" class="glass-svg-node--indigo"/>
    <text x="1161" y="151" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" class="glass-svg-ink-2" transform="rotate(-90 1161 151)">IMC</text>
  </g>

  <g id="g-devcard">
    <rect x="89" y="302" width="150" height="90" rx="14" class="glass-svg-node"/>
    <path d="M89,316 V316 Q89,302 103,302 H225 Q239,302 239,316 Z" class="glass-svg-ink-3"/>
    <circle cx="101" cy="309" r="3" class="glass-svg-accent"/>
    <text x="104" y="348" font-family="'Inter', sans-serif" font-size="13" font-weight="600" class="glass-svg-ink">200 GbE NIC</text>
    <text x="104" y="367" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">2 &#215; QSFP56</text>
  </g>

  <g id="g-accoupling">
    <g class="glass-svg-ink-stroke" stroke-width="2.4" stroke-linecap="round">
      <line x1="378" y1="347" x2="558" y2="347"/>
      <line x1="460" y1="335" x2="460" y2="359"/>
      <line x1="476" y1="335" x2="476" y2="359"/>
    </g>
    <text x="378" y="380" font-family="'JetBrains Mono', monospace" font-size="12" class="glass-svg-ink-2">D+</text>
    <text x="558" y="380" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" class="glass-svg-ink-2">D&#8722;</text>
  </g>

  <g id="g-sync">
    <line x1="772" y1="302" x2="772" y2="394" class="glass-svg-line" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M694,347 H846" class="glass-svg-ink-stroke" stroke-width="2.4" marker-end="url(#glgArrI)"/>
    <rect x="763" y="338" width="18" height="18" rx="5" class="glass-svg-node"/>
    <text x="772" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" class="glass-svg-ink-2">sync</text>
    <text x="694" y="320" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">clk A</text>
    <text x="850" y="320" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" class="glass-svg-ink-3">clk B</text>
  </g>

  <g id="g-hatch">
    <rect x="996" y="320" width="160" height="54" rx="12" class="glass-svg-node"/>
    <rect x="996" y="320" width="160" height="54" rx="12" fill="url(#glgHatch)" opacity="0.42"/>
    <text x="1076" y="352" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" class="glass-svg-ink">BAR0 window</text>
  </g>
</svg>
