f-song t-jiao" data-a="aw" style="--d:2.85s;--t:0.75s"><tspan class="lang-zh">按场景分开记:技术图爱淡,壁纸爱浓</tspan><tspan class="lang-en">Per scene: faint for diagrams, heavy for wallpapers</tspan></text><text x="240" y="454" font-size="34" class="tx f-song t-jiao" data-a="aw" style="--d:3.9s;--t:0.57s"><tspan class="lang-zh">看一张你喜欢的画,量出留白和设色</tspan><tspan class="lang-en">Show it a picture you like; it measures space and colour</tspan></text><text x="240" y="564" font-size="34" class="tx f-song t-jiao" data-a="aw" style="--d:5s;--t:0.67s"><tspan class="lang-zh">点开画上的小印,看它为什么这样画</tspan><tspan class="lang-en">Click the little seal to see why it drew it so</tspan></text><g class="sl" transform="translate(1120 600)"><g filter="url(#ink-erode)"><rect x="0" y="0" width="60" height="60" rx="2" stroke-width="6.7"/><text x="30" y="26.6" font-size="24" text-anchor="middle">懂</text><text x="30" y="51.8" font-size="24" text-anchor="middle">你</text></g></g></g></svg>
