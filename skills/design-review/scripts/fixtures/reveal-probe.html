<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>reveal-on-scroll probe</title>
<style>
 body{margin:0;font:16px system-ui;background:#fff;color:#111}
 .pad{height:2400px;padding:20px}
 .reveal{opacity:0;transition:opacity .2s;background:#1a4d8f;color:#fff;
   padding:60px 20px;font-size:32px;font-weight:700}
 .reveal.is-visible{opacity:1}
</style></head><body>
<div class="pad">首屏：这一块一直看得见。下面那块要滚动到才会显示。</div>
<div class="reveal" id="target">这一行只有滚动到才会显示 · this line only appears once scrolled to</div>
<div class="pad">底部填充</div>
<script>
// 探针页面：故意做成「不滚动就永远 opacity:0」。
// 四道只读检查如果不滚动，量到 / 截到 / 审到的就是一块不可见的元素，
// 而且三种坏法都不报错。这个测试页就是用来证明滚动那一步真的在跑。
const io = new IntersectionObserver((es) => es.forEach(e => {
  if (e.isIntersecting) e.target.classList.add('is-visible');
}), { threshold: 0.25 });
document.querySelectorAll('.reveal').forEach(e => io.observe(e));
</script>
</body></html>
