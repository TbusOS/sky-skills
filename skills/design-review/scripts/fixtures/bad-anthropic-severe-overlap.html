<!doctype html><html lang="en" data-lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>severe text overlap — a waiver fixture</title>
<link rel="stylesheet" href="../../../anthropic-design/assets/fonts.css">
<link rel="stylesheet" href="../../../anthropic-design/assets/anthropic.css">
<style>
  /* Two paragraphs put on the same pixels. Not a metric artefact: the glyphs
     are genuinely on top of each other, which is what the error tier is for. */
  .lap { position: relative; height: 90px; }
  .lap p { position: absolute; top: 0; left: 0; width: 520px; margin: 0;
           font-size: 18px; line-height: 1.5; }
</style></head>
<body>
<section class="anth-hero"><div class="anth-container"><h1>Severe overlap</h1></div></section>
<section class="anth-section"><div class="anth-container">
  <div class="lap">
    <p>Returns are accepted within thirty days of delivery, no questions asked at all.</p>
    <p>Shipping is calculated at checkout for every destination we deliver to today.</p>
  </div>
</div></section>
</body></html>
