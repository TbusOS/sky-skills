<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>stale inert declaration</title></head>
<body><h1>Declared inert, but it works</h1>
<button type="button" id="t" data-inert-by-design="needs a backend that does not exist yet">Toggle detail</button>
<p id="d" hidden>This appears, so the declaration above is a lie.</p>
<script>document.getElementById('t').addEventListener('click', () => {
  const d = document.getElementById('d'); d.hidden = !d.hidden; });</script>
</body></html>
