<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>svg-text-contrast · a dark fixed header over the page</title>
<style>body{margin:0;background:#ffffff;color:#141413;font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:0 auto;padding:24px}.bar{position:fixed;top:0;left:0;right:0;height:110px;background:#141413;color:#fff;padding:20px;z-index:5}</style>
</head>
<body><main>
<h1>Fixture</h1>
<header class="bar">Fixed header</header><div style="height:1400px"></div><svg viewBox="0 0 400 80" width="400" role="img" aria-label="a figure far down the page"><rect width="400" height="80" fill="#ffffff"/><text x="10" y="18" font-size="14" fill="#141413">dark label at the top of the figure</text></svg><div style="height:1400px"></div>
</main></body>
</html>
