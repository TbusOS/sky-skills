<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>svg-text-contrast · label colours that change through a transition</title>
<style>body{margin:0;background:#ffffff;color:#141413;font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:0 auto;padding:24px}svg text{transition:fill 1s linear}</style>
</head>
<body><main>
<h1>Fixture</h1>
<svg viewBox="0 0 400 100" width="400" role="img" aria-label="a card"><rect x="10" y="10" width="300" height="60" rx="8" fill="#fbeee7"/><text x="24" y="46" font-size="14" fill="#141413">label on a card</text></svg>
</main></body>
</html>
