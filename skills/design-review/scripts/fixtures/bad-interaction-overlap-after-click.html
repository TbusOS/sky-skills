<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>overlap only after click</title>
<style>
  body { background:#fff; color:#111; font:16px system-ui; padding:24px; }
  #panel { position:absolute; top:120px; left:24px; width:420px; background:#fff; }
  #below { position:absolute; top:132px; left:24px; width:420px; }
</style></head>
<body><h1>The panel lands on the paragraph</h1>
<button type="button" id="o">Show details</button>
<div id="panel" hidden>Shipping is calculated at checkout for every destination.</div>
<p id="below">Returns accepted within thirty days of delivery, no questions asked.</p>
<script>document.getElementById('o').addEventListener('click', () => {
  document.getElementById('panel').hidden = false; });</script>
</body></html>
