<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" role="img" aria-label="PCIe protocol layering seen as two mirrored stacks. Requester on the left, completer on the right, each with four layers: transaction, data link, physical logical and physical electrical. Between the upper three layers the horizontal lines are grey and dashed, labelled TLP end to end, DLLP hop by hop and symbol stream — these are protocol agreements, not wires. The only solid horizontal line runs along the bottom: the PCIe lane itself, with two AC coupling capacitors. One orange dashed path numbered 1 to 6 shows where the bytes actually travel: down every layer on the requester side, once across the wire, then up every layer on the completer side" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="psDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/>
    </pattern>
    <filter id="psSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
    <marker id="psArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/>
    </marker>
    <marker id="psArrN" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#a8a496"/>
    </marker>
  </defs>

  <rect width="1240" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1240" height="560" rx="16" fill="url(#psDots)"/>

  <!-- header -->
  <text x="32" y="36" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">PROTOCOL LAYERING &#183; PEER VIEW</text>
  <!-- legend -->
  <g font-size="11.5" fill="#6b6a5f">
    <line x1="640" y1="32" x2="666" y2="32" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="674" y="36">peer agreement &#183; no wire</text>
    <line x1="830" y1="32" x2="856" y2="32" stroke="#141413" stroke-width="1.8"/>
    <text x="864" y="36">the only real wire</text>
    <line x1="990" y1="32" x2="1016" y2="32" stroke="#d97757" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="1024" y="36">this transfer</text>
  </g>

  <!-- ================= layer containers ================= -->
  <!-- L1 transaction -->
  <rect x="60" y="68" width="440" height="92" rx="12" fill="#e2ecf5" stroke="#c4d5e6" stroke-dasharray="4 3"/>
  <rect x="740" y="68" width="440" height="92" rx="12" fill="#e2ecf5" stroke="#c4d5e6" stroke-dasharray="4 3"/>
  <!-- L2 data link -->
  <rect x="60" y="184" width="440" height="92" rx="12" fill="#e8eee1" stroke="#c9d6b8" stroke-dasharray="4 3"/>
  <rect x="740" y="184" width="440" height="92" rx="12" fill="#e8eee1" stroke="#c9d6b8" stroke-dasharray="4 3"/>
  <!-- L3 physical logical -->
  <rect x="60" y="300" width="440" height="92" rx="12" fill="#f5ecdb" stroke="#e3d0ab" stroke-dasharray="4 3"/>
  <rect x="740" y="300" width="440" height="92" rx="12" fill="#f5ecdb" stroke="#e3d0ab" stroke-dasharray="4 3"/>
  <!-- L4 physical electrical -->
  <rect x="60" y="416" width="440" height="92" rx="12" fill="#e7e4d9" stroke="#cfccc0" stroke-dasharray="4 3"/>
  <rect x="740" y="416" width="440" height="92" rx="12" fill="#e7e4d9" stroke="#cfccc0" stroke-dasharray="4 3"/>

  <!-- layer name tabs: straddle the container top edge -->
  <g font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#ffffff">
    <rect x="88" y="57" width="196" height="22" rx="11" fill="#6a9bcc"/><text x="186" y="72" text-anchor="middle">TRANSACTION LAYER</text>
    <rect x="768" y="57" width="196" height="22" rx="11" fill="#6a9bcc"/><text x="866" y="72" text-anchor="middle">TRANSACTION LAYER</text>
    <rect x="88" y="173" width="188" height="22" rx="11" fill="#788c5d"/><text x="182" y="188" text-anchor="middle">DATA LINK LAYER</text>
    <rect x="768" y="173" width="188" height="22" rx="11" fill="#788c5d"/><text x="862" y="188" text-anchor="middle">DATA LINK LAYER</text>
    <rect x="88" y="289" width="216" height="22" rx="11" fill="#c9913f"/><text x="196" y="304" text-anchor="middle">PHYSICAL &#183; LOGICAL</text>
    <rect x="768" y="289" width="216" height="22" rx="11" fill="#c9913f"/><text x="876" y="304" text-anchor="middle">PHYSICAL &#183; LOGICAL</text>
    <rect x="88" y="405" width="228" height="22" rx="11" fill="#141413"/><text x="202" y="420" text-anchor="middle">PHYSICAL &#183; ELECTRICAL</text>
    <rect x="768" y="405" width="228" height="22" rx="11" fill="#141413"/><text x="882" y="420" text-anchor="middle">PHYSICAL &#183; ELECTRICAL</text>
  </g>

  <!-- who is who -->
  <g font-size="11.5" font-style="italic" fill="#8c8a7d">
    <text x="488" y="92" text-anchor="end">requester</text>
    <text x="1168" y="92" text-anchor="end">completer</text>
  </g>

  <!-- ================= component cards ================= -->
  <g filter="url(#psSh)">
    <rect x="84" y="98" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="288" y="98" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="764" y="98" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="968" y="98" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>

    <rect x="84" y="214" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="288" y="214" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="764" y="214" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="968" y="214" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>

    <rect x="84" y="330" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="288" y="330" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="764" y="330" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="968" y="330" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>

    <rect x="84" y="446" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="288" y="446" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="764" y="446" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="968" y="446" width="184" height="44" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
  </g>

  <g font-size="12.5" font-weight="600" fill="#141413">
    <text x="98" y="119">TLP generator</text><text x="302" y="119">Flow control</text>
    <text x="778" y="119">TLP parser</text><text x="982" y="119">Flow control</text>
    <text x="98" y="235">Seq num + LCRC</text><text x="302" y="235">Replay buffer</text>
    <text x="778" y="235">LCRC check</text><text x="982" y="235">ACK / NAK gen</text>
    <text x="98" y="351">128b/130b encode</text><text x="302" y="351">Scrambler</text>
    <text x="778" y="351">Descrambler</text><text x="982" y="351">128b/130b decode</text>
    <text x="98" y="467">TX driver</text><text x="302" y="467">RX equalizer</text>
    <text x="778" y="467">RX equalizer</text><text x="982" y="467">TX driver</text>
  </g>
  <g font-size="11.5" fill="#6b6a5f">
    <text x="98" y="135">builds header + payload</text><text x="302" y="135">credit based</text>
    <text x="778" y="135">decodes header</text><text x="982" y="135">returns credits</text>
    <text x="98" y="251">per packet</text><text x="302" y="251">holds until ACK</text>
    <text x="778" y="251">drops on mismatch</text><text x="982" y="251">DLLP, never a TLP</text>
    <text x="98" y="367">block sync</text><text x="302" y="367">removes DC bias</text>
    <text x="778" y="367">restores block</text><text x="982" y="367">recovers symbols</text>
    <text x="98" y="483">differential pair</text><text x="302" y="483">CDR + de-emphasis</text>
    <text x="778" y="483">CDR + de-emphasis</text><text x="982" y="483">differential pair</text>
  </g>

  <!-- ================= peer lines: dashed, no wire ================= -->
  <g>
    <line x1="500" y1="114" x2="740" y2="114" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3" marker-start="url(#psArrN)" marker-end="url(#psArrN)"/>
    <line x1="500" y1="230" x2="740" y2="230" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3" marker-start="url(#psArrN)" marker-end="url(#psArrN)"/>
    <line x1="500" y1="346" x2="740" y2="346" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3" marker-start="url(#psArrN)" marker-end="url(#psArrN)"/>
    <rect x="532" y="103" width="176" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
    <text x="620" y="118" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">TLP &#183; end to end</text>
    <rect x="532" y="219" width="176" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
    <text x="620" y="234" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">DLLP &#183; hop by hop</text>
    <rect x="532" y="335" width="176" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
    <text x="620" y="350" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">symbol stream</text>
  </g>
  <text x="620" y="454" text-anchor="middle" font-size="11.5" font-style="italic" fill="#8c8a7d">no line here either</text>
  <text x="620" y="472" text-anchor="middle" font-size="11.5" font-style="italic" fill="#8c8a7d">the real one runs below</text>

  <!-- ================= the one real wire ================= -->
  <path d="M278,534 H958" fill="none" stroke="#141413" stroke-width="1.8"/>
  <!-- AC coupling capacitors -->
  <line x1="424" y1="524" x2="424" y2="544" stroke="#141413" stroke-width="1.8"/>
  <line x1="440" y1="524" x2="440" y2="544" stroke="#141413" stroke-width="1.8"/>
  <line x1="800" y1="524" x2="800" y2="544" stroke="#141413" stroke-width="1.8"/>
  <line x1="816" y1="524" x2="816" y2="544" stroke="#141413" stroke-width="1.8"/>
  <rect x="524" y="523" width="192" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
  <text x="620" y="538" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">PCIe lane &#215;4 &#183; 32 GT/s</text>

  <!-- ================= this transfer: the orange dashed path ================= -->
  <g stroke="#d97757" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <path d="M278,160 V178" marker-end="url(#psArrO)"/>
    <path d="M278,276 V294" marker-end="url(#psArrO)"/>
    <path d="M278,392 V410" marker-end="url(#psArrO)"/>
    <path d="M278,508 V528" marker-end="url(#psArrO)"/>
    <path d="M958,528 V512" marker-start="url(#psArrO)"/>
    <path d="M958,410 V392" marker-start="url(#psArrO)"/>
    <path d="M958,294 V276" marker-start="url(#psArrO)"/>
    <path d="M958,178 V160" marker-start="url(#psArrO)"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#ffffff">
    <circle cx="256" cy="169" r="9.5" fill="#d97757"/><text x="256" y="173" text-anchor="middle">1</text>
    <circle cx="256" cy="285" r="9.5" fill="#d97757"/><text x="256" y="289" text-anchor="middle">2</text>
    <circle cx="256" cy="401" r="9.5" fill="#d97757"/><text x="256" y="405" text-anchor="middle">3</text>
    <circle cx="256" cy="518" r="9.5" fill="#d97757"/><text x="256" y="522" text-anchor="middle">4</text>
    <circle cx="980" cy="518" r="9.5" fill="#d97757"/><text x="980" y="522" text-anchor="middle">5</text>
    <circle cx="980" cy="401" r="9.5" fill="#d97757"/><text x="980" y="405" text-anchor="middle">6</text>
    <circle cx="980" cy="285" r="9.5" fill="#d97757"/><text x="980" y="289" text-anchor="middle">7</text>
    <circle cx="980" cy="169" r="9.5" fill="#d97757"/><text x="980" y="173" text-anchor="middle">8</text>
  </g>
</svg>
