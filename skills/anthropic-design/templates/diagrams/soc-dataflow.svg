<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Physical data path of a display pipeline with no GPU, drawn as a package cross-section. Off-package on the left is a DDR4 chip, off-package on the right is the LCD panel with its driver IC; everything between them sits inside one dashed SoC boundary. Inside, from left to right: a multi-port DDR controller and PHY with three ports carrying different quality-of-service classes, a vertical AXI NoC rail, and three bus masters hanging off it, the CPU cluster, a greyed-out GPU deferred to the next figure, and the display controller. The display controller is drawn open, showing the fetch DMA, the line buffer and the framebuffer base-address register, which is outlined because it is the only thing software sets. Its output leaves on a pixel interface, twenty-four bits of parallel RGB plus sync at the pixel clock, which is not an AXI port, into the DSI controller and then the MIPI D-PHY, which serialises onto four differential lanes to the panel. A thin gold dashed APB rail runs along the bottom from the CPU to the register blocks of the display controller and the DSI controller. Five badges trace one frame: one, the CPU writes the framebuffer base address into the display controller over APB, four bytes, once; two, the display DMA issues its own AXI read bursts with no CPU involvement; three, the DDR controller serves them on the highest-priority port; four, finished pixels cross the pixel interface into the DSI controller; five, the D-PHY serialises them off-chip. The figure's point is that the configuration path and the data path are different wires: four bytes one way, eight megabytes a frame the other" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="sdfDots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <marker id="sdfArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker>
    <marker id="sdfArrG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#8a6a2f"/></marker>
    <marker id="sdfArrK" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#6b6a5f"/></marker>
  </defs>
  <rect width="1120" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="560" rx="16" fill="url(#sdfDots)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">PHYSICAL DATA PATH &#183; NO GPU &#183; WHO ISSUES THE TRANSACTION, AND OVER WHICH WIRE</text>
  <g font-size="12" fill="#6b6a5f">
    <line x1="726" y1="30" x2="750" y2="30" stroke="#d97757" stroke-width="2.4"/><text x="758" y="34">pixel data &#183; AXI</text>
    <line x1="874" y1="30" x2="898" y2="30" stroke="#8a6a2f" stroke-width="1.6" stroke-dasharray="4 3"/><text x="906" y="34">config &#183; APB</text>
  </g>
  <rect x="196" y="56" width="756" height="428" rx="14" fill="none" stroke="#8c8a7d" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="212" y="76" font-size="12" fill="#8c8a7d">SoC package &#183; anything outside this line is a separate chip</text>
  <rect x="40" y="176" width="140" height="128" rx="10" fill="#f5f2ea" stroke="#cfccc0"/>
  <text x="110" y="214" text-anchor="middle" font-size="13" font-weight="600" fill="#141413">DDR4 SDRAM</text>
  <text x="110" y="234" text-anchor="middle" font-size="12" fill="#6b6a5f">4 GiB &#183; off-package</text>
  <text x="110" y="256" text-anchor="middle" font-size="12" fill="#6b6a5f">every framebuffer</text>
  <text x="110" y="273" text-anchor="middle" font-size="12" fill="#6b6a5f">lives here, always</text>
  <line x1="180" y1="240" x2="216" y2="240" stroke="#6b6a5f" stroke-width="2"/>
  <text x="198" y="230" text-anchor="middle" font-size="12" fill="#8c8a7d">DQ</text>
  <text x="110" y="326" text-anchor="middle" font-size="12" fill="#8c8a7d">32-bit &#183; 1600 MT/s</text>
  <text x="110" y="343" text-anchor="middle" font-size="12" fill="#8c8a7d">= 6.4 GB/s ceiling</text>
  <rect x="216" y="150" width="156" height="212" rx="10" fill="#eef1e7" stroke="#b9c4a4"/>
  <text x="294" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#4d5a3c">DDR ctrl + PHY</text>
  <text x="294" y="194" text-anchor="middle" font-size="12" fill="#6b6a5f">multi-port &#183; QoS</text>
  <rect x="234" y="214" width="120" height="36" rx="6" fill="#faf9f5" stroke="#b9c4a4" stroke-width="1"/>
  <text x="246" y="236" font-size="12" fill="#4d5a3c" font-weight="600">p0</text>
  <text x="276" y="236" font-size="12" fill="#6b6a5f">CPU</text>
  <rect x="234" y="262" width="120" height="36" rx="6" fill="#faf9f5" stroke="#b9c4a4" stroke-width="1"/>
  <text x="246" y="284" font-size="12" fill="#4d5a3c" font-weight="600">p1</text>
  <text x="276" y="284" font-size="12" fill="#6b6a5f">GPU</text>
  <rect x="234" y="310" width="120" height="36" rx="6" fill="#faf9f5" stroke="#d97757" stroke-width="1.6"/>
  <text x="246" y="332" font-size="12" fill="#8f4a2f" font-weight="600">p2</text>
  <text x="276" y="332" font-size="12" fill="#6b6a5f">display</text>
  <text x="216" y="380" font-size="12" fill="#8f4a2f">p2 gets the highest QoS class</text>
  <text x="216" y="397" font-size="12" fill="#8c8a7d">scanout cannot be made to wait</text>
  <rect x="404" y="96" width="66" height="248" rx="10" fill="#eef1e7" stroke="#b9c4a4"/>
  <text x="437" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#4d5a3c">AXI</text>
  <text x="437" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#4d5a3c">NoC</text>
  <text x="437" y="174" text-anchor="middle" font-size="12" font-weight="400" fill="#6b6a5f">128-bit</text>
  <text x="437" y="196" text-anchor="middle" font-size="12" font-weight="400" fill="#6b6a5f">800 MHz</text>
  <rect x="506" y="96" width="220" height="62" rx="10" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="616" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5c8a">CPU cluster</text>
  <text x="616" y="140" text-anchor="middle" font-size="12" fill="#6b6a5f">AXI master 0</text>
  <rect x="506" y="176" width="220" height="62" rx="10" fill="#f5f2ea" stroke="#cfccc0" stroke-dasharray="6 4"/>
  <text x="616" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#8c8a7d">GPU</text>
  <text x="616" y="220" text-anchor="middle" font-size="12" fill="#6b6a5f">AXI master 1 &#183; next figure</text>
  <rect x="506" y="256" width="256" height="160" rx="10" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="634" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5c8a">Display controller</text>
  <text x="634" y="298" text-anchor="middle" font-size="12" fill="#6b6a5f">AXI master 2 &#183; the DMA lives here</text>
  <rect x="520" y="308" width="228" height="26" rx="6" fill="#faf9f5" stroke="#c4d5e6"/>
  <text x="530" y="325" font-size="12" fill="#2f5c8a">fetch DMA &#183; issues the reads</text>
  <rect x="520" y="340" width="228" height="40" rx="6" fill="#faf9f5" stroke="#d97757" stroke-width="1.6"/>
  <text x="530" y="357" font-size="12" font-weight="600" fill="#8f4a2f">FB base address register</text>
  <text x="530" y="373" font-size="12" fill="#8c8a7d">the only thing software sets</text>
  <rect x="520" y="386" width="228" height="26" rx="6" fill="#faf9f5" stroke="#c4d5e6"/>
  <text x="530" y="403" font-size="12" fill="#2f5c8a">line buffer &#183; a few lines only</text>
  <line x1="470" y1="127" x2="506" y2="127" stroke="#6b6a5f" stroke-width="1.6"/>
  <line x1="470" y1="207" x2="506" y2="207" stroke="#6b6a5f" stroke-width="1.6"/>
  <line x1="470" y1="300" x2="506" y2="300" stroke="#6b6a5f" stroke-width="1.6"/>
  <rect x="800" y="256" width="140" height="70" rx="10" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="870" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5c8a">DSI controller</text>
  <text x="870" y="300" text-anchor="middle" font-size="12" fill="#6b6a5f">packs RGB into</text>
  <text x="870" y="316" text-anchor="middle" font-size="12" fill="#6b6a5f">HS packets</text>
  <rect x="800" y="340" width="140" height="66" rx="10" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="870" y="366" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5c8a">MIPI D-PHY</text>
  <text x="870" y="384" text-anchor="middle" font-size="12" fill="#6b6a5f">4 lanes &#183; 1 Gbps</text>
  <line x1="870" y1="326" x2="870" y2="340" stroke="#6b6a5f" stroke-width="1.6"/>
  <rect x="976" y="256" width="112" height="150" rx="10" fill="#f5f2ea" stroke="#cfccc0"/>
  <text x="1032" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#141413">LCD panel</text>
  <text x="1032" y="316" text-anchor="middle" font-size="12" fill="#6b6a5f">driver IC +</text>
  <text x="1032" y="333" text-anchor="middle" font-size="12" fill="#6b6a5f">source drivers</text>
  <text x="1032" y="360" text-anchor="middle" font-size="12" fill="#8c8a7d">no memory</text>
  <text x="1032" y="377" text-anchor="middle" font-size="12" fill="#8c8a7d">of a whole frame</text>
  <path d="M726,127 H778 Q790,127 790,139 V440 Q790,452 778,452 H240" fill="none" stroke="#8a6a2f" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="634" y1="416" x2="634" y2="452" stroke="#8a6a2f" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="634" cy="452" r="3" fill="#8a6a2f"/>
  <line x1="870" y1="406" x2="870" y2="452" stroke="#8a6a2f" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="870" cy="452" r="3" fill="#8a6a2f"/>
  <text x="240" y="472" font-size="12" font-weight="600" fill="#8a6a2f">APB &#183; 32-bit &#183; register writes only</text>
  <text x="524" y="472" font-size="12" fill="#8c8a7d">4 bytes per frame &#183; never carries a pixel</text>
  <g fill="none" stroke="#d97757" stroke-width="2.4">
    <path d="M506,300 H470 V328 H392"/>
    <line x1="392" y1="328" x2="378" y2="328" marker-end="url(#sdfArrO)"/>
    <line x1="762" y1="291" x2="794" y2="291" marker-end="url(#sdfArrO)"/>
    <line x1="940" y1="373" x2="970" y2="373" marker-end="url(#sdfArrO)"/>
  </g>
  <text x="870" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">pixel interface</text>
  <text x="870" y="241" text-anchor="middle" font-size="12" fill="#8c8a7d">24-bit RGB &#183; not AXI</text>
  <circle cx="742" cy="127" r="11" fill="#d97757"/>
  <text x="742" y="131" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">1</text>
  <circle cx="488" cy="300" r="11" fill="#d97757"/>
  <text x="488" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">2</text>
  <circle cx="388" cy="328" r="11" fill="#d97757"/>
  <text x="388" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">3</text>
  <circle cx="778" cy="291" r="11" fill="#d97757"/>
  <text x="778" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">4</text>
  <circle cx="956" cy="373" r="11" fill="#d97757"/>
  <text x="956" y="377" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">5</text>
  <text x="32" y="512" font-size="12" fill="#6b6a5f">&#9312; one 32-bit register write over APB &#183; &#9313; the DMA then reads on its own &#183; &#9314; served at the top QoS class</text>
  <text x="32" y="530" font-size="12" fill="#6b6a5f">&#9315; pixels leave on a non-AXI wire &#183; &#9316; the D-PHY sends them off-chip</text>
  <text x="32" y="548" font-size="12" fill="#8c8a7d">config and data are different wires: 4 bytes one way, 8.3 MB a frame the other &#8212; setting a framebuffer is a register write, not a copy</text>
</svg>
