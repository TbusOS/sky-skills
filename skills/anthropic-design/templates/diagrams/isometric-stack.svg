<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-label="The same board drawn twice, to show what an isometric view buys and what it costs. On the left, a front elevation: the board as a bar with a package and two memory chips sitting on it, which states every thickness exactly and is annotated with a note that it cannot say whether the two memory chips are side by side or one behind the other. On the right, the same board in isometric projection, where the arrangement on the plane is immediately visible: the package sits front left, the two memory chips sit in a row to its right, and a connector sits at the near edge. Every box is drawn as three flat faces in three tints of one colour, with no gradients and no shadows, and every label stays upright on a leader rather than tilting with a face. A dimension line runs along the front edge of the board with its length on it. A strip below states the four rules the projection has to follow to stay honest: use the real transform rather than freehand angles, keep text upright, use three flat tints of one hue instead of fake lighting, and always carry a dimension line, because two faces that look the same size in isometric can differ by a factor of two" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="isoDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
  <marker id="isoA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#141413"/></marker></defs>
  <rect width="1120" height="720" rx="16" fill="#faf9f5" stroke="#eceadf"/><rect width="1120" height="720" rx="16" fill="url(#isoDot)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">ISOMETRIC &#183; WHEN THE ARRANGEMENT ON THE PLANE IS ALSO PART OF THE ANSWER</text>
  <text x="32" y="58" font-size="11.5" fill="#8c8a7d">a front view states every thickness and hides the layout. isometric states both, at the price of four rules it has to keep &#8212; they are on the strip below.</text>
  <text x="36" y="98" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">FRONT VIEW &#183; EVERY THICKNESS, NO LAYOUT</text>
  <rect x="36" y="112" width="384" height="280" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <rect x="60" y="252" width="336" height="18" fill="#efece2" stroke="#141413" stroke-width="1.3"/>
  <rect x="104" y="216" width="96" height="36" fill="#e8f0f8" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="152" y="238" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2f5c8a">package</text>
  <rect x="228" y="234" width="70" height="18" fill="#eaeee2" stroke="#5d7045" stroke-width="1.4"/>
  <rect x="306" y="234" width="70" height="18" fill="#eaeee2" stroke="#5d7045" stroke-width="1.4"/>
  <text x="302" y="228" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5d7045">two memory chips</text>
  <text x="60" y="312" font-size="11" fill="#6b6a5f">thicknesses: exact, and readable at a glance.</text>
  <text x="60" y="340" font-size="11" font-weight="700" fill="#c2613f">what it cannot say: are those two chips side by</text>
  <text x="60" y="356" font-size="11" font-weight="700" fill="#c2613f">side, or is one behind the other?</text>
  <text x="452" y="98" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">ISOMETRIC &#183; BOTH, IF IT KEEPS THE RULES</text>
  <rect x="440" y="112" width="644" height="280" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <polygon points="731.0,166.4 912.9,271.4 791.6,341.4 609.8,236.4" fill="#efece2" stroke="#141413" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="912.9,271.4 912.9,277.0 791.6,347.0 791.6,341.4" fill="#e2ded1" stroke="#141413" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="609.8,236.4 791.6,341.4 791.6,347.0 609.8,242.0" fill="#d4d0c1" stroke="#141413" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="735.8,180.4 801.3,218.2 749.2,248.3 683.7,210.5" fill="#e8f0f8" stroke="#2f5c8a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="801.3,218.2 801.3,235.0 749.2,265.1 749.2,248.3" fill="#d6e3f0" stroke="#2f5c8a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="683.7,210.5 749.2,248.3 749.2,265.1 683.7,227.3" fill="#c3d5e8" stroke="#2f5c8a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="828.0,233.6 868.0,256.7 841.3,272.1 801.3,249.0" fill="#eaeee2" stroke="#5d7045" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="868.0,256.7 868.0,266.5 841.3,281.9 841.3,272.1" fill="#dde3d1" stroke="#5d7045" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="801.3,249.0 841.3,272.1 841.3,281.9 801.3,258.8" fill="#ced7bd" stroke="#5d7045" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="783.1,259.5 823.1,282.6 796.5,298.0 756.5,274.9" fill="#eaeee2" stroke="#5d7045" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="823.1,282.6 823.1,292.4 796.5,307.8 796.5,298.0" fill="#dde3d1" stroke="#5d7045" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="756.5,274.9 796.5,298.0 796.5,307.8 756.5,284.7" fill="#ced7bd" stroke="#5d7045" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="652.2,214.7 675.2,228.0 654.6,239.9 631.6,226.6" fill="#f6ebdf" stroke="#8a5a2a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="675.2,228.0 675.2,239.2 654.6,251.1 654.6,239.9" fill="#efdfcc" stroke="#8a5a2a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="631.6,226.6 654.6,239.9 654.6,251.1 631.6,237.8" fill="#e5d0b6" stroke="#8a5a2a" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="742.5" y1="214.3" x2="466" y2="148" stroke="#a8a496" stroke-width="1"/>
  <circle cx="742.5" cy="214.3" r="2.6" fill="#a8a496"/>
  <text x="470" y="152" text-anchor="start" font-size="10.5" font-weight="600" fill="#2f5c8a">package</text>
  <line x1="834.7" y1="252.8" x2="1058" y2="150" stroke="#a8a496" stroke-width="1"/>
  <circle cx="834.7" cy="252.8" r="2.6" fill="#a8a496"/>
  <text x="1054" y="154" text-anchor="end" font-size="10.5" font-weight="600" fill="#5d7045">memory 0</text>
  <line x1="789.8" y1="278.8" x2="1058" y2="186" stroke="#a8a496" stroke-width="1"/>
  <circle cx="789.8" cy="278.8" r="2.6" fill="#a8a496"/>
  <text x="1054" y="190" text-anchor="end" font-size="10.5" font-weight="600" fill="#5d7045">memory 1</text>
  <line x1="653.4" y1="227.3" x2="466" y2="332" stroke="#a8a496" stroke-width="1"/>
  <circle cx="653.4" cy="227.3" r="2.6" fill="#a8a496"/>
  <text x="470" y="336" text-anchor="start" font-size="10.5" font-weight="600" fill="#8a5a2a">connector</text>
  <line x1="609.8" y1="258.0" x2="791.6" y2="363.0" stroke="#141413" stroke-width="1.3" marker-start="url(#isoA)" marker-end="url(#isoA)"/>
  <rect x="668.7" y="300.5" width="64" height="20" rx="10" fill="#ffffff" stroke="#141413" stroke-width="1.1"/>
  <text x="700.7" y="314.5" text-anchor="middle" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">100 mm</text>
  <text x="440" y="412" font-size="11.5" font-weight="700" fill="#c2613f">now the layout is the easy part: two chips in a row, to the right of the package.</text>
  <rect x="36" y="432" width="1048" height="130" rx="10" fill="#f7e4dc" stroke="#c2613f" stroke-width="1.5"/>
  <text x="58" y="458" font-size="12" font-weight="700" fill="#c2613f">four rules, and the projection is only honest while it keeps all four</text>
  <circle cx="58" cy="478" r="8.5" fill="#c2613f"/><text x="58" y="482" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text>
  <text x="74" y="482" font-size="11" font-weight="700" fill="#141413">use the real transform</text>
  <text x="74" y="496" font-size="10.5" fill="#6b6a5f">sx = (x&#8722;y)&#215;0.866, sy = (x+y)&#215;0.5 &#8722; z. freehand</text>
  <text x="74" y="509" font-size="10.5" fill="#6b6a5f">angles drift, and a drifting angle reads as a shape difference.</text>
  <circle cx="570" cy="478" r="8.5" fill="#c2613f"/><text x="570" y="482" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text>
  <text x="586" y="482" font-size="11" font-weight="700" fill="#141413">keep every label upright</text>
  <text x="586" y="496" font-size="10.5" fill="#6b6a5f">tilted text is harder to read and its effective size drops after</text>
  <text x="586" y="509" font-size="10.5" fill="#6b6a5f">scaling. put it outside on a leader.</text>
  <circle cx="58" cy="522" r="8.5" fill="#c2613f"/><text x="58" y="526" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text>
  <text x="74" y="526" font-size="11" font-weight="700" fill="#141413">three flat tints, one hue</text>
  <text x="74" y="540" font-size="10.5" fill="#6b6a5f">top lightest, right middle, left darkest. no gradients, no drop</text>
  <text x="74" y="553" font-size="10.5" fill="#6b6a5f">shadows &#8212; those are fake lighting, not information.</text>
  <circle cx="570" cy="522" r="8.5" fill="#c2613f"/><text x="570" y="526" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">4</text>
  <text x="586" y="526" font-size="11" font-weight="700" fill="#141413">always carry a dimension</text>
  <text x="586" y="540" font-size="10.5" fill="#6b6a5f">two faces that look equal in isometric can differ by a factor of</text>
  <text x="586" y="553" font-size="10.5" fill="#6b6a5f">two. without a dimension line it is a sketch.</text>
  <text x="32" y="608" font-size="11.5" fill="#8c8a7d">this replaces a blanket ban. the thing worth banning was never projection &#8212; it was decoration: drop shadows, perspective, fake thickness, a gradient standing in for a light source.</text>
  <text x="32" y="625" font-size="11.5" fill="#8c8a7d">isometric earns its place only when layout and thickness are both part of the answer. thickness alone wants a section; order alone wants a flat exploded view; this wants both at once.</text>
  <text x="32" y="642" font-size="11.5" fill="#8c8a7d">whatever is hidden in an isometric view is simply gone. to show something behind something else, move it apart or make the front one see-through &#8212; a reader will not fill it in.</text>
  <text x="32" y="659" font-size="11.5" fill="#8c8a7d">the shapes here are one board with four parts on it, sized so the proportions are plausible. the projection is exact; the object is an example.</text>
  <rect x="820" y="676" width="260" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M820 683 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="833" cy="691" r="3.6" fill="#ffffff"/>
  <text x="967" y="695" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">Isometric &#183; four rules</text>
</svg>
