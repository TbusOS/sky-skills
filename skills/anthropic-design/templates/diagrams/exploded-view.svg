<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-label="An exploded view of a chip package, pulled apart along one straight vertical axis. On the left is a small thumbnail of the finished package as it looks assembled, joined by a dashed line to the exploded column. In the column, from top to bottom: a heat spreader lid, a thermal interface layer, a logic die beside a stacked memory die, an underfill layer, a silicon interposer drawn in orange as the part this figure is about, a row of small copper bumps forming the joint below it, a package substrate, a row of solder balls forming the next joint, and the printed circuit board at the bottom. All parts are centred on the same dash-dot axis and separated by equal gaps. Orange numbered badges on the left run in assembly order rather than top to bottom: the substrate is first, the interposer second, the dies third, the underfill and lid fourth, and the whole package onto the board last. A label column on the right names every part and says whether it can ever be taken apart again, using solid borders for parts that separate and dashed borders for joints that are permanent. Closing notes record that the axis must be one straight line because it is the reader's only clue to how the parts go back together, that the gaps must be equal because unequal gaps read as real distance, and that the numbering follows assembly order, which is the question a cross-section cannot answer" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="exDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <marker id="exArr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#a8a496"/></marker>
  </defs>

  <rect width="1120" height="720" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="720" rx="16" fill="url(#exDot)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">EXPLODED VIEW &#183; IN WHAT ORDER, AND WHAT CAN EVER COME APART AGAIN</text>

  <!-- assembled thumbnail -->
  <text x="60" y="70" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">ASSEMBLED</text>
  <rect x="60" y="82" width="176" height="96" rx="6" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.3"/>
  <rect x="76" y="140" width="144" height="14" fill="#e7e4d9" stroke="#141413" stroke-width="1.2"/>
  <rect x="100" y="124" width="96" height="16" fill="#f0e4d8" stroke="#c9913f" stroke-width="1.2"/>
  <rect x="106" y="112" width="84" height="12" fill="#e7e4d9" stroke="#6b6a5f" stroke-width="1.2"/>
  <text x="148" y="170" text-anchor="middle" font-size="10.5" fill="#8c8a7d">one part, from outside</text>
  <path d="M240 130 H 268" fill="none" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#exArr)"/>
  <text x="60" y="200" font-size="11.5" fill="#8c8a7d">the thumbnail is not decoration &#8212; without it the column below is just a list of rectangles</text>

  <!-- assembly axis -->
  <line x1="460" y1="104" x2="460" y2="536" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="10 4 3 4"/>
  <text x="472" y="112" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">ASSEMBLY AXIS</text>

  <!-- 1 lid -->
  <rect x="310" y="120" width="300" height="22" rx="3" fill="#e7e4d9" stroke="#141413" stroke-width="1.4"/>
  <!-- 2 TIM -->
  <rect x="310" y="168" width="300" height="12" rx="2" fill="#f0e4d8" stroke="#c9913f" stroke-width="1.2" stroke-dasharray="5 3"/>
  <!-- 3 dies -->
  <rect x="322" y="204" width="150" height="40" rx="3" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.4"/>
  <text x="397" y="222" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5d7045">logic die</text>
  <text x="397" y="237" text-anchor="middle" font-size="10.5" fill="#6b6a5f">CPU + GPU</text>
  <g>
    <rect x="490" y="204" width="110" height="40" rx="3" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.4"/>
    <line x1="490" y1="214" x2="600" y2="214" stroke="#5d7045" stroke-width="0.9"/>
    <line x1="490" y1="224" x2="600" y2="224" stroke="#5d7045" stroke-width="0.9"/>
    <line x1="490" y1="234" x2="600" y2="234" stroke="#5d7045" stroke-width="0.9"/>
    <text x="545" y="260" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5d7045">memory stack</text>
  </g>
  <!-- 4 underfill -->
  <rect x="300" y="270" width="320" height="12" rx="2" fill="#f0e4d8" stroke="#c9913f" stroke-width="1.2" stroke-dasharray="5 3"/>
  <!-- 5 interposer (focus) -->
  <rect x="290" y="308" width="340" height="24" rx="3" fill="#f7e4dc" stroke="#d97757" stroke-width="1.8"/>
  <text x="460" y="324" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2613f">silicon interposer</text>
  <!-- joint: copper bumps -->
  <g fill="#c9913f">
    <circle cx="330" cy="358" r="6"/><circle cx="374" cy="358" r="6"/><circle cx="418" cy="358" r="6"/>
    <circle cx="462" cy="358" r="6"/><circle cx="506" cy="358" r="6"/><circle cx="550" cy="358" r="6"/><circle cx="594" cy="358" r="6"/>
  </g>
  <!-- 6 substrate -->
  <rect x="270" y="384" width="380" height="30" rx="3" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="460" y="403" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f5c8a">package substrate</text>
  <!-- joint: BGA -->
  <g fill="#6b6a5f">
    <circle cx="300" cy="440" r="8"/><circle cx="354" cy="440" r="8"/><circle cx="408" cy="440" r="8"/>
    <circle cx="462" cy="440" r="8"/><circle cx="516" cy="440" r="8"/><circle cx="570" cy="440" r="8"/><circle cx="624" cy="440" r="8"/>
  </g>
  <!-- 7 PCB -->
  <rect x="230" y="466" width="460" height="34" rx="3" fill="#e7e4d9" stroke="#141413" stroke-width="1.6"/>
  <text x="460" y="487" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">printed circuit board</text>

  <!-- order badges (assembly order, NOT top to bottom) -->
  <circle cx="252" cy="399" r="10.5" fill="#d97757"/><text x="252" y="403" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text>
  <circle cx="272" cy="320" r="10.5" fill="#d97757"/><text x="272" y="324" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
  <circle cx="300" cy="224" r="10.5" fill="#d97757"/><text x="300" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3</text>
  <circle cx="288" cy="131" r="10.5" fill="#d97757"/><text x="288" y="135" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">4</text>
  <circle cx="262" cy="440" r="10.5" fill="#d97757"/><text x="262" y="444" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">5</text>

  <!-- label column -->
  <g font-size="11.5">
    <line x1="610" y1="131" x2="700" y2="131" stroke="#a8a496" stroke-width="1"/>
    <text x="706" y="128" font-weight="600" fill="#141413">heat spreader lid</text>
    <text x="706" y="144" fill="#6b6a5f">comes off first in any rework &#183; separable</text>

    <line x1="610" y1="174" x2="700" y2="174" stroke="#a8a496" stroke-width="1"/>
    <text x="706" y="171" font-weight="600" fill="#8a5a2a">thermal interface</text>
    <text x="706" y="187" fill="#6b6a5f">one use only &#8212; lift the lid and it is scrap</text>

    <line x1="600" y1="216" x2="700" y2="216" stroke="#a8a496" stroke-width="1"/>
    <text x="706" y="213" font-weight="600" fill="#5d7045">two dies, already bonded</text>
    <text x="706" y="229" fill="#6b6a5f">bonded to the interposer, not to each other</text>

    <line x1="620" y1="276" x2="700" y2="276" stroke="#a8a496" stroke-width="1"/>
    <text x="706" y="273" font-weight="600" fill="#8a5a2a">underfill</text>
    <text x="706" y="289" fill="#6b6a5f">cured &#183; from here down nothing separates</text>

    <line x1="630" y1="320" x2="700" y2="320" stroke="#d97757" stroke-width="1.3"/>
    <text x="706" y="317" font-weight="700" fill="#c2613f">silicon interposer</text>
    <text x="706" y="333" fill="#6b6a5f">carries the wide bus between the two dies</text>
    <text x="706" y="349" font-weight="600" fill="#c2613f">one broken trace here scraps the whole part</text>

    <line x1="602" y1="358" x2="700" y2="368" stroke="#a8a496" stroke-width="1"/>
    <text x="706" y="371" font-weight="600" fill="#8a5a2a">copper bumps</text>
    <text x="706" y="387" fill="#6b6a5f">a joint, not a part &#183; reflowed once</text>

    <line x1="650" y1="399" x2="700" y2="404" stroke="#a8a496" stroke-width="1"/>
    <text x="706" y="407" font-weight="600" fill="#2f5c8a">package substrate</text>
    <text x="706" y="423" fill="#6b6a5f">fans the fine pitch out to something a board can take</text>

    <line x1="632" y1="440" x2="700" y2="443" stroke="#a8a496" stroke-width="1"/>
    <text x="706" y="446" font-weight="600" fill="#141413">solder balls</text>
    <text x="706" y="462" fill="#6b6a5f">the only joint here a repair shop can undo</text>

    <line x1="690" y1="483" x2="700" y2="483" stroke="#a8a496" stroke-width="1"/>
    <text x="706" y="480" font-weight="600" fill="#141413">printed circuit board</text>
    <text x="706" y="496" fill="#6b6a5f">everything above arrives as one component</text>
  </g>

  <!-- legend -->
  <rect x="60" y="556" width="22" height="12" rx="2" fill="#ffffff" stroke="#6b6a5f" stroke-width="1.3"/>
  <text x="92" y="566" font-size="11" fill="#6b6a5f">solid border &#183; this really does come apart</text>
  <rect x="352" y="556" width="22" height="12" rx="2" fill="#ffffff" stroke="#6b6a5f" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="384" y="566" font-size="11" fill="#6b6a5f">dashed border &#183; permanent once cured or reflowed</text>
  <circle cx="712" cy="562" r="6" fill="#c9913f"/>
  <text x="726" y="566" font-size="11" fill="#6b6a5f">round elements are joints between two parts, not parts of their own</text>

  <text x="32" y="604" font-size="11.5" fill="#8c8a7d">assembly order is &#9312; substrate first, &#9313; interposer onto it, &#9314; dies onto the interposer, &#9315; underfill and lid, &#9316; and only then the finished package onto the board.</text>
  <text x="32" y="621" font-size="11.5" fill="#8c8a7d">that order is the whole reason to draw this instead of a cross-section: a section shows what touches what, and says nothing about what happened first, or what you can still get back apart.</text>
  <text x="32" y="638" font-size="11.5" fill="#8c8a7d">the axis is one straight line and every part is centred on it &#8212; that line is the reader&#8217;s only clue to how the pieces go back together.</text>
  <text x="32" y="655" font-size="11.5" fill="#8c8a7d">the gaps are equal on purpose. unequal gaps get read as real distance, and then two parts that merely sit next to each other look like they are related.</text>

  <rect x="858" y="672" width="222" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M858 679 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="871" cy="687" r="3.6" fill="#ffffff"/>
  <text x="978" y="691" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">Exploded view &#183; chip package</text>
</svg>
