<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="How pixel data physically moves on a machine with a discrete graphics card, which unlike a phone system on chip has its own separate video memory. The figure is split down the middle. On the left is the host: a CPU with its memory management unit, and below it the system memory on the motherboard, drawn as two stacked rows holding the same physical pages. The upper row is labelled decoded image, ordinary pages, TTM underscore PL underscore SYSTEM, and marked as not reachable by the card at all. The lower row is the same pages after the driver has pinned them and mapped them through the graphics aperture, labelled AMDGPU underscore GEM underscore DOMAIN underscore GTT, now readable by the card across the link. A note states that this step makes a mapping entry and does not move any bytes. Between the two halves sits the PCI Express link, drawn as a narrow gold gateway, and it is the only wire connecting the two memories. On the right is the graphics card, its own board with its own memory. Its die holds, from left to right, an SDMA copy engine highlighted in orange, a shader array, a level two cache, and a display engine in blue. Below the die is a second address bar, the video memory, divided left to right into textures, the back framebuffer and the front framebuffer. Badge one, an application decodes an image into ordinary system memory where the card cannot see it. Badge two, the driver pins the pages and calls dma map sgtable, which makes them reachable. Badge three, the card's own SDMA engine reads those pages across PCI Express and writes them into video memory; this is the real copy and the card issues it, not the CPU. Badge four, the shader array reads textures and draws into the back framebuffer. Badge five, the display engine reads the front framebuffer and drives the monitor, never crossing PCI Express again. Badge six, the CPU can only see a window of video memory through the PCI Express base address register, sized by visible vram size. The conclusion is that here the word upload is literal: there really are two address spaces with one wire between them, which is exactly what a phone system on chip does not have" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="vdfDots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <marker id="vdfArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker>
    <marker id="vdfArrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#2f5c8a"/></marker>
    <marker id="vdfArrG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#4d5a3c"/></marker>
  </defs>
  <rect width="1120" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="560" rx="16" fill="url(#vdfDots)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">DISCRETE CARD &#183; TWO MEMORIES, ONE WIRE &#183; HERE THE COPY IS REAL</text>
  <g font-size="12" fill="#6b6a5f">
    <line x1="646" y1="30" x2="670" y2="30" stroke="#d97757" stroke-width="2.4"/><text x="678" y="34">who issues the transfer</text>
    <line x1="850" y1="30" x2="874" y2="30" stroke="#4d5a3c" stroke-width="1.8"/><text x="882" y="34">on-card traffic</text>
    <line x1="984" y1="30" x2="1008" y2="30" stroke="#2f5c8a" stroke-width="1.8"/><text x="1016" y="34">display side</text>
  </g>
  <rect x="32" y="54" width="404" height="402" rx="12" fill="none" stroke="#d5d2c6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="48" y="76" font-size="13" font-weight="600" fill="#6b6a5f">HOST &#183; motherboard</text>
  <rect x="48" y="88" width="200" height="50" rx="9" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="148" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">CPU + system MMU</text>
  <text x="148" y="126" text-anchor="middle" font-size="12" fill="#6b6a5f">decodes, then hands over</text>
  <text x="48" y="168" font-size="12" font-weight="600" fill="#4d5a3c">SYSTEM MEMORY &#183; DDR on the board</text>
  <rect x="48" y="180" width="372" height="60" rx="9" fill="#f1efe8" stroke="#d5d2c6"/>
  <text x="64" y="203" font-size="12.5" font-weight="600" fill="#6b6a5f">decoded image &#183; ordinary pages</text>
  <text x="64" y="223" font-size="12" fill="#8c8a7d">TTM_PL_SYSTEM &#183; the card cannot reach this</text>
  <rect x="48" y="276" width="372" height="60" rx="9" fill="#eef1e7" stroke="#b9c4a4"/>
  <text x="64" y="299" font-size="12.5" font-weight="600" fill="#4d5a3c">the same pages, now GART-mapped</text>
  <text x="64" y="319" font-size="12" fill="#8c8a7d">AMDGPU_GEM_DOMAIN_GTT &#183; readable over the link</text>
  <line x1="226" y1="242" x2="226" y2="270" stroke="#4d5a3c" stroke-width="1.8" marker-end="url(#vdfArrG)"/>
  <text x="256" y="262" font-size="12" fill="#4d5a3c">pin + dma_map_sgtable()</text>
  <text x="48" y="364" font-size="12" font-weight="600" fill="#8f4a2f">that step writes a mapping entry.</text>
  <text x="48" y="381" font-size="12" font-weight="600" fill="#8f4a2f">not one byte has moved yet.</text>
  <text x="48" y="410" font-size="12" fill="#6b6a5f">the CPU could also write into the BAR window</text>
  <text x="48" y="427" font-size="12" fill="#6b6a5f">itself, but it is small and uncached &#8212; drivers</text>
  <text x="48" y="444" font-size="12" fill="#6b6a5f">use the engine for anything bulky.</text>
  <rect x="446" y="270" width="66" height="72" rx="9" fill="#f0e4d8" stroke="#d9bf94"/>
  <text x="479" y="299" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8a6a2f">PCIe</text>
  <text x="479" y="317" text-anchor="middle" font-size="11.5" fill="#8a6a2f">the only</text>
  <text x="479" y="333" text-anchor="middle" font-size="11.5" fill="#8a6a2f">wire</text>
  <rect x="522" y="54" width="566" height="402" rx="12" fill="none" stroke="#d97757" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="538" y="76" font-size="13" font-weight="600" fill="#8f4a2f">GRAPHICS CARD &#183; its own board, its own memory</text>
  <rect x="538" y="88" width="534" height="104" rx="10" fill="none" stroke="#d5d2c6" stroke-width="1.2"/>
  <text x="1058" y="106" text-anchor="end" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#6b6a5f">GPU DIE</text>
  <rect x="552" y="116" width="148" height="60" rx="8" fill="#f4d9cd" stroke="#d97757" stroke-width="1.6"/>
  <text x="626" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">SDMA copy engine</text>
  <text x="626" y="158" text-anchor="middle" font-size="11.5" fill="#8f4a2f">it does the upload</text>
  <rect x="712" y="116" width="118" height="60" rx="8" fill="#f4d9cd" stroke="#d97757" stroke-opacity="0.45"/>
  <text x="771" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">shader array</text>
  <text x="771" y="158" text-anchor="middle" font-size="11.5" fill="#6b6a5f">renders</text>
  <rect x="842" y="116" width="100" height="60" rx="8" fill="#f1efe8" stroke="#d5d2c6"/>
  <text x="892" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#6b6a5f">L2 cache</text>
  <text x="892" y="158" text-anchor="middle" font-size="11.5" fill="#8c8a7d">not a frame</text>
  <rect x="954" y="116" width="104" height="60" rx="8" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="1006" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">display</text>
  <text x="1006" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">engine</text>
  <text x="538" y="240" font-size="12" font-weight="600" fill="#4d5a3c">VRAM &#183; a second physical address space</text>
  <rect x="538" y="248" width="534" height="76" rx="10" fill="#ffffff" stroke="#b9c4a4"/>
  <rect x="552" y="262" width="164" height="48" rx="7" fill="#eef1e7" stroke="#b9c4a4"/>
  <text x="634" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="#4d5a3c">textures</text>
  <text x="634" y="300" text-anchor="middle" font-size="11.5" fill="#6b6a5f">uploaded once</text>
  <rect x="728" y="262" width="164" height="48" rx="7" fill="#eef1e7" stroke="#b9c4a4"/>
  <text x="810" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="#4d5a3c">fb &#183; back</text>
  <text x="810" y="300" text-anchor="middle" font-size="11.5" fill="#6b6a5f">being drawn</text>
  <rect x="904" y="262" width="154" height="48" rx="7" fill="#eef1e7" stroke="#b9c4a4"/>
  <text x="981" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="#4d5a3c">fb &#183; front</text>
  <text x="981" y="300" text-anchor="middle" font-size="11.5" fill="#6b6a5f">scanned out now</text>
  <text x="538" y="342" font-size="11.5" fill="#8c8a7d">once a byte is here it stays &#8212; shaders and scanout read it without crossing PCIe</text>
  <rect x="538" y="356" width="342" height="52" rx="8" fill="#f1efe8" stroke="#d5d2c6"/>
  <text x="552" y="377" font-size="12" font-weight="600" fill="#6b6a5f">CPU-visible window &#183; the PCIe BAR</text>
  <text x="552" y="396" font-size="11.5" fill="#8c8a7d">visible_vram_size &#183; usually far smaller than the VRAM</text>
  <text x="1072" y="378" text-anchor="end" font-size="12" font-weight="600" fill="#2f5c8a">to the monitor</text>
  <text x="1072" y="396" text-anchor="end" font-size="11.5" fill="#6b6a5f">DisplayPort &#183; off-card</text>
  <line x1="420" y1="306" x2="444" y2="306" stroke="#d97757" stroke-width="2.4"/>
  <path d="M479 268 L479 146 L550 146" stroke="#d97757" stroke-width="2.4" fill="none" marker-end="url(#vdfArrO)"/>
  <path d="M626 178 L626 256" stroke="#d97757" stroke-width="2.4" fill="none" marker-end="url(#vdfArrO)"/>
  <path d="M771 178 L771 214 L810 214 L810 256" stroke="#4d5a3c" stroke-width="1.8" fill="none" marker-end="url(#vdfArrG)"/>
  <path d="M1006 256 L1006 180" stroke="#2f5c8a" stroke-width="1.8" fill="none" marker-end="url(#vdfArrB)"/>
  <path d="M1060 160 L1076 160 L1076 350" stroke="#2f5c8a" stroke-width="1.8" fill="none" marker-end="url(#vdfArrB)"/>
  <line x1="536" y1="382" x2="514" y2="382" stroke="#6b6a5f" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="444" y1="382" x2="422" y2="382" stroke="#6b6a5f" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="398" cy="194" r="10.5" fill="#d97757"/>
  <text x="398" y="198" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text>
  <circle cx="226" cy="256" r="10.5" fill="#d97757"/>
  <text x="226" y="260" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
  <circle cx="479" cy="214" r="10.5" fill="#d97757"/>
  <text x="479" y="218" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3</text>
  <circle cx="790" cy="214" r="10.5" fill="#d97757"/>
  <text x="790" y="218" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">4</text>
  <circle cx="1006" cy="214" r="10.5" fill="#d97757"/>
  <text x="1006" y="218" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">5</text>
  <circle cx="479" cy="382" r="10.5" fill="#d97757"/>
  <text x="479" y="386" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">6</text>
  <text x="32" y="484" font-size="11.5" fill="#8c8a7d">&#9312; an app decodes into ordinary system memory &#183; &#9313; the driver pins it and maps it through GART &#183; &#9314; the card&#8217;s SDMA engine reads it over PCIe and writes VRAM</text>
  <text x="32" y="501" font-size="11.5" fill="#8c8a7d">&#9315; the shaders draw into the back buffer &#183; &#9316; the display engine reads the front buffer &#183; &#9317; the CPU can only peek at VRAM through the BAR window</text>
  <text x="32" y="526" font-size="12" font-weight="600" fill="#8f4a2f">two address spaces, one wire. here &#8220;upload&#8221; is literal &#8212; and it is still the card, not the CPU, that issues the reads.</text>
</svg>
