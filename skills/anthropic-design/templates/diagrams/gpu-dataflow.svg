<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="How a GPU actually touches pixel data on a phone-class system on chip. The CPU cluster sits top left with its caches and MMU; the GPU fills the top right, drawn open so its four shader cores, its sixteen by sixteen pixel tile buffer, its two hundred and fifty six kilobyte level two cache, its own memory management unit and its single AXI master port are all visible. A note inside it states that one 1080p RGBA frame is 8.3 megabytes and nothing on that die can hold one. Across the middle runs a single DDR bar, one physical address space divided into five tenants: the command buffer, the GPU's page tables, textures and meshes, framebuffer A which is the front buffer, and framebuffer B which is the back buffer, each with its size and base address. Every arrow in the figure ends on that bar. Badge one, the CPU writes the command buffer through its cache. Badge two, the CPU rings one doorbell register over APB. Badge three, the GPU's own MMU fetches its page tables from DDR. Badge four, the GPU reads textures through its single master port. Badge five, finished tiles are written back to framebuffer B, the only pixel write the GPU performs. Badge six, a fence is signalled back to the CPU. Badge seven, at the same time the display controller's DMA is reading framebuffer A and feeding the DSI and D-PHY out to the panel. An aside notes the contrast with a discrete PCIe graphics card, where an upload really is a copy into separate video memory. The conclusion is that nothing is ever moved into the GPU: the GPU is simply a second bus master issuing addresses into the same DDR the CPU uses" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="gdfDots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <marker id="gdfArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker>
    <marker id="gdfArrG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#8a6a2f"/></marker>
    <marker id="gdfArrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#2f5c8a"/></marker>
  </defs>
  <rect width="1120" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="560" rx="16" fill="url(#gdfDots)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">GPU DATA PATH &#183; NOTHING IS EVER MOVED INTO THE GPU</text>
  <g font-size="12" fill="#6b6a5f">
    <line x1="558" y1="30" x2="582" y2="30" stroke="#d97757" stroke-width="2.4"/><text x="590" y="34">who issues the address</text>
    <line x1="770" y1="30" x2="794" y2="30" stroke="#8a6a2f" stroke-width="1.6" stroke-dasharray="4 3"/><text x="802" y="34">register poke &#183; APB</text>
    <line x1="946" y1="30" x2="970" y2="30" stroke="#2f5c8a" stroke-width="1.8"/><text x="978" y="34">display side</text>
  </g>
  <rect x="40" y="64" width="330" height="196" rx="12" fill="none" stroke="#c4d5e6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="56" y="88" font-size="13" font-weight="600" fill="#2f5c8a">CPU cluster &#183; AXI master 0</text>
  <rect x="56" y="102" width="146" height="48" rx="8" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="129" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">L1 + L2 cache</text>
  <text x="129" y="139" text-anchor="middle" font-size="12" fill="#6b6a5f">write-back</text>
  <rect x="214" y="102" width="140" height="48" rx="8" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="284" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">CPU MMU</text>
  <text x="284" y="139" text-anchor="middle" font-size="12" fill="#6b6a5f">virtual &#8594; physical</text>
  <text x="56" y="174" font-size="12" fill="#6b6a5f">it fills the command buffer, then writes</text>
  <text x="56" y="191" font-size="12" fill="#6b6a5f">one doorbell register. that is its whole</text>
  <text x="56" y="208" font-size="12" fill="#6b6a5f">part &#8212; it never touches a pixel again.</text>
  <text x="56" y="232" font-size="12" fill="#8f4a2f">flush the cache, or the GPU reads</text>
  <text x="56" y="248" font-size="12" fill="#8f4a2f">bytes that are still sitting in it</text>
  <rect x="430" y="64" width="650" height="188" rx="12" fill="none" stroke="#d97757" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="446" y="88" font-size="13" font-weight="600" fill="#8f4a2f">GPU &#183; AXI master 1 &#183; drawn open</text>
  <rect x="446" y="102" width="80" height="48" rx="8" fill="#f4d9cd" stroke="#d97757"/>
  <text x="486" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">shader</text>
  <text x="486" y="139" text-anchor="middle" font-size="12" fill="#6b6a5f">core 0</text>
  <rect x="534" y="102" width="80" height="48" rx="8" fill="#f4d9cd" stroke="#d97757"/>
  <text x="574" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">shader</text>
  <text x="574" y="139" text-anchor="middle" font-size="12" fill="#6b6a5f">core 1</text>
  <rect x="622" y="102" width="80" height="48" rx="8" fill="#f4d9cd" stroke="#d97757"/>
  <text x="662" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">shader</text>
  <text x="662" y="139" text-anchor="middle" font-size="12" fill="#6b6a5f">core 2</text>
  <rect x="710" y="102" width="80" height="48" rx="8" fill="#f4d9cd" stroke="#d97757"/>
  <text x="750" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">shader</text>
  <text x="750" y="139" text-anchor="middle" font-size="12" fill="#6b6a5f">core 3</text>
  <rect x="806" y="102" width="118" height="48" rx="8" fill="#f4d9cd" stroke="#d97757"/>
  <text x="865" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">tile buffer</text>
  <text x="865" y="139" text-anchor="middle" font-size="12" fill="#6b6a5f">16&#215;16 px &#183; 2 KiB</text>
  <rect x="938" y="102" width="126" height="48" rx="8" fill="#f4d9cd" stroke="#d97757"/>
  <text x="1001" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">L2 cache</text>
  <text x="1001" y="139" text-anchor="middle" font-size="12" fill="#6b6a5f">256 KiB</text>
  <rect x="446" y="168" width="190" height="46" rx="8" fill="#faf9f5" stroke="#d97757"/>
  <text x="541" y="187" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">GPU MMU</text>
  <text x="541" y="204" text-anchor="middle" font-size="12" fill="#6b6a5f">page tables live in DDR</text>
  <rect x="650" y="168" width="150" height="46" rx="8" fill="#faf9f5" stroke="#d97757" stroke-width="1.8"/>
  <text x="725" y="187" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">AXI master port</text>
  <text x="725" y="204" text-anchor="middle" font-size="12" fill="#6b6a5f">one way in and out</text>
  <text x="816" y="182" font-size="12" fill="#8c8a7d">one 1080p RGBA frame = 8.3 MB.</text>
  <text x="816" y="199" font-size="12" fill="#8c8a7d">nothing on this die holds one &#8212;</text>
  <text x="816" y="216" font-size="12" fill="#8c8a7d">so the frame has to stay in DDR.</text>
  <line x1="370" y1="180" x2="424" y2="180" stroke="#8a6a2f" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#gdfArrG)"/>
  <line x1="430" y1="222" x2="376" y2="222" stroke="#8a6a2f" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#gdfArrG)"/>
  <rect x="40" y="296" width="1030" height="76" rx="10" fill="#eef1e7" stroke="#b9c4a4"/>
  <rect x="40" y="296" width="146" height="76" rx="10" fill="none" stroke="#b9c4a4"/>
  <text x="113" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#4d5a3c">command buffer</text>
  <text x="113" y="342" text-anchor="middle" font-size="12" fill="#6b6a5f">64 KiB</text>
  <text x="113" y="360" text-anchor="middle" font-size="12" fill="#8c8a7d">0x8000_0000</text>
  <rect x="186" y="296" width="118" height="76" rx="10" fill="none" stroke="#b9c4a4"/>
  <text x="245" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#4d5a3c">page tables</text>
  <text x="245" y="342" text-anchor="middle" font-size="12" fill="#6b6a5f">2 MiB</text>
  <text x="245" y="360" text-anchor="middle" font-size="12" fill="#8c8a7d">0x8001_0000</text>
  <rect x="304" y="296" width="266" height="76" rx="10" fill="none" stroke="#b9c4a4"/>
  <text x="437" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#4d5a3c">textures &amp; meshes</text>
  <text x="437" y="342" text-anchor="middle" font-size="12" fill="#6b6a5f">48 MiB</text>
  <text x="437" y="360" text-anchor="middle" font-size="12" fill="#8c8a7d">0x8021_0000</text>
  <rect x="570" y="296" width="250" height="76" rx="10" fill="#faf9f5" stroke="#b9c4a4"/>
  <text x="695" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#4d5a3c">fb A &#183; front</text>
  <text x="695" y="342" text-anchor="middle" font-size="12" fill="#6b6a5f">8.3 MiB</text>
  <text x="695" y="360" text-anchor="middle" font-size="12" fill="#8c8a7d">0x8321_0000</text>
  <rect x="820" y="296" width="250" height="76" rx="10" fill="#faf9f5" stroke="#b9c4a4"/>
  <text x="945" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#4d5a3c">fb B &#183; back</text>
  <text x="945" y="342" text-anchor="middle" font-size="12" fill="#6b6a5f">8.3 MiB</text>
  <text x="945" y="360" text-anchor="middle" font-size="12" fill="#8c8a7d">0x8B21_0000</text>
  <text x="40" y="388" font-size="12" fill="#8c8a7d">DDR &#183; one physical address space, five tenants, 6.4 GB/s shared between them</text>
  <g fill="none" stroke="#d97757" stroke-width="2.4">
    <line x1="725" y1="214" x2="725" y2="268"/>
    <line x1="245" y1="268" x2="945" y2="268"/>
    <line x1="245" y1="268" x2="245" y2="292" marker-end="url(#gdfArrO)"/>
    <line x1="437" y1="268" x2="437" y2="292" marker-end="url(#gdfArrO)"/>
    <line x1="945" y1="268" x2="945" y2="292" marker-end="url(#gdfArrO)"/>
  </g>
  <line x1="113" y1="262" x2="113" y2="292" stroke="#d97757" stroke-width="2.4" marker-end="url(#gdfArrO)"/>
  <line x1="695" y1="372" x2="695" y2="396" stroke="#2f5c8a" stroke-width="1.8" marker-end="url(#gdfArrB)"/>
  <rect x="600" y="400" width="184" height="68" rx="10" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="692" y="424" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5c8a">Display ctrl</text>
  <text x="692" y="442" text-anchor="middle" font-size="12" fill="#6b6a5f">fetch DMA &#183; master 2</text>
  <text x="692" y="459" text-anchor="middle" font-size="12" fill="#6b6a5f">reads fb A right now</text>
  <rect x="800" y="400" width="130" height="68" rx="10" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="865" y="424" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5c8a">DSI + D-PHY</text>
  <text x="865" y="442" text-anchor="middle" font-size="12" fill="#6b6a5f">4 lanes</text>
  <text x="865" y="459" text-anchor="middle" font-size="12" fill="#6b6a5f">1 Gbps each</text>
  <rect x="946" y="400" width="124" height="68" rx="10" fill="#f5f2ea" stroke="#cfccc0"/>
  <text x="1008" y="424" text-anchor="middle" font-size="13" font-weight="600" fill="#141413">LCD panel</text>
  <text x="1008" y="442" text-anchor="middle" font-size="12" fill="#6b6a5f">off-package</text>
  <text x="1008" y="459" text-anchor="middle" font-size="12" fill="#6b6a5f">glass at last</text>
  <line x1="784" y1="434" x2="796" y2="434" stroke="#2f5c8a" stroke-width="1.8" marker-end="url(#gdfArrB)"/>
  <line x1="930" y1="434" x2="942" y2="434" stroke="#2f5c8a" stroke-width="1.8" marker-end="url(#gdfArrB)"/>
  <rect x="40" y="400" width="524" height="68" rx="10" fill="#faf9f5" stroke="#eceadf"/>
  <text x="56" y="422" font-size="12" font-weight="600" fill="#141413">a desktop card is the exception</text>
  <text x="56" y="440" font-size="12" fill="#6b6a5f">a discrete PCIe GPU has its own VRAM, so "upload the texture" really is a copy</text>
  <text x="56" y="457" font-size="12" fill="#6b6a5f">across the bus. on this SoC there is no VRAM &#8212; upload means another DDR address.</text>
  <circle cx="113" cy="274" r="11" fill="#d97757"/>
  <text x="113" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">1</text>
  <circle cx="397" cy="162" r="11" fill="#d97757"/>
  <text x="397" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">2</text>
  <circle cx="245" cy="286" r="11" fill="#d97757"/>
  <text x="245" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">3</text>
  <circle cx="437" cy="286" r="11" fill="#d97757"/>
  <text x="437" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">4</text>
  <circle cx="945" cy="286" r="11" fill="#d97757"/>
  <text x="945" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">5</text>
  <circle cx="397" cy="240" r="11" fill="#d97757"/>
  <text x="397" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">6</text>
  <circle cx="676" cy="386" r="11" fill="#d97757"/>
  <text x="676" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">7</text>
  <text x="32" y="512" font-size="12" fill="#6b6a5f">&#9312; CPU fills the command buffer &#183; &#9313; one doorbell write &#183; &#9314; the GPU MMU fetches its own page tables &#183; &#9315; textures read in</text>
  <text x="32" y="530" font-size="12" fill="#6b6a5f">&#9316; tiles written out to fb B &#183; &#9317; fence back to the CPU &#183; &#9318; the display DMA reads fb A the whole time</text>
  <text x="32" y="548" font-size="12" fill="#8c8a7d">every arrow ends on the same DDR bar. the GPU is not a place data goes &#8212; it is a second master issuing addresses into it.</text>
</svg>
