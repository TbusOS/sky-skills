<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-label="Platform block diagram of a single board: one system on chip in the middle, with the parts it talks to arranged around it, and every link labelled with the interface it carries. On the left, drawn as a green circuit board with a gold edge connector and a notch, is the DRAM, joined to the chip by a link marked LPDDR4 x32; a note says every framebuffer lives here and the 6.4 gigabytes per second is shared by every master on the chip. On the right, drawn as a glass rectangle with a driver integrated circuit strip and a flexible cable, is the display panel, reached over a four lane MIPI DSI link, with a note that no frame of memory exists inside the panel so it must be fed on time every frame. Above the chip is a storage group holding eMMC over HS200 and SPI NOR flash over QSPI. Below it is a sensors and control group holding a touch controller on I2C, a backlight driver on PWM and a power management chip on I2C. Inside the chip four blocks face outward: the memory controller, the display controller which owns the fetch DMA, the DSI transmitter, and the low speed peripheral block. Badges mark the two links a pixel actually travels, the storage links which carry boot code but never pixels, and the control links which carry bytes per second rather than megabytes. The closing line states that the pill on each link is the part that carries information, and the line itself carries none" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
