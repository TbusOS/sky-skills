<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="One PCIe transaction packet built layer by layer, drawn on a byte ruler at eight pixels per byte so each bar's width is literally its byte count. Row one, the transaction layer emits a sixteen byte TLP header followed by a sixty-four byte payload, eighty bytes. Row two, the data link layer prepends a two byte sequence number and appends a four byte link CRC, so the bar grows outward at both ends to eighty-six bytes while the original eighty stay put between the two dashed guidelines. Row three, the physical layer frames it with a one byte start symbol and a one byte end symbol, eighty-eight bytes. Row four, those bytes are striped round-robin across four lanes: byte zero and four and eight go to lane zero, byte one and five and nine to lane one, and so on, each lane feeding its own serialiser. The two dashed guidelines are the point of the figure: everything added by a lower layer appears outside them, never inside" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="peDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/>
    </pattern>
    <marker id="peArrI" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#141413"/>
    </marker>
    <marker id="peArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/>
    </marker>
  </defs>

  <rect width="1120" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="560" rx="16" fill="url(#peDots)"/>

  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">PACKET ENCAPSULATION &#183; ONE BYTE RULER, THREE LAYERS</text>
  <text x="1088" y="34" text-anchor="end" font-size="12" fill="#6b6a5f">8 px = 1 byte &#183; bars are to scale with each other</text>

  <!-- the two guidelines: the original 80 bytes never move -->
  <g stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="240" y1="82" x2="240" y2="326"/>
    <line x1="880" y1="82" x2="880" y2="326"/>
  </g>

  <!-- ===== 1 · transaction layer ===== -->
  <text x="32" y="112" font-size="13" font-weight="600" fill="#141413">Transaction</text>
  <text x="32" y="130" font-size="12" fill="#6b6a5f">layer</text>
  <rect x="240" y="96" width="128" height="34" fill="#e2ecf5" stroke="#c4d5e6"/>
  <rect x="368" y="96" width="512" height="34" fill="#eef1e7" stroke="#b9c4a4"/>
  <text x="304" y="118" text-anchor="middle" font-size="12" fill="#2f5c8a">TLP header 16 B</text>
  <text x="624" y="118" text-anchor="middle" font-size="12" fill="#4d5a3c">data payload 64 B</text>
  <g stroke="#a8a496" stroke-width="1">
    <line x1="240" y1="130" x2="240" y2="123"/><line x1="304" y1="130" x2="304" y2="123"/><line x1="368" y1="130" x2="368" y2="123"/><line x1="432" y1="130" x2="432" y2="123"/><line x1="496" y1="130" x2="496" y2="123"/><line x1="560" y1="130" x2="560" y2="123"/><line x1="624" y1="130" x2="624" y2="123"/><line x1="688" y1="130" x2="688" y2="123"/><line x1="752" y1="130" x2="752" y2="123"/><line x1="816" y1="130" x2="816" y2="123"/><line x1="880" y1="130" x2="880" y2="123"/>
  </g>
  <text x="1088" y="152" text-anchor="end" font-size="12" font-style="italic" fill="#8c8a7d">80 B &#183; what the requester actually meant to send</text>

  <!-- ===== 2 · data link layer ===== -->
  <text x="32" y="202" font-size="13" font-weight="600" fill="#141413">Data link</text>
  <text x="32" y="220" font-size="12" fill="#6b6a5f">layer</text>
  <rect x="224" y="186" width="16" height="34" fill="#f0e4d8" stroke="#d9bf94"/>
  <rect x="240" y="186" width="640" height="34" fill="#f5f2ea" stroke="#d8d4c8"/>
  <rect x="880" y="186" width="32" height="34" fill="#f0e4d8" stroke="#d9bf94"/>
  <text x="560" y="208" text-anchor="middle" font-size="12" fill="#6b6a5f">the 80 B above, untouched</text>
  <g stroke="#a8a496" stroke-width="1">
    <line x1="224" y1="220" x2="224" y2="213"/><line x1="288" y1="220" x2="288" y2="213"/><line x1="352" y1="220" x2="352" y2="213"/><line x1="416" y1="220" x2="416" y2="213"/><line x1="480" y1="220" x2="480" y2="213"/><line x1="544" y1="220" x2="544" y2="213"/><line x1="608" y1="220" x2="608" y2="213"/><line x1="672" y1="220" x2="672" y2="213"/><line x1="736" y1="220" x2="736" y2="213"/><line x1="800" y1="220" x2="800" y2="213"/><line x1="864" y1="220" x2="864" y2="213"/>
  </g>
  <g fill="none" stroke="#c9913f" stroke-width="1.2">
    <path d="M232,186 V174 H180"/>
    <path d="M896,186 V174 H948"/>
  </g>
  <text x="176" y="178" text-anchor="end" font-size="12" fill="#8a6a2f">+ SeqNum 2 B</text>
  <text x="952" y="178" font-size="12" fill="#8a6a2f">+ LCRC 4 B</text>
  <text x="1088" y="242" text-anchor="end" font-size="12" font-style="italic" fill="#8c8a7d">86 B &#183; replay needs the number, the receiver needs the CRC</text>

  <!-- ===== 3 · physical layer ===== -->
  <text x="32" y="292" font-size="13" font-weight="600" fill="#141413">Physical</text>
  <text x="32" y="310" font-size="12" fill="#6b6a5f">layer &#183; framing</text>
  <rect x="216" y="276" width="8" height="34" fill="#f4d9cd" stroke="#d97757"/>
  <rect x="224" y="276" width="688" height="34" fill="#f5f2ea" stroke="#d8d4c8"/>
  <rect x="912" y="276" width="8" height="34" fill="#f4d9cd" stroke="#d97757"/>
  <text x="568" y="298" text-anchor="middle" font-size="12" fill="#6b6a5f">the 86 B above, untouched</text>
  <g stroke="#a8a496" stroke-width="1">
    <line x1="216" y1="310" x2="216" y2="303"/><line x1="280" y1="310" x2="280" y2="303"/><line x1="344" y1="310" x2="344" y2="303"/><line x1="408" y1="310" x2="408" y2="303"/><line x1="472" y1="310" x2="472" y2="303"/><line x1="536" y1="310" x2="536" y2="303"/><line x1="600" y1="310" x2="600" y2="303"/><line x1="664" y1="310" x2="664" y2="303"/><line x1="728" y1="310" x2="728" y2="303"/><line x1="792" y1="310" x2="792" y2="303"/><line x1="856" y1="310" x2="856" y2="303"/><line x1="920" y1="310" x2="920" y2="303"/>
  </g>
  <g fill="none" stroke="#d97757" stroke-width="1.2">
    <path d="M220,276 V264 H172"/>
    <path d="M916,276 V264 H964"/>
  </g>
  <text x="168" y="268" text-anchor="end" font-size="12" fill="#8f4a2f">+ STP 1 B</text>
  <text x="968" y="268" font-size="12" fill="#8f4a2f">+ END 1 B</text>
  <text x="1088" y="332" text-anchor="end" font-size="12" font-style="italic" fill="#8c8a7d">88 B &#183; now it has a beginning and an end on the wire</text>

  <!-- ===== 4 · striping ===== -->
  <path d="M568,310 V352" fill="none" stroke="#d97757" stroke-width="2" marker-end="url(#peArrO)"/>
  <text x="216" y="356" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">BYTE STRIPING &#183; x4 LINK</text>
  <text x="345" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">Lane 0</text>
  <rect x="300" y="380" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="345" y="397" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 0</text>
  <rect x="300" y="412" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="345" y="429" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 4</text>
  <rect x="300" y="444" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="345" y="461" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 8</text>
  <text x="455" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">Lane 1</text>
  <rect x="410" y="380" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="455" y="397" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 1</text>
  <rect x="410" y="412" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="455" y="429" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 5</text>
  <rect x="410" y="444" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="455" y="461" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 9</text>
  <text x="565" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">Lane 2</text>
  <rect x="520" y="380" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="565" y="397" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 2</text>
  <rect x="520" y="412" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="565" y="429" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 6</text>
  <rect x="520" y="444" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="565" y="461" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 10</text>
  <text x="675" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">Lane 3</text>
  <rect x="630" y="380" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="675" y="397" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 3</text>
  <rect x="630" y="412" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="675" y="429" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 7</text>
  <rect x="630" y="444" width="90" height="26" rx="4" fill="#e2ecf5" stroke="#c4d5e6"/>
  <text x="675" y="461" text-anchor="middle" font-size="12" fill="#2f5c8a">byte 11</text>
  <g fill="none" stroke="#141413" stroke-width="1.4">
    <line x1="345" y1="470" x2="345" y2="488" marker-end="url(#peArrI)"/>
    <line x1="455" y1="470" x2="455" y2="488" marker-end="url(#peArrI)"/>
    <line x1="565" y1="470" x2="565" y2="488" marker-end="url(#peArrI)"/>
    <line x1="675" y1="470" x2="675" y2="488" marker-end="url(#peArrI)"/>
  </g>
  <rect x="300" y="492" width="420" height="30" rx="8" fill="#ffffff" stroke="#d8d4c8"/>
  <text x="510" y="512" text-anchor="middle" font-size="12" fill="#141413">SerDes &#183; 128b/130b &#183; 32 GT/s per lane</text>
  <text x="1088" y="440" text-anchor="end" font-size="12" font-style="italic" fill="#8c8a7d">byte n leaves on lane n mod 4</text>
</svg>
