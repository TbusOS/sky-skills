<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Five ways to read a customer record, drawn as five horizontal paths running left to right into one target, the customers table, with four gates standing across them as vertical columns: an API gateway that checks token scope, a policy engine whose enforce flag is set per route, query alerts that page on bulk reads, and database grants, which see only who connects rather than who is asking. Each gate leaves one of four marks on each path: a solid bar where it really rejects the read, a dashed box where it runs but does not reject, a dashed box with a note where it is hooked in but not honoured, or grey text saying it never reaches that path. After the first solid bar a path turns into a faint dashed line. The public API is rejected at the gateway, the SQL console and the read replica at the database grants, and internal RPC at the policy engine. The admin panel is the one path still drawn as a solid orange line all the way into the table: the gateway never sees it, the database sees only the service's own role, and the only gate that does see it is the policy engine, which on that route is in audit mode, so it logs a deny and lets the read through. The query alerts never reject anything on any path." font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="pgtDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern><marker id="pgtArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker></defs>
  <rect width="1120" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="560" rx="16" fill="url(#pgtDot)"/>
  <line x1="336" y1="94" x2="336" y2="96" stroke="#6a9bcc" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="336" y1="150" x2="336" y2="172" stroke="#6a9bcc" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="336" y1="198" x2="336" y2="234" stroke="#6a9bcc" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="336" y1="260" x2="336" y2="296" stroke="#6a9bcc" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="336" y1="322" x2="336" y2="358" stroke="#6a9bcc" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="336" y1="384" x2="336" y2="412" stroke="#6a9bcc" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="496" y1="94" x2="496" y2="96" stroke="#788c5d" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="496" y1="150" x2="496" y2="158" stroke="#788c5d" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="496" y1="212" x2="496" y2="234" stroke="#788c5d" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="496" y1="260" x2="496" y2="282" stroke="#788c5d" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="496" y1="336" x2="496" y2="358" stroke="#788c5d" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="496" y1="384" x2="496" y2="412" stroke="#788c5d" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="656" y1="94" x2="656" y2="220" stroke="#c9913f" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="656" y1="274" x2="656" y2="358" stroke="#c9913f" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="656" y1="384" x2="656" y2="412" stroke="#c9913f" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="816" y1="94" x2="816" y2="110" stroke="#141413" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="816" y1="136" x2="816" y2="172" stroke="#141413" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="816" y1="198" x2="816" y2="220" stroke="#141413" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="816" y1="274" x2="816" y2="296" stroke="#141413" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="816" y1="322" x2="816" y2="344" stroke="#141413" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <line x1="816" y1="398" x2="816" y2="412" stroke="#141413" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
  <rect x="912" y="100" width="176" height="304" rx="12" fill="#f3f1ea" stroke="#141413" stroke-width="1.4"/>
  <rect x="32" y="108" width="200" height="48" rx="8" fill="#ffffff" stroke="#e3e0d4"/>
  <path d="M232,132 H330" stroke="#6b6a5f" stroke-width="1.6" fill="none"/>
  <path d="M342,132 H912" stroke="#cfccc0" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
  <rect x="32" y="170" width="200" height="48" rx="8" fill="#ffffff" stroke="#e3e0d4"/>
  <path d="M232,194 H910" stroke="#d97757" stroke-width="1.8" marker-end="url(#pgtArrO)" fill="none"/>
  <rect x="32" y="232" width="200" height="48" rx="8" fill="#ffffff" stroke="#e3e0d4"/>
  <path d="M232,256 H810" stroke="#6b6a5f" stroke-width="1.6" fill="none"/>
  <path d="M822,256 H912" stroke="#cfccc0" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
  <rect x="32" y="294" width="200" height="48" rx="8" fill="#ffffff" stroke="#e3e0d4"/>
  <path d="M232,318 H490" stroke="#6b6a5f" stroke-width="1.6" fill="none"/>
  <path d="M502,318 H912" stroke="#cfccc0" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
  <rect x="32" y="356" width="200" height="48" rx="8" fill="#ffffff" stroke="#e3e0d4"/>
  <path d="M232,380 H810" stroke="#6b6a5f" stroke-width="1.6" fill="none"/>
  <path d="M822,380 H912" stroke="#cfccc0" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
  <rect x="330" y="116" width="12" height="32" rx="3" fill="#6a9bcc"/>
  <rect x="490" y="116" width="12" height="32" rx="3" fill="#788c5d"/>
  <rect x="489" y="178" width="14" height="32" rx="3" fill="#ffffff" stroke="#788c5d" stroke-width="1.4" stroke-dasharray="3 2"/>
  <rect x="649" y="240" width="14" height="32" rx="3" fill="#ffffff" stroke="#c9913f" stroke-width="1.4" stroke-dasharray="3 2"/>
  <rect x="810" y="240" width="12" height="32" rx="3" fill="#141413"/>
  <rect x="490" y="302" width="12" height="32" rx="3" fill="#788c5d"/>
  <rect x="810" y="364" width="12" height="32" rx="3" fill="#141413"/>
  <rect x="32" y="426" width="8" height="22" rx="2" fill="#6b6a5f"/>
  <rect x="176" y="426" width="10" height="22" rx="2" fill="#ffffff" stroke="#6b6a5f" stroke-width="1.3" stroke-dasharray="3 2"/>
  <path d="M32,464 H60" stroke="#6b6a5f" stroke-width="1.6" fill="none"/>
  <path d="M256,464 H284" stroke="#cfccc0" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
  <path d="M476,464 H500" stroke="#d97757" stroke-width="1.8" marker-end="url(#pgtArrO)" fill="none"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">PATHS &#215; GATES &#183; WHICH GATE ACTUALLY STOPS EACH PATH</text>
  <text x="1088" y="34" text-anchor="end" font-size="12" fill="#6b6a5f">all four gates installed</text>
  <text x="336" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5c8a">API gateway</text>
  <text x="336" y="82" text-anchor="middle" font-size="12" fill="#6b6a5f">checks the token's scope</text>
  <text x="496" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#5d7045">Policy engine</text>
  <text x="496" y="82" text-anchor="middle" font-size="12" fill="#6b6a5f">enforce flag, per route</text>
  <text x="656" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a2a">Query alerts</text>
  <text x="656" y="82" text-anchor="middle" font-size="12" fill="#6b6a5f">pages on bulk reads</text>
  <text x="816" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#141413">DB grants</text>
  <text x="816" y="82" text-anchor="middle" font-size="12" fill="#6b6a5f">sees only the DB role</text>
  <text x="32" y="82" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">FIVE WAYS IN</text>
  <text x="928" y="64" font-size="13" font-weight="600" fill="#141413">customers table</text>
  <text x="928" y="82" font-size="12" fill="#6b6a5f">email &#183; phone &#183; address</text>
  <text x="48" y="128" font-size="13" font-weight="600" fill="#141413">Public API</text>
  <text x="48" y="146" font-size="12" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">GET /v1/customers/:id</text>
  <text x="928" y="136" font-size="12" fill="#6b6a5f">stopped by the gateway</text>
  <text x="48" y="190" font-size="13" font-weight="600" fill="#141413">Admin panel</text>
  <text x="48" y="208" font-size="12" fill="#6b6a5f">support staff, in the browser</text>
  <text x="928" y="198" font-size="12" font-weight="600" fill="#c2613f">arrives</text>
  <text x="48" y="252" font-size="13" font-weight="600" fill="#141413">SQL console</text>
  <text x="48" y="270" font-size="12" fill="#6b6a5f">psql on the bastion host</text>
  <text x="928" y="260" font-size="12" fill="#6b6a5f">stopped by DB grants</text>
  <text x="48" y="314" font-size="13" font-weight="600" fill="#141413">Internal RPC</text>
  <text x="48" y="332" font-size="12" fill="#6b6a5f">another service asks</text>
  <text x="928" y="322" font-size="12" fill="#6b6a5f">stopped by policy</text>
  <text x="48" y="376" font-size="13" font-weight="600" fill="#141413">Read replica</text>
  <text x="48" y="394" font-size="12" fill="#6b6a5f">a BI tool connects directly</text>
  <text x="928" y="384" font-size="12" fill="#6b6a5f">stopped by DB grants</text>
  <text x="336" y="109" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">rejects &#183; no scope</text>
  <text x="496" y="109" text-anchor="middle" font-size="12" font-weight="600" fill="#5d7045">rejects</text>
  <text x="816" y="124" text-anchor="middle" font-size="12" font-style="italic" fill="#8c8a7d">not reached</text>
  <text x="336" y="186" text-anchor="middle" font-size="12" font-style="italic" fill="#8c8a7d">not reached</text>
  <text x="496" y="171" text-anchor="middle" font-size="12" fill="#5d7045">audit mode &#183; allows</text>
  <text x="816" y="186" text-anchor="middle" font-size="12" font-style="italic" fill="#8c8a7d">not reached</text>
  <text x="336" y="248" text-anchor="middle" font-size="12" font-style="italic" fill="#8c8a7d">not reached</text>
  <text x="496" y="248" text-anchor="middle" font-size="12" font-style="italic" fill="#8c8a7d">not reached</text>
  <text x="656" y="233" text-anchor="middle" font-size="12" fill="#8a5a2a">pages after the fact</text>
  <text x="816" y="233" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">rejects &#183; no grant</text>
  <text x="336" y="310" text-anchor="middle" font-size="12" font-style="italic" fill="#8c8a7d">not reached</text>
  <text x="496" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#5d7045">rejects &#183; caller id</text>
  <text x="816" y="310" text-anchor="middle" font-size="12" font-style="italic" fill="#8c8a7d">not reached</text>
  <text x="336" y="372" text-anchor="middle" font-size="12" font-style="italic" fill="#8c8a7d">not reached</text>
  <text x="496" y="372" text-anchor="middle" font-size="12" font-style="italic" fill="#8c8a7d">not reached</text>
  <text x="656" y="372" text-anchor="middle" font-size="12" font-style="italic" fill="#8c8a7d">no such event</text>
  <text x="816" y="357" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">rejects &#183; grants copied</text>
  <text x="48" y="442" font-size="12" fill="#6b6a5f">rejects the read</text>
  <text x="194" y="442" font-size="12" fill="#6b6a5f">runs, does not reject (alert only, or audit mode)</text>
  <text x="520" y="442" font-size="12" font-style="italic" fill="#8c8a7d">not reached</text>
  <text x="596" y="442" font-size="12" fill="#6b6a5f">= this gate cannot see that path at all</text>
  <text x="68" y="468" font-size="12" fill="#6b6a5f">still getting through here</text>
  <text x="292" y="468" font-size="12" fill="#6b6a5f">already stopped upstream</text>
  <text x="512" y="468" font-size="12" fill="#6b6a5f">reaches the table &#8212; no gate stops it</text>
  <text x="32" y="500" font-size="12" fill="#6b6a5f">Four of five paths meet a real rejection. The admin panel meets exactly one gate, and on that route the policy engine is in audit mode: it logs deny, then allows.</text>
  <text x="32" y="520" font-size="12" fill="#6b6a5f">Query alerts reject nothing anywhere &#8212; a detector drawn as a gate. DB grants only see who connects, so any path through the service's own role passes them.</text>
  <text x="32" y="540" font-size="12" font-style="italic" fill="#8c8a7d">Stepper: step k installs gates 1..k from the same table, and each line fades after the first solid bar among the installed gates. Nothing else moves.</text>
</svg>
