<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="A grid for why a number printed at build time can already be out of date. Four horizontal bands are places: the advisory database that says what counts as vulnerable and the lockfile in the repository, grouped as what the scan reads, then the container image and the running pods, grouped as what actually runs. Three columns are moments: the build, when the scan runs; the weeks after; and a re-scan now. The build's reading, zero known vulnerabilities, is drawn as a gold stamp over the first column covering only the two rows it was computed from. Five numbered badges sit where things go stale. One, at build time in the image row: the base image ships an old TLS library, and lockfile scans never read OS packages, so the stamp was wrong the moment it was printed. Two, in the weeks after, in the advisory row: a new advisory names a version that is pinned, and nobody had to change anything. Three, in the lockfile row: a dependency is bumped but the image is not rebuilt. Four and five, in the running pods row: someone installs a package inside a live pod, and a paused rollout leaves half the pods on the old image. The re-scan column is shaded orange and reads a different pair of rows: today's advisories and the image digests actually running, not the lockfile. It sees badges one, two and five, and still misses four, because a change made inside a live pod is in no image." font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="wwgDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern></defs>
  <rect width="1120" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="560" rx="16" fill="url(#wwgDot)"/>
  <rect x="868" y="44" width="220" height="360" rx="12" fill="#f7e4dc" stroke="#d97757" stroke-width="1.2"/>
  <line x1="548" y1="52" x2="548" y2="404" stroke="#e3e0d4" stroke-width="1"/>
  <line x1="860" y1="52" x2="860" y2="404" stroke="#e3e0d4" stroke-width="1"/>
  <line x1="32" y1="96" x2="860" y2="96" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="32" y1="182" x2="860" y2="182" stroke="#e3e0d4" stroke-width="1"/>
  <line x1="32" y1="246" x2="860" y2="246" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="32" y1="330" x2="860" y2="330" stroke="#e3e0d4" stroke-width="1"/>
  <circle cx="40" cy="147" r="4.5" fill="#6a9bcc"/>
  <circle cx="40" cy="207" r="4.5" fill="#6a9bcc"/>
  <circle cx="40" cy="295" r="4.5" fill="#788c5d"/>
  <circle cx="40" cy="355" r="4.5" fill="#788c5d"/>
  <path d="M280,128 H274 V236 H280" stroke="#c9913f" stroke-width="1.6" fill="none"/>
  <rect x="292" y="150" width="236" height="64" rx="6" fill="#f0e4d8" stroke="#c9913f" stroke-width="1.8"/>
  <rect x="296" y="154" width="228" height="56" rx="4" fill="none" stroke="#c9913f" stroke-width="0.8"/>
  <circle cx="294" cy="294" r="10" fill="#141413"/>
  <circle cx="582" cy="146" r="10" fill="#141413"/>
  <circle cx="582" cy="206" r="10" fill="#141413"/>
  <circle cx="582" cy="346" r="10" fill="#141413"/>
  <circle cx="582" cy="376" r="10" fill="#141413"/>
  <circle cx="38" cy="428" r="4.5" fill="#6a9bcc"/>
  <circle cx="194" cy="428" r="4.5" fill="#788c5d"/>
  <circle cx="350" cy="428" r="10" fill="#141413"/>
  <rect x="566" y="418" width="30" height="20" rx="4" fill="#f0e4d8" stroke="#c9913f" stroke-width="1.6"/>
  <rect x="790" y="418" width="30" height="20" rx="6" fill="#f7e4dc" stroke="#d97757" stroke-width="1.2"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">WHERE &#215; WHEN &#183; WHY THE BUILD'S NUMBER IS ALREADY OLD</text>
  <text x="1088" y="34" text-anchor="end" font-size="12" fill="#6b6a5f">one service, one container image</text>
  <text x="284" y="64" font-size="13" font-weight="600" fill="#141413">build &#183; the scan runs</text>
  <text x="284" y="82" font-size="12" fill="#6b6a5f">lockfile vs today's advisories</text>
  <text x="572" y="64" font-size="13" font-weight="600" fill="#141413">the weeks after</text>
  <text x="572" y="82" font-size="12" fill="#6b6a5f">nobody has to touch anything</text>
  <text x="884" y="64" font-size="13" font-weight="600" fill="#c2613f">re-scan now</text>
  <text x="884" y="82" font-size="12" fill="#6b6a5f">reads what runs, not the repo</text>
  <text x="32" y="82" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">WHERE IT LIVES</text>
  <text x="32" y="116" font-size="12" font-weight="600" letter-spacing="1.2" fill="#2f5c8a">WHAT THE SCAN READS</text>
  <text x="32" y="264" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5d7045">WHAT ACTUALLY RUNS</text>
  <text x="52" y="152" font-size="13" font-weight="600" fill="#141413">Advisory database</text>
  <text x="52" y="170" font-size="12" fill="#6b6a5f">what counts as vulnerable</text>
  <text x="52" y="212" font-size="13" font-weight="600" fill="#141413">Lockfile</text>
  <text x="52" y="230" font-size="12" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">package-lock.json</text>
  <text x="52" y="300" font-size="13" font-weight="600" fill="#141413">Container image</text>
  <text x="52" y="318" font-size="12" fill="#6b6a5f">base OS layers + app</text>
  <text x="52" y="360" font-size="13" font-weight="600" fill="#141413">Running pods</text>
  <text x="52" y="378" font-size="12" fill="#6b6a5f">what is serving traffic</text>
  <text x="410" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#8a5a2a">0 known vulnerabilities</text>
  <text x="410" y="198" text-anchor="middle" font-size="12" fill="#8a5a2a">computed from these two rows</text>
  <text x="294" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">1</text>
  <text x="312" y="298" font-size="12.5" font-weight="600" fill="#141413">base image ships an old libssl</text>
  <text x="312" y="316" font-size="12" fill="#6b6a5f">lockfile scans skip OS packages</text>
  <text x="284" y="364" font-size="12" font-style="italic" fill="#8c8a7d">rolled out to every pod</text>
  <text x="582" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">2</text>
  <text x="600" y="150" font-size="12.5" font-weight="600" fill="#141413">new advisory for a pinned version</text>
  <text x="600" y="168" font-size="12" fill="#6b6a5f">nobody changed anything</text>
  <text x="582" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">3</text>
  <text x="600" y="210" font-size="12.5" font-weight="600" fill="#141413">lockfile bumped, image not rebuilt</text>
  <text x="600" y="228" font-size="12" fill="#6b6a5f">the repo now describes something else</text>
  <text x="572" y="304" font-size="12" font-style="italic" fill="#8c8a7d">unchanged &#8212; an image never changes</text>
  <text x="582" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">4</text>
  <text x="600" y="350" font-size="12.5" font-weight="600" fill="#141413">npm install inside a live pod</text>
  <text x="582" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">5</text>
  <text x="600" y="380" font-size="12.5" font-weight="600" fill="#141413">half the pods still run the old image</text>
  <text x="884" y="152" font-size="12.5" font-weight="600" fill="#c2613f">reads today's list</text>
  <text x="884" y="170" font-size="12" fill="#6b6a5f">&#8212; so it sees 2</text>
  <text x="884" y="216" font-size="12" font-style="italic" fill="#8c8a7d">not read: not what runs</text>
  <text x="884" y="300" font-size="12.5" font-weight="600" fill="#c2613f">reads the digests running</text>
  <text x="884" y="318" font-size="12" fill="#6b6a5f">&#8212; sees 1, and 5's old image</text>
  <text x="884" y="356" font-size="12" font-style="italic" fill="#8c8a7d">misses 4: a change made in</text>
  <text x="884" y="374" font-size="12" font-style="italic" fill="#8c8a7d">a live pod is in no image</text>
  <text x="50" y="432" font-size="12" fill="#6b6a5f">what the scan reads</text>
  <text x="206" y="432" font-size="12" fill="#6b6a5f">what actually runs</text>
  <text x="350" y="432" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">1</text>
  <text x="366" y="432" font-size="12" fill="#6b6a5f">where and when it goes stale</text>
  <text x="604" y="432" font-size="12" fill="#6b6a5f">the number printed at build</text>
  <text x="828" y="432" font-size="12" fill="#6b6a5f">what the re-scan reads</text>
  <text x="32" y="476" font-size="12" fill="#6b6a5f">The build printed &#8220;0 known vulnerabilities&#8221; and it was wrong at that very moment: badge 1 sits in a row the scan never read.</text>
  <text x="32" y="496" font-size="12" fill="#6b6a5f">Badges 2&#8211;5 happen later, in three different places &#8212; and badge 2 needs nobody to do anything except wait.</text>
  <text x="32" y="516" font-size="12" fill="#6b6a5f">So the re-scan reads a different pair of rows &#8212; today's advisories and the digests actually running, not the lockfile &#8212; and still misses badge 4.</text>
  <text x="32" y="540" font-size="12" font-style="italic" fill="#8c8a7d">A reading is only as fresh as the rows it was computed from, at the moment it was computed. Draw those rows under the stamp.</text>
</svg>
