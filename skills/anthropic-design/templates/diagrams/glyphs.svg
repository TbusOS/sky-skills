<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" role="img" aria-label="Glyph sheet for engineering diagrams: a comb-toothed rectangle for a bounded in-order queue, a ruler-ticked bar for a serialized byte stream, a row of small vertical bars for pluggable slots, a small dark tab straddling a die boundary for an on-die port, a white card with a dark bezel strip for a pluggable board, two short strokes across a line for an AC coupling capacitor, a small square where a signal crosses a clock-domain boundary for a synchroniser, and a hatched fill for a window onto another address space" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="glDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/>
    </pattern>
    <pattern id="glHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6a9bcc" stroke-width="1.6" opacity="0.35"/>
    </pattern>
    <filter id="glSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
    <marker id="glArrI" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#141413"/>
    </marker>
  </defs>

  <rect width="1240" height="470" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1240" height="470" rx="16" fill="url(#glDots)"/>
  <text x="32" y="36" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">GLYPH SHEET &#183; COPY ONE &#60;g&#62; AT A TIME</text>
  <text x="36" y="80" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-QUEUE</text>
  <text x="170" y="222" text-anchor="middle" font-size="11.5" fill="#6b6a5f">finite depth, in order</text>
  <text x="340" y="80" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-BYTESTREAM</text>
  <text x="474" y="222" text-anchor="middle" font-size="11.5" fill="#6b6a5f">serialized bytes, not addresses</text>
  <text x="644" y="80" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-SLOTS</text>
  <text x="778" y="222" text-anchor="middle" font-size="11.5" fill="#6b6a5f">a place something plugs into</text>
  <text x="948" y="80" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-PORTTAB</text>
  <text x="1082" y="222" text-anchor="middle" font-size="11.5" fill="#6b6a5f">an interface owned by this die</text>
  <text x="36" y="280" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-DEVCARD</text>
  <text x="170" y="422" text-anchor="middle" font-size="11.5" fill="#6b6a5f">pluggable board · model text, no logo</text>
  <text x="340" y="280" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-ACCOUPLING</text>
  <text x="474" y="422" text-anchor="middle" font-size="11.5" fill="#6b6a5f">AC coupling capacitor</text>
  <text x="644" y="280" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-SYNC</text>
  <text x="778" y="422" text-anchor="middle" font-size="11.5" fill="#6b6a5f">clock-domain crossing only</text>
  <text x="948" y="280" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-HATCH</text>
  <text x="1082" y="422" text-anchor="middle" font-size="11.5" fill="#6b6a5f">a window onto another space</text>

  <g id="g-queue">
    <rect x="90" y="123" width="160" height="44" rx="8" fill="#ffffff" stroke="#d8d4c8" filter="url(#glSh)"/>
    <g stroke="#d8d4c8" stroke-width="1">
      <line x1="102" y1="123" x2="102" y2="167"/>
      <line x1="114" y1="123" x2="114" y2="167"/>
      <line x1="126" y1="123" x2="126" y2="167"/>
      <line x1="138" y1="123" x2="138" y2="167"/>
      <line x1="150" y1="123" x2="150" y2="167"/>
      <line x1="162" y1="123" x2="162" y2="167"/>
      <line x1="174" y1="123" x2="174" y2="167"/>
      <line x1="186" y1="123" x2="186" y2="167"/>
      <line x1="198" y1="123" x2="198" y2="167"/>
      <line x1="210" y1="123" x2="210" y2="167"/>
      <line x1="222" y1="123" x2="222" y2="167"/>
      <line x1="234" y1="123" x2="234" y2="167"/>
      <line x1="246" y1="123" x2="246" y2="167"/>
    </g>
    <rect x="90" y="123" width="36" height="44" rx="8" fill="#e8eee1"/>
    <rect x="90" y="123" width="160" height="44" rx="8" fill="none" stroke="#141413" stroke-width="1.4"/>
    <path d="M84,177 L96,177 L90,168 Z" fill="#788c5d"/>
    <text x="90" y="192" text-anchor="middle" font-size="11.5" font-weight="600" fill="#788c5d">out</text>
    <path d="M120,177 L132,177 L126,168 Z" fill="#6a9bcc"/>
    <text x="126" y="192" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6a9bcc">in</text>
  </g>

  <g id="g-bytestream">
    <rect x="374" y="128" width="200" height="30" rx="6" fill="#f5f4ef" stroke="#141413" stroke-width="1.4"/>
    <g stroke="#141413" stroke-width="1.2">
      <line x1="378" y1="158" x2="378" y2="170"/>
      <line x1="386" y1="158" x2="386" y2="165"/>
      <line x1="394" y1="158" x2="394" y2="165"/>
      <line x1="402" y1="158" x2="402" y2="165"/>
      <line x1="410" y1="158" x2="410" y2="170"/>
      <line x1="418" y1="158" x2="418" y2="165"/>
      <line x1="426" y1="158" x2="426" y2="165"/>
      <line x1="434" y1="158" x2="434" y2="165"/>
      <line x1="442" y1="158" x2="442" y2="170"/>
      <line x1="450" y1="158" x2="450" y2="165"/>
      <line x1="458" y1="158" x2="458" y2="165"/>
      <line x1="466" y1="158" x2="466" y2="165"/>
      <line x1="474" y1="158" x2="474" y2="170"/>
      <line x1="482" y1="158" x2="482" y2="165"/>
      <line x1="490" y1="158" x2="490" y2="165"/>
      <line x1="498" y1="158" x2="498" y2="165"/>
      <line x1="506" y1="158" x2="506" y2="170"/>
      <line x1="514" y1="158" x2="514" y2="165"/>
      <line x1="522" y1="158" x2="522" y2="165"/>
      <line x1="530" y1="158" x2="530" y2="165"/>
      <line x1="538" y1="158" x2="538" y2="170"/>
      <line x1="546" y1="158" x2="546" y2="165"/>
      <line x1="554" y1="158" x2="554" y2="165"/>
      <line x1="562" y1="158" x2="562" y2="165"/>
      <line x1="570" y1="158" x2="570" y2="170"/>
    </g>
    <text x="474" y="148" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">TLP header + payload</text>
  </g>

  <g id="g-slots">
    <rect x="737" y="112" width="10" height="56" rx="3" fill="#e2ecf5" stroke="#141413" stroke-width="1.2"/>
    <rect x="755" y="112" width="10" height="56" rx="3" fill="#e2ecf5" stroke="#141413" stroke-width="1.2"/>
    <rect x="773" y="112" width="10" height="56" rx="3" fill="#6a9bcc" stroke="#141413" stroke-width="1.2"/>
    <rect x="791" y="112" width="10" height="56" rx="3" fill="#e2ecf5" stroke="#141413" stroke-width="1.2"/>
    <rect x="809" y="112" width="10" height="56" rx="3" fill="#e2ecf5" stroke="#141413" stroke-width="1.2"/>
    <rect x="708" y="176" width="140" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
    <text x="778" y="191" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">PCIe &#215;16 slots</text>
  </g>

  <g id="g-porttab">
    <rect x="997" y="110" width="170" height="70" rx="10" fill="#ffffff" stroke="#d8d4c8" filter="url(#glSh)"/>
    <text x="1013" y="140" font-size="12.5" font-weight="600" fill="#141413">Host CPU die</text>
    <text x="1013" y="157" font-size="11.5" fill="#6b6a5f">64 core</text>
    <rect x="1157" y="127" width="20" height="44" rx="5" fill="#141413"/>
    <text x="1167" y="149" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff" transform="rotate(-90 1167 149)">IMC</text>
  </g>

  <g id="g-devcard">
    <rect x="95" y="300" width="150" height="90" rx="10" fill="#ffffff" stroke="#d8d4c8" filter="url(#glSh)"/>
    <path d="M95,310 Q95,300 105,300 H235 Q245,300 245,310 V314 H95 Z" fill="#141413"/>
    <circle cx="107" cy="307" r="3" fill="#788c5d"/>
    <text x="110" y="345" font-size="12.5" font-weight="600" fill="#141413">200 GbE NIC</text>
    <text x="110" y="362" font-size="11.5" fill="#6b6a5f">2 &#215; QSFP56</text>
  </g>

  <g id="g-accoupling">
    <path d="M384,345 H564" fill="none" stroke="#141413" stroke-width="1.8"/>
    <line x1="466" y1="333" x2="466" y2="357" stroke="#141413" stroke-width="1.8"/>
    <line x1="482" y1="333" x2="482" y2="357" stroke="#141413" stroke-width="1.8"/>
    <text x="384" y="378" font-size="11.5" font-weight="600" fill="#141413">D+</text>
    <text x="564" y="378" text-anchor="end" font-size="11.5" font-weight="600" fill="#141413">D&#8722;</text>
  </g>

  <g id="g-sync">
    <line x1="778" y1="300" x2="778" y2="392" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M700,345 H852" fill="none" stroke="#141413" stroke-width="1.8" marker-end="url(#glArrI)"/>
    <rect x="769" y="336" width="18" height="18" rx="3" fill="#ffffff" stroke="#141413" stroke-width="1.4"/>
    <text x="778" y="376" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">sync</text>
    <text x="700" y="318" font-size="11.5" font-style="italic" fill="#8c8a7d">clk A</text>
    <text x="856" y="318" text-anchor="end" font-size="11.5" font-style="italic" fill="#8c8a7d">clk B</text>
  </g>

  <g id="g-hatch">
    <rect x="1002" y="318" width="160" height="54" rx="8" fill="#e2ecf5" stroke="#141413" stroke-width="1.4"/>
    <rect x="1002" y="318" width="160" height="54" rx="8" fill="url(#glHatch)"/>
    <text x="1082" y="350" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">BAR0 window</text>
  </g>
</svg>
