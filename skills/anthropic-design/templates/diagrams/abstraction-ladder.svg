<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="Three panels side by side showing the same idea at three levels of abstraction, each one opening the symbol used by the next. The left panel draws two transistors between a supply rail and ground with a shared gate and a shared output node, then closes them into the triangle-and-bubble symbol for an inverter, with a pill stating the cost as two transistors. The middle panel opens that symbol again: two inverters wired output to input in a ring, one wire drawn in orange for a high level and the other in blue for a low level, which is what makes the ring hold a value, then closes into a rounded box labelled one bit that holds, with a pill stating four transistors. The right panel opens that box in turn: the same ring with two access transistors on the sides controlled by a word line, then closes into a box labelled one memory cell, with a pill stating six transistors. A dashed line runs from each closed symbol down to the panel that opens it, and a closing note states that a symbol a reader has never seen opened is a symbol they will not question, and that carrying the transistor count on every symbol keeps the abstraction honest about what it costs" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="abDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
  <marker id="abArr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#a8a496"/></marker></defs>
  <rect width="1120" height="620" rx="16" fill="#faf9f5" stroke="#eceadf"/><rect width="1120" height="620" rx="16" fill="url(#abDot)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">OPEN IT FIRST, THEN CLOSE IT INTO A SYMBOL</text>
  <text x="32" y="58" font-size="11.5" fill="#8c8a7d">each panel opens the symbol the panel before it handed over. a symbol nobody has seen opened is a symbol nobody will question.</text>
  <rect x="36" y="76" width="336" height="452" rx="12" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="60" cy="100" r="10.5" fill="#d97757"/><text x="60" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text>
  <text x="80" y="98" font-size="13" font-weight="600" fill="#141413">two transistors</text>
  <text x="80" y="114" font-size="10.5" fill="#6b6a5f">one pulls up, one pulls down</text>
  <text x="56" y="146" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">WHAT IS INSIDE</text>
  <line x1="56" y1="356" x2="352" y2="356" stroke="#e3e0d4" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="56" y="382" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">THE SYMBOL YOU THEN USE</text>
  <line x1="132" y1="176" x2="264" y2="176" stroke="#d97757" stroke-width="1.6"/>
  <text x="132" y="170" font-size="10.5" font-weight="600" fill="#d97757">supply</text>
  <line x1="196" y1="196" x2="196" y2="224" stroke="#141413" stroke-width="1.6"/>
  <line x1="202" y1="196" x2="202" y2="224" stroke="#141413" stroke-width="1.6"/>
  <line x1="202" y1="196" x2="220" y2="196" stroke="#141413" stroke-width="1.4"/>
  <line x1="202" y1="224" x2="220" y2="224" stroke="#141413" stroke-width="1.4"/>
  <line x1="178" y1="210" x2="196" y2="210" stroke="#141413" stroke-width="1.4"/>
  <circle cx="174" cy="210" r="3.2" fill="none" stroke="#141413" stroke-width="1.4"/>
  <line x1="211" y1="176" x2="211" y2="196" stroke="#141413" stroke-width="1.4"/>
  <line x1="196" y1="274" x2="196" y2="302" stroke="#141413" stroke-width="1.6"/>
  <line x1="202" y1="274" x2="202" y2="302" stroke="#141413" stroke-width="1.6"/>
  <line x1="202" y1="274" x2="220" y2="274" stroke="#141413" stroke-width="1.4"/>
  <line x1="202" y1="302" x2="220" y2="302" stroke="#141413" stroke-width="1.4"/>
  <line x1="178" y1="288" x2="196" y2="288" stroke="#141413" stroke-width="1.4"/>
  <line x1="211" y1="302" x2="211" y2="322" stroke="#141413" stroke-width="1.4"/>
  <line x1="132" y1="322" x2="264" y2="322" stroke="#2f5c8a" stroke-width="1.6"/>
  <text x="132" y="338" font-size="10.5" font-weight="600" fill="#2f5c8a">ground</text>
  <line x1="211" y1="224" x2="211" y2="274" stroke="#141413" stroke-width="1.4"/>
  <line x1="211" y1="249" x2="282" y2="249" stroke="#141413" stroke-width="1.6" marker-end="url(#abArr)"/>
  <text x="286" y="245" font-size="10.5" fill="#6b6a5f">out</text>
  <line x1="176" y1="210" x2="176" y2="288" stroke="#141413" stroke-width="1.4"/>
  <line x1="132" y1="249" x2="176" y2="249" stroke="#141413" stroke-width="1.6"/>
  <text x="108" y="245" font-size="10.5" fill="#6b6a5f">in</text>
  <path d="M164.0 394.4 L202.5 412.0 L164.0 429.6 Z" fill="none" stroke="#141413" stroke-width="2.0" stroke-linejoin="round"/>
  <circle cx="206.5" cy="412.0" r="4.0" fill="none" stroke="#141413" stroke-width="2.0"/>
  <line x1="132" y1="412" x2="164" y2="412" stroke="#141413" stroke-width="1.6"/>
  <line x1="211" y1="412" x2="246" y2="412" stroke="#141413" stroke-width="1.6"/>
  <line x1="186" y1="330" x2="186" y2="390" stroke="#d97757" stroke-width="1.1" stroke-dasharray="4 3"/>
  <rect x="224" y="459" width="128" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="288" y="474" text-anchor="middle" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">2 transistors</text>
  <text x="56" y="500" font-size="11" fill="#6b6a5f">the triangle is not new information &#8212;</text>
  <text x="56" y="515" font-size="11" fill="#6b6a5f">it is the pair above, folded up.</text>
  <rect x="392" y="76" width="336" height="452" rx="12" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="416" cy="100" r="10.5" fill="#d97757"/><text x="416" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
  <text x="436" y="98" font-size="13" font-weight="600" fill="#141413">two of them, in a ring</text>
  <text x="436" y="114" font-size="10.5" fill="#6b6a5f">each one feeds the other</text>
  <text x="412" y="146" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">WHAT IS INSIDE</text>
  <line x1="412" y1="356" x2="708" y2="356" stroke="#e3e0d4" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="412" y="382" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">THE SYMBOL YOU THEN USE</text>
  <path d="M490.0 182.4 L528.5 200.0 L490.0 217.6 Z" fill="none" stroke="#141413" stroke-width="2.0" stroke-linejoin="round"/>
  <circle cx="532.5" cy="200.0" r="4.0" fill="none" stroke="#141413" stroke-width="2.0"/>
  <path d="M586.0 250.4 L624.5 268.0 L586.0 285.6 Z" fill="none" stroke="#141413" stroke-width="2.0" stroke-linejoin="round"/>
  <circle cx="628.5" cy="268.0" r="4.0" fill="none" stroke="#141413" stroke-width="2.0"/>
  <path d="M537 200 H 664 V 268 H 633" fill="none" stroke="#d97757" stroke-width="2"/>
  <path d="M583 268 H 456 V 200 H 487" fill="none" stroke="#2f5c8a" stroke-width="2"/>
  <text x="642" y="188" font-size="10.5" font-weight="600" fill="#d97757">high</text>
  <text x="454" y="292" font-size="10.5" font-weight="600" fill="#2f5c8a">low</text>
  <text x="412" y="330" font-size="11" fill="#6b6a5f">neither one can change without the other</text>
  <text x="412" y="345" font-size="11" fill="#6b6a5f">disagreeing. so it stays.</text>
  <rect x="488" y="396" width="150" height="40" rx="8" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.5"/>
  <text x="563" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">1 bit that holds</text>
  <text x="563" y="429" text-anchor="middle" font-size="10.5" fill="#6b6a5f">no clock, no refresh</text>
  <line x1="563" y1="352" x2="563" y2="392" stroke="#d97757" stroke-width="1.1" stroke-dasharray="4 3"/>
  <rect x="580" y="459" width="128" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="644" y="474" text-anchor="middle" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">4 transistors</text>
  <text x="412" y="500" font-size="11" fill="#6b6a5f">the box is worth 4, not 1. that number is</text>
  <text x="412" y="515" font-size="11" fill="#6b6a5f">the price of the abstraction.</text>
  <rect x="748" y="76" width="336" height="452" rx="12" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="772" cy="100" r="10.5" fill="#d97757"/><text x="772" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3</text>
  <text x="792" y="98" font-size="13" font-weight="600" fill="#141413">a way in and out</text>
  <text x="792" y="114" font-size="10.5" fill="#6b6a5f">two more, opened by a word line</text>
  <text x="768" y="146" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">WHAT IS INSIDE</text>
  <line x1="768" y1="356" x2="1064" y2="356" stroke="#e3e0d4" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="768" y="382" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">THE SYMBOL YOU THEN USE</text>
  <path d="M859.3 193.0 L892.0 208.0 L859.3 223.0 Z" fill="none" stroke="#141413" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="895.4" cy="208.0" r="3.4" fill="none" stroke="#141413" stroke-width="1.8"/>
  <path d="M937.3 247.0 L970.0 262.0 L937.3 277.0 Z" fill="none" stroke="#141413" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="973.4" cy="262.0" r="3.4" fill="none" stroke="#141413" stroke-width="1.8"/>
  <path d="M900 208 H 1004 V 262 H 978" fill="none" stroke="#d97757" stroke-width="1.8"/>
  <path d="M934 262 H 834 V 208 H 856" fill="none" stroke="#2f5c8a" stroke-width="1.8"/>
  <line x1="816" y1="194" x2="816" y2="222" stroke="#5d7045" stroke-width="1.6"/>
  <line x1="822" y1="194" x2="822" y2="222" stroke="#5d7045" stroke-width="1.6"/>
  <line x1="822" y1="194" x2="840" y2="194" stroke="#5d7045" stroke-width="1.4"/>
  <line x1="822" y1="222" x2="840" y2="222" stroke="#5d7045" stroke-width="1.4"/>
  <line x1="798" y1="208" x2="816" y2="208" stroke="#5d7045" stroke-width="1.4"/>
  <line x1="1010" y1="248" x2="1010" y2="276" stroke="#5d7045" stroke-width="1.6"/>
  <line x1="1016" y1="248" x2="1016" y2="276" stroke="#5d7045" stroke-width="1.6"/>
  <line x1="1016" y1="248" x2="1034" y2="248" stroke="#5d7045" stroke-width="1.4"/>
  <line x1="1016" y1="276" x2="1034" y2="276" stroke="#5d7045" stroke-width="1.4"/>
  <line x1="992" y1="262" x2="1010" y2="262" stroke="#5d7045" stroke-width="1.4"/>
  <line x1="788" y1="176" x2="1048" y2="176" stroke="#5d7045" stroke-width="1.8"/>
  <text x="788" y="170" font-size="10.5" font-weight="600" fill="#5d7045">word line &#183; opens both at once</text>
  <line x1="816" y1="176" x2="816" y2="194" stroke="#5d7045" stroke-width="1.4"/>
  <line x1="1010" y1="176" x2="1010" y2="248" stroke="#5d7045" stroke-width="1.4"/>
  <text x="766" y="206" font-size="10" font-weight="600" fill="#8c8a7d">bit line</text>
  <text x="1040" y="260" font-size="10" font-weight="600" fill="#8c8a7d">bit line</text>
  <text x="768" y="330" font-size="11" fill="#6b6a5f">the ring is the same ring. the two new</text>
  <text x="768" y="345" font-size="11" fill="#6b6a5f">transistors only decide when you may look.</text>
  <rect x="844" y="396" width="150" height="40" rx="8" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.5"/>
  <text x="919" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#5d7045">one memory cell</text>
  <text x="919" y="429" text-anchor="middle" font-size="10.5" fill="#6b6a5f">addressable, at last</text>
  <line x1="919" y1="352" x2="919" y2="392" stroke="#d97757" stroke-width="1.1" stroke-dasharray="4 3"/>
  <rect x="936" y="459" width="128" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="1000" y="474" text-anchor="middle" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">6 transistors</text>
  <text x="768" y="500" font-size="11" fill="#6b6a5f">multiply by a few million and you have</text>
  <text x="768" y="515" font-size="11" fill="#6b6a5f">the cache the die photo is mostly made of.</text>
  <line x1="32" y1="546" x2="60" y2="546" stroke="#d97757" stroke-width="2.4"/><text x="68" y="550" font-size="11" fill="#6b6a5f">a wire held high</text>
  <line x1="176" y1="546" x2="204" y2="546" stroke="#2f5c8a" stroke-width="2.4"/><text x="212" y="550" font-size="11" fill="#6b6a5f">a wire held low</text>
  <line x1="316" y1="546" x2="344" y2="546" stroke="#d97757" stroke-width="1.1" stroke-dasharray="4 3"/><text x="352" y="550" font-size="11" fill="#6b6a5f">&#8220;everything above, folded into this&#8221;</text>
  <text x="32" y="578" font-size="11.5" fill="#8c8a7d">a reader who has seen a symbol opened will question it later. a reader who met it already closed will copy it, and will be stuck the first time the variant does not behave.</text>
  <text x="32" y="595" font-size="11.5" fill="#8c8a7d">every symbol carries its transistor count, so the ladder never hides what an abstraction costs &#8212; which is the number that decides whether it is used a million times.</text>
  <rect x="820" y="530" width="260" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M820 537 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="833" cy="545" r="3.6" fill="#ffffff"/>
  <text x="967" y="549" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">Abstraction ladder &#183; open, then close</text>
</svg>
