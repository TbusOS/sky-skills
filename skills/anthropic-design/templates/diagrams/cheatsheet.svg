<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 756" role="img" aria-label="A single reference card that is complete on its own. A heading names it as a chooser for figure types and a line underneath says what it answers. Twelve cards follow in a three by four grid, each pairing a question a reader might arrive with against the kind of figure that answers it: what touches what and how thick goes to a cross-section, what order and what comes apart goes to an exploded view, are these the same thing at different sizes goes to a zoom chain, how was it built goes to a process series, what does it look like in each state goes to a same-coordinate triptych, what is inside this symbol goes to an abstraction ladder, which command do I run goes to a debug map, how far apart are these numbers goes to a logarithmic rule, where did the time go goes to a flame graph, what is optional and what repeats goes to a railroad diagram, what is each conductor goes to a pinout, and what happens as it gets busier goes to a queue curve. A footer strip carries the source, the date and the boundary of the card: it says which figure to draw and not how to draw it. Closing notes state that a card meant to travel has to carry its own title, its own one-line purpose, its own source and date, and its own limits, because the page it came from will not travel with it" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="csDot2" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern></defs>
  <rect width="1120" height="756" rx="16" fill="#faf9f5" stroke="#eceadf"/><rect width="1120" height="756" rx="16" fill="url(#csDot2)"/>
  <rect x="16" y="16" width="1088" height="724" rx="12" fill="none" stroke="#141413" stroke-width="2"/>
  <text x="40" y="62" font-size="26" font-weight="600" letter-spacing="-0.01em" fill="#141413">Which figure answers this?</text>
  <text x="40" y="88" font-size="12.5" fill="#6b6a5f">start from the question the reader arrives with, not from the thing you want to describe. twelve questions, twelve figures.</text>
  <text x="40" y="110" font-size="11" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">A CARD MEANT TO BE SENT ON ITS OWN &#183; NOTHING HERE NEEDS THE PAGE IT CAME FROM</text>
  <line x1="36" y1="124" x2="1084" y2="124" stroke="#e3e0d4" stroke-width="1.2"/>
  <rect x="36" y="142" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="36" y="156" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="54" y="168" font-size="12.5" font-weight="600" fill="#141413">what touches what, and how thick</text>
  <rect x="54" y="178" width="102" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="63" y="192" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">cross-section</text>
  <text x="54" y="212" font-size="10.5" fill="#6b6a5f">a section, with the cut line shown on a plan</text>
  <text x="54" y="227" font-size="10.5" fill="#6b6a5f">view</text>
  <rect x="392" y="142" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="392" y="156" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="410" y="168" font-size="12.5" font-weight="600" fill="#141413">what order, and what comes apart</text>
  <rect x="410" y="178" width="102" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="419" y="192" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">exploded-view</text>
  <text x="410" y="212" font-size="10.5" fill="#6b6a5f">one axis, equal gaps, numbered by assembly</text>
  <rect x="748" y="142" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="748" y="156" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="766" y="168" font-size="12.5" font-weight="600" fill="#141413">are these the same thing, bigger?</text>
  <rect x="766" y="178" width="96" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="775" y="192" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">scale-ladder</text>
  <text x="766" y="212" font-size="10.5" fill="#6b6a5f">two lines per hop and a real dimension on</text>
  <text x="766" y="227" font-size="10.5" fill="#6b6a5f">each</text>
  <rect x="36" y="248" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="36" y="262" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="54" y="274" font-size="12.5" font-weight="600" fill="#141413">how was it built, step by step</text>
  <rect x="54" y="284" width="102" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="63" y="298" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">process-steps</text>
  <text x="54" y="318" font-size="10.5" fill="#6b6a5f">one part drawn N times, only the new bit</text>
  <text x="54" y="333" font-size="10.5" fill="#6b6a5f">coloured</text>
  <rect x="392" y="248" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="392" y="262" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="410" y="274" font-size="12.5" font-weight="600" fill="#141413">what does it look like in each state</text>
  <rect x="410" y="284" width="109" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="419" y="298" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">state-triptych</text>
  <text x="410" y="318" font-size="10.5" fill="#6b6a5f">identical coordinates, only the colour moves</text>
  <rect x="748" y="248" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="748" y="262" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="766" y="274" font-size="12.5" font-weight="600" fill="#141413">what is inside this symbol</text>
  <rect x="766" y="284" width="135" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="775" y="298" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">abstraction-ladder</text>
  <text x="766" y="318" font-size="10.5" fill="#6b6a5f">open it, then fold it, with the cost on the</text>
  <text x="766" y="333" font-size="10.5" fill="#6b6a5f">fold</text>
  <rect x="36" y="354" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="36" y="368" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="54" y="380" font-size="12.5" font-weight="600" fill="#141413">which command do I actually run</text>
  <rect x="54" y="390" width="76" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="63" y="404" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">debug-map</text>
  <text x="54" y="424" font-size="10.5" fill="#6b6a5f">the path pinned under every block, green</text>
  <text x="54" y="439" font-size="10.5" fill="#6b6a5f">reads gold writes</text>
  <rect x="392" y="354" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="392" y="368" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="410" y="380" font-size="12.5" font-weight="600" fill="#141413">how far apart are these numbers</text>
  <rect x="410" y="390" width="115" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="419" y="404" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">magnitude-ruler</text>
  <text x="410" y="424" font-size="10.5" fill="#6b6a5f">a log axis, and a linear strip showing why</text>
  <rect x="748" y="354" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="748" y="368" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="766" y="380" font-size="12.5" font-weight="600" fill="#141413">where did the time go</text>
  <rect x="766" y="390" width="89" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="775" y="404" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">flame-graph</text>
  <text x="766" y="424" font-size="10.5" fill="#6b6a5f">width is share of samples, not a timeline</text>
  <rect x="36" y="460" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="36" y="474" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="54" y="486" font-size="12.5" font-weight="600" fill="#141413">what is optional, what repeats</text>
  <rect x="54" y="496" width="70" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="63" y="510" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">railroad</text>
  <text x="54" y="530" font-size="10.5" fill="#6b6a5f">bypass over, loop under, parallel rows</text>
  <rect x="392" y="460" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="392" y="474" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="410" y="486" font-size="12.5" font-weight="600" fill="#141413">what is each conductor</text>
  <rect x="410" y="496" width="57" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="419" y="510" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">pinout</text>
  <text x="410" y="530" font-size="10.5" fill="#6b6a5f">physical row plus the table, and which face</text>
  <text x="410" y="545" font-size="10.5" fill="#6b6a5f">you are on</text>
  <rect x="748" y="460" width="340" height="92" rx="9" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.2"/>
  <rect x="748" y="474" width="4" height="64" rx="2" fill="#c2613f"/>
  <text x="766" y="486" font-size="12.5" font-weight="600" fill="#141413">what happens as it gets busier</text>
  <rect x="766" y="496" width="109" height="20" rx="10" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="775" y="510" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#141413">queue-pressure</text>
  <text x="766" y="530" font-size="10.5" fill="#6b6a5f">the knee, not a proportion</text>
  <rect x="36" y="572" width="1048" height="56" rx="9" fill="#f7e4dc" stroke="#c2613f" stroke-width="1.4"/>
  <text x="58" y="594" font-size="11.5" font-weight="700" fill="#c2613f">what this card does not do</text>
  <text x="58" y="614" font-size="11.5" fill="#141413">it says which figure to draw. it says nothing about how to draw one &#8212; that is the template library, and each name above is a file in it.</text>
  <text x="1062" y="594" text-anchor="end" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#c2613f">anthropic-design &#183; diagram-craft &#167;15 &#183; 2026-09</text>
  <text x="36" y="654" font-size="11.5" fill="#8c8a7d">a figure that travels needs four things the page normally supplies for it: a title saying what it is, one line saying what it answers, a source with a date, and its own limits. all four are on this card.</text>
  <text x="36" y="671" font-size="11.5" fill="#8c8a7d">the test is simple and worth applying to any figure: screenshot it, send it to somebody who has not read the page, and see whether they can act on it. most of our figures fail that test, and this one is the shape that passes.</text>
  <rect x="820" y="700" width="248" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M820 707 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="833" cy="715" r="3.6" fill="#ffffff"/>
  <text x="960" y="719" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">Cheat sheet &#183; travels alone</text>
</svg>
