  <text x="650" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">4</text>
  <circle cx="848" cy="102" r="10.5" fill="#d97757"/>
  <text x="848" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">5</text>
  <rect x="28" y="74" width="592" height="102" rx="11" fill="none" stroke="#d97757" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="120.1" y="167" width="159.8" height="18" rx="9" fill="#141413"/>
  <text x="200" y="180" text-anchor="middle" font-size="10" fill="#ffffff">GPU &#183; one IP, three parts</text>
  <rect x="195.7" y="195" width="58.7" height="18" rx="9" fill="#141413"/>
  <text x="225" y="208" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">on-chip</text>
  <rect x="381.5" y="195" width="83.0" height="18" rx="9" fill="#141413"/>
  <text x="423" y="208" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">AXI 128-bit</text>
  <rect x="579.5" y="195" width="83.0" height="18" rx="9" fill="#141413"/>
  <text x="621" y="208" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">AXI 128-bit</text>
  <rect x="801.9" y="195" width="34.3" height="18" rx="9" fill="#141413"/>
  <text x="819" y="208" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">DFI</text>
  <rect x="40" y="232" width="214" height="56" rx="8" fill="#e2ecf5" stroke="#c4d5e6" stroke-width="1.4"/>
  <text x="147" y="257" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">CPU cluster</text>
  <text x="147" y="274" text-anchor="middle" font-size="11.5" fill="#6b6a5f">runs the compositor</text>
  <path d="M254 260 L356 260" fill="none" stroke="#6b6a5f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#adpAB)"/>
  <rect x="261.5" y="231" width="77.0" height="18" rx="9" fill="#141413"/>
  <text x="300" y="244" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">APB 32-bit</text>
  <text x="366" y="256" text-anchor="start" font-size="11.5" fill="#6b6a5f">4 bytes per frame, to the register at stop &#9319;.</text>
  <text x="366" y="273" text-anchor="start" font-size="11.5" fill="#8c8a7d">this is the only thing software does. no pixel travels here.</text>
  <path d="M918 162 L918 310 L390 310 L390 344" fill="none" stroke="#d97757" stroke-width="3.4" class="adp-f" marker-end="url(#adpAO)"/>
  <rect x="615.2" y="301" width="113.5" height="18" rx="9" fill="#141413"/>
  <text x="672" y="314" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">8.3 MB per frame</text>
  <path d="M28 330 L1092 330" fill="none" stroke="#141413" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="66.3" y="321" width="107.4" height="18" rx="9" fill="#6f8a58"/>
  <text x="120" y="334" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">off-chip &#183; DRAM</text>
  <rect x="40" y="344" width="250" height="68" fill="#e2ecf5"/>
  <text x="165" y="376" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f5c8a">front buffer</text>
  <text x="165" y="391" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">the display reads this</text>
  <line x1="290" y1="344" x2="290" y2="412" stroke="#141413" stroke-width="1.5"/>
  <rect x="290" y="344" width="250" height="68" fill="#f4d9cd"/>
