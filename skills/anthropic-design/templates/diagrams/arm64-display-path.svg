  <text x="324" y="139" text-anchor="middle" font-size="11.5" fill="#6b6a5f">16 KiB on-chip</text>
  <rect x="436" y="88" width="172" height="74" rx="8" fill="#f0e4d8" stroke="#d9bf94" stroke-width="1.4"/>
  <text x="522" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6a2f">GPU MMU</text>
  <text x="522" y="139" text-anchor="middle" font-size="11.5" fill="#6b6a5f">virtual &#8594; physical</text>
