<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="The full journey of one frame on a phone-class ARM64 system on chip, drawn as ten numbered stops in two rows with the memory between them. The upper row is the write side: the GPU shader cores render into an on-chip tile buffer, the results pass through the GPU's own memory management unit which translates virtual addresses to physical ones, then across the system interconnect on a 128-bit AXI bus, then through the memory controller which arbitrates between all requesters. A thick orange flowing line drops from the memory controller through the silicon boundary and into the back buffer. The memory bar spans the full width and is the only place in the system where a whole frame exists: it is divided into the front buffer the display is currently reading, the back buffer the GPU is currently writing, textures, the GPU's page tables, and other allocations. Below it the read side rises back into the chip: the display controller's fetch DMA issues read requests in scanline order, the blender and timing generator compose the layers and generate the horizontal and vertical sync signals, the MIPI DSI controller packetises the pixels and the D-PHY serialises them onto four lanes, and the signal leaves the chip through a port toward the panel. The CPU cluster sits to one side connected only by a narrow 32-bit APB configuration bus that carries four bytes per frame, and never touches a pixel. Every link is labelled with its bus type, its width and the number of bytes it carries per frame" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
  <style>
    .adp-f { stroke-dasharray: 12 8; animation: adpM 1.15s linear infinite; }
    .adp-f.adp-r { animation-name: adpMR; }
    .adp-f.adp-s { animation-duration: 2.1s; }
    @keyframes adpM  { to { stroke-dashoffset: -40; } }
    @keyframes adpMR { to { stroke-dashoffset:  40; } }
    /* 三条关闭动效的口子,跟 glass 同一套约定 */
    @media (prefers-reduced-motion: reduce) {
      .adp-f { animation: none; stroke-dashoffset: 0; }
    }
    :root[data-motion-freeze] .adp-f,
    html[data-motion-freeze] .adp-f { animation: none; stroke-dashoffset: 0; }
  </style>
    <pattern id="adpD" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <pattern id="adpH" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2f5c8a" stroke-width="1.6" opacity="0.35"/></pattern>
    <marker id="adpAO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker>
    <marker id="adpAB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#2f5c8a"/></marker>
    <marker id="adpAG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#4d5a3c"/></marker>
    <marker id="adpAK" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#141413"/></marker>
    <marker id="adpAD" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#8a6a2f"/></marker>
  </defs>
  <rect width="1120" height="800" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="800" rx="16" fill="url(#adpD)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">ONE FRAME &#183; TEN STOPS ON A PHONE SOC</text>
  <path d="M686 28 L728 28" fill="none" stroke="#d97757" stroke-width="2.8" class="adp-f" marker-end="url(#adpAO)"/>
  <text x="736" y="32" text-anchor="start" font-size="11.5" fill="#6b6a5f">pixels being written</text>
  <path d="M898 28 L940 28" fill="none" stroke="#2f5c8a" stroke-width="2.8" class="adp-f" marker-end="url(#adpAB)"/>
  <text x="948" y="32" text-anchor="start" font-size="11.5" fill="#6b6a5f">pixels being read</text>
  <text x="40" y="58" text-anchor="start" font-size="12.5" font-weight="600" fill="#141413">&#9312;&#8211;&#9316; &#183; THE WRITE SIDE &#183; the GPU renders one frame into memory</text>
  <rect x="40" y="88" width="172" height="74" rx="8" fill="#f4d9cd" stroke="#d97757" stroke-width="1.4"/>
  <text x="126" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">shader cores</text>
  <text x="126" y="139" text-anchor="middle" font-size="11.5" fill="#6b6a5f">they compute pixels</text>
  <rect x="238" y="88" width="172" height="74" rx="8" fill="#f4d9cd" stroke="#d97757" stroke-width="1.4"/>
