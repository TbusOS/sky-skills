  <circle cx="254" cy="102" r="10.5" fill="#d97757"/>
  <text x="254" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
  <path d="M608 125 L634 125" fill="none" stroke="#d97757" stroke-width="2.8" class="adp-f" marker-end="url(#adpAO)"/>
  <circle cx="452" cy="102" r="10.5" fill="#d97757"/>
  <text x="452" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3</text>
  <path d="M806 125 L832 125" fill="none" stroke="#d97757" stroke-width="2.8" class="adp-f" marker-end="url(#adpAO)"/>
