  <text x="415" y="391" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">the GPU writes this</text>
  <line x1="540" y1="344" x2="540" y2="412" stroke="#141413" stroke-width="1.5"/>
  <rect x="540" y="344" width="190" height="68" fill="#eef1e7"/>
  <text x="635" y="376" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4d5a3c">textures</text>
  <text x="635" y="391" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">source art</text>
  <line x1="730" y1="344" x2="730" y2="412" stroke="#141413" stroke-width="1.5"/>
  <rect x="730" y="344" width="160" height="68" fill="#f0e4d8"/>
  <text x="810" y="376" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a6a2f">page tables</text>
  <text x="810" y="391" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">the GPU's</text>
  <line x1="890" y1="344" x2="890" y2="412" stroke="#141413" stroke-width="1.5"/>
  <rect x="890" y="344" width="190" height="68" fill="#f1efe8"/>
  <text x="985" y="383" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b6a5f">other</text>
  <rect x="40" y="344" width="1040" height="68" rx="7" fill="none" stroke="#141413" stroke-width="1.8"/>
  <circle cx="56" cy="378" r="10.5" fill="#d97757"/>
  <text x="56" y="382" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">6</text>
  <text x="560" y="436" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4d5a3c">LPDDR4X &#183; the only place in the system where a whole frame exists</text>
  <path d="M28 470 L1092 470" fill="none" stroke="#141413" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="857.4" y="461" width="89.1" height="18" rx="9" fill="#141413"/>
  <text x="902" y="474" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">back on-chip</text>
  <text x="200" y="494" text-anchor="start" font-size="12.5" font-weight="600" fill="#141413">&#9318;&#8211;&#9321; &#183; THE READ SIDE &#183; the display controller pulls it out again, and never stops</text>
  <path d="M154 412 L154 518" fill="none" stroke="#2f5c8a" stroke-width="3.4" class="adp-f" marker-end="url(#adpAB)"/>
  <rect x="40" y="518" width="214" height="74" rx="8" fill="#e2ecf5" stroke="#c4d5e6" stroke-width="1.4"/>
  <text x="147" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">fetch DMA</text>
  <text x="147" y="569" text-anchor="middle" font-size="11.5" fill="#6b6a5f">reads in scanline order</text>
  <rect x="296" y="518" width="232" height="74" rx="8" fill="#e2ecf5" stroke="#c4d5e6" stroke-width="1.4"/>
  <text x="412" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">blend + timing</text>
  <text x="412" y="569" text-anchor="middle" font-size="11.5" fill="#6b6a5f">composes, makes vsync</text>
  <rect x="570" y="518" width="180" height="74" rx="8" fill="#e2ecf5" stroke="#c4d5e6" stroke-width="1.4"/>
  <text x="660" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">MIPI DSI</text>
  <text x="660" y="569" text-anchor="middle" font-size="11.5" fill="#6b6a5f">packetises</text>
  <rect x="792" y="518" width="170" height="74" rx="8" fill="#f0e4d8" stroke="#d9bf94" stroke-width="1.4"/>
  <text x="877" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6a2f">D-PHY</text>
  <text x="877" y="569" text-anchor="middle" font-size="11.5" fill="#6b6a5f">4 lanes, serial</text>
  <path d="M254 555 L296 555" fill="none" stroke="#2f5c8a" stroke-width="2.8" class="adp-f" marker-end="url(#adpAB)"/>
  <path d="M528 555 L570 555" fill="none" stroke="#2f5c8a" stroke-width="2.8" class="adp-f" marker-end="url(#adpAB)"/>
  <path d="M750 555 L792 555" fill="none" stroke="#2f5c8a" stroke-width="2.8" class="adp-f" marker-end="url(#adpAB)"/>
  <circle cx="56" cy="532" r="10.5" fill="#d97757"/>
  <text x="56" y="536" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">7</text>
  <circle cx="312" cy="532" r="10.5" fill="#d97757"/>
  <text x="312" y="536" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">8</text>
  <circle cx="586" cy="532" r="10.5" fill="#d97757"/>
  <text x="586" y="536" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">9</text>
  <rect x="28" y="504" width="512" height="102" rx="11" fill="none" stroke="#c4d5e6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="85.8" y="597" width="188.5" height="18" rx="9" fill="#141413"/>
  <text x="180" y="610" text-anchor="middle" font-size="10" fill="#ffffff">display controller &#183; VOP / DPU</text>
  <rect x="558" y="504" width="414" height="102" rx="11" fill="none" stroke="#d9bf94" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="614.4" y="597" width="171.2" height="18" rx="9" fill="#141413"/>
  <text x="700" y="610" text-anchor="middle" font-size="10" fill="#ffffff">serial link out of the chip</text>
  <rect x="227.4" y="623" width="95.2" height="18" rx="9" fill="#141413"/>
  <text x="275" y="636" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">16 lines only</text>
  <rect x="510.5" y="623" width="77.0" height="18" rx="9" fill="#141413"/>
  <text x="549" y="636" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">24-bit RGB</text>
  <rect x="741.7" y="623" width="58.7" height="18" rx="9" fill="#141413"/>
  <text x="771" y="636" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">packets</text>
  <path d="M984,534 L1022,534 L1032,555.0 L1022,576 L984,576 Z" fill="#f0e4d8" stroke="#d9bf94" stroke-width="1.4"/>
  <text x="1008" y="559" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a6a2f">&#8594;</text>
  <circle cx="1064" cy="555" r="10.5" fill="#d97757"/>
  <text x="1064" y="559" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">10</text>
  <text x="1064" y="610" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a6a2f">panel</text>
  <text x="40" y="674" text-anchor="start" font-size="12.5" font-weight="600" fill="#141413">the frame never entered the GPU and never entered the display controller. both of them reached into the same DRAM.</text>
  <text x="40" y="702" text-anchor="start" font-size="11.5" fill="#8c8a7d">every box above is a real block with a driver in mainline Linux. the two that hold no frame are the ones people assume do: the GPU,</text>
  <text x="40" y="719" text-anchor="start" font-size="11.5" fill="#8c8a7d">whose tile buffer is 16 KiB, and the display controller, whose line buffer is 16 lines deep (rockchip_drm_vop2.c:500).</text>
  <rect x="40" y="742" width="176" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M40 749 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="53" cy="757" r="3.6" fill="#ffffff"/>
  <text x="141" y="761" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">One frame &#183; ten stops</text>
</svg>
