  <rect x="832" y="88" width="172" height="74" rx="8" fill="#f1efe8" stroke="#d5d2c6" stroke-width="1.4"/>
  <text x="918" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#6b6a5f">memory ctrl</text>
  <text x="918" y="139" text-anchor="middle" font-size="11.5" fill="#6b6a5f">queues + refresh</text>
