<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-label="Three address spaces stacked vertically so the same block of memory can be followed through all of them. The top bar is the process virtual address space, holding code, a mapped buffer and the heap. Below it a translation box marked CPU MMU, page tables in DRAM. The middle bar is the system physical address space, holding DRAM at the left, then a hatched window band marked device window which is a view onto another space rather than storage, then more DRAM and a region of registers. Below it a second translation box marked device MMU with its own page tables. The bottom bar is the device address space, holding the device's own local memory and a hatched window band marked host window which is a view back onto system DRAM. Dashed vertical leaders join the same block of content where it appears in each space, showing that one buffer has three different addresses at once. Boundary values hang outside each bar on black pill labels joined to the boundary they name. The closing lines state that a hatched band never stores anything, that a translation box is where an address changes meaning, and that a pointer is only meaningful together with the space it belongs to" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="asD" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <pattern id="asH" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2f5c8a" stroke-width="1.6" opacity="0.35"/></pattern>
    <marker id="asAO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker>
    <marker id="asAB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#2f5c8a"/></marker>
    <marker id="asAG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#4d5a3c"/></marker>
    <marker id="asAK" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#141413"/></marker>
    <marker id="asAD" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#8a6a2f"/></marker>
  </defs>
  <rect width="1120" height="660" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="660" rx="16" fill="url(#asD)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">ADDRESS SPACES &#183; THE SAME BYTES, THREE DIFFERENT ADDRESSES</text>
  <rect x="40" y="102" width="88" height="64" rx="9" fill="#e2ecf5" stroke="#c4d5e6" stroke-width="1.4"/>
  <text x="84" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">process</text>
  <text x="84" y="149" text-anchor="middle" font-size="11" fill="#6b6a5f">space</text>
  <rect x="40" y="282" width="88" height="64" rx="9" fill="#eef1e7" stroke="#b9c4a4" stroke-width="1.4"/>
  <text x="84" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#4d5a3c">system</text>
  <text x="84" y="329" text-anchor="middle" font-size="11" fill="#6b6a5f">space</text>
  <rect x="40" y="462" width="88" height="64" rx="9" fill="#f0e4d8" stroke="#d9bf94" stroke-width="1.4"/>
  <text x="84" y="492" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6a2f">device</text>
  <text x="84" y="509" text-anchor="middle" font-size="11" fill="#6b6a5f">space</text>
  <rect x="150" y="108" width="210" height="52" fill="#f1efe8"/>
  <text x="255" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b6a5f">.text</text>
  <text x="255" y="147" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">read-only</text>
  <line x1="360" y1="108" x2="360" y2="160" stroke="#141413" stroke-width="1.5"/>
  <rect x="360" y="108" width="250" height="52" fill="#e2ecf5"/>
  <text x="485" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f5c8a">mapped buffer</text>
  <text x="485" y="147" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">the one we follow</text>
  <line x1="610" y1="108" x2="610" y2="160" stroke="#141413" stroke-width="1.5"/>
  <rect x="610" y="108" width="370" height="52" fill="#f1efe8"/>
  <text x="795" y="139" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b6a5f">heap</text>
  <rect x="150" y="108" width="830" height="52" rx="7" fill="none" stroke="#141413" stroke-width="1.8"/>
  <rect x="318.5" y="69" width="83.0" height="18" rx="9" fill="#141413"/>
  <text x="360" y="82" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">0x0055_0000</text>
  <line x1="360" y1="87" x2="360" y2="108" stroke="#6b6a5f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="568.5" y="69" width="83.0" height="18" rx="9" fill="#141413"/>
  <text x="610" y="82" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">0x0055_F000</text>
  <line x1="610" y1="87" x2="610" y2="108" stroke="#6b6a5f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="150" y="288" width="230" height="52" fill="#eef1e7"/>
  <text x="265" y="319" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4d5a3c">DRAM</text>
  <line x1="380" y1="288" x2="380" y2="340" stroke="#141413" stroke-width="1.5"/>
  <rect x="380" y="288" width="200" height="52" fill="#f1efe8"/>
  <text x="480" y="319" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b6a5f"></text>
  <line x1="580" y1="288" x2="580" y2="340" stroke="#141413" stroke-width="1.5"/>
  <rect x="580" y="288" width="250" height="52" fill="#eef1e7"/>
  <text x="705" y="319" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4d5a3c">DRAM</text>
  <line x1="830" y1="288" x2="830" y2="340" stroke="#141413" stroke-width="1.5"/>
  <rect x="830" y="288" width="150" height="52" fill="#f0e4d8"/>
  <text x="905" y="312" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a6a2f">registers</text>
  <text x="905" y="327" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">MMIO</text>
  <rect x="150" y="288" width="830" height="52" rx="7" fill="none" stroke="#141413" stroke-width="1.8"/>
  <rect x="380" y="288" width="200" height="52" fill="url(#asH)"/>
  <rect x="380" y="288" width="200" height="52" fill="none" stroke="#2f5c8a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="480" y="319" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f5c8a">device window</text>
  <rect x="538.5" y="249" width="83.0" height="18" rx="9" fill="#141413"/>
  <text x="580" y="262" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">0x8020_0000</text>
  <line x1="580" y1="267" x2="580" y2="288" stroke="#6b6a5f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="150" y="468" width="300" height="52" fill="#f0e4d8"/>
  <text x="300" y="492" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a6a2f">local memory</text>
  <text x="300" y="507" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">on the device</text>
  <line x1="450" y1="468" x2="450" y2="520" stroke="#141413" stroke-width="1.5"/>
  <rect x="450" y="468" width="260" height="52" fill="#f1efe8"/>
  <text x="580" y="499" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b6a5f"></text>
  <line x1="710" y1="468" x2="710" y2="520" stroke="#141413" stroke-width="1.5"/>
  <rect x="710" y="468" width="270" height="52" fill="#f0e4d8"/>
  <text x="845" y="499" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a6a2f">local memory</text>
  <rect x="150" y="468" width="830" height="52" rx="7" fill="none" stroke="#141413" stroke-width="1.8"/>
  <rect x="408.5" y="429" width="83.0" height="18" rx="9" fill="#141413"/>
  <text x="450" y="442" text-anchor="middle" font-size="10" font-family="'JetBrains Mono', monospace" fill="#ffffff">0x0100_0000</text>
  <line x1="450" y1="447" x2="450" y2="468" stroke="#6b6a5f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="450" y="468" width="260" height="52" fill="url(#asH)"/>
  <rect x="450" y="468" width="260" height="52" fill="none" stroke="#2f5c8a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="580" y="499" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f5c8a">host window</text>
  <rect x="450" y="186" width="230" height="46" rx="8" fill="#f4d9cd" stroke="#d97757" stroke-width="1.4"/>
  <text x="565" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">CPU MMU</text>
  <text x="565" y="223" text-anchor="middle" font-size="11.5" fill="#6b6a5f">page tables in DRAM</text>
  <path d="M565 160 L565 186" fill="none" stroke="#8f4a2f" stroke-width="1.6" marker-end="url(#asAO)"/>
  <path d="M565 232 L565 258" fill="none" stroke="#8f4a2f" stroke-width="1.6" marker-end="url(#asAO)"/>
  <rect x="450" y="366" width="230" height="46" rx="8" fill="#f4d9cd" stroke="#d97757" stroke-width="1.4"/>
  <text x="565" y="386" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">device MMU</text>
  <text x="565" y="403" text-anchor="middle" font-size="11.5" fill="#6b6a5f">its own page tables, also in DRAM</text>
  <path d="M565 340 L565 366" fill="none" stroke="#8f4a2f" stroke-width="1.6" marker-end="url(#asAO)"/>
  <path d="M565 412 L565 438" fill="none" stroke="#8f4a2f" stroke-width="1.6" marker-end="url(#asAO)"/>
  <path d="M400 160 L400 288" fill="none" stroke="#2f5c8a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M400 340 L400 468" fill="none" stroke="#2f5c8a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M580 160 L580 288" fill="none" stroke="#2f5c8a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M580 340 L580 468" fill="none" stroke="#2f5c8a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="400" cy="102" r="10.5" fill="#d97757"/>
  <text x="400" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text>
  <circle cx="480" cy="282" r="10.5" fill="#d97757"/>
  <text x="480" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
  <circle cx="580" cy="462" r="10.5" fill="#d97757"/>
  <text x="580" y="466" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3</text>
  <text x="32" y="560" text-anchor="start" font-size="11.5" fill="#8c8a7d">&#9312; one buffer, seen by the process &#183; &#9313; the same bytes in physical memory &#183; &#9314; and again, under the address the device must use</text>
  <text x="32" y="577" text-anchor="start" font-size="11.5" fill="#8c8a7d">a hatched band stores nothing &#8212; a read there lands in the space below. a translation box is where an address changes meaning.</text>
  <text x="32" y="594" text-anchor="start" font-size="11.5" fill="#8c8a7d">so a pointer alone is never enough: it is only meaningful together with the space it came from.</text>
  <rect x="890" y="566" width="217" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M890 573 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="903" cy="581" r="3.6" fill="#ffffff"/>
  <text x="1012" y="585" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">Address spaces &#183; three views</text>
</svg>
