<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="A call-site locator. Two call chains are drawn as indented white cards inside two tinted groups, and every level carries a file and line number right-aligned in its own column, joined to the card by a row of leader dots like a page number in a table of contents. The upper gold group is the packaging chain: pack_release_archive at build dot sh line 182 calls its own private step copy_manifest at line 141, and the dark card below quotes that step verbatim, a cp of ship_manifest.txt into OUT_DIR, with the filename highlighted in orange. The lower olive group is the verification chain, which never calls the one above: verify_all has no line number to give because it is dispatched by job name, so its slot in the column carries a bracketed note instead of leader dots; it calls check_coverage at verify_all dot sh line 751, which calls list_expected at check_coverage dot sh lines 98 to 103, the focus card in orange. The dark card under it quotes two lines, a shell glob looking for any manifest file and a test that returns 1 when it finds none, with return 1 highlighted. An orange dashed line runs from a capsule reading ship_manifest.txt in the first group, out around the right edge, to an identical capsule in the second: the same file, produced by one chain as a private step and required by the other. Two numbered notes on the right explain that this is the only way the manifest gets there, and that the failure goes towards stopping the build rather than passing silently" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="cslDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/>
    </pattern>
    <filter id="cslCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
    <marker id="cslArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1200" height="620" rx="16" fill="url(#cslDots)"/>

  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">CALL-SITE LOCATOR &#183; WHY THE BUILD STOPS AT ONE LINE</text>
  <text x="1168" y="34" text-anchor="end" font-size="11.5" font-style="italic" fill="#8c8a7d">every level carries a file:line &#183; the deciding line is quoted, never described</text>

  <!-- ═══ group A · packaging ═══ -->
  <rect x="32" y="54" width="828" height="202" rx="12" fill="#f0e4d8" stroke="#e0cdb4"/>
  <rect x="32" y="54" width="4" height="202" rx="2" fill="#c9913f"/>
  <circle cx="54" cy="78" r="4" fill="#c9913f"/>
  <text x="66" y="82" font-size="11.5" font-weight="700" letter-spacing="0.9" fill="#8a5a2a">PACKAGING &#183; THE CHAIN SOMEONE WANTS TO DELETE</text>
  <text x="844" y="82" text-anchor="end" font-size="11.5" font-style="italic" fill="#8c8a7d">runs once, at release time</text>

  <!-- structure rails: grey solid = the call nesting, which is always there -->
  <g fill="none" stroke="#a8a496" stroke-width="1.2">
    <path d="M64,142 V165 Q64,173 72,173 H76"/>
    <path d="M88,196 V204"/>
  </g>

  <rect x="52" y="96" width="200" height="46" rx="9" fill="#ffffff" stroke="#d8d4c8" filter="url(#cslCard)"/>
  <circle cx="66" cy="112" r="3.5" fill="#c9913f"/>
  <text x="76" y="116" font-size="13" font-weight="600" fill="#141413" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">pack_release_archive()</text>
  <text x="66" y="132" font-size="11.5" fill="#6b6a5f">called once, at release time</text>
  <path d="M262,119 H751" stroke="#c9c5b6" stroke-width="1" stroke-dasharray="1.5 5"/>
  <text x="844" y="123" text-anchor="end" font-size="11.5" fill="#4a7bab" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">build.sh:182</text>

  <rect x="76" y="150" width="200" height="46" rx="9" fill="#ffffff" stroke="#d8d4c8" filter="url(#cslCard)"/>
  <circle cx="90" cy="166" r="3.5" fill="#c9913f"/>
  <text x="100" y="170" font-size="13" font-weight="600" fill="#141413" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">copy_manifest()</text>
  <text x="90" y="186" font-size="11.5" fill="#6b6a5f">its own private step</text>
  <path d="M286,173 H751" stroke="#c9c5b6" stroke-width="1" stroke-dasharray="1.5 5"/>
  <text x="844" y="177" text-anchor="end" font-size="11.5" fill="#4a7bab" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">build.sh:141</text>

  <!-- the line itself, quoted -->
  <rect x="76" y="204" width="312" height="40" rx="8" fill="#1f1e1b"/>
  <rect x="154.8" y="219" width="122.4" height="17" rx="3" fill="#d97757" opacity="0.32"/>
  <text x="90" y="229" font-size="12" textLength="280.8" lengthAdjust="spacing" xml:space="preserve" fill="#e8e6dd" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">cp "$SRC/ship_manifest.txt" "$OUT_DIR/"</text>
  <circle cx="80" cy="208" r="9" fill="#d97757"/>
  <text x="80" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">1</text>

  <rect x="404" y="211" width="152" height="26" rx="13" fill="#f7e4dc" stroke="#d97757" stroke-width="1.2"/>
  <text x="480" y="228" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c2613f" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">ship_manifest.txt</text>

  <!-- ═══ group B · verification ═══ -->
  <rect x="32" y="280" width="828" height="280" rx="12" fill="#e5e9dd" stroke="#d3dcc6"/>
  <rect x="32" y="280" width="4" height="280" rx="2" fill="#788c5d"/>
  <circle cx="54" cy="304" r="4" fill="#788c5d"/>
  <text x="66" y="308" font-size="11.5" font-weight="700" letter-spacing="0.9" fill="#5d7045">VERIFICATION &#183; NEVER CALLS THE CHAIN ABOVE</text>
  <text x="844" y="308" text-anchor="end" font-size="11.5" font-style="italic" fill="#8c8a7d">runs after every build</text>

  <g fill="none" stroke="#a8a496" stroke-width="1.2">
    <path d="M64,368 V391 Q64,399 72,399 H76"/>
    <path d="M88,422 V445 Q88,453 96,453 H100"/>
    <path d="M112,476 V484"/>
  </g>

  <rect x="52" y="322" width="200" height="46" rx="9" fill="#ffffff" stroke="#d8d4c8" filter="url(#cslCard)"/>
  <circle cx="66" cy="338" r="3.5" fill="#788c5d"/>
  <text x="76" y="342" font-size="13" font-weight="600" fill="#141413" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">verify_all()</text>
  <text x="66" y="358" font-size="11.5" fill="#6b6a5f">entry point of the gate</text>
  <text x="844" y="349" text-anchor="end" font-size="11.5" font-style="italic" fill="#8c8a7d">[no line &#8212; dispatched by job name]</text>

  <rect x="76" y="376" width="200" height="46" rx="9" fill="#ffffff" stroke="#d8d4c8" filter="url(#cslCard)"/>
  <circle cx="90" cy="392" r="3.5" fill="#788c5d"/>
  <text x="100" y="396" font-size="13" font-weight="600" fill="#141413" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">check_coverage()</text>
  <text x="90" y="412" font-size="11.5" fill="#6b6a5f">one of eleven checks</text>
  <path d="M286,399 H717" stroke="#c9c5b6" stroke-width="1" stroke-dasharray="1.5 5"/>
  <text x="844" y="403" text-anchor="end" font-size="11.5" fill="#4a7bab" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">verify_all.sh:751</text>

  <rect x="100" y="430" width="200" height="46" rx="9" fill="#f7e4dc" stroke="#d97757" stroke-width="1.5" filter="url(#cslCard)"/>
  <circle cx="114" cy="446" r="3.5" fill="#d97757"/>
  <text x="124" y="450" font-size="13" font-weight="600" fill="#141413" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">list_expected()</text>
  <text x="114" y="466" font-size="11.5" fill="#c2613f">the line you came here for</text>
  <path d="M310,453 H668" stroke="#c9c5b6" stroke-width="1" stroke-dasharray="1.5 5"/>
  <text x="844" y="457" text-anchor="end" font-size="11.5" fill="#4a7bab" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">check_coverage.sh:98-103</text>

  <rect x="100" y="484" width="464" height="64" rx="8" fill="#1f1e1b"/>
  <rect x="272.4" y="521" width="57.6" height="17" rx="3" fill="#d97757" opacity="0.32"/>
  <text x="114" y="508" font-size="12" textLength="432" lengthAdjust="spacing" xml:space="preserve" fill="#e8e6dd" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">manifest="$(ls "$dir"/*manifest*.txt 2&gt;/dev/null | head -1)"</text>
  <text x="114" y="531" font-size="12" textLength="216" lengthAdjust="spacing" xml:space="preserve" fill="#e8e6dd" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">[ -n "$manifest" ] || return 1</text>
  <circle cx="104" cy="488" r="9" fill="#d97757"/>
  <text x="104" y="492" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">2</text>

  <rect x="590" y="502" width="152" height="26" rx="13" fill="#f7e4dc" stroke="#d97757" stroke-width="1.2"/>
  <text x="666" y="519" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c2613f" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">ship_manifest.txt</text>

  <!-- the coupling · orange dashed = the one thing this figure is about -->
  <path d="M558,224 H862 Q870,224 870,232 V507 Q870,515 862,515 H746" fill="none" stroke="#d97757"
        stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#cslArrO)"/>

  <!-- ═══ notes ═══ -->
  <circle cx="910" cy="208" r="9" fill="#d97757"/>
  <text x="910" y="212" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">1</text>
  <text x="928" y="212" font-size="13" font-weight="600" fill="#141413">The only way in</text>
  <text x="928" y="232" font-size="11.5" fill="#6b6a5f">Nothing else copies the manifest into</text>
  <text x="928" y="248" font-size="11.5" fill="#6b6a5f">$OUT_DIR. It rides along inside a</text>
  <text x="928" y="264" font-size="11.5" fill="#6b6a5f">packaging step that looks unrelated,</text>
  <text x="928" y="280" font-size="11.5" fill="#6b6a5f">which is why deleting that step for a</text>
  <text x="928" y="296" font-size="11.5" fill="#6b6a5f">debug build looks free of consequence.</text>

  <circle cx="910" cy="488" r="9" fill="#d97757"/>
  <text x="910" y="492" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">2</text>
  <text x="928" y="492" font-size="13" font-weight="600" fill="#141413">Which way it fails</text>
  <text x="928" y="512" font-size="11.5" fill="#6b6a5f">The quoted line matters: <tspan font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5">return 1</tspan></text>
  <text x="928" y="528" font-size="11.5" fill="#6b6a5f">stops the build. Had it been</text>
  <text x="928" y="544" font-size="11.5" fill="#6b6a5f"><tspan font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5">return 0</tspan>, coverage would report</text>
  <text x="928" y="560" font-size="11.5" fill="#6b6a5f">a pass on a package with no manifest</text>
  <text x="928" y="576" font-size="11.5" fill="#6b6a5f">&#8212; the same bug, silent.</text>

  <text x="32" y="592" font-size="11.5" font-style="italic" fill="#8c8a7d">grep finds neither end of the orange line: the two chains share a filename, not a call. That is what makes this class of coupling worth a figure.</text>
</svg>
