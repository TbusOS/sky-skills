<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="One path drawn one cell per segment, with a rule's segments aligned underneath, in two panels. Panel A: the path logs/eu/2026/09/app.gz against the rule logs/*/app.gz, read by two tools. Where the star stops at a slash, it takes only the segment eu, the rule's app.gz lands under 2026 and is outlined in orange as a mismatch, and two path segments are left with no rule segment under them: no match. Where the star crosses slashes, one wide star cell spans eu, 2026 and 09, and app.gz lands on app.gz: match. Panel B: the path services/billing/secrets/key.pem, with a dashed vertical cut between billing and secrets because a sync tool has been pointed at services/billing/ instead of the repository root, so it now sees secrets/key.pem. The two segments left of the cut are greyed. Rule one, **/billing/secrets/**, has its billing segment left of the cut, outlined in orange: it no longer matches, and the key gets synced. Rule two, **/secrets/**, names only segments right of the cut and still matches." font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="sgaDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern></defs>
