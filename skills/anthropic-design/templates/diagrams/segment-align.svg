  <rect width="1120" height="560" rx="16" fill="url(#sgaDot)"/>
  <line x1="32" y1="236" x2="1088" y2="236" stroke="#e3e0d4" stroke-width="1"/>
  <line x1="444" y1="282" x2="444" y2="428" stroke="#141413" stroke-width="1.6" stroke-dasharray="5 4"/>
