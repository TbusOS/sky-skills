  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">SEGMENT ALIGNMENT &#183; WHAT * SWALLOWS, WHAT A CUT LEAVES</text>
  <text x="1088" y="34" text-anchor="end" font-size="12" fill="#6b6a5f">one cell per path segment</text>
  <text x="32" y="66" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">A &#183; ONE RULE, TWO MEANINGS OF *</text>
  <text x="952" y="66" text-anchor="end" font-size="12" fill="#6b6a5f">the rule, in both tools</text>
  <text x="1024" y="67" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">logs/*/app.gz</text>
  <text x="32" y="109" font-size="13" font-weight="600" fill="#141413">path</text>
  <text x="250" y="109" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#141413">logs</text>
  <text x="334" y="109" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#141413">eu</text>
  <text x="418" y="109" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#141413">2026</text>
  <text x="502" y="109" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#141413">09</text>
  <text x="594" y="109" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#141413">app.gz</text>
  <text x="296" y="109" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#8c8a7d">/</text>
  <text x="372" y="109" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#8c8a7d">/</text>
  <text x="464" y="109" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#8c8a7d">/</text>
  <text x="540" y="109" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#8c8a7d">/</text>
  <text x="32" y="149" font-size="13" font-weight="600" fill="#141413">segment glob</text>
  <text x="32" y="166" font-size="12" fill="#6b6a5f">* stops at /</text>
  <text x="250" y="157" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">logs</text>
  <text x="334" y="157" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">*</text>
  <text x="418" y="157" text-anchor="middle" font-size="14" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#c2613f">app.gz</text>
  <text x="754" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">no match</text>
  <text x="820" y="156" font-size="12" fill="#6b6a5f">* took one segment, and app.gz &#8800; 2026</text>
  <text x="32" y="197" font-size="13" font-weight="600" fill="#141413">string glob</text>
  <text x="32" y="214" font-size="12" fill="#6b6a5f">* crosses /</text>
  <text x="250" y="205" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">logs</text>
  <text x="324" y="205" font-size="14" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">*</text>
  <text x="344" y="205" font-size="13" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">= eu/2026/09</text>
  <text x="594" y="205" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">app.gz</text>
  <text x="754" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#5d7045">match</text>
  <text x="820" y="204" font-size="12" fill="#6b6a5f">* took three segments, slashes and all</text>
  <text x="32" y="266" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">B &#183; CUT AT A NEW ROOT</text>
  <text x="1088" y="266" text-anchor="end" font-size="12" fill="#6b6a5f">a sync tool is pointed at services/billing/ instead of the repo root</text>
  <text x="444" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#141413">the cut &#183; the tool's root starts here</text>
  <text x="32" y="313" font-size="13" font-weight="600" fill="#141413">path</text>
  <text x="266" y="313" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#a8a496">services</text>
  <text x="386" y="313" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#a8a496">billing</text>
  <text x="502" y="313" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#141413">secrets</text>
  <text x="618" y="313" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#141413">key.pem</text>
  <text x="328" y="313" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#c8c4b6">/</text>
  <text x="560" y="313" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#8c8a7d">/</text>
  <text x="704" y="306" font-size="12" fill="#6b6a5f">what the tool now sees</text>
  <text x="704" y="324" font-size="13" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#141413">secrets/key.pem</text>
  <text x="32" y="353" font-size="13" font-weight="600" fill="#141413">rule 1</text>
  <text x="32" y="370" font-size="12" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">**/billing/secrets/**</text>
  <text x="266" y="361" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#a8a496">**</text>
  <text x="386" y="361" text-anchor="middle" font-size="14" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#c2613f">billing</text>
  <text x="502" y="361" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">secrets</text>
  <text x="618" y="361" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">**</text>
  <text x="754" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#c2613f">no match</text>
  <text x="820" y="360" font-size="12" font-weight="600" fill="#c2613f">billing is left of the cut &#8594; key.pem syncs</text>
  <text x="32" y="401" font-size="13" font-weight="600" fill="#141413">rule 2</text>
  <text x="32" y="418" font-size="12" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">**/secrets/**</text>
  <text x="324" y="409" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" fill="#a8a496">** &#183; zero segments now</text>
  <text x="502" y="409" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">secrets</text>
  <text x="618" y="409" text-anchor="middle" font-size="14" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">**</text>
  <text x="754" y="408" text-anchor="middle" font-size="12" font-weight="600" fill="#5d7045">match</text>
  <text x="820" y="408" font-size="12" fill="#6b6a5f">nothing left of the cut &#8594; still excluded</text>
  <text x="68" y="482" font-size="12" fill="#6b6a5f">rule segment, literal</text>
  <text x="254" y="482" font-size="12" fill="#6b6a5f">wildcard &#8212; its width is what it swallowed</text>
  <text x="580" y="482" font-size="12" fill="#6b6a5f">the segment that decides the verdict</text>
  <text x="872" y="482" font-size="12" fill="#6b6a5f">left of the cut, gone</text>
  <text x="32" y="516" font-size="12" fill="#6b6a5f">A shared rule is only shared text: test it against a path deeper than you meant. A rule naming a segment above the new root dies without a word.</text>
  <text x="32" y="540" font-size="12" font-style="italic" fill="#8c8a7d">Same segment, same x in every row &#8212; the eye compares columns, never strings. That alignment is the whole drawing.</text>
</svg>
