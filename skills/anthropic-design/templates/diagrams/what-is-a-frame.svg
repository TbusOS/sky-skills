<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-label="An explanation of what one frame is and why it cannot fit inside the chip. On the left, a phone screen is drawn with its dimensions, one thousand and eighty pixels across by two thousand four hundred down, and a magnified corner shows that a single pixel is four bytes, one each for red, green, blue and alpha. Multiplying gives ten million three hundred and sixty-eight thousand bytes, or nine point eight nine mebibytes, for one frame. The right-hand side is the argument: a ruler nine hundred pixels wide represents that one frame, and the three on-chip memories are drawn on the same scale beneath it. The GPU level two cache, five hundred and twelve kibibytes, is forty-five pixels. The display controller's line buffer, sixteen lines of two thousand and forty-eight pixels, is eleven pixels. The GPU tile buffer, sixteen kibibytes, is one and a half pixels wide and is almost invisible. A magnified inset shows the same three enlarged twenty times so they can be read at all. The conclusion is that no on-chip memory is within two orders of magnitude of holding one frame, which is why every frame lives in external DRAM and why both the GPU and the display controller reach out to it rather than holding a frame themselves" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="wafD" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <pattern id="wafH" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2f5c8a" stroke-width="1.6" opacity="0.35"/></pattern>
    <marker id="wafAO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker>
    <marker id="wafAB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#2f5c8a"/></marker>
    <marker id="wafAG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#4d5a3c"/></marker>
    <marker id="wafAK" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#141413"/></marker>
    <marker id="wafAD" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#8a6a2f"/></marker>
  </defs>
  <rect width="1120" height="600" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="600" rx="16" fill="url(#wafD)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">WHAT A FRAME IS &#183; AND WHY IT DOES NOT FIT</text>
  <rect x="32" y="60" width="340" height="366" rx="11" fill="none" stroke="#b9c4a4" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="81.4" y="51" width="217.2" height="18" rx="9" fill="#141413"/>
  <text x="190" y="64" text-anchor="middle" font-size="10" fill="#ffffff">one frame &#183; a full screen of pixels</text>
  <rect x="62" y="100" width="100" height="222" rx="10" fill="#e2ecf5" stroke="#c4d5e6" stroke-width="1.4"/>
  <text x="112" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a"></text>
  <text x="112" y="203" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">1080</text>
  <text x="112" y="221" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">&#215; 2400</text>
  <text x="112" y="241" text-anchor="middle" font-size="11" fill="#6b6a5f">pixels</text>
  <path d="M162 130 L206 106" fill="none" stroke="#6b6a5f" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M162 156 L206 196" fill="none" stroke="#6b6a5f" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="272" y="98" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">one pixel</text>
  <rect x="210" y="110" width="26" height="26" rx="5" fill="#f4d9cd" stroke="#d97757" stroke-width="1.4"/>
  <text x="223" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#8f4a2f">R</text>
  <rect x="240" y="110" width="26" height="26" rx="5" fill="#eef1e7" stroke="#b9c4a4" stroke-width="1.4"/>
  <text x="253" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#4d5a3c">G</text>
  <rect x="270" y="110" width="26" height="26" rx="5" fill="#e2ecf5" stroke="#c4d5e6" stroke-width="1.4"/>
  <text x="283" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">B</text>
  <rect x="300" y="110" width="26" height="26" rx="5" fill="#f1efe8" stroke="#d5d2c6" stroke-width="1.4"/>
  <text x="313" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#6b6a5f">A</text>
  <text x="272" y="154" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">4 bytes</text>
  <text x="272" y="176" text-anchor="middle" font-size="11" fill="#8c8a7d">nothing here is</text>
  <text x="272" y="191" text-anchor="middle" font-size="11" fill="#8c8a7d">compressed</text>
  <text x="202" y="356" text-anchor="middle" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#141413">1080 &#215; 2400 &#215; 4</text>
  <path d="M70 366 L334 366" fill="none" stroke="#141413" stroke-width="1.4"/>
  <text x="202" y="388" text-anchor="middle" font-size="13" font-weight="600" fill="#4d5a3c">= 9.89 MiB, once</text>
  <text x="202" y="410" text-anchor="middle" font-size="11" fill="#6b6a5f">and there are 60 of them every second</text>
  <text x="410" y="76" text-anchor="start" font-size="12.5" font-weight="600" fill="#141413">THE SAME RULER &#183; one frame, then every on-chip memory drawn to that scale</text>
  <rect x="410" y="94" width="660" height="44" rx="8" fill="#eef1e7" stroke="#b9c4a4" stroke-width="1.4"/>
  <text x="740" y="121" text-anchor="middle" font-size="12" font-weight="600" fill="#4d5a3c">one frame &#183; 9.89 MiB</text>
  <text x="410" y="168" text-anchor="start" font-size="11.5" font-weight="600" fill="#141413">GPU L2 cache</text>
  <rect x="410" y="176" width="33.4" height="22" rx="3" fill="#f4d9cd" stroke="#8f4a2f" stroke-width="1.4"/>
  <text x="453.37481481481484" y="192" text-anchor="start" font-size="11" fill="#6b6a5f">512 KiB &#8212; 33 px on this ruler</text>
  <text x="410" y="220" text-anchor="start" font-size="11.5" font-weight="600" fill="#141413">display line buffer</text>
  <rect x="410" y="228" width="8.3" height="22" rx="3" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="428.3437037037037" y="244" text-anchor="start" font-size="11" fill="#6b6a5f">16 lines &#183; 128 KiB &#8212; 8 px on this ruler</text>
  <text x="410" y="272" text-anchor="start" font-size="11.5" font-weight="600" fill="#141413">GPU tile buffer</text>
  <rect x="410" y="280" width="1.4" height="22" rx="3" fill="#f4d9cd" stroke="#8f4a2f" stroke-width="1.4"/>
  <text x="424" y="296" text-anchor="start" font-size="11" fill="#6b6a5f">16 KiB &#8212; 1 px on this ruler</text>
  <path d="M410 328 L1070 328" fill="none" stroke="#6b6a5f" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="410" y="350" text-anchor="start" font-size="11.5" font-weight="600" fill="#141413">the same three, magnified 12&#215; so they can be seen at all</text>
  <rect x="410" y="364" width="400.5" height="20" rx="3" fill="#f4d9cd" stroke="#8f4a2f" stroke-width="1.4"/>
  <text x="820.4977777777777" y="379" text-anchor="start" font-size="11" fill="#6b6a5f">GPU L2 cache</text>
  <rect x="410" y="394" width="100.1" height="20" rx="3" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="520.1244444444444" y="409" text-anchor="start" font-size="11" fill="#6b6a5f">display line buffer</text>
  <rect x="410" y="424" width="12.5" height="20" rx="3" fill="#f4d9cd" stroke="#8f4a2f" stroke-width="1.4"/>
  <text x="432.5155555555556" y="439" text-anchor="start" font-size="11" fill="#6b6a5f">GPU tile buffer</text>
  <text x="40" y="472" text-anchor="start" font-size="12.5" font-weight="600" fill="#141413">no memory inside the chip is within a hundred times of holding one frame. that is the whole reason the rest of this works the way it does.</text>
  <text x="40" y="502" text-anchor="start" font-size="11.5" fill="#8c8a7d">the largest on-chip memory anywhere in the display path is 53 times too small. on-chip SRAM costs tens of times more silicon area</text>
  <text x="40" y="519" text-anchor="start" font-size="11.5" fill="#8c8a7d">per bit than DRAM, so a chip that could hold a frame would be a chip nobody could afford to buy. the line buffer figure is from</text>
  <text x="40" y="536" text-anchor="start" font-size="11.5" fill="#8c8a7d">rockchip_drm_vop2.c:500 &#8212; &#8220;a Cluster window has 2048 x 16 line buffer&#8221;. sixteen lines, not one frame.</text>
  <rect x="40" y="560" width="268" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M40 567 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="53" cy="575" r="3.6" fill="#ffffff"/>
  <text x="187" y="579" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">A frame &#183; 9.89 MiB, nowhere to put it</text>
</svg>
