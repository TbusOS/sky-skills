  <text x="666" y="204" font-size="11" font-weight="700" fill="#d97757">Q</text>
  <text x="454" y="308" font-size="11" font-weight="700" fill="#2f5c8a">QB</text>
  <text x="412" y="378" font-size="11.5" font-weight="600" fill="#141413">the bit lines are driven, and Q flips</text>
  <text x="412" y="396" font-size="11" fill="#6b6a5f">a write is not persuasion &#8212; it is overpowering</text>
  <text x="412" y="411" font-size="11" fill="#6b6a5f">the ring from outside. Q is a one now.</text>
  <rect x="748" y="76" width="336" height="344" rx="12" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <rect x="748" y="76" width="336" height="4" rx="2" fill="#5d7045"/>
  <text x="768" y="106" font-size="14" font-weight="600" fill="#141413">reading</text>
  <text x="768" y="124" font-size="11" fill="#6b6a5f">the cell barely whispers</text>
