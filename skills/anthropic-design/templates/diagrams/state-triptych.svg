  <text x="154" y="450" font-size="11" fill="#6b6a5f">low</text>
  <line x1="202" y1="446" x2="228" y2="446" stroke="#a8a496" stroke-width="2.6" stroke-dasharray="6 4"/>
  <text x="236" y="450" font-size="11" fill="#6b6a5f">nobody is driving it</text>
  <line x1="370" y1="446" x2="396" y2="446" stroke="#5d7045" stroke-width="2.6"/>
  <text x="404" y="450" font-size="11" fill="#6b6a5f">the word line is asserted</text>
  <text x="32" y="482" font-size="11.5" fill="#8c8a7d">a figure redrawn for every state hides which parts moved. a figure recoloured for every state shows it, and the reader stops re-reading the schematic three times.</text>
  <text x="32" y="499" font-size="11.5" fill="#8c8a7d">the colour meanings are fixed once for the whole figure. a legend that changes between panels is worse than no legend at all.</text>
  <text x="32" y="516" font-size="11.5" fill="#8c8a7d">fifty millivolts is a typical order of magnitude for a cell like this, not a measurement &#8212; the point is that it is small, not that it is fifty.</text>
