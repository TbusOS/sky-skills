  <text x="768" y="378" font-size="11.5" font-weight="600" fill="#141413">both bit lines start high; one dips</text>
  <text x="768" y="396" font-size="11" fill="#6b6a5f">QB is the low node, so the QB-side bit line is the</text>
  <text x="768" y="411" font-size="11" fill="#6b6a5f">one that sags. that sag is the entire signal.</text>
  <line x1="32" y1="446" x2="58" y2="446" stroke="#d97757" stroke-width="2.6"/>
  <text x="66" y="450" font-size="11" fill="#6b6a5f">high</text>
