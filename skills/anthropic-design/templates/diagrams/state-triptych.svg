<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="One memory cell drawn three times on identical coordinates, so the only thing that differs between the panels is colour, and the three together read as one story. In the first, holding, the word line is grey dashes because it is not asserted, both access transistors are shut, the bit lines are grey because nobody drives them, and inside the ring the Q node is blue for low while the QB node is orange for high, meaning the cell currently holds a zero. In the second, writing, the word line turns green, the right bit line is driven high and the left one low, and the two ring nodes swap colours, because a write is the drivers overpowering the ring rather than asking it. In the third, reading, the word line is green again, both bit lines start high, the ring still holds what the write left, and the left bit line, the one joined to the low node, is marked as dipping by about fifty millivolts. A note states that a figure redrawn for each state hides which parts moved while a figure recoloured for each state shows it, that the colour meanings are fixed once for the whole figure, and that the fifty millivolts is a typical order of magnitude rather than a measurement" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="stDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
  <marker id="stArr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker></defs>
  <rect width="1120" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/><rect width="1120" height="560" rx="16" fill="url(#stDot)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">THREE STATES, ONE GEOMETRY &#183; ONLY THE COLOUR MOVES</text>
  <text x="32" y="58" font-size="11.5" fill="#8c8a7d">the three panels share every coordinate on purpose, and read left to right as one story: the cell holds a zero, a write turns it into a one, then a read gets that one back out.</text>
