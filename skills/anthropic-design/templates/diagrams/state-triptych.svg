  <text x="98" y="308" font-size="11" font-weight="700" fill="#d97757">QB</text>
  <text x="56" y="378" font-size="11.5" font-weight="600" fill="#141413">the word line is not asserted</text>
  <text x="56" y="396" font-size="11" fill="#6b6a5f">both access transistors are shut. the ring keeps</text>
  <text x="56" y="411" font-size="11" fill="#6b6a5f">itself, and holds a zero at Q.</text>
  <rect x="392" y="76" width="336" height="344" rx="12" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <rect x="392" y="76" width="336" height="4" rx="2" fill="#5d7045"/>
  <text x="412" y="106" font-size="14" font-weight="600" fill="#141413">writing</text>
  <text x="412" y="124" font-size="11" fill="#6b6a5f">the drivers win</text>
