  <rect x="586" y="205" width="124" height="7" fill="#ffffff" stroke="none"/>
  <rect x="586" y="205" width="30" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="636" y="205" width="26" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="682" y="205" width="28" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="642" y="205" width="12" height="34" fill="#ffffff" stroke="#a8a496" stroke-width="1"/>
  <rect x="642" y="205" width="3" height="34" fill="#c9913f"/>
  <rect x="651" y="205" width="3" height="34" fill="#c9913f"/>
  <rect x="616" y="203" width="20" height="11" fill="none" stroke="#d97757" stroke-width="1.6" stroke-dasharray="3 2"/>
  <rect x="662" y="203" width="20" height="11" fill="none" stroke="#d97757" stroke-width="1.6" stroke-dasharray="3 2"/>
  <text x="582" y="272" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">STILL RECOVERABLE?</text>
  <text x="582" y="292" font-size="11.5" font-weight="700" fill="#b5544a">no</text>
  <text x="582" y="310" font-size="10" fill="#6b6a5f">over-etch reads as an open</text>
  <text x="582" y="323" font-size="10" fill="#6b6a5f">circuit, not as a process</text>
  <text x="582" y="336" font-size="10" fill="#6b6a5f">fault</text>
  <rect x="742" y="76" width="164" height="268" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="764" cy="100" r="10" fill="#d97757"/><text x="764" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">5</text>
  <text x="782" y="104" font-size="12" font-weight="600" fill="#141413">build up</text>
  <text x="758" y="128" font-size="10.5" fill="#6b6a5f">one dielectric, one copper</text>
  <rect x="762" y="212" width="124" height="20" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <rect x="762" y="205" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="762" y="232" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="762" y="205" width="124" height="7" fill="#ffffff" stroke="none"/>
  <rect x="762" y="205" width="30" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="812" y="205" width="26" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="858" y="205" width="28" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="818" y="205" width="12" height="34" fill="#ffffff" stroke="#a8a496" stroke-width="1"/>
  <rect x="818" y="205" width="3" height="34" fill="#c9913f"/>
  <rect x="827" y="205" width="3" height="34" fill="#c9913f"/>
  <rect x="762" y="186" width="124" height="19" fill="#e7e4d9" stroke="#a8a496" stroke-width="1.1"/>
  <rect x="762" y="179" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="762" y="179" width="124" height="26" fill="none" stroke="#d97757" stroke-width="1.8"/>
  <text x="758" y="272" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">STILL RECOVERABLE?</text>
  <text x="758" y="292" font-size="11.5" font-weight="700" fill="#b5544a">no</text>
  <text x="758" y="310" font-size="10" fill="#6b6a5f">every added layer</text>
  <text x="758" y="323" font-size="10" fill="#6b6a5f">multiplies the alignment</text>
  <text x="758" y="336" font-size="10" fill="#6b6a5f">risk</text>
  <rect x="918" y="76" width="164" height="268" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="940" cy="100" r="10" fill="#d97757"/><text x="940" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">6</text>
  <text x="958" y="104" font-size="12" font-weight="600" fill="#141413">finish</text>
  <text x="934" y="128" font-size="10.5" fill="#6b6a5f">pads, ready for parts</text>
  <rect x="938" y="212" width="124" height="20" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <rect x="938" y="205" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="938" y="232" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="938" y="205" width="124" height="7" fill="#ffffff" stroke="none"/>
  <rect x="938" y="205" width="30" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="988" y="205" width="26" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="1034" y="205" width="28" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="994" y="205" width="12" height="34" fill="#ffffff" stroke="#a8a496" stroke-width="1"/>
  <rect x="994" y="205" width="3" height="34" fill="#c9913f"/>
  <rect x="1003" y="205" width="3" height="34" fill="#c9913f"/>
  <rect x="938" y="186" width="124" height="19" fill="#e7e4d9" stroke="#a8a496" stroke-width="1.1"/>
  <rect x="938" y="179" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="938" y="179" width="124" height="7" fill="#ffffff" stroke="none"/>
  <rect x="944" y="176" width="32" height="10" rx="2" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="984" y="176" width="32" height="10" rx="2" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="1024" y="176" width="32" height="10" rx="2" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="944" y="176" width="32" height="10" rx="2" fill="none" stroke="#d97757" stroke-width="1.8"/>
  <rect x="984" y="176" width="32" height="10" rx="2" fill="none" stroke="#d97757" stroke-width="1.8"/>
  <rect x="1024" y="176" width="32" height="10" rx="2" fill="none" stroke="#d97757" stroke-width="1.8"/>
  <text x="934" y="272" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">STILL RECOVERABLE?</text>
  <text x="934" y="292" font-size="11.5" font-weight="700" fill="#b5544a">no</text>
  <text x="934" y="310" font-size="10" fill="#6b6a5f">a bad finish is at least</text>
  <text x="934" y="323" font-size="10" fill="#6b6a5f">caught at assembly, cheaply</text>
  <line x1="560" y1="88" x2="560" y2="336" stroke="#b5544a" stroke-width="1.4" stroke-dasharray="7 5"/>
  <rect x="460" y="352" width="200" height="22" rx="11" fill="#fbeae6" stroke="#b5544a" stroke-width="1.2"/>
  <text x="560" y="367" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b5544a">from here on, no way back</text>
  <rect x="32" y="400" width="12" height="12" rx="2" fill="none" stroke="#d97757" stroke-width="1.8"/><text x="52" y="410" font-size="11" fill="#6b6a5f">orange outline &#183; what this step added</text>
  <rect x="286" y="400" width="12" height="12" rx="2" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/><text x="306" y="410" font-size="11" fill="#6b6a5f">copper</text>
  <rect x="382" y="400" width="12" height="12" rx="2" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1"/><text x="402" y="410" font-size="11" fill="#6b6a5f">core laminate</text>
  <rect x="510" y="400" width="12" height="12" rx="2" fill="#e7e4d9" stroke="#a8a496" stroke-width="1"/><text x="530" y="410" font-size="11" fill="#6b6a5f">build-up dielectric</text>
  <text x="32" y="446" font-size="11.5" fill="#8c8a7d">six independent drawings would make the reader re-find the part six times. keeping every coordinate identical is what turns a row of pictures into a process.</text>
  <text x="32" y="463" font-size="11.5" fill="#8c8a7d">outlining only the new feature is the other half: without it the reader has to compare two panels to work out what a step did, and comparing is far slower than looking.</text>
  <text x="32" y="480" font-size="11.5" fill="#8c8a7d">the recoverability line under each panel is what a process diagram usually leaves out, and it is the thing a schedule actually turns on.</text>
  <text x="32" y="497" font-size="11.5" fill="#8c8a7d">this is the common shape of a build-up substrate, drawn to carry the idea. a real line has more steps than six, and its own order.</text>
  <rect x="820" y="512" width="260" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M820 519 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="833" cy="527" r="3.6" fill="#ffffff"/>
  <text x="967" y="531" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">Process steps &#183; one part, six panels</text>
</svg>
