<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" role="img" aria-label="One package substrate drawn six times in a row, always at the same coordinates and always in section, so that each panel differs from the one before it by exactly one manufacturing step and that difference is the only thing outlined in orange. Panel one is the bare core with copper on both faces. Panel two drills a hole straight through it. Panel three plates the hole wall with copper so the two faces are joined. Panel four etches the top copper into separate traces. Panel five adds a build-up dielectric and a second copper layer above it. Panel six finishes the surface into pads. Under each panel a line states whether the part can still be recovered after that step, and a dashed red rule between the third and fourth panels marks where recovery stops being possible. A closing note states that six independent drawings would have forced the reader to re-find the part six times, that keeping every coordinate identical is what turns a row of pictures into a process, and that outlining only the new feature is what makes each step a single glance rather than a comparison" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="psDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern></defs>
  <rect width="1120" height="580" rx="16" fill="#faf9f5" stroke="#eceadf"/><rect width="1120" height="580" rx="16" fill="url(#psDot)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">ONE PART, SIX STEPS &#183; ONLY THE NEW FEATURE IS OUTLINED</text>
  <text x="32" y="58" font-size="11.5" fill="#8c8a7d">every panel is the same section at the same coordinates. what a step added is the only thing outlined in orange, so reading a step costs one glance instead of a comparison.</text>
  <rect x="38" y="76" width="164" height="268" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="60" cy="100" r="10" fill="#d97757"/><text x="60" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text>
  <text x="78" y="104" font-size="12" font-weight="600" fill="#141413">bare core</text>
  <text x="54" y="128" font-size="10.5" fill="#6b6a5f">copper on both faces</text>
  <rect x="58" y="212" width="124" height="20" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <rect x="58" y="205" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="58" y="232" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <text x="54" y="272" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">STILL RECOVERABLE?</text>
  <text x="54" y="292" font-size="11.5" font-weight="700" fill="#5d7045">yes, at panel cost</text>
  <text x="54" y="310" font-size="10" fill="#6b6a5f">scrap costs one sheet of</text>
  <text x="54" y="323" font-size="10" fill="#6b6a5f">laminate</text>
  <rect x="214" y="76" width="164" height="268" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="236" cy="100" r="10" fill="#d97757"/><text x="236" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
  <text x="254" y="104" font-size="12" font-weight="600" fill="#141413">drill</text>
  <text x="230" y="128" font-size="10.5" fill="#6b6a5f">a hole straight through</text>
  <rect x="234" y="212" width="124" height="20" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <rect x="234" y="205" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="234" y="232" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="290" y="205" width="12" height="34" fill="#ffffff" stroke="#a8a496" stroke-width="1"/>
  <rect x="290" y="205" width="12" height="34" fill="#ffffff" stroke="#d97757" stroke-width="1.8"/>
  <text x="230" y="272" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">STILL RECOVERABLE?</text>
  <text x="230" y="292" font-size="11.5" font-weight="700" fill="#5d7045">yes, at panel cost</text>
  <text x="230" y="310" font-size="10" fill="#6b6a5f">a hole in the wrong place</text>
  <text x="230" y="323" font-size="10" fill="#6b6a5f">cannot be moved</text>
  <rect x="390" y="76" width="164" height="268" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="412" cy="100" r="10" fill="#d97757"/><text x="412" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3</text>
  <text x="430" y="104" font-size="12" font-weight="600" fill="#141413">plate the wall</text>
  <text x="406" y="128" font-size="10.5" fill="#6b6a5f">the two faces are joined</text>
  <rect x="410" y="212" width="124" height="20" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <rect x="410" y="205" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="410" y="232" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
  <rect x="466" y="205" width="12" height="34" fill="#ffffff" stroke="#a8a496" stroke-width="1"/>
  <rect x="466" y="205" width="3" height="34" fill="#c9913f"/>
  <rect x="475" y="205" width="3" height="34" fill="#c9913f"/>
  <rect x="466" y="205" width="3" height="34" fill="#d97757"/><rect x="475" y="205" width="3" height="34" fill="#d97757"/>
  <text x="406" y="272" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">STILL RECOVERABLE?</text>
  <text x="406" y="292" font-size="11.5" font-weight="700" fill="#5d7045">yes, at panel cost</text>
  <text x="406" y="310" font-size="10" fill="#6b6a5f">a thin wall shows up much</text>
  <text x="406" y="323" font-size="10" fill="#6b6a5f">later, in the field</text>
  <rect x="566" y="76" width="164" height="268" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="588" cy="100" r="10" fill="#d97757"/><text x="588" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">4</text>
  <text x="606" y="104" font-size="12" font-weight="600" fill="#141413">etch</text>
  <text x="582" y="128" font-size="10.5" fill="#6b6a5f">top copper into traces</text>
  <rect x="586" y="212" width="124" height="20" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <rect x="586" y="205" width="124" height="7" fill="#f0e4d8" stroke="#c9913f" stroke-width="1"/>
