  <path d="M227 176 V 188 H 343 V 196" fill="none" stroke="#a8a496" stroke-width="1.2" marker-end="url(#fgArr)"/>
  <path d="M210 224 V 236 H 140 V 246" fill="none" stroke="#a8a496" stroke-width="1.2" marker-end="url(#fgArr)"/>
  <path d="M210 224 V 236 H 246 V 246" fill="none" stroke="#a8a496" stroke-width="1.2" marker-end="url(#fgArr)"/>
  <path d="M210 224 V 236 H 340 V 246" fill="none" stroke="#a8a496" stroke-width="1.2" marker-end="url(#fgArr)"/>
  <path d="M140 274 V 286 H 134 V 296" fill="none" stroke="#a8a496" stroke-width="1.2" marker-end="url(#fgArr)"/>
  <path d="M246 274 V 286 H 247 V 296" fill="none" stroke="#a8a496" stroke-width="1.2" marker-end="url(#fgArr)"/>
  <path d="M343 224 V 236 H 360 V 296" fill="none" stroke="#a8a496" stroke-width="1.2" marker-end="url(#fgArr)"/>
  <text x="52" y="356" font-size="11" fill="#6b6a5f">every box is as wide as its name happens to be.</text>
  <text x="52" y="372" font-size="11" font-weight="700" fill="#c2613f">that dimension is empty. it costs nothing to fill.</text>
  <text x="52" y="396" font-size="11" fill="#6b6a5f">the graph is not wrong &#8212; it answers &#8220;who calls whom&#8221;.</text>
  <text x="52" y="412" font-size="11" fill="#6b6a5f">it just cannot answer &#8220;where did the time go&#8221;.</text>
  <text x="452" y="98" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">AS A FLAME GRAPH &#183; WIDTH IS SHARE OF SAMPLES</text>
  <rect x="452.0" y="372" width="620.0" height="34" rx="3" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <text x="762.0" y="386" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">main</text>
  <text x="762.0" y="401" text-anchor="middle" font-size="10.5" fill="#2f5c8a">100%</text>
  <rect x="452.0" y="332" width="483.6" height="34" rx="3" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <text x="693.8" y="346" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">handle_request</text>
  <text x="693.8" y="361" text-anchor="middle" font-size="10.5" fill="#2f5c8a">78%</text>
  <rect x="935.6" y="332" width="136.4" height="34" rx="3" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <text x="1003.8" y="346" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">background_flush</text>
  <text x="1003.8" y="361" text-anchor="middle" font-size="10.5" fill="#2f5c8a">22%</text>
  <rect x="452.0" y="292" width="192.2" height="34" rx="3" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.2"/>
  <text x="548.1" y="306" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">parse_json</text>
  <text x="548.1" y="321" text-anchor="middle" font-size="10.5" fill="#8a5a2a">31%</text>
  <rect x="644.2" y="292" width="210.8" height="34" rx="3" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <text x="749.6" y="306" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">db_query</text>
  <text x="749.6" y="321" text-anchor="middle" font-size="10.5" fill="#2f5c8a">34%</text>
  <rect x="855.0" y="292" width="80.6" height="34" rx="3" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <text x="895.3" y="306" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">render</text>
  <text x="895.3" y="321" text-anchor="middle" font-size="10.5" fill="#2f5c8a">13%</text>
  <rect x="935.6" y="292" width="117.8" height="34" rx="3" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.2"/>
  <text x="994.5" y="306" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#5d7045">write</text>
  <text x="994.5" y="321" text-anchor="middle" font-size="10.5" fill="#5d7045">19%</text>
  <rect x="452.0" y="252" width="74.4" height="34" rx="3" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.2"/>
  <text x="489.2" y="266" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">memcpy</text>
  <text x="489.2" y="281" text-anchor="middle" font-size="10.5" fill="#8a5a2a">12%</text>
  <rect x="644.2" y="252" width="173.6" height="34" rx="3" fill="#f7e4dc" stroke="#c2613f" stroke-width="1.8"/>
  <text x="731.0" y="266" text-anchor="middle" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#c2613f">net_recv</text>
  <text x="731.0" y="281" text-anchor="middle" font-size="10.5" fill="#c2613f">28%</text>
  <path d="M731.0 226 V 246" fill="none" stroke="#c2613f" stroke-width="1.8" marker-end="url(#fgArrO)"/>
  <rect x="605.0" y="196" width="252" height="26" rx="13" fill="#f7e4dc" stroke="#c2613f" stroke-width="1.4"/>
  <text x="731.0" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#c2613f">the widest plateau, not the tallest tower</text>
  <line x1="452" y1="420" x2="1072" y2="420" stroke="#141413" stroke-width="1.4"/>
  <line x1="452.0" y1="416" x2="452.0" y2="424" stroke="#141413" stroke-width="1"/>
  <text x="452.0" y="439" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">0%</text>
  <line x1="514.0" y1="416" x2="514.0" y2="424" stroke="#a8a496" stroke-width="1"/>
  <line x1="576.0" y1="416" x2="576.0" y2="424" stroke="#a8a496" stroke-width="1"/>
  <line x1="638.0" y1="416" x2="638.0" y2="424" stroke="#a8a496" stroke-width="1"/>
  <line x1="700.0" y1="416" x2="700.0" y2="424" stroke="#a8a496" stroke-width="1"/>
  <line x1="762.0" y1="416" x2="762.0" y2="424" stroke="#141413" stroke-width="1"/>
  <text x="762.0" y="439" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">50%</text>
  <line x1="824.0" y1="416" x2="824.0" y2="424" stroke="#a8a496" stroke-width="1"/>
  <line x1="886.0" y1="416" x2="886.0" y2="424" stroke="#a8a496" stroke-width="1"/>
  <line x1="948.0" y1="416" x2="948.0" y2="424" stroke="#a8a496" stroke-width="1"/>
  <line x1="1010.0" y1="416" x2="1010.0" y2="424" stroke="#a8a496" stroke-width="1"/>
  <line x1="1072.0" y1="416" x2="1072.0" y2="424" stroke="#141413" stroke-width="1"/>
  <text x="1072.0" y="439" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">100%</text>
  <text x="452" y="460" font-size="11" font-weight="600" fill="#141413">share of samples &#8212; not elapsed time</text>
  <rect x="36" y="490" width="12" height="12" rx="2" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/><text x="56" y="500" font-size="11" fill="#6b6a5f">application code</text>
  <rect x="176" y="490" width="12" height="12" rx="2" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.2"/><text x="196" y="500" font-size="11" fill="#6b6a5f">library</text>
  <rect x="266" y="490" width="12" height="12" rx="2" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.2"/><text x="286" y="500" font-size="11" fill="#6b6a5f">kernel</text>
  <rect x="352" y="490" width="12" height="12" rx="2" fill="#f7e4dc" stroke="#c2613f" stroke-width="1.4"/><text x="372" y="500" font-size="11" fill="#6b6a5f">the one worth acting on</text>
  <text x="32" y="534" font-size="11.5" fill="#8c8a7d">the horizontal axis is share of samples, so neighbouring boxes are not sequential. two boxes side by side did not run one after the other &#8212; they are sorted by name, which keeps the shape stable between runs.</text>
  <text x="32" y="551" font-size="11.5" fill="#8c8a7d">reading a flame graph left to right as a timeline is the single most common way to misread one. the vertical axis is stack depth, not duration.</text>
  <text x="32" y="568" font-size="11.5" fill="#8c8a7d">a tall thin tower is a deep call chain that cost almost nothing, and it is exactly what the eye is drawn to first. a profile with no wide plateau is telling you the cost is spread thin.</text>
  <text x="32" y="585" font-size="11.5" fill="#8c8a7d">colour here groups frames by where the code lives. random colour is the usual convention for this figure type, and it spends a whole dimension on nothing.</text>
  <text x="32" y="602" font-size="11.5" fill="#8c8a7d">the percentages are an illustrative profile, chosen so the arithmetic adds up. the shape is the lesson, not the numbers.</text>
  <rect x="820" y="632" width="260" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M820 639 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="833" cy="647" r="3.6" fill="#ffffff"/>
  <text x="967" y="651" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">Flame graph &#183; width has a unit</text>
</svg>
