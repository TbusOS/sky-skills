<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-label="The same sampled profile drawn twice, so the only difference is whether width means anything. On the left the six functions are drawn as an ordinary call graph, where each box is as wide as its name happens to be and a note points out that this dimension carries no information at all. On the right the same six are drawn as a flame graph: the root spans the full width, each caller sits directly above the callees it spent its samples in, and every box is exactly as wide as its share of the profile. A percentage axis runs underneath. The widest leaf, a kernel receive at twenty-eight per cent, is highlighted in orange and labelled as the thing to act on, with a note that the target is the widest plateau rather than the tallest tower. Colour groups the frames by where the code lives, application in blue, library in gold and kernel in green, rather than being random. Closing notes state that the horizontal axis is share of samples and not elapsed time so neighbouring boxes are not sequential, that the vertical axis is stack depth and not duration, and that a profile with no wide plateau is telling you the cost is spread thin and there is nothing single to fix" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="fgDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
  <marker id="fgArr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#a8a496"/></marker>
  <marker id="fgArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#c2613f"/></marker></defs>
  <rect width="1120" height="690" rx="16" fill="#faf9f5" stroke="#eceadf"/><rect width="1120" height="690" rx="16" fill="url(#fgDot)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">WIDTH WITH A UNIT &#183; THE SAME PROFILE, DRAWN TWICE</text>
  <text x="32" y="58" font-size="11.5" fill="#8c8a7d">a box has two dimensions and most diagrams spend only one of them. here the horizontal one is doing work: it is the share of the profile that frame accounted for.</text>
  <text x="36" y="98" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">AS A CALL GRAPH &#183; WIDTH MEANS NOTHING</text>
  <rect x="36" y="112" width="384" height="316" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <rect x="184" y="150" width="86" height="26" rx="6" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <text x="227" y="167" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">main</text>
  <rect x="144" y="198" width="132" height="26" rx="6" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <text x="210" y="215" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">handle_request</text>
  <rect x="268" y="198" width="150" height="26" rx="6" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <text x="343" y="215" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">background_flush</text>
  <rect x="92" y="248" width="96" height="26" rx="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.2"/>
  <text x="140" y="265" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">parse_json</text>
  <rect x="202" y="248" width="88" height="26" rx="6" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <text x="246" y="265" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">db_query</text>
  <rect x="304" y="248" width="72" height="26" rx="6" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/>
  <text x="340" y="265" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">render</text>
  <rect x="92" y="298" width="84" height="26" rx="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.2"/>
  <text x="134" y="315" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">memcpy</text>
  <rect x="202" y="298" width="90" height="26" rx="6" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.2"/>
  <text x="247" y="315" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#5d7045">net_recv</text>
  <rect x="324" y="298" width="72" height="26" rx="6" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.2"/>
  <text x="360" y="315" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#5d7045">write</text>
