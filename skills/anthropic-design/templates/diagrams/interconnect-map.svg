<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" role="img" aria-label="Two-socket accelerator system: each node holds DDR5, a host CPU die and an accelerator die joined by CXL 3.0, and the two accelerator dies meet at an eight-port fabric switch. Below, two separate physical address spaces — host and device — each carry a hatched window onto the other side, and the CXL.mem mapping line links the host accelerator-HBM window to the device HBM. A CPU core reaches the host window with a plain load or store; an accelerator core reaches host DDR the same way" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="icDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/>
    </pattern>
    <pattern id="icHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6a9bcc" stroke-width="1.6" opacity="0.35"/>
    </pattern>
    <filter id="icSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
    <marker id="icArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/>
    </marker>
    <marker id="icArrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#6a9bcc"/>
    </marker>
    <marker id="icArrG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#788c5d"/>
    </marker>
    <marker id="icArrI" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#141413"/>
    </marker>
    <marker id="icArrN" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#a8a496"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect width="1240" height="620" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1240" height="620" rx="16" fill="url(#icDots)"/>

  <!-- header -->
  <text x="32" y="36" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">MULTI-DIE INTERCONNECT &#183; ADDRESS MAP</text>
  <!-- legend -->
  <g font-size="11.5" fill="#6b6a5f">
    <circle cx="672" cy="32" r="3.5" fill="#788c5d"/><text x="684" y="36">memory</text>
    <circle cx="768" cy="32" r="3.5" fill="#6a9bcc"/><text x="780" y="36">compute / device</text>
    <circle cx="912" cy="32" r="3.5" fill="#c9913f"/><text x="924" y="36">MMIO</text>
    <rect x="984" y="25" width="22" height="14" rx="3" fill="#e2ecf5" stroke="#c4d5e6"/>
    <rect x="984" y="25" width="22" height="14" rx="3" fill="url(#icHatch)"/>
    <text x="1014" y="36">window onto the other space</text>
  </g>

  <!-- ============ layer 1: topology ============ -->

  <!-- node 0 -->
  <rect x="32" y="52" width="580" height="248" rx="12" fill="#e7e4d9" stroke="#cfccc0" stroke-dasharray="4 3"/>
  <circle cx="56" cy="76" r="4" fill="#141413"/>
  <text x="68" y="80" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">NODE 0 &#183; SOCKET</text>
  <text x="596" y="80" text-anchor="end" font-size="11.5" font-style="italic" fill="#8c8a7d">one coherent domain</text>

  <!-- node 1 -->
  <rect x="628" y="52" width="580" height="248" rx="12" fill="#e7e4d9" stroke="#cfccc0" stroke-dasharray="4 3"/>
  <circle cx="652" cy="76" r="4" fill="#141413"/>
  <text x="664" y="80" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">NODE 1 &#183; SOCKET</text>
  <text x="1192" y="80" text-anchor="end" font-size="11.5" font-style="italic" fill="#8c8a7d">one coherent domain</text>

  <!-- links inside the nodes -->
  <line x1="168" y1="132" x2="316" y2="132" stroke="#788c5d" stroke-width="1.2" marker-start="url(#icArrG)" marker-end="url(#icArrG)"/>
  <line x1="764" y1="132" x2="912" y2="132" stroke="#788c5d" stroke-width="1.2" marker-start="url(#icArrG)" marker-end="url(#icArrG)"/>
  <line x1="456" y1="164" x2="456" y2="220" stroke="#6a9bcc" stroke-width="1.2" marker-start="url(#icArrB)" marker-end="url(#icArrB)"/>
  <line x1="1052" y1="164" x2="1052" y2="220" stroke="#6a9bcc" stroke-width="1.2" marker-start="url(#icArrB)" marker-end="url(#icArrB)"/>

  <!-- node dies -->
  <g filter="url(#icSh)">
    <rect x="48" y="100" width="120" height="64" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="316" y="100" width="280" height="64" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="316" y="220" width="280" height="64" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="644" y="100" width="120" height="64" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="912" y="100" width="280" height="64" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
    <rect x="912" y="220" width="280" height="64" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
  </g>
  <circle cx="64" cy="126" r="3.5" fill="#788c5d"/>
  <circle cx="332" cy="126" r="3.5" fill="#141413"/>
  <circle cx="332" cy="246" r="3.5" fill="#6a9bcc"/>
  <circle cx="660" cy="126" r="3.5" fill="#788c5d"/>
  <circle cx="928" cy="126" r="3.5" fill="#141413"/>
  <circle cx="928" cy="246" r="3.5" fill="#6a9bcc"/>
  <g font-size="13" font-weight="600" fill="#141413">
    <text x="76" y="130">DDR5</text>
    <text x="344" y="130">Host CPU die</text>
    <text x="344" y="250">Accelerator die</text>
    <text x="672" y="130">DDR5</text>
    <text x="940" y="130">Host CPU die</text>
    <text x="940" y="250">Accelerator die</text>
  </g>
  <g font-size="11.5" fill="#6b6a5f">
    <text x="76" y="148">512 GB</text>
    <text x="344" y="148">64 core &#183; 2.4 GHz</text>
    <text x="344" y="268">96 GB HBM3 &#183; on-package</text>
    <text x="672" y="148">512 GB</text>
    <text x="940" y="148">64 core &#183; 2.4 GHz</text>
    <text x="940" y="268">96 GB HBM3 &#183; on-package</text>
  </g>

  <!-- link pills inside the nodes -->
  <g>
    <rect x="194" y="121" width="96" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
    <text x="242" y="136" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">DDR5 &#183; 8 ch</text>
    <rect x="790" y="121" width="96" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
    <text x="838" y="136" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">DDR5 &#183; 8 ch</text>
    <rect x="390" y="181" width="132" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
    <text x="456" y="196" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">CXL 3.0 &#183; 64 GB/s</text>
    <rect x="986" y="181" width="132" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
    <text x="1052" y="196" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">CXL 3.0 &#183; 64 GB/s</text>
  </g>

  <!-- node -> fabric switch -->
  <path d="M456,288 V295" fill="none" stroke="#141413" stroke-width="1.2"/>
  <path d="M456,317 V332 Q456,340 464,340 H552 Q560,340 560,348 V360" fill="none" stroke="#141413" stroke-width="1.2" marker-end="url(#icArrI)"/>
  <path d="M1052,288 V295" fill="none" stroke="#141413" stroke-width="1.2"/>
  <path d="M1052,317 V332 Q1052,340 1044,340 H688 Q680,340 680,348 V360" fill="none" stroke="#141413" stroke-width="1.2" marker-end="url(#icArrI)"/>
  <g>
    <rect x="390" y="295" width="132" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
    <text x="456" y="310" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">fabric &#183; 400 GB/s</text>
    <rect x="986" y="295" width="132" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
    <text x="1052" y="310" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">fabric &#183; 400 GB/s</text>
  </g>

  <!-- fabric switch: neutral card, never a saturated band -->
  <g filter="url(#icSh)">
    <rect x="500" y="360" width="240" height="56" rx="10" fill="#ffffff" stroke="#d8d4c8"/>
  </g>
  <circle cx="516" cy="382" r="3.5" fill="#141413"/>
  <text x="528" y="386" font-size="13" font-weight="600" fill="#141413">Fabric switch</text>
  <text x="528" y="404" font-size="11.5" fill="#6b6a5f">8 port &#183; non-blocking</text>

  <!-- ============ layer 3: who can reach it with a plain load/store ============ -->
  <g filter="url(#icSh)">
    <rect x="332" y="444" width="180" height="30" rx="15" fill="#fbeee7" stroke="#d97757" stroke-width="1.5"/>
    <rect x="950" y="444" width="196" height="30" rx="15" fill="#fbeee7" stroke="#d97757" stroke-width="1.5"/>
  </g>
  <text x="422" y="463" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c2613f">CPU core &#183; ld / st</text>
  <text x="1048" y="463" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c2613f">Accel core &#183; ld / st</text>
  <path d="M422,474 V508" fill="none" stroke="#d97757" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#icArrO)"/>
  <path d="M1048,474 V508" fill="none" stroke="#d97757" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#icArrO)"/>

  <!-- ============ layer 2: two address spaces, never merged ============ -->
  <!-- host physical -->
  <rect x="32" y="508" width="300" height="60" fill="#e5e9dd" stroke="#141413" stroke-width="1.5"/>
  <rect x="332" y="508" width="180" height="60" fill="#e2ecf5" stroke="#141413" stroke-width="1.5"/>
  <rect x="332" y="508" width="180" height="60" fill="url(#icHatch)" stroke="#141413" stroke-width="1.5"/>
  <rect x="512" y="508" width="100" height="60" fill="#f0e4d8" stroke="#141413" stroke-width="1.5"/>
  <g font-size="11.5" font-weight="600" fill="#141413" text-anchor="middle">
    <text x="182" y="540">DDR5 &#183; 512 GB</text>
    <text x="422" y="540">ACCEL HBM WINDOW</text>
    <text x="562" y="540">MMIO</text>
  </g>
  <g font-size="11.5" fill="#6b6a5f" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace">
    <text x="182" y="556">0x0000_0000</text>
    <text x="422" y="556">0x80_0000_0000</text>
  </g>
  <rect x="44" y="497" width="228" height="22" rx="11" fill="#141413"/>
  <text x="158" y="512" text-anchor="middle" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#faf9f5">HOST PHYSICAL ADDRESS SPACE</text>

  <!-- device physical -->
  <rect x="628" y="508" width="340" height="60" fill="#e2ecf5" stroke="#141413" stroke-width="1.5"/>
  <rect x="968" y="508" width="160" height="60" fill="#e5e9dd" stroke="#141413" stroke-width="1.5"/>
  <rect x="968" y="508" width="160" height="60" fill="url(#icHatch)" stroke="#141413" stroke-width="1.5"/>
  <rect x="1128" y="508" width="80" height="60" fill="#ffffff" stroke="#141413" stroke-width="1.5"/>
  <g font-size="11.5" font-weight="600" fill="#141413" text-anchor="middle">
    <text x="798" y="540">HBM3 &#183; 96 GB</text>
    <text x="1048" y="540">HOST DDR WINDOW</text>
    <text x="1168" y="540">reserved</text>
  </g>
  <g font-size="11.5" fill="#6b6a5f" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace">
    <text x="798" y="556">0x0000_0000</text>
    <text x="1048" y="556">0x18_0000_0000</text>
  </g>
  <rect x="640" y="497" width="244" height="22" rx="11" fill="#141413"/>
  <text x="762" y="512" text-anchor="middle" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#faf9f5">DEVICE PHYSICAL ADDRESS SPACE</text>

  <!-- one mapping line, two segments, nothing else -->
  <path d="M422,568 V586 Q422,594 430,594 H790 Q798,594 798,586 V568" fill="none" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3" marker-start="url(#icArrN)" marker-end="url(#icArrN)"/>
  <rect x="530" y="583" width="160" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/>
  <text x="610" y="598" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">CXL.mem &#183; HDM decoder</text>
</svg>
