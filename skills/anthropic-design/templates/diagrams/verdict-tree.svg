<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Two variants of a directory tree with verdicts drawn beside each node. Panel A: the same two lines, node_modules and .env, sit in both a .gitignore and a .dockerignore, and a small project tree is judged by both readers in two aligned columns. The root node_modules and the root .env are skipped by both, the source file and the Dockerfile are kept by both, but app/.env and app/node_modules are skipped by git and kept by docker, so those two rows carry a pale orange band: git matches a pattern without a slash at any depth, while docker anchors every pattern at the build context root, and app/.env is a secret sent into the build context. Panel B: a cleanup job's list has the entry /srv/builds/team-a/cache, which is missing. The missing nodes are dashed boxes; an orange dashed arrow walks up from cache past team-a to builds, the first ancestor that exists, outlined in gold. Two questions are asked there: is it a mount point, yes, and is anything else in it, no, it is empty. The verdict is that the disk is not mounted, so nothing is changed; had other projects been there, team-a would really be gone and the entry could be pruned." font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="vtrDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern><marker id="vtrArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker></defs>
  <rect width="1120" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="560" rx="16" fill="url(#vtrDot)"/>
  <line x1="32" y1="154" x2="640" y2="154" stroke="#d8d4c8" stroke-width="1"/>
  <rect x="32" y="300" width="608" height="28" rx="4" fill="#f7e4dc"/>
  <rect x="32" y="328" width="608" height="28" rx="4" fill="#f7e4dc"/>
  <line x1="664" y1="52" x2="664" y2="424" stroke="#e3e0d4" stroke-width="1"/>
  <path d="M712,145 V170 H728" stroke="#a8a496" stroke-width="1.2" fill="none"/>
  <path d="M736,183 V208 H752" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
  <path d="M760,221 V246 H776" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
  <rect x="290" y="80" width="112" height="22" rx="6" fill="#e7e4d9" stroke="#d8d4c8"/>
  <rect x="410" y="80" width="52" height="22" rx="6" fill="#e7e4d9" stroke="#d8d4c8"/>
  <rect x="704" y="119" width="60" height="26" rx="6" fill="#ffffff" stroke="#141413" stroke-width="1.2"/>
  <rect x="728" y="157" width="76" height="26" rx="6" fill="#f0e4d8" stroke="#c9913f" stroke-width="1.8"/>
  <rect x="752" y="195" width="76" height="26" rx="6" fill="none" stroke="#b9b5a8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="776" y="233" width="68" height="26" rx="6" fill="none" stroke="#b9b5a8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M846,246 H852 Q860,246 860,238 V178 Q860,170 852,170 H808" stroke="#d97757" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#vtrArrO)" fill="none"/>
  <circle cx="697" cy="290" r="9" fill="#141413"/>
  <circle cx="697" cy="316" r="9" fill="#141413"/>
  <rect x="688" y="338" width="400" height="30" rx="15" fill="#e5e9dd" stroke="#788c5d"/>
  <rect x="32" y="442" width="28" height="20" rx="4" fill="#f7e4dc"/>
  <rect x="220" y="442" width="28" height="20" rx="5" fill="none" stroke="#b9b5a8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="376" y="442" width="28" height="20" rx="5" fill="#f0e4d8" stroke="#c9913f" stroke-width="1.8"/>
  <path d="M600,452 H632" stroke="#d97757" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#vtrArrO)" fill="none"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">VERDICT TREE &#183; ONE JUDGEMENT, NODE BY NODE</text>
  <text x="1088" y="34" text-anchor="end" font-size="12" fill="#6b6a5f">two variants of one drawing</text>
  <text x="32" y="66" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">A &#183; SAME TWO LINES, TWO READERS</text>
  <text x="32" y="94" font-size="12" fill="#6b6a5f">both .gitignore and .dockerignore say</text>
  <text x="346" y="95" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" fill="#141413">node_modules</text>
  <text x="436" y="95" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" fill="#141413">.env</text>
  <text x="40" y="132" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">PATH</text>
  <text x="484" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5c8a">git</text>
  <text x="484" y="143" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">.gitignore</text>
  <text x="588" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#5d7045">docker build</text>
  <text x="588" y="143" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">.dockerignore</text>
  <text x="40" y="179" font-size="13" font-family="'JetBrains Mono', monospace" fill="#141413">./</text>
  <text x="484" y="178" text-anchor="middle" font-size="12" fill="#8c8a7d">&#8212;</text>
  <text x="588" y="178" text-anchor="middle" font-size="12" fill="#8c8a7d">&#8212;</text>
  <text x="40" y="207" font-size="13" font-family="'JetBrains Mono', monospace" fill="#141413">&#9500;&#9472; node_modules/</text>
  <text x="484" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">skipped</text>
  <text x="588" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#5d7045">skipped</text>
  <text x="40" y="235" font-size="13" font-family="'JetBrains Mono', monospace" fill="#141413">&#9500;&#9472; .env</text>
  <text x="484" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">skipped</text>
  <text x="588" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="#5d7045">skipped</text>
  <text x="40" y="263" font-size="13" font-family="'JetBrains Mono', monospace" fill="#141413">&#9500;&#9472; app/</text>
  <text x="484" y="262" text-anchor="middle" font-size="12" fill="#8c8a7d">kept</text>
  <text x="588" y="262" text-anchor="middle" font-size="12" fill="#8c8a7d">kept</text>
  <text x="40" y="291" font-size="13" font-family="'JetBrains Mono', monospace" fill="#141413">&#9474;  &#9500;&#9472; src/index.js</text>
  <text x="484" y="290" text-anchor="middle" font-size="12" fill="#8c8a7d">kept</text>
  <text x="588" y="290" text-anchor="middle" font-size="12" fill="#8c8a7d">kept</text>
  <text x="40" y="319" font-size="13" font-family="'JetBrains Mono', monospace" fill="#141413">&#9474;  &#9500;&#9472; .env</text>
  <text x="220" y="318" font-size="12" font-weight="600" fill="#c2613f">&#8592; a secret sent into the context</text>
  <text x="484" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">skipped</text>
  <text x="588" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#c2613f">kept</text>
  <text x="40" y="347" font-size="13" font-family="'JetBrains Mono', monospace" fill="#141413">&#9474;  &#9492;&#9472; node_modules/</text>
  <text x="220" y="346" font-size="12" font-weight="600" fill="#c2613f">&#8592; sent in as well</text>
  <text x="484" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">skipped</text>
  <text x="588" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#c2613f">kept</text>
  <text x="40" y="375" font-size="13" font-family="'JetBrains Mono', monospace" fill="#141413">&#9492;&#9472; Dockerfile</text>
  <text x="484" y="374" text-anchor="middle" font-size="12" fill="#8c8a7d">kept</text>
  <text x="588" y="374" text-anchor="middle" font-size="12" fill="#8c8a7d">kept</text>
  <text x="32" y="408" font-size="12" fill="#6b6a5f">git: a pattern with no slash matches at any depth.</text>
  <text x="32" y="426" font-size="12" fill="#6b6a5f">docker: every pattern is anchored at the context root.</text>
  <text x="688" y="66" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">B &#183; WALK UP TO THE FIRST ANCESTOR</text>
  <text x="688" y="94" font-size="12" fill="#6b6a5f">a cleanup job's list holds an entry that is missing</text>
  <text x="734" y="137" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" fill="#141413">/srv/</text>
  <text x="872" y="136" font-size="12" fill="#6b6a5f">exists</text>
  <text x="766" y="175" text-anchor="middle" font-size="13" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">builds/</text>
  <text x="872" y="174" font-size="12" font-weight="600" fill="#8a5a2a">exists &#183; empty</text>
  <text x="790" y="213" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" fill="#8c8a7d">team-a/</text>
  <text x="872" y="212" font-size="12" font-style="italic" fill="#8c8a7d">missing</text>
  <text x="810" y="251" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" fill="#8c8a7d">cache/</text>
  <text x="872" y="250" font-size="12" font-style="italic" fill="#8c8a7d">missing &#183; the entry points here</text>
  <text x="697" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">1</text>
  <text x="714" y="294" font-size="12.5" font-weight="600" fill="#141413">is builds/ a mount point in fstab?</text>
  <text x="1088" y="294" text-anchor="end" font-size="12" fill="#6b6a5f">yes</text>
  <text x="697" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">2</text>
  <text x="714" y="320" font-size="12.5" font-weight="600" fill="#141413">is anything else in it?</text>
  <text x="1088" y="320" text-anchor="end" font-size="12" fill="#6b6a5f">no &#8212; it is empty</text>
  <text x="888" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="#5d7045">the disk is not mounted &#8594; change nothing</text>
  <text x="688" y="392" font-size="12" fill="#6b6a5f">had question 2 found team-b/ and team-c/ there,</text>
  <text x="688" y="410" font-size="12" fill="#6b6a5f">team-a/ would really be gone &#8594; prune the entry</text>
  <text x="68" y="456" font-size="12" fill="#6b6a5f">the readers disagree</text>
  <text x="256" y="456" font-size="12" fill="#6b6a5f">does not exist</text>
  <text x="412" y="456" font-size="12" fill="#6b6a5f">first ancestor that exists</text>
  <text x="644" y="456" font-size="12" fill="#6b6a5f">walk up, one parent at a time</text>
  <text x="32" y="490" font-size="12" fill="#6b6a5f">A &#8212; one rule file stops being one rule: git and docker disagree on exactly two of eight nodes, and one of them sends a secret into the build.</text>
  <text x="32" y="510" font-size="12" fill="#6b6a5f">B &#8212; a missing path means &#8220;gone&#8221; only if its first surviving ancestor still holds its siblings; an empty mount point makes everything below it look gone.</text>
  <text x="32" y="536" font-size="12" font-style="italic" fill="#8c8a7d">Tree in monospace on the left, one verdict column per judge on the right: a disagreement reads as a coloured row, not as a sentence to parse.</text>
</svg>
