<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="One frame's journey through the display pipeline, six hardware lanes over one 60 hertz frame period, with the vertical sync and tearing-effect signals underneath on the same time axis. The compositor commits at the start. The GPU renders the next frame into the back buffer from 0.6 to 9.8 milliseconds. The DDR lane is split into two bars because it serves both at once: the GPU writing the back buffer and the display DMA reading the front buffer, and that contention is why scanout underruns when the GPU is busy. The display DMA scans the front buffer out from zero to sixteen milliseconds, the DSI serialises it line by line across four lanes, and the panel holds frame N for the whole period. Five numbered triggers run as dashed verticals through every lane: one, the vsync interrupt latches the framebuffer address; two, the GPU signals its fence; three, the page flip is queued; four, scanout finishes and raises the frame-done interrupt; five, the next vsync makes the back buffer live. The bracket between two and five is the slack, 6.9 milliseconds, and the figure's point is that if the GPU crosses trigger five the panel simply repeats frame N and the user sees a dropped frame" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="fpDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/>
    </pattern>
    <marker id="fpArr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/>
    </marker>
  </defs>

  <rect width="1120" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="560" rx="16" fill="url(#fpDots)"/>

  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">FRAME PIPELINE &#183; GPU &#8594; DDR &#8594; DMA &#8594; DSI &#8594; PANEL, ONE 60 Hz PERIOD</text>
  <g font-size="12" fill="#6b6a5f">
    <rect x="712" y="24" width="16" height="12" rx="3" fill="#eef1e7" stroke="#b9c4a4"/><text x="736" y="34">front buffer &#183; fb A</text>
    <rect x="866" y="24" width="16" height="12" rx="3" fill="#e2ecf5" stroke="#c4d5e6"/><text x="890" y="34">back buffer &#183; fb B</text>
  </g>

  <!-- lanes -->
  <g>
    <rect x="200" y="96" width="864" height="40" rx="8" fill="#ffffff" stroke="#eceadf"/>
    <text x="188" y="114" text-anchor="end" font-size="13" font-weight="600" fill="#141413">CPU &#183; compositor</text>
    <text x="188" y="130" text-anchor="end" font-size="12" fill="#6b6a5f">builds the atomic commit</text>
    <rect x="200" y="142" width="864" height="40" rx="8" fill="#ffffff" stroke="#eceadf"/>
    <text x="188" y="160" text-anchor="end" font-size="13" font-weight="600" fill="#141413">GPU</text>
    <text x="188" y="176" text-anchor="end" font-size="12" fill="#6b6a5f">renders into the back buffer</text>
    <rect x="200" y="188" width="864" height="40" rx="8" fill="#ffffff" stroke="#eceadf"/>
    <text x="188" y="206" text-anchor="end" font-size="13" font-weight="600" fill="#141413">DDR</text>
    <text x="188" y="222" text-anchor="end" font-size="12" fill="#6b6a5f">serves both at once</text>
    <rect x="200" y="234" width="864" height="40" rx="8" fill="#ffffff" stroke="#eceadf"/>
    <text x="188" y="252" text-anchor="end" font-size="13" font-weight="600" fill="#141413">display DMA &#183; CRTC</text>
    <text x="188" y="268" text-anchor="end" font-size="12" fill="#6b6a5f">scans out, line by line</text>
    <rect x="200" y="280" width="864" height="40" rx="8" fill="#ffffff" stroke="#eceadf"/>
    <text x="188" y="298" text-anchor="end" font-size="13" font-weight="600" fill="#141413">DSI &#183; D-PHY</text>
    <text x="188" y="314" text-anchor="end" font-size="12" fill="#6b6a5f">4 lanes &#183; 1 Gbps each</text>
    <rect x="200" y="326" width="864" height="40" rx="8" fill="#ffffff" stroke="#eceadf"/>
    <text x="188" y="344" text-anchor="end" font-size="13" font-weight="600" fill="#141413">LCD driver IC</text>
    <text x="188" y="360" text-anchor="end" font-size="12" fill="#6b6a5f">holds the pixels on the glass</text>
  </g>

  <!-- trigger verticals (under the bars) -->
  <g>
    <line x1="200.0" y1="86" x2="200.0" y2="452" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="200.0" cy="76" r="10" fill="#d97757"/>
    <text x="200.0" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">1</text>
    <line x1="670.4" y1="86" x2="670.4" y2="452" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="670.4" cy="76" r="10" fill="#d97757"/>
    <text x="670.4" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">2</text>
    <line x1="723.2" y1="86" x2="723.2" y2="452" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="723.2" cy="76" r="10" fill="#d97757"/>
    <text x="723.2" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">3</text>
    <line x1="968.0" y1="86" x2="968.0" y2="452" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="968.0" cy="76" r="10" fill="#d97757"/>
    <text x="968.0" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">4</text>
    <line x1="1000.2" y1="86" x2="1000.2" y2="452" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="1000.2" cy="76" r="10" fill="#d97757"/>
    <text x="1000.2" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">5</text>
  </g>

  <!-- work bars -->
    <rect x="204.8" y="104" width="24.0" height="24" rx="5" fill="#f4d9cd" stroke="#d97757"/>
  <text x="233.6" y="120" font-size="12" fill="#8f4a2f">atomic commit</text>
    <rect x="228.8" y="150" width="441.6" height="24" rx="5" fill="#e2ecf5" stroke="#c4d5e6"/>
    <text x="449.6" y="166" text-anchor="middle" font-size="12" fill="#2f5c8a">render frame N+1 &#8594; fb B</text>
    <rect x="228.8" y="194" width="441.6" height="15" rx="5" fill="#e2ecf5" stroke="#c4d5e6"/>
    <text x="449.6" y="205" text-anchor="middle" font-size="12" fill="#2f5c8a">write fb B</text>
    <rect x="200.0" y="211" width="768.0" height="15" rx="5" fill="#eef1e7" stroke="#b9c4a4"/>
    <text x="584.0" y="222" text-anchor="middle" font-size="12" fill="#4d5a3c">read fb A &#183; every line, all frame long</text>
    <rect x="200.0" y="242" width="768.0" height="24" rx="5" fill="#eef1e7" stroke="#b9c4a4"/>
    <text x="584.0" y="258" text-anchor="middle" font-size="12" fill="#4d5a3c">scanout fb A &#183; 1080 lines</text>
    <rect x="209.6" y="288" width="758.4" height="24" rx="5" fill="#f5f2ea" stroke="#d8d4c8"/>
  <g stroke="#a8a496" stroke-width="1"><line x1="209.6" y1="290" x2="209.6" y2="310"/><line x1="239.4" y1="290" x2="239.4" y2="310"/><line x1="269.1" y1="290" x2="269.1" y2="310"/><line x1="298.9" y1="290" x2="298.9" y2="310"/><line x1="328.6" y1="290" x2="328.6" y2="310"/><line x1="358.4" y1="290" x2="358.4" y2="310"/><line x1="388.2" y1="290" x2="388.2" y2="310"/><line x1="417.9" y1="290" x2="417.9" y2="310"/><line x1="447.7" y1="290" x2="447.7" y2="310"/><line x1="477.4" y1="290" x2="477.4" y2="310"/><line x1="507.2" y1="290" x2="507.2" y2="310"/><line x1="537.0" y1="290" x2="537.0" y2="310"/><line x1="566.7" y1="290" x2="566.7" y2="310"/><line x1="596.5" y1="290" x2="596.5" y2="310"/><line x1="626.2" y1="290" x2="626.2" y2="310"/><line x1="656.0" y1="290" x2="656.0" y2="310"/><line x1="685.8" y1="290" x2="685.8" y2="310"/><line x1="715.5" y1="290" x2="715.5" y2="310"/><line x1="745.3" y1="290" x2="745.3" y2="310"/><line x1="775.0" y1="290" x2="775.0" y2="310"/><line x1="804.8" y1="290" x2="804.8" y2="310"/><line x1="834.6" y1="290" x2="834.6" y2="310"/><line x1="864.3" y1="290" x2="864.3" y2="310"/><line x1="894.1" y1="290" x2="894.1" y2="310"/><line x1="923.8" y1="290" x2="923.8" y2="310"/><line x1="953.6" y1="290" x2="953.6" y2="310"/></g>
  <text x="584.0" y="305" text-anchor="middle" font-size="12" fill="#6b6a5f">one burst per line &#183; HS entry, payload, HS exit</text>
    <rect x="200.0" y="334" width="800.2" height="24" rx="5" fill="#eef1e7" stroke="#b9c4a4"/>
    <text x="600.1" y="350" text-anchor="middle" font-size="12" fill="#4d5a3c">showing frame N</text>
    <rect x="1000.2" y="334" width="63.8" height="24" rx="5" fill="#e2ecf5" stroke="#c4d5e6"/>
    <text x="1032.1" y="350" text-anchor="middle" font-size="12" fill="#2f5c8a">N+1</text>

  <!-- signals -->
  <text x="188" y="400" text-anchor="end" font-size="12" font-weight="600" fill="#141413">VSYNC</text>
  <path d="M200,396 V414 H997.2 M988.2,414 V396 H1012.2 V414 H1064" fill="none" stroke="#d97757" stroke-width="1.8"/>
  <text x="188" y="440" text-anchor="end" font-size="12" font-weight="600" fill="#141413">TE</text>
  <path d="M200,442 H974.6 M965.6,442 V424 H989.6 V442 H1064" fill="none" stroke="#6a9bcc" stroke-width="1.8"/>

  <!-- axis -->
  <line x1="200" y1="456" x2="1064" y2="456" stroke="#141413" stroke-width="1.4"/>
  <g stroke="#141413" stroke-width="1.2"><line x1="200.0" y1="452" x2="200.0" y2="460"/><line x1="296.0" y1="452" x2="296.0" y2="460"/><line x1="392.0" y1="452" x2="392.0" y2="460"/><line x1="488.0" y1="452" x2="488.0" y2="460"/><line x1="584.0" y1="452" x2="584.0" y2="460"/><line x1="680.0" y1="452" x2="680.0" y2="460"/><line x1="776.0" y1="452" x2="776.0" y2="460"/><line x1="872.0" y1="452" x2="872.0" y2="460"/><line x1="968.0" y1="452" x2="968.0" y2="460"/><line x1="1064.0" y1="452" x2="1064.0" y2="460"/></g>
  <g>
    <text x="200.0" y="478" text-anchor="middle" font-size="12" fill="#6b6a5f">0</text>
    <text x="296.0" y="478" text-anchor="middle" font-size="12" fill="#6b6a5f">2</text>
    <text x="392.0" y="478" text-anchor="middle" font-size="12" fill="#6b6a5f">4</text>
    <text x="488.0" y="478" text-anchor="middle" font-size="12" fill="#6b6a5f">6</text>
    <text x="584.0" y="478" text-anchor="middle" font-size="12" fill="#6b6a5f">8</text>
    <text x="680.0" y="478" text-anchor="middle" font-size="12" fill="#6b6a5f">10</text>
    <text x="776.0" y="478" text-anchor="middle" font-size="12" fill="#6b6a5f">12</text>
    <text x="872.0" y="478" text-anchor="middle" font-size="12" fill="#6b6a5f">14</text>
    <text x="968.0" y="478" text-anchor="middle" font-size="12" fill="#6b6a5f">16</text>
    <text x="1064.0" y="478" text-anchor="middle" font-size="12" fill="#6b6a5f">18</text>
  </g>
  <text x="188" y="478" text-anchor="end" font-size="12" fill="#6b6a5f">ms</text>

  <!-- the slack that decides whether the frame lands -->
  <g stroke="#c9913f" stroke-width="2">
    <line x1="670.4" y1="500" x2="1000.2" y2="500"/>
    <line x1="670.4" y1="495" x2="670.4" y2="505"/>
    <line x1="1000.2" y1="495" x2="1000.2" y2="505"/>
  </g>
  <text x="835.3" y="518" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6a2f">slack 6.9 ms &#183; cross &#9315; and the panel repeats frame N</text>

  <text x="32" y="518" font-size="12" fill="#6b6a5f">&#9312; vsync IRQ latches the framebuffer address &#183; &#9313; GPU signals its fence &#183; &#9314; page flip queued</text>
  <text x="32" y="536" font-size="12" fill="#6b6a5f">&#9315; scanout done, frame-done IRQ &#183; &#9316; next vsync, fb B goes live</text>
  <text x="1064" y="536" text-anchor="end" font-size="12" font-style="italic" fill="#8c8a7d">the deadline is a vsync edge, not a config value</text>
</svg>
