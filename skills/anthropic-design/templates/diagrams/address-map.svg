<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" role="img" aria-label="Two vertical address maps side by side, low addresses at the bottom. On the left the system physical address space: low DRAM up to TOLUD at 3 GiB, then a hatched MMIO hole up to 4 GiB, then DRAM again from 4 to 16 GiB, then a reclaimed DRAM window from REMAPBASE to TOUUD, then 64-bit PCIe MMIO on top. On the right the DIMM physical space, contiguous from zero to 16 GiB. Every boundary carries a leader line to a label: symbol names in ink pills, literal constants in orange mono pills. Two grey dashed mapping lines mark direct mappings; one orange line shows the gigabyte of DRAM shadowed by the MMIO hole reappearing above TOUUD" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="amDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/>
    </pattern>
    <pattern id="amHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6a9bcc" stroke-width="1.6" opacity="0.35"/>
    </pattern>
    <clipPath id="amClipA"><rect x="232" y="68" width="328" height="458" rx="12"/></clipPath>
    <clipPath id="amClipB"><rect x="800" y="214" width="328" height="312" rx="12"/></clipPath>
    <marker id="amArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/>
    </marker>
    <marker id="amArrN" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#a8a496"/>
    </marker>
  </defs>

  <rect width="1240" height="600" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1240" height="600" rx="16" fill="url(#amDots)"/>

  <text x="32" y="36" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">ADDRESS MAP &#183; TWO VIEWPOINTS</text>
  <g font-size="11.5" fill="#6b6a5f">
    <rect x="596" y="25" width="22" height="14" rx="3" fill="#e2ecf5" stroke="#c4d5e6"/>
    <rect x="596" y="25" width="22" height="14" rx="3" fill="url(#amHatch)"/>
    <text x="626" y="36">not DRAM</text>
    <line x1="736" y1="32" x2="762" y2="32" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="770" y="36">direct mapping</text>
    <line x1="890" y1="32" x2="916" y2="32" stroke="#d97757" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="924" y="36">reclaim &#183; this remap</text>
  </g>

  <!-- ============ band A: system physical ============ -->
  <g clip-path="url(#amClipA)">
    <rect x="232" y="68"  width="328" height="84"  fill="#e2ecf5"/>
    <rect x="232" y="68"  width="328" height="84"  fill="url(#amHatch)"/>
    <rect x="232" y="152" width="328" height="62"  fill="#e8eee1"/>
    <rect x="232" y="214" width="328" height="130" fill="#e8eee1"/>
    <rect x="232" y="344" width="328" height="62"  fill="#e2ecf5"/>
    <rect x="232" y="344" width="328" height="62"  fill="url(#amHatch)"/>
    <rect x="232" y="406" width="328" height="120" fill="#e8eee1"/>
    <g stroke="#141413" stroke-width="1" stroke-dasharray="5 4">
      <line x1="232" y1="152" x2="560" y2="152"/>
      <line x1="232" y1="214" x2="560" y2="214"/>
      <line x1="232" y1="344" x2="560" y2="344"/>
      <line x1="232" y1="406" x2="560" y2="406"/>
    </g>
  </g>
  <rect x="232" y="68" width="328" height="458" rx="12" fill="none" stroke="#141413" stroke-width="1.6"/>
  <rect x="232" y="152" width="328" height="62" fill="none" stroke="#d97757" stroke-width="1.6"/>

  <g font-size="12.5" font-weight="600" fill="#141413">
    <text x="248" y="104">PCIe MMIO &#183; 64-bit</text>
    <text x="248" y="179">DRAM &#183; reclaimed</text>
    <text x="248" y="274">DRAM &#183; direct</text>
    <text x="248" y="370">MMIO hole</text>
    <text x="248" y="460">DRAM &#183; direct</text>
  </g>
  <g font-size="11.5" fill="#6b6a5f">
    <text x="248" y="121">BAR windows of every device</text>
    <text x="248" y="196">the gigabyte that was shadowed</text>
    <text x="248" y="291">12 GiB</text>
    <text x="248" y="387">PCI &#183; LAPIC &#183; IOAPIC &#183; flash</text>
    <text x="248" y="477">3 GiB, legacy region at the bottom</text>
  </g>

  <!-- ============ band B: DIMM physical ============ -->
  <g clip-path="url(#amClipB)">
    <rect x="800" y="214" width="328" height="130" fill="#e8eee1"/>
    <rect x="800" y="344" width="328" height="62"  fill="#e8eee1"/>
    <rect x="800" y="406" width="328" height="120" fill="#e8eee1"/>
    <g stroke="#141413" stroke-width="1" stroke-dasharray="5 4">
      <line x1="800" y1="344" x2="1128" y2="344"/>
      <line x1="800" y1="406" x2="1128" y2="406"/>
    </g>
  </g>
  <rect x="800" y="214" width="328" height="312" rx="12" fill="none" stroke="#141413" stroke-width="1.6"/>
  <rect x="800" y="344" width="328" height="62" fill="none" stroke="#d97757" stroke-width="1.6"/>

  <g font-size="12.5" font-weight="600" fill="#141413">
    <text x="816" y="274">DRAM 4 &#8211; 16 GiB</text>
    <text x="816" y="371">DRAM 3 &#8211; 4 GiB</text>
    <text x="816" y="460">DRAM 0 &#8211; 3 GiB</text>
  </g>
  <g font-size="11.5" fill="#6b6a5f">
    <text x="816" y="291">reachable at its own address</text>
    <text x="816" y="388">shadowed by the hole &#8212; needs a remap</text>
    <text x="816" y="477">reachable at its own address</text>
  </g>

  <!-- band chips -->
  <g font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#ffffff">
    <rect x="248" y="57" width="212" height="22" rx="11" fill="#141413"/>
    <text x="354" y="72" text-anchor="middle">SYSTEM PHYSICAL</text>
    <rect x="816" y="203" width="248" height="22" rx="11" fill="#141413"/>
    <text x="940" y="218" text-anchor="middle">DIMM PHYSICAL &#183; 16 GiB</text>
  </g>

  <!-- ============ boundary leaders, left column ============ -->
  <g stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="206" y1="68"  x2="232" y2="68"/>
    <line x1="206" y1="152" x2="232" y2="152"/>
    <line x1="206" y1="214" x2="232" y2="214"/>
    <line x1="206" y1="344" x2="232" y2="344"/>
    <line x1="206" y1="406" x2="232" y2="406"/>
    <line x1="206" y1="526" x2="232" y2="526"/>
  </g>
  <!-- symbol-name pills: ink -->
  <g font-size="11.5" font-weight="600" fill="#141413">
    <rect x="96" y="130" width="106" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/><text x="149" y="145" text-anchor="middle">TOUUD</text>
    <rect x="72" y="192" width="130" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/><text x="137" y="207" text-anchor="middle">REMAPBASE</text>
    <rect x="106" y="384" width="96" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/><text x="154" y="399" text-anchor="middle">TOLUD</text>
  </g>
  <!-- literal-constant pills: orange + mono -->
  <g font-size="11.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c2613f">
    <rect x="54" y="57"  width="148" height="22" rx="11" fill="#fbeee7" stroke="#e3b9a5"/><text x="128" y="72"  text-anchor="middle">0x40_0000_0000</text>
    <rect x="54" y="156" width="148" height="22" rx="11" fill="#fbeee7" stroke="#e3b9a5"/><text x="128" y="171" text-anchor="middle">0x4_4000_0000</text>
    <rect x="54" y="218" width="148" height="22" rx="11" fill="#fbeee7" stroke="#e3b9a5"/><text x="128" y="233" text-anchor="middle">0x4_0000_0000</text>
    <rect x="54" y="333" width="148" height="22" rx="11" fill="#fbeee7" stroke="#e3b9a5"/><text x="128" y="348" text-anchor="middle">0x1_0000_0000</text>
    <rect x="54" y="410" width="148" height="22" rx="11" fill="#fbeee7" stroke="#e3b9a5"/><text x="128" y="425" text-anchor="middle">0xC000_0000</text>
    <rect x="54" y="515" width="148" height="22" rx="11" fill="#fbeee7" stroke="#e3b9a5"/><text x="128" y="530" text-anchor="middle">0x0000_0000</text>
  </g>

  <!-- ============ boundary leaders, right column ============ -->
  <g stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="1128" y1="214" x2="1154" y2="214"/>
    <line x1="1128" y1="344" x2="1154" y2="344"/>
    <line x1="1128" y1="406" x2="1154" y2="406"/>
    <line x1="1128" y1="526" x2="1154" y2="526"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#141413">
    <rect x="1158" y="203" width="58" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/><text x="1187" y="218" text-anchor="middle">TOM</text>
  </g>
  <g font-size="11.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c2613f">
    <rect x="1158" y="229" width="58" height="22" rx="11" fill="#fbeee7" stroke="#e3b9a5"/><text x="1187" y="244" text-anchor="middle">16G</text>
    <rect x="1158" y="333" width="58" height="22" rx="11" fill="#fbeee7" stroke="#e3b9a5"/><text x="1187" y="348" text-anchor="middle">4G</text>
    <rect x="1158" y="395" width="58" height="22" rx="11" fill="#fbeee7" stroke="#e3b9a5"/><text x="1187" y="410" text-anchor="middle">3G</text>
    <rect x="1158" y="515" width="58" height="22" rx="11" fill="#fbeee7" stroke="#e3b9a5"/><text x="1187" y="530" text-anchor="middle">0x0</text>
  </g>

  <!-- ============ mapping lines ============ -->
  <g stroke="#a8a496" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <path d="M796,279 H564" marker-end="url(#amArrN)"/>
    <path d="M796,466 H564" marker-end="url(#amArrN)"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#141413">
    <rect x="626" y="268" width="108" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/><text x="680" y="283" text-anchor="middle">direct</text>
    <rect x="626" y="455" width="108" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0"/><text x="680" y="470" text-anchor="middle">direct</text>
  </g>
  <path d="M796,375 H784 Q776,375 776,367 V191 Q776,183 768,183 H564" fill="none" stroke="#d97757" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#amArrO)"/>
  <rect x="596" y="172" width="164" height="22" rx="11" fill="#fbeee7" stroke="#d97757"/>
  <text x="678" y="187" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c2613f">reclaim &#183; same DRAM</text>

  <text x="1216" y="562" text-anchor="end" font-size="11.5" font-style="italic" fill="#8c8a7d">segment heights are not to scale &#183; low addresses at the bottom</text>
</svg>
