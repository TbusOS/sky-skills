<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="Why sharing one memory is not free: the bandwidth becomes a shared resource that every block on the chip competes for. Six requesters are listed with the bandwidth each one needs, drawn as bars on a common scale: the display controller needs one point two gigabytes per second and is marked hard real time, the GPU needs two point four, the camera image signal processor zero point nine, the video codec zero point seven, the CPU cluster zero point six, and a sixth slot is left for anything else. Their total is close to the six point four gigabytes per second the memory can actually deliver, so the bus is nearly full. Below, the memory controller is drawn with a request queue of finite depth, and the requests in it are ordered not by arrival but by consequence of lateness. The display port is served first. The reason is spelled out as a comparison: if the GPU is served late it drops one frame and catches up on the next, whereas if scanout is served late the line buffer empties while the pixel clock keeps running, and a visible band appears across the screen immediately. Those two kinds of lateness differ by an order of magnitude in consequence, which is why their priorities differ too. The numbers are a representative configuration chosen so the proportions are honest, not the specification of any particular chip" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
  <style>
    .btn-f { stroke-dasharray: 12 8; animation: btnM 1.15s linear infinite; }
    .btn-f.btn-r { animation-name: btnMR; }
    .btn-f.btn-s { animation-duration: 2.1s; }
    @keyframes btnM  { to { stroke-dashoffset: -40; } }
    @keyframes btnMR { to { stroke-dashoffset:  40; } }
    /* 三条关闭动效的口子,跟 glass 同一套约定 */
    @media (prefers-reduced-motion: reduce) {
      .btn-f { animation: none; stroke-dashoffset: 0; }
    }
    :root[data-motion-freeze] .btn-f,
    html[data-motion-freeze] .btn-f { animation: none; stroke-dashoffset: 0; }
  </style>
    <pattern id="btnD" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <pattern id="btnH" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2f5c8a" stroke-width="1.6" opacity="0.35"/></pattern>
    <marker id="btnAO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker>
    <marker id="btnAB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#2f5c8a"/></marker>
    <marker id="btnAG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#4d5a3c"/></marker>
    <marker id="btnAK" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#141413"/></marker>
    <marker id="btnAD" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#8a6a2f"/></marker>
  </defs>
  <rect width="1120" height="620" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="620" rx="16" fill="url(#btnD)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">SIX TENANTS, ONE MEMORY BUS</text>
  <text x="40" y="76" text-anchor="start" font-size="12.5" font-weight="600" fill="#141413">sharing one DRAM removed the copies. what it did not remove is the queue.</text>
  <text x="40" y="96" text-anchor="start" font-size="11.5" fill="#6b6a5f">every block on the chip asks the same memory for bandwidth, and there is not enough for everyone at once.</text>
  <text x="286" y="144" text-anchor="end" font-size="11.5" font-weight="600" fill="#141413">display controller</text>
  <rect x="300" y="126" width="120" height="26" rx="4" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="310" y="144" text-anchor="start" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">1.2 GB/s</text>
  <text x="432.0" y="144" text-anchor="start" font-size="11" fill="#6b6a5f">hard real time &#183; cannot be late</text>
  <text x="286" y="182" text-anchor="end" font-size="11.5" font-weight="600" fill="#141413">GPU</text>
  <rect x="300" y="164" width="240" height="26" rx="4" fill="#f4d9cd" stroke="#8f4a2f" stroke-width="1.4"/>
  <text x="310" y="182" text-anchor="start" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#8f4a2f">2.4 GB/s</text>
  <text x="552.0" y="182" text-anchor="start" font-size="11" fill="#6b6a5f">can drop a frame and catch up</text>
  <text x="286" y="220" text-anchor="end" font-size="11.5" font-weight="600" fill="#141413">camera ISP</text>
  <rect x="300" y="202" width="90" height="26" rx="4" fill="#eef1e7" stroke="#4d5a3c" stroke-width="1.4"/>
  <text x="310" y="220" text-anchor="start" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#4d5a3c">0.9 GB/s</text>
  <text x="402.0" y="220" text-anchor="start" font-size="11" fill="#6b6a5f">only while the camera is open</text>
  <text x="286" y="258" text-anchor="end" font-size="11.5" font-weight="600" fill="#141413">video codec</text>
  <rect x="300" y="240" width="70" height="26" rx="4" fill="#eef1e7" stroke="#4d5a3c" stroke-width="1.4"/>
  <text x="310" y="258" text-anchor="start" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#4d5a3c">0.7 GB/s</text>
  <text x="382.0" y="258" text-anchor="start" font-size="11" fill="#6b6a5f">only while something is playing</text>
  <text x="286" y="296" text-anchor="end" font-size="11.5" font-weight="600" fill="#141413">CPU cluster</text>
  <rect x="300" y="278" width="60" height="26" rx="4" fill="#f1efe8" stroke="#6b6a5f" stroke-width="1.4"/>
  <text x="370.0" y="296" text-anchor="start" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">0.6 GB/s</text>
  <text x="426.64" y="296" text-anchor="start" font-size="11" fill="#6b6a5f">bursty, small</text>
  <path d="M300 118 L300 310" fill="none" stroke="#141413" stroke-width="1.4"/>
  <path d="M940 118 L940 310" fill="none" stroke="#8f4a2f" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="940" y="112" text-anchor="end" font-size="11.5" font-weight="600" fill="#8f4a2f">6.4 GB/s &#8212; everything the DRAM can deliver</text>
  <text x="300" y="328" text-anchor="start" font-size="11.5" font-weight="600" fill="#141413">5.8 GB/s asked for, 6.4 available. one more tenant and somebody waits.</text>
  <path d="M40 344 L1080 344" fill="none" stroke="#6b6a5f" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="40" y="374" text-anchor="start" font-size="12.5" font-weight="600" fill="#141413">THE MEMORY CONTROLLER DOES NOT SERVE THEM IN THE ORDER THEY ASKED</text>
  <rect x="40" y="396" width="214" height="66" rx="8" fill="#f1efe8" stroke="#d5d2c6" stroke-width="1.4"/>
  <text x="147" y="426" text-anchor="middle" font-size="12" font-weight="600" fill="#6b6a5f">request queue</text>
  <text x="147" y="443" text-anchor="middle" font-size="11.5" fill="#6b6a5f">finite depth, reordered</text>
  <rect x="276" y="406" width="300" height="46" rx="8" fill="#ffffff" stroke="#d8d4c8"/>
  <rect x="276" y="406" width="200.0" height="46" rx="8" fill="#e2ecf5"/>
  <line x1="301.0" y1="406" x2="301.0" y2="452" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="326.0" y1="406" x2="326.0" y2="452" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="351.0" y1="406" x2="351.0" y2="452" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="376.0" y1="406" x2="376.0" y2="452" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="401.0" y1="406" x2="401.0" y2="452" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="426.0" y1="406" x2="426.0" y2="452" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="451.0" y1="406" x2="451.0" y2="452" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="476.0" y1="406" x2="476.0" y2="452" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="501.0" y1="406" x2="501.0" y2="452" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="526.0" y1="406" x2="526.0" y2="452" stroke="#d8d4c8" stroke-width="1"/>
  <line x1="551.0" y1="406" x2="551.0" y2="452" stroke="#d8d4c8" stroke-width="1"/>
  <rect x="276" y="406" width="300" height="46" rx="8" fill="none" stroke="#141413" stroke-width="1.4"/>
  <text x="426.0" y="467" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">deep enough to hide a row miss, no more</text>
  <circle cx="300" cy="396" r="10.5" fill="#d97757"/>
  <text x="300" y="400" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text>
  <path d="M596 429 L656 429" fill="none" stroke="#2f5c8a" stroke-width="2.8" class="btn-f" marker-end="url(#btnAB)"/>
  <rect x="656" y="396" width="424" height="66" rx="8" fill="#e2ecf5" stroke="#c4d5e6" stroke-width="1.4"/>
  <text x="868" y="426" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">served by consequence, not by arrival</text>
  <text x="868" y="443" text-anchor="middle" font-size="11.5" fill="#6b6a5f">the display port is picked first, every time</text>
  <circle cx="680" cy="410" r="10.5" fill="#d97757"/>
  <text x="680" y="414" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
  <rect x="40" y="486" width="512" height="74" rx="11" fill="none" stroke="#d97757" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="90.1" y="477" width="159.8" height="18" rx="9" fill="#141413"/>
  <text x="170" y="490" text-anchor="middle" font-size="10" fill="#ffffff">if the GPU is served late</text>
  <text x="58" y="518" text-anchor="start" font-size="11.5" fill="#6b6a5f">one frame is dropped. the next one catches up.</text>
  <text x="58" y="538" text-anchor="start" font-size="11.5" fill="#6b6a5f">nobody outside the phone can tell.</text>
  <rect x="568" y="486" width="512" height="74" rx="11" fill="none" stroke="#c4d5e6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="626.1" y="477" width="159.8" height="18" rx="9" fill="#141413"/>
  <text x="706" y="490" text-anchor="middle" font-size="10" fill="#ffffff">if scanout is served late</text>
  <text x="586" y="518" text-anchor="start" font-size="11.5" fill="#6b6a5f">the 16-line buffer empties and the pixel clock does not wait.</text>
  <text x="586" y="538" text-anchor="start" font-size="11.5" font-weight="600" fill="#2f5c8a">a band appears across the screen, in that frame, visibly.</text>
  <text x="40" y="584" text-anchor="start" font-size="11.5" fill="#8c8a7d">the two kinds of lateness differ by an order of magnitude in consequence, so the priorities differ too. this is also the answer to</text>
  <text x="40" y="601" text-anchor="start" font-size="11.5" fill="#8c8a7d">&#8220;why did adding a camera preview make the display stutter&#8221; &#8212; nothing in the display path changed; a sixth tenant moved in.</text>
</svg>
