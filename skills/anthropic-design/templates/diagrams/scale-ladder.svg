  <text x="32" y="504" font-size="11.5" fill="#8c8a7d">the four panels are evenly spaced on the page and nowhere near evenly spaced in reality. the rule underneath is what stops the layout from making that claim on its own.</text>
  <text x="32" y="521" font-size="11.5" fill="#8c8a7d">two lines between panels, never one: one line reads as &#8220;goes to&#8221;, two read as &#8220;this region, opened&#8221;. it is the same pair of lines a cross-section uses for a detail.</text>
  <text x="32" y="538" font-size="11.5" fill="#8c8a7d">every panel carries a real width. a zoom chain without dimensions is decoration &#8212; the reader cannot tell a 3&#215; step from a 50&#215; one, and here the last step is the big one.</text>
  <text x="32" y="555" font-size="11.5" fill="#8c8a7d">the dimensions are representative of a desktop-class part, chosen so the ratios are honest. they are not a specific product.</text>
