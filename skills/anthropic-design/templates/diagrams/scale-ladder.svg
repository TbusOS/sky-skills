<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="Four panels in a row, each one magnifying a region of the panel to its left, so the reader walks from a whole board down to a single connection without ever losing the thread. The first panel is a board about a hundred millimetres across with several components on it and a dashed box around one package. Two thin lines carry that box into the second panel, a package about thirty millimetres across containing two dies, with a dashed box around one of them. Two more lines carry that into the third panel, a die about ten millimetres across divided into cores, cache and input-output, with a dashed box on one corner. Two final lines carry that into the fourth panel, a field of microbumps about two hundred micrometres across with the pitch marked. Each panel states its real width and the magnification from the panel before it. Underneath, a logarithmic rule places all four widths on one axis, which shows that the four panels are not evenly spaced in reality even though they are evenly spaced on the page. Closing notes state that a zoom chain needs two lines between panels rather than one, that every panel must carry a real dimension or the chain becomes decorative, and that the rule at the bottom is what stops the even spacing on the page from being read as even spacing in the world" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="slDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern></defs>
  <rect width="1120" height="620" rx="16" fill="#faf9f5" stroke="#eceadf"/><rect width="1120" height="620" rx="16" fill="url(#slDot)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">FOUR PANELS, THREE ORDERS OF MAGNITUDE &#183; EACH ONE OPENS THE LAST</text>
  <text x="32" y="58" font-size="11.5" fill="#8c8a7d">a zoom chain only works when each step says where it came from and how much bigger it is. two lines between panels, and a real dimension on every one.</text>
