<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="The same chip package drawn three ways, so the reader can see that looking inside something is not one technique but three, each answering a different question and each paying a different price. The first panel cuts it open: a section with hatched cut faces showing lid, two dies, substrate and solder balls, which answers what touches what and how thick, and pays by showing only the one plane the knife went through. The second panel makes the shell see-through: the outline of the package is drawn at low opacity with the two dies and the wiring visible inside it, which answers how many parts there are and how they are arranged, and pays by blurring wherever parts overlap. The third panel pulls it apart along an axis, which answers what order it was built in and what can still be separated, and pays by destroying the real adjacency the first panel showed. A closing rule states that the question decides the drawing: what is next to what and how thick means cut it, how many and where means make it see-through, what order and can it come apart means pull it apart, and that a figure trying to answer all three at once answers none of them well" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="siDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
  <pattern id="siCut" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#141413" stroke-width="1.1" opacity="0.22"/></pattern>
  <marker id="siArr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#a8a496"/></marker></defs>
  <rect width="1120" height="620" rx="16" fill="#faf9f5" stroke="#eceadf"/><rect width="1120" height="620" rx="16" fill="url(#siDot)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">THREE WAYS TO LOOK INSIDE ONE THING &#183; AND WHAT EACH ONE COSTS</text>
  <text x="32" y="58" font-size="11.5" fill="#8c8a7d">&#8220;show the inside&#8221; is not one drawing. it is three, they answer different questions, and picking the wrong one is why a figure can be careful and still not help.</text>
  <rect x="36" y="76" width="336" height="342" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="60" cy="102" r="10" fill="#c2613f"/><text x="60" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text>
  <text x="78" y="100" font-size="13" font-weight="600" fill="#141413">cut it open</text>
  <text x="78" y="116" font-size="10.5" fill="#6b6a5f">a plane through the part</text>
  <rect x="96" y="160" width="216" height="18" fill="#e7e4d9" stroke="#141413" stroke-width="1.3"/><rect x="96" y="160" width="216" height="18" fill="url(#siCut)"/>
  <rect x="114" y="184" width="88" height="34" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.3"/><rect x="114" y="184" width="88" height="34" fill="url(#siCut)"/>
  <rect x="222" y="184" width="66" height="34" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.3"/><rect x="222" y="184" width="66" height="34" fill="url(#siCut)"/>
  <rect x="96" y="224" width="216" height="26" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.3"/><rect x="96" y="224" width="216" height="26" fill="url(#siCut)"/>
  <circle cx="118" cy="262" r="7" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="148" cy="262" r="7" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="178" cy="262" r="7" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="208" cy="262" r="7" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="238" cy="262" r="7" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="268" cy="262" r="7" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="298" cy="262" r="7" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <line x1="312" y1="169" x2="336" y2="169" stroke="#a8a496" stroke-width="1"/><text x="340" y="172" font-size="10" fill="#6b6a5f">lid</text>
  <line x1="288" y1="201" x2="336" y2="201" stroke="#a8a496" stroke-width="1"/><text x="340" y="204" font-size="10" fill="#6b6a5f">dies</text>
  <line x1="312" y1="237" x2="336" y2="237" stroke="#a8a496" stroke-width="1"/><text x="340" y="240" font-size="10" fill="#6b6a5f">substrate</text>
  <text x="56" y="292" font-size="10.5" fill="#6b6a5f">hatching says &#8220;the knife went through here&#8221;</text>
  <text x="56" y="330" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">ANSWERS</text>
  <text x="56" y="350" font-size="11.5" font-weight="600" fill="#141413">what touches what, and how thick</text>
  <text x="56" y="374" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">PAYS WITH</text>
  <text x="56" y="394" font-size="11.5" fill="#c2613f">you only see the one plane you cut</text>
  <rect x="392" y="76" width="336" height="342" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="416" cy="102" r="10" fill="#c2613f"/><text x="416" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
  <text x="434" y="100" font-size="13" font-weight="600" fill="#141413">make it see-through</text>
  <text x="434" y="116" font-size="10.5" fill="#6b6a5f">the shell drops to a whisper</text>
  <rect x="452" y="160" width="216" height="102" rx="4" fill="#e7e4d9" fill-opacity="0.35" stroke="#141413" stroke-width="1.4" stroke-opacity="0.55"/>
  <rect x="470" y="184" width="88" height="52" rx="3" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.5"/>
  <text x="514" y="214" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5d7045">logic</text>
  <rect x="578" y="184" width="66" height="52" rx="3" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.5"/>
  <text x="611" y="214" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2f5c8a">memory</text>
  <line x1="558" y1="192" x2="578" y2="192" stroke="#8a5a2a" stroke-width="1.2" opacity="0.75"/>
  <line x1="558" y1="201" x2="578" y2="201" stroke="#8a5a2a" stroke-width="1.2" opacity="0.75"/>
  <line x1="558" y1="210" x2="578" y2="210" stroke="#8a5a2a" stroke-width="1.2" opacity="0.75"/>
  <line x1="558" y1="219" x2="578" y2="219" stroke="#8a5a2a" stroke-width="1.2" opacity="0.75"/>
  <line x1="558" y1="228" x2="578" y2="228" stroke="#8a5a2a" stroke-width="1.2" opacity="0.75"/>
  <line x1="558" y1="237" x2="578" y2="237" stroke="#8a5a2a" stroke-width="1.2" opacity="0.75"/>
  <rect x="452" y="244" width="216" height="0" fill="none"/>
  <text x="560" y="256" text-anchor="middle" font-size="10" fill="#6b6a5f">the shell is still there &#8212; it is just quiet</text>
  <rect x="412" y="272" width="60" height="22" rx="4" fill="#e7e4d9" fill-opacity="0.35" stroke="#141413" stroke-width="1.2" stroke-opacity="0.55"/>
  <rect x="442" y="278" width="60" height="22" rx="4" fill="#e7e4d9" fill-opacity="0.35" stroke="#141413" stroke-width="1.2" stroke-opacity="0.55"/>
  <text x="512" y="296" font-size="10.5" fill="#6b6a5f">two overlapping parts read as a third</text>
  <text x="412" y="330" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">ANSWERS</text>
  <text x="412" y="350" font-size="11.5" font-weight="600" fill="#141413">how many parts, and how they sit</text>
  <text x="412" y="374" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">PAYS WITH</text>
  <text x="412" y="394" font-size="11.5" fill="#c2613f">wherever things overlap, it goes muddy</text>
  <rect x="748" y="76" width="336" height="342" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <circle cx="772" cy="102" r="10" fill="#c2613f"/><text x="772" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3</text>
  <text x="790" y="100" font-size="13" font-weight="600" fill="#141413">pull it apart</text>
  <text x="790" y="116" font-size="10.5" fill="#6b6a5f">along one straight axis</text>
  <line x1="916" y1="152" x2="916" y2="278" stroke="#a8a496" stroke-width="1.2" stroke-dasharray="10 4 3 4"/>
  <rect x="808" y="158" width="216" height="16" rx="2" fill="#e7e4d9" stroke="#141413" stroke-width="1.3"/>
  <rect x="826" y="192" width="88" height="26" rx="2" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.3"/>
  <rect x="934" y="192" width="66" height="26" rx="2" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.3"/>
  <rect x="808" y="236" width="216" height="22" rx="2" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.3"/>
  <circle cx="830" cy="274" r="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="860" cy="274" r="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="890" cy="274" r="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="920" cy="274" r="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="950" cy="274" r="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="980" cy="274" r="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <circle cx="1010" cy="274" r="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1"/>
  <path d="M1040 168 V 182" fill="none" stroke="#a8a496" stroke-width="1.2" marker-end="url(#siArr)"/>
  <path d="M1040 212 V 226" fill="none" stroke="#a8a496" stroke-width="1.2" marker-end="url(#siArr)"/>
  <text x="768" y="292" font-size="10.5" fill="#6b6a5f">equal gaps, one axis, everything centred on it</text>
  <text x="768" y="330" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">ANSWERS</text>
  <text x="768" y="350" font-size="11.5" font-weight="600" fill="#141413">what order, and what still separates</text>
  <text x="768" y="374" font-size="10" font-weight="600" letter-spacing="0.8" fill="#8c8a7d">PAYS WITH</text>
  <text x="768" y="394" font-size="11.5" fill="#c2613f">the real adjacency is gone</text>
  <rect x="36" y="440" width="1048" height="62" rx="10" fill="#f7e4dc" stroke="#c2613f" stroke-width="1.5"/>
  <text x="60" y="466" font-size="12" font-weight="700" fill="#c2613f">the question picks the drawing, not your taste</text>
  <text x="60" y="488" font-size="11.5" fill="#141413">&#8220;what is next to what, and how thick&#8221; &#8594; cut it &#183; &#8220;how many, and where&#8221; &#8594; make it see-through &#183; &#8220;what order, and can it come apart&#8221; &#8594; pull it apart</text>
  <text x="32" y="528" font-size="11.5" fill="#8c8a7d">a figure that tries to answer all three at once answers none of them well: the section grows ghost outlines, the see-through view grows an axis, and the reader stops trusting any of it.</text>
  <text x="32" y="545" font-size="11.5" fill="#8c8a7d">see-through is the one to reach for least. it is the only one of the three whose failure is quiet &#8212; overlapping parts merge into shapes that were never there, and nothing on the page says so.</text>
  <text x="32" y="562" font-size="11.5" fill="#8c8a7d">all three are flat drawings. none of them needs perspective, and adding it costs accuracy in exchange for looking like a render.</text>
  <rect x="820" y="576" width="260" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M820 583 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="833" cy="591" r="3.6" fill="#ffffff"/>
  <text x="967" y="595" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">See inside &#183; three ways, three costs</text>
</svg>
