  <text x="132" y="346.0" text-anchor="end" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">20&#215;</text>
  <text x="132" y="328" text-anchor="end" font-size="10.5" fill="#6b6a5f">wait</text>
