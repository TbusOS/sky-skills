  <text x="132" y="515.1" text-anchor="end" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">1&#215;</text>
  <line x1="140" y1="475.5" x2="1060" y2="475.5" stroke="#c8c4b6" stroke-width="0.9" stroke-dasharray="3 4"/>
  <text x="132" y="479.5" text-anchor="end" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">5&#215;</text>
  <line x1="140" y1="431.0" x2="1060" y2="431.0" stroke="#c8c4b6" stroke-width="0.9" stroke-dasharray="3 4"/>
  <text x="132" y="435.0" text-anchor="end" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">10&#215;</text>
