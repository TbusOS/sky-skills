  <rect x="552" y="158" width="13" height="24" rx="2" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.1"/>
  <path d="M410 170 H 426" fill="none" stroke="#6b6a5f" stroke-width="1.2" marker-end="url(#quA)"/>
  <text x="410" y="146" font-size="10" fill="#6b6a5f">arrivals</text>
  <text x="412" y="216" font-size="11.5" font-weight="700" fill="#8a5a2a">4 waiting</text>
  <text x="412" y="234" font-size="11" fill="#6b6a5f">four waiting, and it feels fine on a graph</text>
  <rect x="748" y="76" width="336" height="196" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <text x="768" y="102" font-size="14" font-weight="600" fill="#141413">95% busy</text>
  <text x="768" y="120" font-size="10.5" fill="#6b6a5f">&#8220;we still have headroom&#8221;</text>
  <rect x="998" y="148" width="62" height="44" rx="7" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.5"/>
  <text x="1029" y="166" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2f5c8a">server</text>
  <text x="1029" y="180" text-anchor="middle" font-size="10.5" fill="#6b6a5f">one at a time</text>
