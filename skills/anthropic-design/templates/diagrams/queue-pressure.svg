  <line x1="324.0" y1="520" x2="324.0" y2="525" stroke="#c8c4b6" stroke-width="1"/>
  <text x="324.0" y="540" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">20%</text>
  <line x1="416.0" y1="520" x2="416.0" y2="525" stroke="#c8c4b6" stroke-width="1"/>
  <line x1="508.0" y1="520" x2="508.0" y2="525" stroke="#c8c4b6" stroke-width="1"/>
  <text x="508.0" y="540" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">40%</text>
  <line x1="600.0" y1="520" x2="600.0" y2="525" stroke="#c8c4b6" stroke-width="1"/>
  <line x1="692.0" y1="520" x2="692.0" y2="525" stroke="#c8c4b6" stroke-width="1"/>
  <text x="692.0" y="540" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">60%</text>
  <line x1="784.0" y1="520" x2="784.0" y2="525" stroke="#c8c4b6" stroke-width="1"/>
  <line x1="876.0" y1="520" x2="876.0" y2="525" stroke="#c8c4b6" stroke-width="1"/>
  <text x="876.0" y="540" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">80%</text>
  <line x1="968.0" y1="520" x2="968.0" y2="525" stroke="#c8c4b6" stroke-width="1"/>
