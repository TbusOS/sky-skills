  <rect x="836" y="158" width="13" height="24" rx="2" fill="#f7e4dc" stroke="#c2613f" stroke-width="1.1"/>
  <rect x="818" y="158" width="13" height="24" rx="2" fill="#f7e4dc" stroke="#c2613f" stroke-width="1.1"/>
  <text x="812" y="176" text-anchor="end" font-size="11" font-weight="700" fill="#c2613f">+10</text>
  <path d="M766 170 H 782" fill="none" stroke="#6b6a5f" stroke-width="1.2" marker-end="url(#quA)"/>
  <text x="766" y="146" font-size="10" fill="#6b6a5f">arrivals</text>
  <text x="768" y="216" font-size="11.5" font-weight="700" fill="#c2613f">19 waiting</text>
  <text x="768" y="234" font-size="11" fill="#6b6a5f">nineteen waiting. nothing broke &#8212; it just queued</text>
  <text x="32" y="308" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">AVERAGE WAIT AGAINST UTILISATION &#183; ONE SERVER, RANDOM ARRIVALS</text>
