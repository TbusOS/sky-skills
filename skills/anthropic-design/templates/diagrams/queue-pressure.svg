<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-label="Three panels above a curve, all about the same thing: how long a queue gets as the server approaches saturation. Each panel shows one server box with work waiting in front of it, drawn as small squares, at three levels of utilisation. At fifty per cent one item waits and the panel is calm. At eighty per cent four items wait. At ninety-five per cent nineteen items wait and the row runs off the edge of the panel. Below them a single chart plots average wait against utilisation from zero to nearly one hundred per cent. The line is flat and unremarkable until about seventy per cent, then bends sharply upward, and a dashed vertical marker at eighty per cent is labelled as the knee. Four points on the curve are called out with their values: one at fifty per cent, four at eighty, nine at ninety, nineteen at ninety-five. Closing notes state that the last twenty per cent of utilisation is not the last twenty per cent of the trouble, that this shape comes from one server and random arrivals so a real system with bursts bends earlier and harder, and that a queue drawing without this curve underneath lets a reader believe a busy system is merely a proportionally slower one" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="quDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
  <marker id="quA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#6b6a5f"/></marker></defs>
  <rect width="1120" height="680" rx="16" fill="#faf9f5" stroke="#eceadf"/><rect width="1120" height="680" rx="16" fill="url(#quDot)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">A QUEUE IS NOT A PROPORTION &#183; THE LAST 20% OF LOAD IS NOT 20% OF THE TROUBLE</text>
  <text x="32" y="58" font-size="11.5" fill="#8c8a7d">the three panels are the same server at three loads. the curve underneath is why the third one looks the way it does, and it is the part a queue drawing usually leaves out.</text>
  <rect x="36" y="76" width="336" height="196" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <text x="56" y="102" font-size="14" font-weight="600" fill="#141413">50% busy</text>
  <text x="56" y="120" font-size="10.5" fill="#6b6a5f">half the time it is idle</text>
  <rect x="286" y="148" width="62" height="44" rx="7" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.5"/>
  <text x="317" y="166" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2f5c8a">server</text>
  <text x="317" y="180" text-anchor="middle" font-size="10.5" fill="#6b6a5f">one at a time</text>
  <rect x="250" y="158" width="13" height="24" rx="2" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.1"/>
  <path d="M54 170 H 70" fill="none" stroke="#6b6a5f" stroke-width="1.2" marker-end="url(#quA)"/>
  <text x="54" y="146" font-size="10" fill="#6b6a5f">arrivals</text>
  <text x="56" y="216" font-size="11.5" font-weight="700" fill="#5d7045">1 waiting</text>
  <text x="56" y="234" font-size="11" fill="#6b6a5f">the queue empties between arrivals</text>
  <rect x="392" y="76" width="336" height="196" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <text x="412" y="102" font-size="14" font-weight="600" fill="#141413">80% busy</text>
  <text x="412" y="120" font-size="10.5" fill="#6b6a5f">the usual production target</text>
  <rect x="642" y="148" width="62" height="44" rx="7" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.5"/>
  <text x="673" y="166" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2f5c8a">server</text>
  <text x="673" y="180" text-anchor="middle" font-size="10.5" fill="#6b6a5f">one at a time</text>
  <rect x="606" y="158" width="13" height="24" rx="2" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.1"/>
  <rect x="588" y="158" width="13" height="24" rx="2" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.1"/>
