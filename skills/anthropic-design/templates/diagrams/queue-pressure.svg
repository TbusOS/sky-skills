  <line x1="876.0" y1="520" x2="876.0" y2="334" stroke="#8a5a2a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="876.0" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5a2a">the knee</text>
  <circle cx="600.0" cy="511.1" r="4.5" fill="#c2613f"/>
  <text x="610.0" y="505.1" font-size="10.5" font-weight="700" fill="#c2613f">1&#215; at 50%</text>
  <circle cx="876.0" cy="484.4" r="4.5" fill="#c2613f"/>
  <text x="886.0" y="478.4" font-size="10.5" font-weight="700" fill="#c2613f">4&#215; at 80%</text>
  <circle cx="968.0" cy="439.9" r="4.5" fill="#c2613f"/>
  <text x="978.0" y="433.9" font-size="10.5" font-weight="700" fill="#c2613f">9&#215; at 90%</text>
  <circle cx="1014.0" cy="350.9" r="4.5" fill="#c2613f"/>
  <text x="1024.0" y="344.9" font-size="10.5" font-weight="700" fill="#c2613f">19&#215; at 95%</text>
  <text x="32" y="562" font-size="11.5" fill="#8c8a7d">going from 50% to 80% busy costs four times the wait. going from 80% to 95% costs another five times on top of that. the axis is linear; the experience is not.</text>
  <text x="32" y="579" font-size="11.5" fill="#8c8a7d">this shape is one server with random arrivals. a real system with bursty arrivals bends earlier and harder, so treat the curve as the floor of the bad news rather than the estimate.</text>
  <text x="32" y="596" font-size="11.5" fill="#8c8a7d">the three panels above cannot make this point on their own &#8212; a reader who sees only queues believes a busy system is a proportionally slower one. the curve is what says otherwise.</text>
  <text x="32" y="613" font-size="11.5" fill="#8c8a7d">the same shape governs an interrupt handler, a ring buffer and a thread pool. what changes between them is what happens after the queue is full, not the shape of the approach.</text>
  <rect x="820" y="636" width="260" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
