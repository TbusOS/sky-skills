<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-label="A cross-section of a display module drawn beside a magnified detail of one of its layers. Top left is a small plan view of the module seen from above, with a dashed section line A to A running across it and two arrows showing the viewing direction. In the middle of the figure the section itself: twelve horizontal bands stacked from cover glass at the top down through optical adhesive, upper polariser, colour filter glass, the liquid crystal layer, TFT glass, lower polariser, an air gap, diffuser, light guide plate, reflector and metal frame. Every band is named by a short leader running out to a right-aligned label column on the left, because the thin bands cannot hold text. A dashed box sits on the right end of the TFT glass band and two thin lines carry it across to the large detail panel on the right, which magnifies that layer forty times and shows pixel transistors below one continuous conductor strip. That strip is labelled as serving two jobs at once, the common electrode for the display and the transmit electrode for touch, which is why a stalled display side takes the touch side down with it while every touch register still reads back normal. Closing notes state that a section line is what tells the reader where the cut was made and which way they are looking, that thin layers must be labelled outside on leaders rather than stuffed with text, and that a detail panel needs two lines back to the place it magnifies" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="xsDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <pattern id="xsCut" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#141413" stroke-width="1.1" opacity="0.20"/></pattern>
    <pattern id="xsCutB" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#2f5c8a" stroke-width="1.1" opacity="0.26"/></pattern>
    <marker id="xsArr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#141413"/></marker>
    <marker id="xsArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker>
  </defs>

  <rect width="1120" height="700" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="700" rx="16" fill="url(#xsDot)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">CROSS-SECTION &#183; WHAT IS TOUCHING WHAT, AND HOW THICK</text>

  <!-- plan view + section line -->
  <text x="60" y="70" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">PLAN VIEW &#183; WHERE THE CUT IS TAKEN</text>
  <rect x="60" y="82" width="188" height="104" rx="6" fill="#ffffff" stroke="#d8d4c8" stroke-width="1.3"/>
  <rect x="72" y="94" width="164" height="80" rx="3" fill="#e2ecf5" stroke="#c4d5e6" stroke-width="1.2"/>
  <text x="154" y="166" text-anchor="middle" font-size="10.5" fill="#6b6a5f">active area</text>
  <line x1="44" y1="124" x2="264" y2="124" stroke="#141413" stroke-width="1.3" stroke-dasharray="10 4 3 4"/>
  <path d="M60 142 L60 128" fill="none" stroke="#141413" stroke-width="1.5" marker-end="url(#xsArr)"/>
  <path d="M248 142 L248 128" fill="none" stroke="#141413" stroke-width="1.5" marker-end="url(#xsArr)"/>
  <text x="34" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#141413">A</text>
  <text x="274" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#141413">A</text>
  <text x="60" y="208" font-size="11.5" fill="#8c8a7d">the arrows say which way you are looking &#8212; a section line without them is ambiguous</text>

  <text x="360" y="240" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">SECTION A&#8212;A &#183; 12 LAYERS, RELATIVE THICKNESS</text>

  <!-- stack: cell x 360..660, backlight x 372..648 -->
  <rect x="360" y="252" width="300" height="30" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.3"/>
  <rect x="360" y="252" width="300" height="30" fill="url(#xsCutB)"/>
  <rect x="360" y="282" width="300" height="16" fill="#f0e4d8" stroke="#c9913f" stroke-width="1.2"/>
  <rect x="360" y="298" width="300" height="18" fill="#e7e4d9" stroke="#a8a496" stroke-width="1.2"/>
  <rect x="360" y="316" width="300" height="26" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.3"/>
  <rect x="360" y="316" width="300" height="26" fill="url(#xsCutB)"/>
  <rect x="360" y="342" width="300" height="18" fill="#f7e4dc" stroke="#d97757" stroke-width="1.6"/>
  <rect x="360" y="360" width="300" height="34" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.4"/>
  <rect x="360" y="360" width="300" height="34" fill="url(#xsCut)"/>
  <rect x="360" y="394" width="300" height="18" fill="#e7e4d9" stroke="#a8a496" stroke-width="1.2"/>
  <rect x="372" y="412" width="276" height="20" fill="#ffffff" stroke="#c8c4b6" stroke-width="1.1" stroke-dasharray="5 3"/>
  <rect x="372" y="432" width="276" height="16" fill="#f1efe8" stroke="#a8a496" stroke-width="1.2"/>
  <rect x="372" y="448" width="276" height="38" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.3"/>
  <rect x="372" y="448" width="276" height="38" fill="url(#xsCutB)"/>
  <rect x="372" y="486" width="276" height="14" fill="#f1efe8" stroke="#a8a496" stroke-width="1.2"/>
  <rect x="372" y="500" width="276" height="26" fill="#e7e4d9" stroke="#141413" stroke-width="1.4"/>
  <rect x="372" y="500" width="276" height="26" fill="url(#xsCut)"/>
  <rect x="654" y="456" width="14" height="22" rx="2" fill="#c9913f"/>
  <text x="661" y="450" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a5a2a">LED</text>

  <!-- leaders out to the LEFT, labels right-aligned at x=330 -->
  <g stroke="#a8a496" stroke-width="1">
    <line x1="360" y1="267" x2="336" y2="267"/><line x1="360" y1="290" x2="336" y2="290"/>
    <line x1="360" y1="307" x2="336" y2="307"/><line x1="360" y1="329" x2="336" y2="329"/>
    <line x1="360" y1="403" x2="336" y2="403"/><line x1="372" y1="422" x2="336" y2="422"/>
    <line x1="372" y1="440" x2="336" y2="440"/><line x1="372" y1="467" x2="336" y2="467"/>
    <line x1="372" y1="493" x2="336" y2="493"/><line x1="372" y1="513" x2="336" y2="513"/>
  </g>
  <line x1="360" y1="351" x2="336" y2="351" stroke="#d97757" stroke-width="1.3"/>
  <line x1="360" y1="377" x2="336" y2="377" stroke="#5d7045" stroke-width="1.3"/>
  <g text-anchor="end" font-size="11.5">
    <text x="330" y="271" font-weight="600" fill="#2f5c8a">cover glass<tspan font-weight="400" fill="#6b6a5f"> &#183; 0.55 mm</tspan></text>
    <text x="330" y="294" font-weight="600" fill="#8a5a2a">optical adhesive<tspan font-weight="400" fill="#6b6a5f"> &#183; 150 &#181;m</tspan></text>
    <text x="330" y="311" font-weight="600" fill="#6b6a5f">upper polariser</text>
    <text x="330" y="333" font-weight="600" fill="#2f5c8a">colour-filter glass<tspan font-weight="400" fill="#6b6a5f"> &#183; 0.20 mm</tspan></text>
    <text x="330" y="355" font-weight="700" fill="#c2613f">liquid-crystal layer<tspan font-weight="400" fill="#6b6a5f"> &#183; 3.5 &#181;m</tspan></text>
    <text x="330" y="381" font-weight="700" fill="#5d7045">TFT glass<tspan font-weight="400" fill="#6b6a5f"> &#183; transistors + one shared conductor</tspan></text>
    <text x="330" y="407" font-weight="600" fill="#6b6a5f">lower polariser</text>
    <text x="330" y="426" font-weight="600" fill="#6b6a5f">air gap<tspan font-weight="400"> &#183; not a mistake, it is optical</tspan></text>
    <text x="330" y="444" font-weight="600" fill="#6b6a5f">diffuser</text>
    <text x="330" y="471" font-weight="600" fill="#2f5c8a">light guide plate<tspan font-weight="400" fill="#6b6a5f"> &#183; 0.40 mm</tspan></text>
    <text x="330" y="497" font-weight="600" fill="#6b6a5f">reflector</text>
    <text x="330" y="517" font-weight="600" fill="#141413">metal frame</text>
  </g>
  <text x="360" y="548" font-size="11" fill="#8c8a7d">the flex that carries signals out leaves from the TFT glass &#8212; the colour-filter glass carries nothing out</text>

  <!-- detail callout box, right end of the TFT glass band -->
  <rect x="566" y="358" width="88" height="38" fill="none" stroke="#d97757" stroke-width="1.6" stroke-dasharray="5 3"/>
  <line x1="654" y1="358" x2="720" y2="252" stroke="#d97757" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="654" y1="396" x2="720" y2="526" stroke="#d97757" stroke-width="1.1" stroke-dasharray="4 3"/>

  <!-- DETAIL panel -->
  <text x="720" y="240" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">DETAIL &#183; THAT ONE LAYER AT 40&#215;</text>
  <rect x="720" y="252" width="360" height="274" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="1.6"/>
  <rect x="736" y="276" width="328" height="26" fill="#f7e4dc" stroke="#d97757" stroke-width="1.6"/>
  <text x="900" y="293" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2613f">one continuous conductor strip</text>
  <text x="736" y="324" font-size="11.5" font-weight="600" fill="#141413">display calls it</text>
  <rect x="736" y="332" width="150" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="811" y="347" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#141413">Vcom &#183; common electrode</text>
  <text x="914" y="324" font-size="11.5" font-weight="600" fill="#141413">touch calls it</text>
  <rect x="914" y="332" width="150" height="22" rx="11" fill="#e7e4d9" stroke="#cfccc0" stroke-width="1"/>
  <text x="989" y="347" text-anchor="middle" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#141413">TX &#183; transmit electrode</text>
  <path d="M811 354 V 372 H 900" fill="none" stroke="#a8a496" stroke-width="1.2"/>
  <path d="M989 354 V 372 H 900" fill="none" stroke="#a8a496" stroke-width="1.2"/>
  <path d="M900 372 V 386" fill="none" stroke="#d97757" stroke-width="1.8" marker-end="url(#xsArrO)"/>
  <text x="900" y="404" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2613f">same piece of metal, time-shared</text>
  <rect x="736" y="418" width="328" height="44" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.3"/>
  <g stroke="#5d7045" stroke-width="1.2" fill="none">
    <rect x="756" y="430" width="30" height="20" rx="2"/><rect x="812" y="430" width="30" height="20" rx="2"/>
    <rect x="868" y="430" width="30" height="20" rx="2"/><rect x="924" y="430" width="30" height="20" rx="2"/>
    <rect x="980" y="430" width="30" height="20" rx="2"/>
  </g>
  <text x="900" y="476" text-anchor="middle" font-size="11" fill="#6b6a5f">pixel transistors sit underneath, on the same glass</text>
  <text x="736" y="500" font-size="11.5" font-weight="700" fill="#c2613f">consequence:</text>
  <text x="828" y="500" font-size="11.5" fill="#6b6a5f">stall the display side and touch stops too &#8212;</text>
  <text x="736" y="516" font-size="11.5" fill="#6b6a5f">while every touch register still reads back perfectly normal.</text>

  <!-- badges -->
  <circle cx="290" cy="124" r="10.5" fill="#d97757"/><text x="290" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text>
  <circle cx="348" cy="267" r="10.5" fill="#d97757"/><text x="348" y="271" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
  <circle cx="700" cy="284" r="10.5" fill="#d97757"/><text x="700" y="288" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">3</text>

  <!-- legend -->
  <rect x="60" y="576" width="10" height="10" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.2"/><text x="78" y="585" font-size="11" fill="#6b6a5f">glass</text>
  <rect x="130" y="576" width="10" height="10" fill="#e7e4d9" stroke="#a8a496" stroke-width="1.2"/><text x="148" y="585" font-size="11" fill="#6b6a5f">film</text>
  <rect x="192" y="576" width="10" height="10" fill="#f0e4d8" stroke="#c9913f" stroke-width="1.2"/><text x="210" y="585" font-size="11" fill="#6b6a5f">adhesive</text>
  <rect x="276" y="576" width="10" height="10" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.2"/><text x="294" y="585" font-size="11" fill="#6b6a5f">active silicon</text>
  <rect x="386" y="576" width="10" height="10" fill="#f7e4dc" stroke="#d97757" stroke-width="1.4"/><text x="404" y="585" font-size="11" fill="#6b6a5f">what this figure is about</text>
  <rect x="556" y="576" width="10" height="10" fill="#e7e4d9" stroke="#a8a496" stroke-width="1"/><rect x="556" y="576" width="10" height="10" fill="url(#xsCut)"/><text x="574" y="585" font-size="11" fill="#6b6a5f">hatched = cut through solid material</text>

  <text x="32" y="620" font-size="11.5" fill="#8c8a7d">&#9312; the plan view carries the section line, so the reader knows where the cut was taken and which way they are facing &#183; &#9313; every thin band is named outside, on a leader</text>
  <text x="32" y="637" font-size="11.5" fill="#8c8a7d">&#9314; the detail panel is joined to its origin by two lines, not one &#8212; one line reads as an arrow pointing somewhere, two read as &#8220;this region, blown up&#8221;.</text>
  <text x="32" y="654" font-size="11.5" fill="#8c8a7d">thicknesses are typical for a small-panel module and are drawn to relative, not absolute, scale &#8212; measure your own stack before quoting any of them.</text>

  <rect x="858" y="570" width="222" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M858 577 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="871" cy="585" r="3.6" fill="#ffffff"/>
  <text x="978" y="589" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">Cross-section &#183; panel stack</text>
</svg>
