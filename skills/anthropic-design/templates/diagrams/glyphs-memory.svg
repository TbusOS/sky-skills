<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" role="img" aria-label="Second glyph sheet for engineering diagrams, covering how memory and addresses are drawn. An address bar: a horizontal bar split into named regions, with black pill labels hanging outside it, each joined by a dashed leader to the boundary it names. A window band: a hatched region inside an address bar with an arrow at each end, meaning that range is a view onto another space rather than storage of its own. A page grid: a lattice of small squares, one per page, coloured by state, with a legend of small chips beneath. A copy block: a solid orange box with an arrow in and an arrow out, placed on a path to mark the one place where bytes genuinely move. A memory module drawn as a green circuit board with a gold edge connector, a notch and black packages. A display panel drawn as a glass rectangle with a driver integrated circuit strip along its lower edge and a flexible cable leaving it. A link pill: a small black rounded label riding on a connecting line to name the interface that line carries. A signature card: a small white card with a black bar and a white dot, placed in a corner so the figure states what it is" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="gmDots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <pattern id="gmHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2f5c8a" stroke-width="1.6" opacity="0.35"/></pattern>
    <marker id="gmArr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#2f5c8a"/></marker>
    <marker id="gmArrO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker>
  </defs>
  <rect width="1240" height="470" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1240" height="470" rx="16" fill="url(#gmDots)"/>
  <text x="32" y="36" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">GLYPH SHEET 2 &#183; MEMORY &amp; ADDRESS &#183; COPY ONE &#60;g&#62; AT A TIME</text>
  <text x="36" y="80" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-ADDRBAR</text>
  <text x="170" y="222" text-anchor="middle" font-size="11.5" fill="#6b6a5f">a span of address space, named</text>
  <text x="340" y="80" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-WINDOW</text>
  <text x="474" y="222" text-anchor="middle" font-size="11.5" fill="#6b6a5f">a view onto another space, not storage</text>
  <text x="644" y="80" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-PAGEGRID</text>
  <text x="778" y="222" text-anchor="middle" font-size="11.5" fill="#6b6a5f">one cell per page, colour is state</text>
  <text x="948" y="80" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-COPYBLOCK</text>
  <text x="1082" y="222" text-anchor="middle" font-size="11.5" fill="#6b6a5f">the one place bytes actually move</text>
  <text x="36" y="280" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-DIMM</text>
  <text x="170" y="422" text-anchor="middle" font-size="11.5" fill="#6b6a5f">a memory module you could hold</text>
  <text x="340" y="280" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-PANEL</text>
  <text x="474" y="422" text-anchor="middle" font-size="11.5" fill="#6b6a5f">glass + driver IC + flex cable</text>
  <text x="644" y="280" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-LINKPILL</text>
  <text x="778" y="422" text-anchor="middle" font-size="11.5" fill="#6b6a5f">names the interface a line carries</text>
  <text x="948" y="280" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#141413">G-SIGNCARD</text>
  <text x="1082" y="422" text-anchor="middle" font-size="11.5" fill="#6b6a5f">the figure states what it is</text>
