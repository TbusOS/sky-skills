<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="A coverage dot chart for one web service's release pipeline. Six ways a release goes wrong run down the left as rows; four checks run across the top as columns, grouped by when they run: unit tests and an API contract diff before merge, a migration test on a production-size copy before deploy, and a five percent canary on real traffic in production. A solid dot means the check fails the release for that row, a grey capsule means it only prints a warning, a cross means the row is left out of that check on purpose, and a blank means nobody looks. A last column counts the solid dots in each row. Row one is caught only by unit tests, row two by both the contract diff and the canary, row three only by the migration test, rows four and five only by the canary (row four's unit test merely prints, row five is crossed out of unit tests because they pin every flag off), and row six by nobody: the contract diff skips schemas the team does not own and webhooks are not routed through the canary. Four rows hang on a single check, one row has none, and no two columns share a pattern." font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="cvdDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern></defs>
  <rect width="1120" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="560" rx="16" fill="url(#cvdDot)"/>
  <rect x="32" y="138" width="1056" height="36" rx="6" fill="#f3f1ea"/>
  <rect x="32" y="218" width="1056" height="36" rx="6" fill="#f3f1ea"/>
  <rect x="32" y="298" width="1056" height="36" rx="6" fill="#f3f1ea"/>
  <rect x="388" y="72" width="132" height="54" rx="10" fill="#ffffff" stroke="#e3e0d4"/>
  <rect x="388" y="72" width="132" height="4" rx="2" fill="#6a9bcc"/>
  <rect x="526" y="72" width="132" height="54" rx="10" fill="#ffffff" stroke="#e3e0d4"/>
  <rect x="526" y="72" width="132" height="4" rx="2" fill="#6a9bcc"/>
  <rect x="664" y="72" width="132" height="54" rx="10" fill="#ffffff" stroke="#e3e0d4"/>
  <rect x="664" y="72" width="132" height="4" rx="2" fill="#788c5d"/>
  <rect x="802" y="72" width="132" height="54" rx="10" fill="#ffffff" stroke="#e3e0d4"/>
  <rect x="802" y="72" width="132" height="4" rx="2" fill="#c9913f"/>
  <circle cx="46" cy="156" r="10" fill="#141413"/>
  <circle cx="454" cy="156" r="7" fill="#141413"/>
  <rect x="948" y="144" width="140" height="24" rx="12" fill="#f0e4d8" stroke="#c9913f"/>
  <circle cx="46" cy="196" r="10" fill="#141413"/>
  <circle cx="592" cy="196" r="7" fill="#141413"/>
  <circle cx="868" cy="196" r="7" fill="#141413"/>
  <circle cx="46" cy="236" r="10" fill="#141413"/>
  <circle cx="730" cy="236" r="7" fill="#141413"/>
  <rect x="948" y="224" width="140" height="24" rx="12" fill="#f0e4d8" stroke="#c9913f"/>
  <circle cx="46" cy="276" r="10" fill="#141413"/>
  <rect x="404" y="265" width="100" height="22" rx="11" fill="#e7e4d9" stroke="#d8d4c8"/>
  <circle cx="868" cy="276" r="7" fill="#141413"/>
  <rect x="948" y="264" width="140" height="24" rx="12" fill="#f0e4d8" stroke="#c9913f"/>
  <circle cx="46" cy="316" r="10" fill="#141413"/>
  <path d="M448,310 L460,322 M448,322 L460,310" stroke="#6b6a5f" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="868" cy="316" r="7" fill="#141413"/>
  <rect x="948" y="304" width="140" height="24" rx="12" fill="#f0e4d8" stroke="#c9913f"/>
  <circle cx="46" cy="356" r="10" fill="#141413"/>
  <path d="M586,350 L598,362 M586,362 L598,350" stroke="#6b6a5f" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M862,350 L874,362 M862,362 L874,350" stroke="#6b6a5f" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <rect x="948" y="344" width="140" height="24" rx="12" fill="#f4d9cd" stroke="#d97757"/>
  <circle cx="38" cy="406" r="6" fill="#141413"/>
  <rect x="172" y="396" width="34" height="20" rx="10" fill="#e7e4d9" stroke="#d8d4c8"/>
  <path d="M368,401 L378,411 M368,411 L378,401" stroke="#6b6a5f" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <rect x="690" y="396" width="34" height="20" rx="10" fill="#f0e4d8" stroke="#c9913f"/>
  <rect x="830" y="396" width="34" height="20" rx="10" fill="#f4d9cd" stroke="#d97757"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">COVERAGE DOTS &#183; WHICH CHECK CATCHES WHICH FAILURE</text>
  <text x="1088" y="34" text-anchor="end" font-size="12" fill="#6b6a5f">one web service's release pipeline</text>
  <text x="523" y="62" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.2" fill="#2f5c8a">BEFORE MERGE</text>
  <text x="454" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#141413">unit tests</text>
  <text x="454" y="116" text-anchor="middle" font-size="12" fill="#6b6a5f">one function</text>
  <text x="592" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#141413">contract diff</text>
  <text x="592" y="116" text-anchor="middle" font-size="12" fill="#6b6a5f">API schema</text>
  <text x="730" y="62" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5d7045">BEFORE DEPLOY</text>
  <text x="730" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#141413">migration test</text>
  <text x="730" y="116" text-anchor="middle" font-size="12" fill="#6b6a5f">prod-size copy</text>
  <text x="868" y="62" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.2" fill="#8a5a2a">IN PRODUCTION</text>
  <text x="868" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#141413">canary &#183; 5%</text>
  <text x="868" y="116" text-anchor="middle" font-size="12" fill="#6b6a5f">real traffic</text>
  <text x="1018" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#141413">caught by</text>
  <text x="1018" y="116" text-anchor="middle" font-size="12" fill="#6b6a5f">solid dots only</text>
  <text x="32" y="116" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">WHAT GOES WRONG</text>
  <text x="46" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">1</text>
  <text x="66" y="161" font-size="13" fill="#141413">A pure function returns the wrong total</text>
  <text x="1018" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a2a">only unit tests</text>
  <text x="46" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">2</text>
  <text x="66" y="201" font-size="13" fill="#141413">A response field is renamed</text>
  <text x="1018" y="200" text-anchor="middle" font-size="12" fill="#6b6a5f">2 checks</text>
  <text x="46" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">3</text>
  <text x="66" y="241" font-size="13" fill="#141413">A migration locks a big table for minutes</text>
  <text x="1018" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a2a">only migration test</text>
  <text x="46" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">4</text>
  <text x="66" y="281" font-size="13" fill="#141413">An N+1 query triples p99 latency</text>
  <text x="454" y="280" text-anchor="middle" font-size="12" fill="#6b6a5f">prints, passes</text>
  <text x="1018" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a2a">only the canary</text>
  <text x="46" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">5</text>
  <text x="66" y="321" font-size="13" fill="#141413">A flag defaults to on in production only</text>
  <text x="1018" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a2a">only the canary</text>
  <text x="46" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">6</text>
  <text x="66" y="361" font-size="13" fill="#141413">A payment webhook changes its signature</text>
  <text x="1018" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#c2613f">nobody</text>
  <text x="52" y="410" font-size="12" fill="#6b6a5f">fails the release</text>
  <text x="214" y="410" font-size="12" fill="#6b6a5f">prints, does not fail</text>
  <text x="388" y="410" font-size="12" fill="#6b6a5f">left out on purpose</text>
  <text x="534" y="410" font-size="12" font-style="italic" fill="#8c8a7d">blank = nobody looks</text>
  <text x="732" y="410" font-size="12" fill="#6b6a5f">one catcher</text>
  <text x="872" y="410" font-size="12" fill="#6b6a5f">no catcher</text>
  <text x="32" y="448" font-size="12" fill="#6b6a5f">Read along the rows. Rows 1, 3, 4 and 5 hang on one check each: drop that column and the failure ships. Row 4 looks covered twice,</text>
  <text x="32" y="468" font-size="12" fill="#6b6a5f">but the unit test only prints. Row 6 is empty twice over &#8212; the contract diff skips schemas we don't own, and webhooks skip the canary.</text>
  <text x="32" y="488" font-size="12" fill="#6b6a5f">That empty row is not a gap in the drawing; it is the next check to write.</text>
  <text x="32" y="516" font-size="12" font-style="italic" fill="#8c8a7d">Then read down the columns: no two share a pattern, so none of them is redundant. The &#215; in row 5 is a decision, not a gap &#8212;</text>
  <text x="32" y="536" font-size="12" font-style="italic" fill="#8c8a7d">unit tests pin every feature flag off, which is exactly why they cannot see a flag's production default.</text>
</svg>
