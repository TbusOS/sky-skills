  <text x="640" y="162" text-anchor="middle" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">term</text>
  <path d="M684 158 H 1046" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="1054" cy="158" r="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M812 158 V 192 Q 812 206 796 206 H 756" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="656" y="192" width="100" height="28" rx="6" fill="#e5e9dd" stroke="#5d7045" stroke-width="1.4"/>
  <text x="706" y="210" text-anchor="middle" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#5d7045">'&amp;&amp;' or '||'</text>
  <path d="M656 206 H 620 Q 604 206 604 192 V 158" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="812" cy="158" r="3.4" fill="#141413"/>
  <circle cx="604" cy="158" r="3.4" fill="#141413"/>
  <text x="706" y="232" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5d7045">round again for another term</text>
  <text x="470" y="124" font-size="10.5" font-weight="600" fill="#8a5a2a">skip it</text>
  <text x="430" y="290" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">AS A RAILROAD &#183; term</text>
  <circle cx="444" cy="352" r="7" fill="#141413" stroke="#141413" stroke-width="1.6"/>
  <path d="M451 352 H 476" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
