  <rect x="520" y="296" width="88" height="28" rx="6" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="564" y="314" text-anchor="middle" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">symbol</text>
  <path d="M476 352 H 512" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M772 352 H 816" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M512 352 H 520" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="520" y="338" width="84" height="28" rx="6" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="562" y="356" text-anchor="middle" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">symbol</text>
  <path d="M604 352 H 624" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="624" y="338" width="44" height="28" rx="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.4"/>
  <text x="646" y="356" text-anchor="middle" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">'='</text>
  <path d="M668 352 H 688" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="688" y="338" width="84" height="28" rx="6" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="730" y="356" text-anchor="middle" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">symbol</text>
  <path d="M476 352 Q 476 394 492 394 H 512" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M716 394 H 800 Q 816 394 816 352" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M512 394 H 520" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="520" y="380" width="40" height="28" rx="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.4"/>
  <text x="540" y="398" text-anchor="middle" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">'('</text>
  <path d="M560 394 H 584" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="584" y="380" width="72" height="28" rx="6" fill="#f7e4dc" stroke="#c2613f" stroke-width="1.4"/>
  <text x="620" y="398" text-anchor="middle" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#c2613f">expr</text>
  <path d="M656 394 H 676" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="676" y="380" width="40" height="28" rx="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.4"/>
  <text x="696" y="398" text-anchor="middle" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">')'</text>
  <path d="M816 352 H 968" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="976" cy="352" r="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <text x="430" y="426" font-size="10.5" font-weight="600" fill="#6b6a5f">three ways in, one way out</text>
  <text x="618" y="426" font-size="10.5" font-weight="700" fill="#c2613f">this box points back at the track above &#8212; that is the recursion</text>
  <text x="32" y="456" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">THE ONLY THREE SHAPES IT USES</text>
  <path d="M36 492 H 66" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="66" y="481" width="44" height="22" rx="5" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="88" y="496" text-anchor="middle" font-size="10" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">A</text>
  <path d="M110 492 H 140" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M52 492 Q 52 474 66 474 H 110 Q 124 474 124 492" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <text x="152" y="496" font-size="11" font-weight="600" fill="#141413">over the top = you may skip it</text>
  <path d="M420 492 H 450" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="450" y="481" width="44" height="22" rx="5" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="472" y="496" text-anchor="middle" font-size="10" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">A</text>
  <path d="M494 492 H 524" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M508 492 Q 508 510 494 510 H 450 Q 436 510 436 492" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <text x="536" y="496" font-size="11" font-weight="600" fill="#141413">back underneath = you may repeat it</text>
  <path d="M792 492 H 806" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="812" y="467" width="44" height="22" rx="5" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="834" y="482" text-anchor="middle" font-size="10" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">A</text>
  <rect x="812" y="495" width="44" height="22" rx="5" fill="#e2ecf5" stroke="#2f5c8a" stroke-width="1.4"/>
  <text x="834" y="510" text-anchor="middle" font-size="10" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">B</text>
  <path d="M806 478 V 506" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M806 478 H 812" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M806 506 H 812" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M856 478 H 862" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M856 506 H 862" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M862 478 V 506" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M862 492 H 896" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <text x="908" y="496" font-size="11" font-weight="600" fill="#141413">parallel rows = choose one</text>
  <text x="32" y="540" font-size="11.5" fill="#8c8a7d">a railroad diagram contains no decisions, so it must never be given diamonds, arrowheads on every segment, or condition labels &#8212; that turns it into a flowchart that is wrong.</text>
  <text x="32" y="557" font-size="11.5" fill="#8c8a7d">it beats notation on the three questions readers actually ask: may I leave this out, may I repeat it, which do I pick. each answer is a different shape, not a different bracket.</text>
  <text x="32" y="574" font-size="11.5" fill="#8c8a7d">it loses on recursion: notation says term contains expr in one line, while the picture can only point back at the track above. when a grammar is mostly recursive, keep the notation.</text>
  <text x="32" y="591" font-size="11.5" fill="#8c8a7d">this grammar is a cut-down form of the boolean expressions a kernel configuration language accepts, trimmed so each of the three shapes appears exactly once.</text>
  <rect x="820" y="616" width="260" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M820 623 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="833" cy="631" r="3.6" fill="#ffffff"/>
  <text x="967" y="635" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">Railroad &#183; grammar as a path</text>
</svg>
