<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 664" role="img" aria-label="The same small grammar written twice, as notation and as a railroad diagram. On the left, five lines of grammar notation in a monospace block, with a note that its brackets and braces are doing three different jobs while all looking alike. On the right, two tracks. The upper one is an expression: a start ring, an optional negation the line can bypass over the top, a term, then a loop that leaves the main line, runs leftwards through a box reading and-and or or-or, and rejoins in front of the term, which is how the picture says the term may repeat. The lower track is a term: the line splits three ways into a bare symbol, a symbol compared with another symbol, and a parenthesised expression, and the three merge into one end ring. Below both tracks, three small glyphs name the only shapes the notation uses: a bypass over the top means optional, a loop back underneath means repeatable, parallel rows mean choose one. Closing notes state that the single rule is that any path walked from start ring to end ring is legal, that a railroad diagram contains no decisions and so must never be given diamonds or condition labels, and that recursion is the one thing notation states plainly while the picture can only point back at an earlier track" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs><pattern id="rrDot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern></defs>
  <rect width="1120" height="664" rx="16" fill="#faf9f5" stroke="#eceadf"/><rect width="1120" height="664" rx="16" fill="url(#rrDot)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">RAILROAD &#183; WHAT IS OPTIONAL, WHAT REPEATS, WHAT YOU CHOOSE BETWEEN</text>
  <text x="32" y="58" font-size="11.5" fill="#8c8a7d">one rule: any path you can walk from the start ring to the end ring is legal. that is the whole notation, and it is why nothing here needs a condition label.</text>
  <text x="36" y="98" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">AS NOTATION</text>
  <rect x="36" y="110" width="360" height="150" rx="10" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.2"/>
  <text x="56" y="142" font-size="11.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">expr</text>
  <text x="100" y="142" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#141413">  :=  [ '!' ] term { ( '&amp;&amp;' | '||' ) term }</text>
  <text x="56" y="170" font-size="11.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#2f5c8a">term</text>
  <text x="100" y="170" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#141413">  :=  symbol</text>
  <text x="56" y="198" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#141413">  |   symbol '=' symbol</text>
  <text x="56" y="226" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#141413">  |   '(' expr ')'</text>
  <text x="36" y="284" font-size="11" fill="#6b6a5f">correct, complete &#8212; and you hold all of it in your head.</text>
  <text x="36" y="312" font-size="11" fill="#6b6a5f">the square brackets, the braces and the bar are doing</text>
  <text x="36" y="328" font-size="11" fill="#6b6a5f">three different jobs, and all three look alike.</text>
  <text x="36" y="354" font-size="11" font-weight="700" fill="#c2613f">on the right those three jobs become three shapes.</text>
  <text x="430" y="98" font-size="10.5" font-weight="600" letter-spacing="0.9" fill="#8c8a7d">AS A RAILROAD &#183; expr</text>
  <circle cx="444" cy="158" r="7" fill="#141413" stroke="#141413" stroke-width="1.6"/>
  <path d="M451 158 H 486" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="486" y="144" width="54" height="28" rx="6" fill="#f0e4d8" stroke="#8a5a2a" stroke-width="1.4"/>
  <text x="513" y="162" text-anchor="middle" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace" fill="#8a5a2a">'!'</text>
  <path d="M540 158 H 596" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M470 158 Q 470 130 486 130 H 578 Q 596 130 596 158" fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>
