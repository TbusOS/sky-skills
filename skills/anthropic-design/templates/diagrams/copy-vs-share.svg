<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="The same arrangement drawn twice, so the only difference is whether bytes move. In the upper half, marked copying, a producer box on the left and a consumer box on the right each point down at their own separate region of one address bar, and between those two regions sits a solid orange block labelled COPY, 8.3 megabytes, with an arrow entering it and an arrow leaving it. A note says the bar now holds the same picture twice and someone paid to put it there. In the lower half, marked sharing, the producer and the consumer point down at the very same region of the bar, there is no orange block anywhere, and a note says only a handle changed hands. Down the middle a dashed rule separates the two halves. The closing lines state that the two halves use identical coordinates so the single difference is visible, that the orange block is the only place bytes actually move, and that if a figure of this kind has no orange block then nothing was copied no matter what the surrounding prose calls it" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="csD" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <pattern id="csH" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2f5c8a" stroke-width="1.6" opacity="0.35"/></pattern>
    <marker id="csAO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#d97757"/></marker>
    <marker id="csAB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#2f5c8a"/></marker>
    <marker id="csAG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#4d5a3c"/></marker>
    <marker id="csAK" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#141413"/></marker>
    <marker id="csAD" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#8a6a2f"/></marker>
  </defs>
  <rect width="1120" height="620" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="620" rx="16" fill="url(#csD)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">COPY VS SHARE &#183; ONE DIFFERENCE, DRAWN TWICE</text>
  <rect x="232" y="68" width="150" height="44" rx="8" fill="#eef1e7" stroke="#b9c4a4" stroke-width="1.4"/>
  <text x="307" y="87" text-anchor="middle" font-size="12" font-weight="600" fill="#4d5a3c">producer</text>
  <text x="307" y="104" text-anchor="middle" font-size="11.5" fill="#6b6a5f">writes the frame</text>
  <rect x="848" y="68" width="150" height="44" rx="8" fill="#e2ecf5" stroke="#c4d5e6" stroke-width="1.4"/>
  <text x="923" y="87" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">consumer</text>
  <text x="923" y="104" text-anchor="middle" font-size="11.5" fill="#6b6a5f">reads the frame</text>
  <rect x="210" y="150" width="180" height="46" fill="#f1efe8"/>
  <text x="300" y="178" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b6a5f">other</text>
  <line x1="390" y1="150" x2="390" y2="196" stroke="#141413" stroke-width="1.5"/>
  <rect x="390" y="150" width="200" height="46" fill="#eef1e7"/>
  <text x="490" y="171" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4d5a3c">frame A</text>
  <text x="490" y="186" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">written here</text>
  <line x1="590" y1="150" x2="590" y2="196" stroke="#141413" stroke-width="1.5"/>
  <rect x="590" y="150" width="230" height="46" fill="#f1efe8"/>
  <line x1="820" y1="150" x2="820" y2="196" stroke="#141413" stroke-width="1.5"/>
  <rect x="820" y="150" width="200" height="46" fill="#e2ecf5"/>
  <text x="920" y="171" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f5c8a">frame A&#8242;</text>
  <text x="920" y="186" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">the second copy</text>
  <rect x="210" y="150" width="810" height="46" rx="7" fill="none" stroke="#141413" stroke-width="1.8"/>
  <rect x="82.8" y="164" width="98.5" height="18" rx="9" fill="#141413"/>
  <text x="132" y="177" text-anchor="middle" font-size="9.5" fill="#ffffff">one address bar</text>
  <path d="M307 112 L307 150" fill="none" stroke="#4d5a3c" stroke-width="1.8" marker-end="url(#csAG)"/>
  <path d="M923 112 L923 150" fill="none" stroke="#2f5c8a" stroke-width="1.8" marker-end="url(#csAB)"/>
  <rect x="667" y="146" width="76" height="54" rx="8" fill="#d97757" stroke="#8f4a2f" stroke-width="1.8"/>
  <text x="705" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">COPY</text>
  <text x="705" y="186" text-anchor="middle" font-size="10" fill="#ffffff">8.3 MB</text>
  <path d="M590 173 L663 173" fill="none" stroke="#d97757" stroke-width="2.4" marker-end="url(#csAO)"/>
  <path d="M747 173 L816 173" fill="none" stroke="#d97757" stroke-width="2.4" marker-end="url(#csAO)"/>
  <text x="705" y="128" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8f4a2f">the bar now holds the same picture twice</text>
  <text x="705" y="236" text-anchor="middle" font-size="11" fill="#6b6a5f">someone paid 8.3 MB of bandwidth to put it there</text>
  <rect x="67.0" y="81" width="58.0" height="18" rx="9" fill="#8f4a2f"/>
  <text x="96" y="94" text-anchor="middle" font-size="10.5" fill="#ffffff">COPYING</text>
  <rect x="232" y="300" width="150" height="44" rx="8" fill="#eef1e7" stroke="#b9c4a4" stroke-width="1.4"/>
  <text x="307" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#4d5a3c">producer</text>
  <text x="307" y="336" text-anchor="middle" font-size="11.5" fill="#6b6a5f">writes the frame</text>
  <rect x="848" y="300" width="150" height="44" rx="8" fill="#e2ecf5" stroke="#c4d5e6" stroke-width="1.4"/>
  <text x="923" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5c8a">consumer</text>
  <text x="923" y="336" text-anchor="middle" font-size="11.5" fill="#6b6a5f">reads the frame</text>
  <rect x="210" y="400" width="300" height="46" fill="#f1efe8"/>
  <text x="360" y="428" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b6a5f">other</text>
  <line x1="510" y1="400" x2="510" y2="446" stroke="#141413" stroke-width="1.5"/>
  <rect x="510" y="400" width="210" height="46" fill="#eef1e7"/>
  <text x="615" y="421" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4d5a3c">frame A</text>
  <text x="615" y="436" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#6b6a5f">the only one</text>
  <line x1="720" y1="400" x2="720" y2="446" stroke="#141413" stroke-width="1.5"/>
  <rect x="720" y="400" width="300" height="46" fill="#f1efe8"/>
  <text x="870" y="428" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b6a5f">other</text>
  <rect x="210" y="400" width="810" height="46" rx="7" fill="none" stroke="#141413" stroke-width="1.8"/>
  <rect x="82.8" y="414" width="98.5" height="18" rx="9" fill="#141413"/>
  <text x="132" y="427" text-anchor="middle" font-size="9.5" fill="#ffffff">one address bar</text>
  <path d="M307 344 L307 380 L560 380 L560 400" fill="none" stroke="#4d5a3c" stroke-width="1.8" marker-end="url(#csAG)"/>
  <path d="M923 344 L923 380 L660 380 L660 400" fill="none" stroke="#2f5c8a" stroke-width="1.8" marker-end="url(#csAB)"/>
  <text x="615" y="366" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4d5a3c">both arrows land on the same region</text>
  <text x="615" y="486" text-anchor="middle" font-size="11" fill="#6b6a5f">only a handle changed hands &#8212; no orange block anywhere</text>
  <rect x="67.0" y="313" width="58.0" height="18" rx="9" fill="#4d5a3c"/>
  <text x="96" y="326" text-anchor="middle" font-size="10.5" fill="#ffffff">SHARING</text>
  <path d="M40 272 L1080 272" fill="none" stroke="#6b6a5f" stroke-width="1.4" stroke-dasharray="8 5"/>
  <circle cx="705" cy="208" r="10.5" fill="#d97757"/>
  <text x="705" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">1</text>
  <circle cx="615" cy="458" r="10.5" fill="#d97757"/>
  <text x="615" y="462" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">2</text>
  <text x="32" y="522" text-anchor="start" font-size="11.5" fill="#8c8a7d">&#9312; bytes move here, and only here &#183; &#9313; nothing moves; the two sides simply agree on an address</text>
  <text x="32" y="539" text-anchor="start" font-size="11.5" fill="#8c8a7d">both halves use identical coordinates on purpose, so the one difference is the only thing your eye has to find.</text>
  <text x="32" y="556" text-anchor="start" font-size="11.5" fill="#8c8a7d">if a figure like this has no orange block, then nothing was copied &#8212; whatever the prose around it says.</text>
  <rect x="838" y="528" width="251" height="30" rx="7" fill="#ffffff" stroke="#141413" stroke-width="1.6"/>
  <path d="M838 535 a7 7 0 0 1 7-7 h20 v30 h-20 a7 7 0 0 1 -7 -7 Z" fill="#141413"/>
  <circle cx="851" cy="543" r="3.6" fill="#ffffff"/>
  <text x="977" y="547" text-anchor="middle" font-size="11.5" font-weight="600" fill="#141413">Copy vs share &#183; the one difference</text>
</svg>
