<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Where thirty-one findings came from and where they went, drawn so that the height of every bar is the number of findings in it, six pixels each. On the left, a card for the in-house test suite: nine hundred and forty tests, all passing, and none of them caught any of the thirty-one. After it went green, outside beta testers who were given the user guide but not the code reported thirty-one findings, stacked in one bar as three blockers, sixteen normal and twelve cosmetic. Translucent bands carry each part to where it went. The three blockers and sixteen normal findings flow straight across into a bar of nineteen fixed before release. The twelve cosmetic ones curve down into a bar of twelve that were deferred and re-checked before anyone touched them. That bar splits again: nine still happened and were fixed, three were already gone because fixing blocker B2 had fixed them too. A thin dashed branch leaves the re-check with no band behind it, ending in a bar of two new findings that were never among the thirty-one; they turned up while reproducing one of the twelve. Notes say that heights add up at every split, thirty-one is nineteen plus twelve and twelve is nine plus three, that the two new ones have nothing feeding them because they were not in the batch, and that a green suite count is not the same thing as the ability to find problems" font-family="Poppins, 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="cflDots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#141413" opacity="0.05"/></pattern>
    <marker id="cflArr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#a8a496"/></marker>
    <marker id="cflArrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#6a9bcc"/></marker>
    <filter id="cflSh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/></filter>
  </defs>
  <rect width="1120" height="560" rx="16" fill="#faf9f5" stroke="#eceadf"/>
  <rect width="1120" height="560" rx="16" fill="url(#cflDots)"/>
  <text x="32" y="34" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6b6a5f">COUNT FLOW &#183; 31 FINDINGS, WHERE THEY CAME FROM AND WHERE THEY WENT</text>
  <text x="1088" y="34" text-anchor="end" font-size="12" fill="#6b6a5f">bar height = number of findings &#183; 6 px each</text>
  <text x="1088" y="54" text-anchor="end" font-size="12" font-weight="600" fill="#141413">heights add up at every split: 31 = 19 + 12 &#183; 12 = 9 + 3</text>
  <!-- bands: each carries one part of a bar to where it went; translucent so the text above stays readable -->
  <path d="M324,108 C442.0,108 442.0,108 560,108 V126 C442.0,126 442.0,126 324,126 Z" fill="#d97757" fill-opacity="0.18"/>
  <path d="M324,126 C442.0,126 442.0,126 560,126 V222 C442.0,222 442.0,222 324,222 Z" fill="#141413" fill-opacity="0.08"/>
  <path d="M324,222 C442.0,222 442.0,324 560,324 V396 C442.0,396 442.0,294 324,294 Z" fill="#8c8a7d" fill-opacity="0.16"/>
  <path d="M584,324 C696.0,324 696.0,324 808,324 V378 C696.0,378 696.0,378 584,378 Z" fill="#6a9bcc" fill-opacity="0.16"/>
  <path d="M584,378 C696.0,378 696.0,396 808,396 V414 C696.0,414 696.0,396 584,396 Z" fill="#6a9bcc" fill-opacity="0.16"/>
  <!-- column 1: not a bar. 940 tests at 6 px each would be 5640 px, and tests are not findings -->
  <rect x="32" y="108" width="208" height="178" rx="12" fill="#e2ecf5" stroke="#c4d5e6" filter="url(#cflSh)"/>
  <rect x="32" y="122" width="4" height="150" rx="2" fill="#6a9bcc"/>
  <circle cx="58" cy="134" r="10" fill="#141413"/><text x="58" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="76" y="138" font-size="13" font-weight="600" fill="#141413">In-house test suite</text>
  <text x="52" y="184" font-size="32" font-weight="600" fill="#4a7bab">940</text>
  <text x="124" y="184" font-size="12.5" fill="#6b6a5f">tests, all passing</text>
  <text x="52" y="208" font-size="12" fill="#6b6a5f">at the moment outsiders</text>
  <text x="52" y="225" font-size="12" fill="#6b6a5f">were asked to look</text>
  <text x="52" y="252" font-size="12.5" font-weight="600" fill="#141413">caught none of the 31</text>
  <text x="52" y="269" font-size="12.5" font-weight="600" fill="#141413">on the right</text>
  <path d="M240,197 H292" fill="none" stroke="#a8a496" stroke-width="1.4" marker-end="url(#cflArr)"/>
  <text x="266.0" y="189" text-anchor="middle" font-size="12" fill="#8c8a7d">then</text>
  <!-- column 2: one stacked bar, split by severity -->
  <circle cx="308" cy="66" r="10" fill="#141413"/><text x="308" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="326" y="70" font-size="13" font-weight="600" fill="#141413">Outside beta testers</text>
  <text x="296" y="92" font-size="12" fill="#6b6a5f">given the user guide, not the code</text>
  <rect x="300" y="108" width="24" height="18" fill="#d97757"/>
  <rect x="300" y="126" width="24" height="96" fill="#141413"/>
  <rect x="300" y="222" width="24" height="72" fill="#8c8a7d"/>
  <text x="334" y="122" font-size="12.5" font-weight="700" fill="#c2613f">3 blockers</text>
  <text x="334" y="178.0" font-size="12.5" font-weight="600" fill="#141413">16 normal</text>
  <text x="334" y="246" font-size="12.5" font-weight="600" fill="#6b6a5f">12 cosmetic</text>
  <text x="288" y="292" text-anchor="end" font-size="12" font-weight="600" fill="#6b6a5f">31</text>
  <text x="440" y="292" text-anchor="middle" font-size="12" fill="#8c8a7d">deferred as cosmetic</text>
  <!-- column 3: fixed now, and the deferred ones re-checked first -->
  <rect x="560" y="108" width="24" height="18" fill="#d97757"/>
  <rect x="560" y="126" width="24" height="96" fill="#141413"/>
  <text x="598" y="122" font-size="13" font-weight="600" fill="#141413">Fixed before release &#183; 19</text>
  <text x="598" y="144" font-size="12" fill="#6b6a5f"><tspan font-weight="700" fill="#c2613f">B1</tspan>  a renamed folder is deleted on the other device</text>
  <text x="598" y="162" font-size="12" fill="#6b6a5f"><tspan font-weight="700" fill="#c2613f">B2</tspan>  a conflict copy overwrites the newer file</text>
  <text x="598" y="180" font-size="12" fill="#6b6a5f"><tspan font-weight="700" fill="#c2613f">B3</tspan>  sync stalls after the laptop wakes from sleep</text>
  <text x="598" y="202" font-size="12" fill="#6b6a5f">16 normal, N1&#8211;N16 &#183; all shipped in 3.2.0</text>
  <rect x="560" y="324" width="24" height="72" fill="#6a9bcc"/>
  <circle cx="572" cy="302" r="10" fill="#141413"/><text x="572" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="590" y="306" font-size="13" font-weight="600" fill="#4a7bab">Re-checked first &#183; 12</text>
  <text x="598" y="346" font-size="12" fill="#6b6a5f">does each one still</text>
  <text x="598" y="363" font-size="12" fill="#6b6a5f">happen? before any fix</text>
  <!-- column 4: what the re-check found -->
  <rect x="808" y="324" width="24" height="54" fill="#6a9bcc"/>
  <rect x="808" y="396" width="24" height="18" fill="#6a9bcc" fill-opacity="0.45"/>
  <rect x="808" y="454" width="24" height="12" fill="#6a9bcc"/>
  <text x="846" y="344" font-size="13" font-weight="600" fill="#141413">9 still happen &#8594; fixed in 3.2.1</text>
  <text x="846" y="362" font-size="12" fill="#6b6a5f">C1&#8211;C6, C8, C10, C11</text>
  <text x="846" y="408" font-size="13" font-weight="600" fill="#141413">3 already gone</text>
  <text x="846" y="426" font-size="12" fill="#6b6a5f">fixed as a side effect of B2 &#8212;</text>
  <text x="846" y="443" font-size="12" fill="#6b6a5f">fixing them again fixes nothing</text>
  <path d="M584,393 C696.0,393 696.0,460 800,460" fill="none" stroke="#6a9bcc" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cflArrB)"/>
  <text x="846" y="465" font-size="13" font-weight="600" fill="#4a7bab">+2 not on the list &#183; D1, D2</text>
  <text x="846" y="483" font-size="12" fill="#6b6a5f">hit while reproducing C7;</text>
  <text x="846" y="500" font-size="12" fill="#6b6a5f">never among the 31</text>
  <text x="702.0" y="480" text-anchor="middle" font-size="12" font-style="italic" fill="#4a7bab">no band: not from the batch</text>
  <!-- legend: colour is who found it; orange is the focus, not a third source -->
  <g font-size="12" fill="#6b6a5f">
    <circle cx="38" cy="512" r="5" fill="#6a9bcc"/><text x="50" y="516">found or re-checked by us</text>
    <circle cx="230" cy="512" r="5" fill="#141413"/><text x="242" y="516">found by outside testers</text>
    <circle cx="414" cy="512" r="5" fill="#d97757"/><text x="426" y="516">blocker</text>
    <circle cx="496" cy="512" r="5" fill="#8c8a7d"/><text x="508" y="516">cosmetic</text>
  </g>
  <text x="32" y="542" font-size="12" fill="#6b6a5f">An all-passing count on the left is not the ability to find problems. And a re-check of a deferred list both shrinks it (3 gone) and grows it (2 new).</text>
</svg>
